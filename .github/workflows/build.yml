# On every push to main: validate content, rebuild the site and the Anki deck.
# The site is deployed to GitHub Pages (Settings → Pages → Source: GitHub Actions);
# the .apkg is attached as a workflow artifact.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: make all
      - uses: actions/upload-artifact@v4
        with: {name: anki-deck, path: dist/big-picture.apkg}
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
