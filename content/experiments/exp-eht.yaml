id: exp-eht
title: Event Horizon Telescope Black-Hole Images
short: EHT
domain: experiment
area: exp-cosmo
order: 280
year: 2019
who: Event Horizon Telescope collaboration
one_liner: Earth-sized radio interferometry imaged the shadows of M87* and Sgr A*.
measured: VLBI at 1.3 mm wavelength combining telescopes worldwide.
result: Rings of ~42 μas (M87*, 2019) and ~52 μas (Sgr A*, 2022) consistent with Kerr black-hole shadows.
significance:
  - Direct imaging of horizon-scale structure; tests of GR and accretion/jet physics.
connections: [black-holes, general-relativity, astrophysics]
cards:
  - q: What sets the size of a black-hole shadow?
    a: The photon sphere; for Schwarzschild the shadow diameter is $2\sqrt{27}\,GM/c^2$.
