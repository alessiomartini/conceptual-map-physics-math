id: exp-pound-rebka
title: Pound–Rebka Experiment
domain: experiment
area: exp-cosmo
order: 220
year: 1959
who: Robert Pound, Glen Rebka
one_liner: Gamma rays climbing a 22.5 m tower were redshifted by gravity, exactly as predicted.
measured: Mössbauer-resonance frequency shift of ⁵⁷Fe gamma rays over the height of the Harvard tower.
result: Fractional shift $gh/c^2 \approx 2.5\times10^{-15}$, confirmed to ~10% (later 1%).
significance:
  - First laboratory test of gravitational redshift; today optical clocks see it over centimetres.
connections: [general-relativity]
cards:
  - q: What effect did Pound and Rebka measure, and with what technique?
    a: Gravitational redshift of photons, using the Mössbauer effect for extreme frequency resolution.
