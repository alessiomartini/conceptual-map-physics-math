id: exp-bell-tests
title: Bell Tests
domain: experiment
area: exp-quantum
order: 200
year: 1982
who: Freedman–Clauser (1972), Aspect (1982), loophole-free tests (Hensen et al., Giustina et al., Shalm et al. 2015); Nobel 2022
one_liner: Entangled particles violate Bell inequalities — no local hidden-variable theory can describe nature.
measured: Correlations between polarization/spin measurements on entangled pairs with randomly chosen settings at spacelike separation.
result: CHSH values above 2, in agreement with quantum mechanics; locality and detection loopholes closed simultaneously in 2015.
significance:
  - Nonlocal correlations are real; foundation of device-independent quantum cryptography and randomness certification.
connections: [quantum-foundations, quantum-mechanics, quantum-information]
cards:
  - q: Which two main loopholes were closed together in 2015?
    a: The locality (communication) loophole and the detection (fair-sampling) loophole.
  - q: Who shared the 2022 Nobel Prize for Bell tests?
    a: Alain Aspect, John Clauser, Anton Zeilinger.
