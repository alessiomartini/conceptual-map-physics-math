id: non-equilibrium
title: Non-Equilibrium Statistical Physics
short: Non-equilibrium
domain: physics
area: matter
order: 890
one_liner: Systems driven, relaxing or living away from thermal equilibrium, from fluctuating molecules to active matter.
summary: >-
  Most of nature is out of equilibrium. The field ranges from linear response and kinetic theory to exact
  fluctuation theorems, stochastic thermodynamics, non-equilibrium phase transitions, active matter and the
  thermalization of isolated quantum systems.
definitions:
  - "**Thermalization has several inequivalent definitions.** First distinguish *equilibration* (relaxing to some stationary state) from *thermalization* (that state is the Gibbs state at the right temperature)."
  - "**(1) Ergodic hypothesis** — time averages equal microcanonical averages. *Why:* Boltzmann's original route. *Problem:* rarely provable and stronger than needed: Khinchin showed that for macroscopic sum-like observables concentration of measure suffices."
  - "**(2) Typicality** — almost every pure state of a large system looks thermal on a small subsystem (canonical typicality: Goldstein–Lebowitz–Tumulka–Zanghì; Popescu–Short–Winter 2006). *Why:* explains why thermal states are generic. *Limit:* a statement about states, not dynamics — it does not say that a given initial state gets there."
  - "**(3) Subsystem thermalization in isolated quantum systems** — after a quench, local observables (reduced density matrices of small regions) relax to and stay near their Gibbs values. *Why:* the operational definition used in cold-atom experiments."
  - "**(4) ETH** — strong ETH: every eigenstate in the bulk of the spectrum is thermal; weak ETH: almost all. *Relation:* strong ETH plus dephasing implies (3) for all reasonable initial states; weak ETH does not. Many-body scars and many-body localization violate strong ETH."
  - "**(5) Generalized thermalization** — integrable systems relax to a generalized Gibbs ensemble with all their conserved charges, so they thermalize only in this extended sense ([[integrability]])."
  - "**(6) Open systems** — relaxation to the temperature of a bath (Markovian/Lindblad dynamics); here thermalization is imposed by the environment rather than emergent."
  - "**Time scales are a separate question:** systems can prethermalize to a long-lived non-thermal plateau before thermalizing; definitions (3)–(5) differ on what counts as eventually."
asks:
  - What general laws govern systems away from equilibrium?
  - How do isolated quantum systems thermalize, or avoid it?
  - What new collective phases appear in driven and active systems?
key_results:
  - "Boltzmann equation; Onsager reciprocal relations; Green–Kubo formulas."
  - "Fluctuation theorems (Evans–Searles, Gallavotti–Cohen, Crooks) and Jarzynski equality $\\langle e^{-\\beta W}\\rangle = e^{-\\beta \\Delta F}$. ([Jarzynski 1997](https://arxiv.org/abs/cond-mat/9610209))"
  - "KPZ universality for growing interfaces; directed percolation universality."
  - "Eigenstate thermalization hypothesis (Deutsch 1991, Srednicki 1994). ([Deutsch 1991](https://doi.org/10.1103/PhysRevA.43.2046), [Srednicki 1994](https://arxiv.org/abs/cond-mat/9403051))"
  - "Many-body localization; quantum many-body scars; discrete time crystals."
  - "Thermodynamic uncertainty relations (Barato–Seifert 2015)."
  - "Vicsek model and Toner–Tu theory: flocking with long-range order in 2D. ([Vicsek 1995](https://doi.org/10.1103/PhysRevLett.75.1226), [Toner–Tu 1995](https://doi.org/10.1103/PhysRevLett.75.4326))"
experiments:
  - Single-molecule pulling verifying Jarzynski/Crooks; cold-atom thermalization experiments; time crystals on qubit platforms; bacterial and active colloid suspensions.
limits:
  - No general variational principle comparable to free-energy minimization; stability of MBL in the thermodynamic limit debated.
applications:
  - Molecular motors and biophysics, chemical reaction networks, nanoscale engines, climate, traffic.
frontiers:
  - Active matter, non-reciprocal interactions and phase transitions; stochastic thermodynamics of computation; prethermalization and Floquet engineering.
connections: [soft-matter, statistical-mechanics, thermodynamics, hydrodynamics, phase-transitions, complex-systems, stochastic-processes, chaos, biophysics]
prerequisites: [statistical-mechanics]
cards:
  - q: State the Jarzynski equality.
    a: $\langle e^{-\beta W} \rangle = e^{-\beta \Delta F}$ for work done in arbitrary non-equilibrium driving between equilibrium states.
  - q: What is the eigenstate thermalization hypothesis?
    a: Matrix elements of local observables in energy eigenstates of chaotic systems are smooth functions of energy on the diagonal plus exponentially small random off-diagonal terms, so single eigenstates look thermal.
  - q: What is the KPZ equation?
    a: $\partial_t h = \nu \nabla^2 h + \frac{\lambda}{2}(\nabla h)^2 + \eta$; in 1+1D it has exponents $z = 3/2$ and Tracy–Widom fluctuations.
  - q: What do Green–Kubo relations give?
    a: Transport coefficients as time integrals of equilibrium current–current correlation functions.
  - q: What is a thermodynamic uncertainty relation?
    a: A bound relating precision of a current to dissipation, $\mathrm{Var}(J)/\langle J\rangle^2 \ge 2k_B/\Sigma$ (entropy production).
