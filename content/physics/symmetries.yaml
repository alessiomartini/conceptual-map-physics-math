id: symmetries
title: Symmetries & Generalized Symmetries
short: Symmetries
domain: physics
area: hep
order: 730
one_liner: Symmetry organizes conservation laws, spectra, phases and dynamics; generalized symmetries extend this to extended and non-invertible operators.
summary: >-
  From Noether to Wigner to Landau, symmetry has been the master organizing principle. Since Gaiotto,
  Kapustin, Seiberg and Willett (2014) symmetries are seen as topological operators: they may act on
  lines and surfaces (higher-form), form higher groups, or have no inverse (non-invertible, fusion-category
  symmetries). Their anomalies give robust non-perturbative constraints on phases of matter and QFTs.
asks:
  - What constrains the spectrum, dynamics and phases of a system independently of details?
  - How do symmetries and their anomalies classify phases of matter?
  - What is the most general notion of symmetry in quantum field theory?
key_results:
  - "Noether's theorem; Wigner's theorem (symmetries are unitary or antiunitary); Goldstone theorem."
  - "Landau paradigm: phases classified by symmetry breaking patterns."
  - "’t Hooft anomaly matching: UV anomalies must be reproduced in the IR."
  - "Higher-form symmetries act on extended objects; 1-form center symmetry is the order parameter for confinement. ([GKSW 2014](https://arxiv.org/abs/1412.5148))"
  - "Non-invertible symmetries exist in 4D (e.g. in QED and pion theory) and constrain dynamics (Choi–Lam–Shao, Córdova–Ohmori)."
  - "Symmetry TFT / SymTFT: symmetries of a d-dimensional theory encoded in a (d+1)-dimensional topological theory."
experiments:
  - "[[exp-wu-parity]] (P violation), CP violation in kaons (1964), Goldstone modes (phonons, magnons, pions)."
limits:
  - The classification of generalized symmetries in higher dimensions (higher fusion categories) is still being developed.
applications:
  - Selection rules in spectroscopy and chemistry; classification of topological phases; constraints on neutral pion decay and axion couplings.
frontiers:
  - Categorical symmetries, SymTFT, anomalies of non-invertible symmetries, generalized symmetries in lattice models and quantum gravity (no global symmetries conjecture).
connections: [classical-mechanics, qft, gauge-theory, topological-phases, phase-transitions, group-theory, category-theory, quantum-gravity, cft]
prerequisites: [qft, group-theory]
resources:
  - "Gaiotto, Kapustin, Seiberg, Willett, *Generalized Global Symmetries* (2014)"
  - "Schafer-Nameki, *ICTP lectures on (non-)invertible generalized symmetries* (2023)"
  - "Shao, *What's done cannot be undone: TASI lectures on non-invertible symmetries* (2023)"
cards:
  - q: In modern QFT language, what is a symmetry?
    a: A topological operator (defect); a $p$-form symmetry is generated by codimension-$(p+1)$ topological operators acting on $p$-dimensional charged objects.
  - q: What is the order parameter for confinement in pure Yang–Mills in generalized-symmetry language?
    a: The 1-form center symmetry, which acts on Wilson lines; unbroken ⇔ confinement.
  - q: What is a ’t Hooft anomaly and why is it useful?
    a: An obstruction to gauging a global symmetry; it is RG invariant, so the IR must match it (gapless modes, symmetry breaking, or topological order).
  - q: What is a non-invertible symmetry?
    a: A topological operator without inverse, whose fusion rules form a category (e.g. Kramers–Wannier duality defect in the Ising model).
  - q: What does Wigner's theorem state?
    a: Every symmetry preserving transition probabilities is represented by a unitary or an antiunitary operator.
  - q: What is the conjecture about global symmetries in quantum gravity?
    a: Quantum gravity admits no exact global symmetries (all symmetries are gauged or broken), supported by black-hole arguments and AdS/CFT (Harlow–Ooguri).
