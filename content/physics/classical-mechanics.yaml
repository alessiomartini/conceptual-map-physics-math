id: classical-mechanics
title: Classical Mechanics
domain: physics
area: classical
order: 570
one_liner: How bodies move under forces, reformulated as the geometry of phase space.
summary: >-
  From Newton's laws to the Lagrangian and Hamiltonian formulations. The modern view is geometric:
  states are points of a symplectic manifold, dynamics is a flow generated by the Hamiltonian, and
  symmetries give conserved quantities. Almost every later theory (field theory, quantum mechanics,
  statistical mechanics) is built by deforming or extending this structure.
big_goal: "Predict the motion of any system of bodies from forces, and understand the geometric structure (phase space, symmetries, conservation) behind that motion."
essentials:
  - "Newton's laws can be rewritten as a principle of stationary action (Lagrangian) or as flow in phase space (Hamiltonian); these reformulations are what later theories build on."
  - "Symmetries give conservation laws (Noether): energy, momentum, angular momentum."
  - "Most systems are not integrable; small perturbations of integrable ones keep most of their regular motion (KAM) but can become chaotic."
broken_promises:
  - "Laplace's determinism: with exact initial conditions the future is computable. Poincaré's work on the three-body problem showed generic systems are chaotic, so the promise fails for any finite precision."
  - "Finding closed-form solutions for all mechanical problems: Poincaré proved the three-body problem has no complete set of analytic integrals."
asks:
  - Given forces or a Lagrangian, how does a system evolve in time?
  - Which quantities are conserved, and why (symmetry)?
  - When is motion integrable (solvable by quadratures) and when is it chaotic?
  - What is the geometric structure (phase space, symplectic form, Poisson bracket) behind dynamics?
key_results:
  - "Newton's laws; Galilean invariance."
  - "Principle of stationary action: $\\delta S = 0$ gives the Euler–Lagrange equations."
  - "Noether's theorem: continuous symmetry implies a conserved quantity (time → energy, space → momentum, rotation → angular momentum)."
  - Hamiltonian mechanics, Poisson brackets, canonical transformations, Hamilton–Jacobi equation.
  - "Liouville's theorem: Hamiltonian flow preserves phase-space volume."
  - "Liouville–Arnold theorem: $n$ independent commuting integrals ⇒ motion on invariant tori (action–angle variables)."
  - "KAM theorem: most invariant tori survive small non-integrable perturbations."
  - "Kepler problem and its hidden SO(4) symmetry (Laplace–Runge–Lenz vector)."
experiments:
  - Planetary motion (Kepler's laws) and celestial mechanics, including the prediction of Neptune (1846).
  - "[[exp-cavendish]] measured Newton's constant $G$."
  - "Foucault pendulum: Earth's rotation; non-inertial frames."
limits:
  - Fails at high speeds (→ [[special-relativity]]), small scales (→ [[quantum-mechanics]]), strong gravity (→ [[general-relativity]]).
  - Long-time prediction is impossible for chaotic systems despite determinism.
  - The many-body problem is generically non-integrable; one needs statistical methods.
applications:
  - Orbital mechanics and spacecraft navigation, robotics, engineering dynamics.
  - Molecular dynamics simulations; symplectic integrators.
  - Accelerator beam dynamics; plasma confinement.
frontiers:
  - "Mostly a mature field; active work in geometric mechanics, symplectic topology (Arnold conjecture, Floer theory) and celestial mechanics (n-body stability)."
  - Structure-preserving numerical methods and learning Hamiltonian dynamics from data.
connections: [chaos, classical-field-theory, symmetries, differential-geometry, dynamical-systems, statistical-mechanics, quantum-mechanics]
resources:
  - "Landau & Lifshitz, *Mechanics* (Vol. 1)"
  - "Arnold, *Mathematical Methods of Classical Mechanics*"
  - "Goldstein, *Classical Mechanics*"
cards:
  - q: What does Noether's theorem state?
    a: Every continuous (differentiable) symmetry of the action corresponds to a conserved current/quantity.
  - q: Which symmetry gives energy conservation? Which gives angular momentum?
    a: Time-translation invariance → energy; rotational invariance → angular momentum.
  - q: What does Liouville's theorem say about Hamiltonian flow?
    a: It preserves phase-space volume (the symplectic form, hence the Liouville measure).
  - q: What does the Liouville–Arnold theorem guarantee for an integrable system with $n$ degrees of freedom?
    a: "With $n$ independent Poisson-commuting conserved quantities, bounded motion lies on $n$-tori and can be written in action–angle variables."
  - q: What does the KAM theorem say?
    a: Under small smooth perturbations of an integrable Hamiltonian, most invariant tori (those with sufficiently irrational frequencies) survive, slightly deformed.
  - q: What extra conserved vector does the Kepler problem have, and what symmetry does it signal?
    a: The Laplace–Runge–Lenz vector; a hidden SO(4) symmetry for bound orbits (why orbits close).
  - q: What is the geometric object underlying Hamiltonian mechanics?
    a: A symplectic manifold (phase space) with a closed non-degenerate 2-form; the Hamiltonian generates a flow via $\\iota_{X_H}\\omega = dH$.
