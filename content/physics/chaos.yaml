id: chaos
title: Chaos
short: Chaos
domain: physics
area: classical
order: 630
one_liner: Deterministic systems whose sensitivity to initial conditions makes long-term prediction impossible.
summary: >-
  Classical chaos is exponential divergence of nearby trajectories (positive Lyapunov exponents) combined
  with mixing. Quantum chaos asks what replaces this in quantum systems: level statistics of [[random-matrix-theory]],
  the eigenstate thermalization hypothesis, and out-of-time-order correlators, with a bound on the
  quantum Lyapunov exponent saturated by black holes.
big_goal: "Understand when deterministic laws produce unpredictable behaviour, what remains predictable (statistics, structure of attractors), and what chaos means in quantum systems."
essentials:
  - "Determinism does not mean predictability: tiny errors grow exponentially in chaotic systems (Lyapunov exponent), so long-term prediction is impossible in practice."
  - "Chaos has universal features, e.g. the Feigenbaum constants of the period-doubling route."
  - "In quantum mechanics chaos shows up in energy-level statistics (random matrices) and in how fast information scrambles — with a speed limit saturated by black holes."
broken_promises:
  - "Laplace's dream: knowing the laws and the present state exactly would give the whole future. Chaos (Poincaré, Lorenz) showed this fails for any finite precision — weather beyond ~2 weeks is unpredictable in principle, not just in practice."
  - "Quantum chaos was expected to be the quantum version of the same idea; but unitary evolution of finite systems is never exponentially sensitive, so it had to be redefined (and there are now several definitions)."
definitions:
  - "**Classical chaos — several definitions that mostly agree.** (a) A positive Lyapunov exponent on a bounded, recurrent orbit (sensitivity alone is not enough: $\\dot x = x$ separates trajectories exponentially but is not chaotic); (b) Devaney: sensitivity + topological transitivity + dense periodic orbits; (c) positive Kolmogorov–Sinai entropy (equal to the sum of positive Lyapunov exponents by Pesin's formula); (d) mixing in the ergodic hierarchy. *Overlap:* for uniformly hyperbolic systems all coincide. *Where they differ:* mixed phase spaces (KAM islands inside chaotic seas), transient chaos, chaos on a set of measure zero."
  - "**Quantum chaos (1): semiclassical — quantum systems whose classical limit is chaotic** (Berry's quantum chaology; Gutzwiller trace formula). *Why it exists:* historically the question was what happens to classical chaos under quantisation. *Problem:* unitary evolution of a finite system is quasi-periodic, so no exponential sensitivity survives; and many systems of interest (spin-½ chains, SYK) have no classical limit, so the definition does not apply."
  - "**Quantum chaos (2): spectral — level statistics follow random-matrix theory** (Bohigas–Giannoni–Schmit; spectral form factor with a ramp). *Why:* works without a classical limit and is easy to test numerically; the most widely used criterion. *Limits:* a statistical, not dynamical, statement; needs symmetry sectors resolved; says nothing about time scales."
  - "**Quantum chaos (3): the eigenstate thermalization hypothesis (ETH)** — eigenstates look thermal for local observables. *Why:* it is what makes isolated systems thermalize ([[non-equilibrium]]). *Overlap:* in practice RMT statistics and ETH go together; ETH is about eigenvectors, RMT about eigenvalues."
  - "**Quantum chaos (4): exponential growth of out-of-time-order correlators**, $\\lambda_L \\le 2\\pi k_BT/\\hbar$. *Why:* the closest analogue of a Lyapunov exponent, natural in large-N and holographic systems. *Conflict:* exponential OTOC growth also occurs in integrable systems with unstable saddle points (Rozenbaum et al.; Xu–Scaffidi–Cao 2020), and spin chains with small local Hilbert space show no clean exponential window — so it is neither necessary nor sufficient."
  - "**Quantum chaos (5): operator growth / Krylov complexity** — Lanczos coefficients growing linearly (Parker et al. 2019). *Why:* a definition at infinite temperature without a semiclassical parameter. *Conflict:* linear growth can also come from saddle points; still being tested."
  - "**Bottom line:** in maximally chaotic large-N systems (SYK, black holes) all quantum criteria agree; in general they are different diagnostics, and papers say which one they use."
asks:
  - When does deterministic dynamics become unpredictable?
  - What universal routes to chaos exist?
  - What is the quantum analogue of chaos and how do isolated quantum systems thermalize?
key_results:
  - Poincaré's discovery of homoclinic tangles in the three-body problem.
  - Lorenz attractor (1963); strange attractors with fractal dimension. ([Lorenz 1963](https://doi.org/10.1175/1520-0469%281963%29020%3C0130:DNF%3E2.0.CO;2))
  - "Feigenbaum universality in period-doubling ($\\delta \\approx 4.669$). ([Feigenbaum 1978](https://doi.org/10.1007/BF01020332))"
  - Lyapunov exponents, Kolmogorov–Sinai entropy, ergodic hierarchy.
  - "Bohigas–Giannoni–Schmit conjecture: chaotic quantum spectra follow RMT statistics; integrable ones are Poissonian. ([BGS 1984](https://doi.org/10.1103/PhysRevLett.52.1))"
  - "Maldacena–Shenker–Stanford bound: $\\lambda_L \\le 2\\pi k_B T/\\hbar$, saturated by black holes and the SYK model. ([MSS 2015](https://arxiv.org/abs/1503.01409))"
experiments:
  - Chaotic circuits and lasers; Rayleigh–Bénard convection showing period doubling (Libchaber).
  - Microwave billiards and nuclear spectra confirming RMT level statistics.
  - OTOC measurements on trapped ions and superconducting qubits.
limits:
  - Few general theorems for realistic high-dimensional systems; ergodicity is rarely provable.
  - Quantum chaos has no single agreed definition.
applications:
  - Weather forecasting limits and ensemble prediction, secure communication, mixing in engineering, celestial mechanics (asteroid dynamics).
frontiers:
  - Many-body quantum chaos, operator growth and Krylov complexity, scrambling, deep thermalization.
  - Links with black holes (fast scramblers) and quantum error correction.
connections: [geophysics-climate, stability, classical-mechanics, dynamical-systems, random-matrix-theory, statistical-mechanics, black-holes, complex-systems, hydrodynamics]
cards:
  - q: What quantity measures sensitivity to initial conditions?
    a: The (maximal) Lyapunov exponent $\\lambda$; separations grow as $e^{\\lambda t}$.
  - q: What is the Feigenbaum constant $\\delta$?
    a: The universal ratio ($\\approx 4.669$) of successive period-doubling intervals for unimodal maps.
  - q: What does the Bohigas–Giannoni–Schmit conjecture state?
    a: Quantum systems with chaotic classical limits have energy-level statistics described by random matrix ensembles (level repulsion); integrable ones show Poisson statistics.
  - q: What is the chaos bound of Maldacena, Shenker and Stanford?
    a: "The quantum Lyapunov exponent from OTOCs obeys $\\lambda_L \\le 2\\pi k_B T / \\hbar$."
  - q: What is an OTOC used for?
    a: Out-of-time-order correlators $\\langle [W(t),V]^\\dagger[W(t),V]\\rangle$ diagnose operator growth and scrambling (quantum butterfly effect).
