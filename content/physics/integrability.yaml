id: integrability
title: Integrability
domain: physics
area: hep
order: 760
one_liner: Systems with enough conserved quantities to be solved exactly, from spin chains to planar N=4 Yang–Mills.
summary: >-
  Quantum integrable systems have factorized scattering and infinitely many commuting charges. Bethe ansatz,
  Yang–Baxter equation and quantum groups solve 1+1D models exactly. Integrability solved the spectrum
  of planar N=4 SYM and supplies exact benchmarks for many-body physics.
definitions:
  - "**Classical integrability is clear:** n independent Poisson-commuting conserved quantities (Liouville–Arnold) ⇒ motion on tori."
  - "**Quantum integrability has no agreed definition** (Caux–Mossel 2011). The naive translation fails: every Hamiltonian has N commuting conserved operators (the projectors on its eigenstates)."
  - "**(1) Local (or quasi-local) conserved charges** — an extensive number of conserved quantities that are sums of local densities. Most common in condensed matter; explains GGE relaxation."
  - "**(2) Bethe-ansatz solvability / Yang–Baxter** — eigenstates obtained exactly from an R-matrix. The working definition in mathematical physics; free fermions are integrable by (1) but trivially so."
  - "**(3) Factorized, non-diffractive scattering** — the multi-particle S-matrix factorizes into two-body ones (1+1D field theories)."
  - "**(4) Poisson level statistics** — the spectral opposite of chaos. *Problem:* fails with degeneracies or unresolved symmetries, and some non-integrable systems (localized ones) also show Poisson statistics."
  - "**Overlap:** for XXZ, Lieb–Liniger and sine-Gordon all four agree; they form a cluster of properties rather than one definition."
asks:
  - Which interacting systems can be solved exactly, and what structure makes it possible?
  - How do integrable systems thermalize (or fail to)?
key_results:
  - "Bethe ansatz (1931) for the Heisenberg chain; Lieb–Liniger; Yang–Baxter equation."
  - "Onsager's solution of the 2D Ising model (1944). ([Onsager 1944](https://doi.org/10.1103/PhysRev.65.117))"
  - "Factorized S-matrices (Zamolodchikov); quantum groups."
  - "Quantum spectral curve for planar N=4 SYM (Gromov–Kazakov–Leurent–Volin). ([GKLV 2013](https://arxiv.org/abs/1305.1939))"
  - "Generalized Gibbs ensemble and generalized hydrodynamics (2016) for integrable relaxation."
experiments:
  - "Quantum Newton's cradle (Kinoshita–Wenger–Weiss 2006): 1D Bose gas does not thermalize."
  - Spin-chain materials measured by neutron scattering; KPZ superdiffusion in Heisenberg chains.
limits:
  - Fine-tuned; most realistic systems are non-integrable; mostly low-dimensional.
applications:
  - Exact benchmarks for numerics; cold-atom physics; strings in AdS₅×S⁵.
frontiers:
  - Generalized hydrodynamics; weak integrability breaking; integrability in AdS₃ and fishnet theories.
connections: [classical-mechanics, cft, statistical-mechanics, condensed-matter, holography, chaos, scattering-amplitudes]
cards:
  - q: What is the Yang–Baxter equation?
    a: "$R_{12}R_{13}R_{23} = R_{23}R_{13}R_{12}$; consistency of factorized scattering and of commuting transfer matrices."
  - q: What is the generalized Gibbs ensemble?
    a: The stationary state of integrable systems, $\rho \propto e^{-\sum_i \beta_i Q_i}$ including all conserved charges.
  - q: What did the quantum Newton's cradle experiment show?
    a: A 1D Bose gas (nearly integrable Lieb–Liniger) did not thermalize over thousands of collisions.
