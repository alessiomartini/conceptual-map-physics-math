id: quantum-gravity
title: Quantum Gravity
domain: physics
area: gravity
order: 810
one_liner: The search for a consistent quantum theory of spacetime itself.
summary: >-
  GR works as an EFT below the Planck scale ($\sim 10^{19}$ GeV), but its UV completion is unknown. Approaches
  include string theory, holography, loop quantum gravity, asymptotic safety, causal dynamical triangulations and
  causal sets. Evidence is mostly theoretical: black-hole entropy, consistency, and the hope of testable relics.
big_goal: "Find the quantum theory of spacetime itself — what happens at the Planck scale, inside black holes and at the Big Bang."
essentials:
  - "General relativity works as an effective quantum theory at low energy; the problem is its completion near the Planck scale (~10¹⁹ GeV)."
  - "Black-hole entropy and holography suggest the number of degrees of freedom scales with area, not volume."
  - "There are several candidates (strings/holography, loop quantum gravity, asymptotic safety…) and a set of conjectured constraints (swampland)."
broken_promises:
  - "Direct tests at the Planck scale are out of reach: a particle accelerator would need to be roughly galaxy-sized, and single gravitons are probably undetectable in principle (Dyson)."
  - "There is no experimental evidence pointing to any candidate, so progress relies on consistency and indirect hints (cosmology, black holes, tabletop entanglement tests)."
definitions:
  - "**Quantum gravity is defined by a problem, not (yet) by a theory.** Different communities mean different things:"
  - "**(1) The low-energy definition:** any quantum theory whose long-distance limit is GR coupled to matter. This EFT is known and computable ([[effective-field-theory]]); what is unknown is its UV completion. Every candidate must reproduce it."
  - "**(2) Constraints without a theory:** properties any consistent quantum gravity should have — Bekenstein–Hawking entropy, unitary black-hole evaporation, no global symmetries, weak gravity conjecture (swampland, S-matrix and CFT bootstrap). *Why:* lets one make claims without choosing a candidate. *Limit:* most constraints are conjectures with varying evidence."
  - "**(3) Holographic definition:** in asymptotically AdS spacetimes, quantum gravity *is* a dual CFT on the boundary ([[holography]]). *Why:* the only fully non-perturbative definition we have. *Limit:* our universe is not AdS; flat-space and de Sitter versions are open."
  - "**(4) Specific candidates:** string theory (perturbative, with non-perturbative completions in AdS), loop quantum gravity (canonical quantization of geometry, background independent), asymptotic safety (GR-like field theory with a UV fixed point), causal dynamical triangulations, causal sets."
  - "**Where they agree / disagree:** all aim to recover semiclassical GR; string theory and LQG both reproduce black-hole entropy (LQG after fixing the Immirzi parameter). They disagree on what is fundamental — a quantized continuum geometry (LQG, asymptotic safety) or spacetime emerging from non-geometric degrees of freedom (strings, holography) — and on whether string theory is the unique consistent completion, which is debated, not established."
asks:
  - What are the microscopic degrees of freedom of spacetime?
  - What replaces singularities (Big Bang, black hole interiors)?
  - Is spacetime emergent, and from what (entanglement)?
key_results:
  - Non-renormalizability of perturbative GR; GR as a valid EFT at low energies.
  - "Bekenstein–Hawking entropy and the holographic principle (’t Hooft, Susskind)."
  - "AdS/CFT gives a non-perturbative definition of quantum gravity in AdS ([[holography]])."
  - "Loop quantum gravity: discrete area and volume spectra; spin networks."
  - "Asymptotic safety (Weinberg 1979; Reuter): evidence for a UV fixed point in truncations."
  - "Swampland conjectures: no global symmetries, weak gravity conjecture, distance conjecture."
experiments:
  - No direct evidence. Constraints from Lorentz-invariance tests (GRB timing), CMB tensor modes, tabletop proposals for gravitationally mediated entanglement.
limits:
  - The Planck scale is ~15 orders beyond colliders; quantum gravity in de Sitter (our universe) is poorly understood.
applications:
  - Conceptual, but has driven advances in mathematics, QFT and quantum information.
frontiers:
  - De Sitter holography and observers; algebras of observables (type II von Neumann algebras, Chandrasekaran–Longo–Penington–Witten 2022); swampland vs data (DESI hints). ([CLPW 2022](https://arxiv.org/abs/2206.10780))
  - Tabletop tests of quantum nature of gravity.
connections: [general-relativity, string-theory, holography, black-holes, effective-field-theory, quantum-information, cosmology, quantum-foundations]
prerequisites: [general-relativity, qft]
cards:
  - q: What is the Planck energy?
    a: $E_P = \sqrt{\hbar c^5/G} \approx 1.2\times 10^{19}$ GeV.
  - q: What does the holographic principle claim?
    a: The number of degrees of freedom in a region of quantum gravity scales with the area of its boundary in Planck units, not its volume.
  - q: What is the weak gravity conjecture?
    a: In any consistent quantum gravity with a U(1) gauge field, there exists a state with charge-to-mass ratio at least that of an extremal black hole (gravity is the weakest force).
  - q: Name four approaches to quantum gravity.
    a: String theory/holography, loop quantum gravity, asymptotic safety, causal dynamical triangulations (also causal sets, group field theory).
  - q: What type of von Neumann algebra appears for observables outside a black hole when gravity is included perturbatively?
    a: Type II (crossed product of the type III₁ QFT algebra), allowing finite entropy differences (Witten; Chandrasekaran–Penington–Witten).
