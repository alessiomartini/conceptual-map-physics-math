id: networks
title: Network Science
short: Networks
domain: physics
area: complex
order: 970
one_liner: The structure and dynamics of systems best described as nodes and links.
summary: >-
  Real networks (internet, social, biological, financial) share small-world and heavy-tailed degree properties
  that shape spreading, robustness and synchronization. Statistical physics provides random-graph ensembles,
  percolation, and community detection methods.
big_goal: "Understand how the pattern of connections in real systems — social, biological, technological — shapes what happens on them."
essentials:
  - "Real networks are 'small worlds': few steps connect any two nodes, while local clustering stays high."
  - "Many networks have hubs (heavy-tailed degree distributions), which make them robust to random failure but fragile to targeted attacks."
  - "Epidemics spread differently on networks with hubs: the epidemic threshold can vanish."
broken_promises:
  - "The claim that most real networks are 'scale-free' with universal exponents turned out much weaker under rigorous statistics (Broido–Clauset 2019)."
  - "Pairwise networks were hoped to capture complex systems; many phenomena need higher-order (group) interactions and time dependence."
asks:
  - What universal structures do real networks share and why?
  - How do processes (epidemics, cascades, synchronization) depend on network structure?
  - How robust are networks to failures and attacks?
key_results:
  - "Erdős–Rényi random graphs and the giant-component transition at mean degree 1."
  - "Small-world networks (Watts–Strogatz 1998). ([Watts–Strogatz 1998](https://doi.org/10.1038/30918))"
  - "Scale-free networks via preferential attachment (Barabási–Albert 1999). ([Barabási–Albert 1999](https://doi.org/10.1126/science.286.5439.509))"
  - "Vanishing epidemic threshold on scale-free networks (Pastor-Satorras–Vespignani 2001)."
  - "Robust-yet-fragile: resilient to random failure, vulnerable to targeted hub attacks."
  - "Kuramoto model of synchronization; community detection via modularity and stochastic block models."
experiments:
  - Empirical datasets (WWW, citation, protein interaction, airline, interbank networks).
limits:
  - Many scale-free claims weak under rigorous statistics (Broido–Clauset 2019); networks ignore higher-order and temporal structure.
applications:
  - Epidemic modelling, systemic risk in banking, recommendation systems, power grids, neuroscience (connectome).
frontiers:
  - Higher-order networks (simplicial complexes, hypergraphs), multilayer and temporal networks, network geometry, graph neural networks.
connections: [graph-theory, complex-systems, phase-transitions, sociophysics, econophysics, statistical-mechanics, probability-theory]
resources:
  - "Barabási, *Network Science* (free online)"
  - "Newman, *Networks*"
cards:
  - q: At what mean degree does a giant component appear in an Erdős–Rényi graph?
    a: At mean degree $\langle k\rangle = 1$ (percolation transition).
  - q: What mechanism generates scale-free degree distributions in the Barabási–Albert model?
    a: Growth with preferential attachment (new nodes link proportionally to degree), giving $P(k) \sim k^{-3}$.
  - q: Why do scale-free networks have a vanishing epidemic threshold?
    a: The threshold scales as $\langle k\rangle/\langle k^2\rangle$, and $\langle k^2\rangle$ diverges for degree exponents ≤ 3.
  - q: What does the Kuramoto model describe?
    a: Synchronization of coupled phase oscillators with distributed natural frequencies; above a critical coupling a macroscopic fraction locks.
