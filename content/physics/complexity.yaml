id: complexity
title: Complexity (Algorithmic, Computational & Physical)
short: Complexity
domain: physics
area: complex
order: 960
one_liner: Quantifying how hard something is to describe, compute or prepare — and why this matters for physics.
summary: >-
  Different notions: Kolmogorov (description length), computational (resources to solve problems), and
  physical (circuit complexity of quantum states, statistical complexity of processes). Computational
  complexity limits simulability of physical systems; quantum circuit complexity has been proposed to
  track the growth of black-hole interiors.
big_goal: "Quantify how hard things are — to describe, to compute, to simulate, to prepare — and understand what these limits say about physics."
essentials:
  - "Different notions: description length (Kolmogorov), computational resources (P vs NP), quantum circuit complexity."
  - "Some physical problems are provably hard (finding spin-glass ground states is NP-hard; quantum ground-state energies are QMA-hard), so no efficient algorithm is expected."
  - "In holography, the growth of black-hole interiors has been conjectured to match the growth of quantum complexity."
broken_promises:
  - "Kolmogorov complexity was meant to be the ultimate measure of information content of a single object; it is uncomputable, so it can never be evaluated in general."
  - "The hope that physical systems might efficiently solve NP-hard problems (analog computers, quantum annealers) has not been borne out; complexity theory suggests even quantum computers cannot."
asks:
  - How much information or computation is needed to describe or simulate a system?
  - Which physical problems are intractable (e.g. NP-hard spin glasses, QMA-hard ground states)?
  - Does complexity have a geometric or gravitational meaning?
key_results:
  - "Kolmogorov complexity is uncomputable; connections to Shannon entropy."
  - "Finding Ising spin-glass ground states is NP-hard (Barahona 1982); local Hamiltonian problem is QMA-complete (Kitaev)."
  - "Nielsen's geometric approach to circuit complexity."
  - "Complexity = volume / action conjectures (Susskind et al.) for black-hole interiors; Brown–Susskind second law of complexity."
  - "Krylov complexity and operator growth (Parker et al. 2019)."
experiments:
  - Quantum advantage experiments test where classical simulation becomes intractable.
limits:
  - Holographic complexity lacks a precise boundary definition; many notions are not observable.
applications:
  - Limits of simulation, cryptography, quantum computing benchmarks.
frontiers:
  - Complexity in holography; pseudorandom quantum states and the hardness of the AdS/CFT dictionary; complexity of learning.
connections: [computational-complexity, information-theory, quantum-information, holography, chaos, complex-systems]
cards:
  - q: Is Kolmogorov complexity computable?
    a: No — there is no algorithm that computes the shortest description length of an arbitrary string.
  - q: What is the complexity class of finding the ground-state energy of a local Hamiltonian?
    a: QMA-complete (Kitaev), the quantum analogue of NP.
  - q: What do "complexity = volume" conjectures propose?
    a: The volume of the maximal slice through a black-hole interior is dual to the quantum circuit complexity of the boundary state, growing linearly for exponentially long times.
