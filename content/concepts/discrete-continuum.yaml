id: discrete-continuum
title: "Discreteness and the continuum: atoms, lattices, quanta and the limit between them"
short: Discreteness and the continuum
domain: concept
area: concepts
order: 180
one_liner: Physics keeps moving between discrete and continuous descriptions (atoms and fluids, lattices and fields, quanta and waves, grids and equations); the thread asks when each is fundamental, when it is an approximation and what the limits between them preserve.
summary: >-
  Matter looks continuous and turns out to be made of atoms; energy looks continuous and comes in quanta; fields
  and spacetime are written as continuous and are simulated, regularised and perhaps quantised on grids. The thread
  follows the recurring move in both directions: coarse-graining discrete structure into a continuum (fluids,
  elasticity, field theory) and discretising a continuum for computation or regularisation (lattice gauge theory,
  numerics). It also asks what continuity means in mathematics and computation, and reviews proposals for
  discreteness of spacetime itself, with the caveat that no experiment has yet seen it. The scaling, universality and
  randomness threads handle the related ideas of coarse-graining limits and of atomism as the origin of noise; they
  are linked, not repeated.
thread:
  - "**Two kinds of description:** a fluid is described by smooth fields (density, velocity) satisfying PDEs, yet it is made of about $10^{23}$ molecules; a crystal is a lattice of atoms but its sound waves obey a continuum wave equation. The continuum is an effective description valid on scales much larger than the spacing, and its parameters (viscosity, elastic constants) come from the discrete level ([[hydrodynamics]], [[condensed-matter]], [[pde]], [[emergence]])."
  - "**The atomic hypothesis:** from Democritus to Dalton the idea of atoms was a chemical and philosophical hypothesis; for many physicists around 1900 (Mach, Ostwald) it was unnecessary. Einstein's 1905 analysis of Brownian motion, and Perrin's measurements of it, gave independent determinations of Avogadro's number and made atoms an experimental fact. The noise side of the story is in the randomness thread ([[randomness-probability]], [[statistical-mechanics]], [[stochastic-processes]], [[thermodynamics]]). ([Einstein 1905](https://doi.org/10.1002/andp.19053220806))"
  - "**Quantisation of energy and spectra:** Planck's blackbody law, the photoelectric effect and the discrete spectra of atoms showed that energy exchange is discrete. Bound states of a confined wave have discrete frequencies for the same reason a guitar string does: the discreteness comes from boundary conditions on a continuous field (eigenvalues of an operator), not from a granular space ([[quantum-mechanics]], [[exp-blackbody]], [[exp-photoelectric]], [[functional-analysis]]). Heisenberg's matrix mechanics took the discrete spectrum as primitive ([Heisenberg 1925](https://doi.org/10.1007/BF01328377))."
  - "**Particles as quanta of fields:** in QFT the discreteness of particle number comes from the quantisation of normal modes of a continuous field (the oscillator thread); electric charge is quantised in units of $e$, and the Dirac and topological arguments relate it to integers ([[qft]], [[harmonic-oscillator]], [[topology-invariants]])."
  - "**From lattice to continuum:** a chain of masses and springs with spacing $a$ has the dispersion $\\omega = 2\\sqrt{K/m}\\,|\\sin(ka/2)|$, which becomes linear, $\\omega = ck$, for $ka\\ll1$: the wave equation. Near a phase transition the correlation length diverges and the lattice spacing becomes irrelevant, so very different microscopic models share continuum field theories; this is the origin of universality and of the scaling and renormalisation ideas ([[universality]], [[scaling-dimensional-analysis]], [[renormalization]], [[phase-transitions]], [[statistical-mechanics]])."
  - "**Lattice field theory:** Wilson put gauge theory on a spacetime lattice with gauge variables on links; it gives a regularisation that preserves gauge invariance, a proof of confinement at strong coupling ([Wilson 1974](https://doi.org/10.1103/PhysRevD.10.2445)) and a way to compute non-perturbatively by Monte Carlo. Lattice QCD reproduces the light hadron masses from the quark masses and the coupling, with the continuum limit $a\\to0$ taken by extrapolation ([Dürr et al. 2008](https://doi.org/10.1126/science.1163233)) ([[lattice-field-theory]], [[gauge-theory]], [[standard-model]], [[qft]])."
  - "**What the lattice breaks:** discretising spacetime breaks Lorentz and rotation invariance down to a hypercubic subgroup (recovered in the continuum limit), and chiral fermions are hard on a lattice because of the doubling problem ([Nielsen–Ninomiya 1981](https://doi.org/10.1016/0550-3213%2881%2990361-8)). Preserving a symmetry in the discretisation, or recovering it in the limit, is a central difficulty ([[symmetries]], [[symmetry-conservation-gauge]], [[special-relativity]])."
  - "**Renormalisation and effective continuum theories:** a field theory with a momentum cut-off $\\Lambda$ is a continuum theory that remembers a discrete scale; the renormalisation group says that the low-energy physics depends on the short-distance details only through a few couplings, so continuum quantum field theories can be used without knowing what is at the cut-off. Effective field theory makes the cut-off explicit ([[renormalization]], [[effective-field-theory]], [[qft]], [[cft]])."
  - "**Discretisation in numerics:** differential equations are solved on grids, in finite elements or by spectral methods; consistency, stability and convergence of a scheme decide whether the discrete solution approaches the continuum one (Lax equivalence theorem), and the discrete equations can preserve structure (symplectic integrators, conservation laws) that the naive scheme loses ([[numerical-analysis]], [[ode]], [[pde]], [[classical-mechanics]], [[chaos]])."
  - "**Combinatorics and graphs:** discrete mathematics enters physics through lattices, graphs, networks, tilings and counting of states; the continuum emerges in limits (random walks to Brownian motion and diffusion, large graphs to continuum geometry, large random matrices to spectral densities) ([[combinatorics]], [[graph-theory]], [[networks]], [[stochastic-processes]], [[random-matrix-theory]], [[sde]])."
  - "**Real numbers and computability:** physical equations use real numbers, but measurements have finite precision and a computer represents only a countable set of numbers. Turing's computable numbers are a countable subset of the reals, so most reals can never be specified; whether physics needs the full continuum or only computable or finite-precision quantities is a question about the foundations ([Turing 1936–37](https://doi.org/10.1112/plms/s2-42.1.230)) ([[logic-set-theory]], [[philosophy-of-mathematics]], [[real-analysis]], [[computational-complexity]], [[philosophy-of-physics]])."
  - "**Discreteness of spacetime:** the Planck length $\\ell_P=\\sqrt{\\hbar G/c^3}\\approx10^{-35}$ m is where gravity and quantum effects are expected to meet, and several proposals make space or time discrete or give a minimal length: Snyder's noncommutative spacetime ([Snyder 1947](https://doi.org/10.1103/PhysRev.71.38)), the discrete spectra of area and volume in loop quantum gravity ([Rovelli–Smolin 1995](https://doi.org/10.1016/0550-3213%2895%2900150-Q)), causal sets ([Bombelli et al. 1987](https://doi.org/10.1103/PhysRevLett.59.521)), minimal-length effects from generalised uncertainty relations in string theory, and spin foams or dynamical triangulations. A review of the minimal-length ideas is [Hossenfelder 2013](https://doi.org/10.12942/lrr-2013-2) ([[quantum-gravity]], [[string-theory]], [[general-relativity]], [[black-holes]], [[holography]])."
definitions:
  - "**What does 'discrete spacetime' mean? Four different claims under one name.** (a) *Lattice regularisation*: spacetime is replaced by a grid as a calculational device and the spacing is sent to zero at the end. *Why:* it gives non-perturbative control (lattice QCD). *Problems:* nothing is claimed about nature, and it breaks Lorentz invariance only at finite $a$."
  - "(b) *Fundamental lattice*: spacetime is a lattice of spacing about $\\ell_P$. *Why:* it removes ultraviolet divergences by construction. *Problems:* it picks a preferred frame, so Lorentz invariance is violated unless the effects are suppressed; astrophysical tests (gamma-ray bursts, cosmic rays) constrain such violations strongly, and a boosted lattice is no longer the same lattice."
  - "(c) *Discrete spectra of geometric operators*: space is smooth as a differentiable structure but quantities like area and volume have discrete eigenvalues (loop quantum gravity), as angular momentum does. *Why:* it keeps Lorentz symmetry a symmetry of the Hilbert space, not of a background lattice. *Problems:* it is not proven that the spectrum is observable or that the semi-classical limit recovers general relativity."
  - "(d) *Minimal length without a lattice*: a bound on resolvable distances (from the generalised uncertainty principle, string size, black-hole formation) with no discrete points. *Why:* many approaches to quantum gravity suggest it. *Problems:* its form depends on the model, and it is not clear it is a property of spacetime rather than of the probes."
  - "**Overlaps and conflicts.** (a) is a method and is compatible with all others. (b) is the most naive and the most constrained. (c), (d) and causal sets try to avoid a preferred frame in different ways. None is confirmed, and the proposals make different predictions, so the thread keeps the phrase tied to the specific claim."
caveats:
  - "Neither discrete nor continuous is automatically more fundamental: the continuum gives symmetries (translations, rotations, Lorentz) and calculus, the discrete gives finiteness and counting, and each emerges from the other in some limit. Atoms are discrete although fluid mechanics works; quantised energies come from continuous wave equations."
  - "The continuum limit of a lattice theory has to be taken carefully: couplings are tuned with $a$ (running), the limit exists only at a critical point of the lattice model, and the result can depend on the discretisation unless universality applies. A lattice theory with finite $a$ is not 'less exact'; it is a different theory that agrees with the continuum one in the limit."
  - "Lattice results are numerical: lattice QCD has statistical errors, finite-volume corrections and extrapolations in $a$ and quark mass. The sign problem prevents the same methods from working at finite baryon density or for real-time dynamics."
  - "'Energy is quantised' is not true in general: continuous spectra (free particles, scattering states) exist, and what is discrete is the spectrum of a bound state, or the possible results of a particular measurement. Quantisation of charge and of angular momentum are not both derived from first principles in the Standard Model."
  - "No experiment has observed discreteness of spacetime. Planck-scale effects are hard to test; Lorentz-violation bounds from gamma-ray bursts, the cosmic microwave background and high-energy cosmic rays constrain some of the lattice and dispersion-relation models but not the others, and a null result is not a refutation of discrete structure in general."
  - "Computability arguments are not physics results: that a computer can use only computable or finite-precision reals does not show that nature does, and the claim 'the universe is a computer' is a hypothesis, not a theorem. Equally, the use of real numbers in physics is justified by convenience (calculus), not by an experimental measurement of infinite precision."
  - "A numerical discretisation can introduce spurious behaviour with no physical counterpart, such as numerical dissipation, grid anisotropy, spurious modes and artificial chaos; the discrete system may have properties (e.g. exact conservation of an invariant) that differ from the continuum ones."
