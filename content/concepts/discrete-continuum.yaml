cards:
  - q: Why can a lattice of atoms be described by a continuum wave equation?
    a: For wavelengths much larger than the lattice spacing, the dispersion relation becomes linear, $\omega=ck$; the continuum is an effective description whose constants come from the discrete level.
  - q: What did Einstein's and Perrin's work on Brownian motion establish?
    a: The mean-square displacement predicted from molecular collisions and its measurement gave Avogadro's number and made the atomic hypothesis an experimental fact.
  - q: Why are atomic energy levels discrete although the Schrödinger equation is a continuous field equation?
    a: A wave confined by boundary conditions has discrete eigenvalues, as a guitar string does; discreteness comes from the eigenvalue problem, not from a granular space.
  - q: What is lattice QCD, and what is the continuum limit?
    a: QCD formulated on a spacetime grid with gauge variables on links and computed by Monte Carlo; the physical results are obtained by extrapolating the spacing $a\to0$ (and the volume to infinity).
  - q: What symmetries does a spacetime lattice break?
    a: Continuous translations, rotations and Lorentz boosts are reduced to a discrete subgroup, and chiral symmetry is hard to preserve (fermion doubling); they are recovered only in the continuum limit.
  - q: How does the renormalisation group justify continuum field theories?
    a: Low-energy physics depends on the short-distance, possibly discrete, structure only through a few couplings, so one can use a continuum theory without knowing what lies at the cut-off.
  - q: What are four different meanings of discrete spacetime?
    a: A lattice used as a regulator, a fundamental lattice, discrete spectra of geometric operators with smooth structure (loop quantum gravity), and a minimal length without any lattice.
  - q: Has discreteness of spacetime been observed?
    a: No. Lorentz-violation tests constrain some models, but Planck-scale discreteness is untested.
  - q: What is the Lax equivalence theorem?
    detail: true  # site only, not in the Anki deck
    a: For a consistent finite-difference scheme for a well-posed linear initial-value problem, stability is equivalent to convergence.
