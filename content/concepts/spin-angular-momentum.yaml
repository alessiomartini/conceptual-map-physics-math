id: spin-angular-momentum
title: "Spin and angular momentum: rotations, representations and the electron's two-valued degree of freedom"
short: Spin
domain: concept
area: concepts
order: 360
one_liner: Spin is angular momentum that no motion in space accounts for; it is the label of how a particle transforms under rotations, it gives the double cover SU(2) of the rotation group, and it reappears in magnetism, geometric phases, spin chains and the proton.
summary: >-
  Orbital angular momentum comes from motion and takes integer values. Experiments on atoms in magnetic fields
  needed a second, intrinsic kind that can be half-integer, and it was first pictured as a spinning electron. The
  picture fails, but the algebra survives: spin is the representation of the rotation group carried by the
  particle, and for half-integer values this is a representation of SU(2), not of SO(3). The thread follows this
  idea from the atomic spectra of the 1920s to Dirac's equation, the classification of particles by Wigner, the
  observation that a $2\pi$ rotation changes the sign of a spinor, the exchange interaction that makes magnets,
  and the use of "spin" for any two-level or SU(2) degree of freedom in quantum magnets and qubits. The link
  with statistics is in the identical-particles thread and the geometric phase in the geometry thread. What is
  called spin is not one thing in all contexts, see "Definitions".
thread:
  - "**Space quantization:** a beam of silver atoms in an inhomogeneous magnetic field splits into two, not into a continuous smear, so the component of the magnetic moment along the field takes discrete values ([Gerlach–Stern 1922](https://doi.org/10.1007/BF01326983)). The two-valued result could not be explained with orbital angular momentum, which gives an odd number of components ([[exp-stern-gerlach]], [[quantum-mechanics]], [[amo-physics]])."
  - "**The electron spin proposal:** the doublet structure of atomic spectra was explained by assigning the electron an intrinsic angular momentum $\\hbar/2$ and a magnetic moment ([Uhlenbeck–Goudsmit 1926](https://doi.org/10.1038/117264a0)). A first estimate of the spin–orbit coupling was a factor of 2 too large and was corrected by the kinematics of the accelerated electron frame, the Thomas precession ([Thomas 1926](https://doi.org/10.1038/117514a0)) ([[special-relativity]], [[classical-mechanics]])."
  - "**Spin as an operator algebra:** the spin components obey the same commutation relations as orbital angular momentum, $[S_i,S_j]=i\\hbar\\epsilon_{ijk}S_k$, and for spin 1/2 are represented by $2\\times2$ matrices acting on a two-component wave function ([Pauli 1927](https://doi.org/10.1007/BF01397326)). Spin is therefore defined by how the state changes under rotations, not by any motion in space ([[lie-theory]], [[group-theory]], [[linear-algebra]])."
  - "**Relativity and spin:** the first-order relativistic equation for the electron contains spin and a magnetic moment with $g\\approx2$ without extra assumptions ([Dirac 1928](https://doi.org/10.1098/rspa.1928.0023)). Spin appears as a consequence of combining quantum mechanics with Lorentz invariance, not as an add-on ([[qft]], [[particles-fields]], [[exp-g-2]])."
  - "**Particles as representations:** massive particles are classified by mass and spin, the latter labelling a representation of the rotation group (the little group), and massless ones by helicity ([Wigner 1939](https://doi.org/10.2307/1968551)). In this language spin is one of the labels that defines what kind of particle something is ([[particles-fields]], [[symmetry-conservation-gauge]], [[standard-model]])."
  - "**The double cover and the $2\\pi$ rotation:** half-integer spin states are representations of SU(2), which covers the rotation group SO(3) twice, so a rotation by $2\\pi$ multiplies the state by $-1$ and only a rotation by $4\\pi$ returns it. This sign cannot be seen in one state, but it can be seen by interfering a rotated and a non-rotated beam ([Aharonov–Susskind 1967](https://doi.org/10.1103/PhysRev.158.1237)), which was done with neutrons ([Rauch et al. 1975](https://doi.org/10.1016/0375-9601%2875%2990798-7); [Werner et al. 1975](https://doi.org/10.1103/PhysRevLett.35.1053)) ([[topology-invariants]], [[geometry-curvature]], [[lie-theory]])."
  - "**Controlling spin with fields:** a spin in a static field precesses at the Larmor frequency, and an oscillating field at that frequency drives transitions between the levels, the basis of magnetic resonance ([Rabi 1937](https://doi.org/10.1103/PhysRev.51.652)). The same two-level dynamics is the model of a qubit ([[quantum-information]], [[amo-physics]])."
  - "**Spin and phase:** when the field direction is changed slowly, the spin state acquires, besides the dynamical phase, a geometric phase equal to half the solid angle swept by the field direction ([Berry 1984](https://doi.org/10.1098/rspa.1984.0023)) ([[geometry-curvature]], [[topological-phases]])."
  - "**Spin and statistics:** particles with integer spin are bosons and those with half-integer spin are fermions, a theorem of relativistic quantum field theory, treated in its own thread ([[identical-particles-statistics]])."
  - "**Magnetism from exchange:** the magnetic dipole interaction between electron spins is far too weak to explain ferromagnets. The alignment comes from the electrostatic repulsion combined with the antisymmetry of the wave function, which makes the energy depend on the relative spin orientation, an effective coupling of the form $J\\,\\vec S_i\\cdot\\vec S_j$ ([Heisenberg 1928](https://doi.org/10.1007/BF01328601)) ([[condensed-matter]], [[statistical-mechanics]], [[spontaneous-symmetry-breaking]])."
  - "**Spin chains and large spin:** the low-energy physics of the antiferromagnetic Heisenberg chain depends on whether the spin is integer or half-integer: integer-spin chains have a gap, half-integer ones do not ([Haldane 1983](https://doi.org/10.1103/PhysRevLett.50.1153)). This is a case where a small quantum number decides the universality class ([[universality]], [[dimensionality]], [[integrability-chaos]])."
  - "**Spin liquids:** in some magnets frustration may prevent order even at zero temperature; the resonating valence bond state was proposed as such a state ([Anderson 1973](https://doi.org/10.1016/0025-5408%2873%2990167-0)), and an exactly solvable spin model on the honeycomb lattice has a spin-liquid ground state with anyonic excitations ([Kitaev 2006](https://doi.org/10.1016/j.aop.2005.10.005)) ([[topological-phases]], [[emergence]], [[entanglement-correlations]])."
  - "**Using spin:** transport depends on spin orientation in magnetic multilayers, observed as a large change of resistance with the relative magnetization of the layers ([Baibich et al. 1988](https://doi.org/10.1103/PhysRevLett.61.2472)), which started spintronics ([[condensed-matter]], [[quantum-information]])."
  - "**Where does the proton's spin come from?** The proton has spin 1/2, but a measurement of polarized muon scattering found that the quark spins carry only a small fraction of it ([EMC, Ashman et al. 1988](https://doi.org/10.1016/0370-2693%2888%2991523-7)). The rest must come from gluon spin and orbital angular momentum, and how to split the total is not unique, see \"Definitions\" ([[standard-model]], [[nuclear-physics]], [[qft]])."
definitions:
  - "**What is 'spin'? The word is used for at least three different things.** (a) *Intrinsic angular momentum of a particle*: the part of the total angular momentum that remains in the rest frame. *Why:* it is what is measured in atomic beams and scattering, and it adds to orbital angular momentum to give a conserved total. *Problems:* in a field theory it is not always separately conserved or gauge invariant, and the 'rest frame' does not exist for massless particles."
  - "(b) *A representation label*: spin is the irreducible representation of the little group of the Poincaré group (rotations for massive particles, rotations in the plane for massless ones). *Why:* it classifies particles without any picture of rotation, and works in every relativistic theory. *Problems:* it says how the state transforms, not why a given particle has a given value, and it does not apply to non-relativistic or lattice systems where the Poincaré group is not a symmetry."
  - "(c) *An effective SU(2) degree of freedom*: any two-level system, or any set of operators obeying the angular momentum algebra, is called a 'spin' (pseudospin, isospin, the spin of a qubit, the effective spin of an atom with total angular momentum $J$). *Why:* the mathematics is the same, so results transfer between fields. *Problems:* these 'spins' need not be intrinsic, may include orbital motion, and may not rotate under physical rotations at all (isospin)."
  - "**The proton spin decomposition.** The total angular momentum $1/2$ can be written as a sum of quark spin, quark orbital, gluon spin and gluon orbital parts, but the split of the gauge field part depends on how it is defined (there are decompositions that are gauge invariant but not satisfying the canonical angular momentum algebra, and others with the algebra but gauge dependent). *Why it matters:* the individual terms are not all measurable in the same way, and the statement that 'quarks carry only a fraction of the spin' depends on the choice."
caveats:
  - "The electron is not a small spinning ball: if one assigns the measured angular momentum to a classical sphere of the classical electron radius, its surface would have to move faster than light, and scattering experiments show no size down to very small scales. Spin has no classical analogue except in the limit of large quantum numbers; the picture is useful for the magnetic moment and misleading for everything else."
  - "A $2\\pi$ rotation giving $-1$ does not make a single spin state observable: only relative phases between two paths or between two parts of a superposition are measurable, which is why the neutron experiments use interference. The statement 'a spin-1/2 particle must turn twice to come back' is about the state, not the particle's position."
  - "Spin is not the same as the magnetic moment, which depends on the particle's charge and structure (the neutron has spin 1/2 and a magnetic moment although it is neutral, a consequence of its quark content). The value $g=2$ is a tree-level result of the Dirac equation; the measured value differs by radiative corrections, see the vacuum and QFT threads."
  - "Spin–orbit coupling in atoms is a relativistic effect (in the electron frame there is a magnetic field), with the Thomas factor $1/2$; in solids the same name covers effective couplings that come from the crystal field, so numerical values are not transferable from atoms to materials."
  - "Spin systems in condensed matter often use spin-1/2 as a model of electrons localized on lattice sites, but real materials also have orbital degrees of freedom, and the claim of a spin liquid in a given material is debated, because absence of order is hard to prove and disorder can mimic it."
