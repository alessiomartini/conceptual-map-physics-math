cards:
  - q: What did the Stern–Gerlach experiment show?
    a: A beam of silver atoms in an inhomogeneous field splits into two discrete components, so the angular momentum component along the field is quantized; for the outer electron it requires a value that orbital motion cannot give.
  - q: What is spin, in terms of symmetry?
    a: The way a particle's state transforms under rotations, that is, the representation of the rotation group (more precisely SU(2)) it carries; it is not defined by any motion of the particle.
  - q: Why does a $2\pi$ rotation multiply a spin-1/2 state by $-1$?
    a: Half-integer spin states are representations of SU(2), which is a double cover of the rotation group SO(3); the rotation by $2\pi$ maps to $-1$ in SU(2) and only $4\pi$ returns to the identity.
  - q: How was the sign change under a $2\pi$ rotation observed?
    a: "In neutron interferometry, by splitting a beam, rotating the spin of one path with a magnetic field and recombining: the interference pattern shifts as the rotation angle goes through $2\\pi$."
  - q: Why does the Dirac equation contain spin?
    a: Combining a first-order wave equation with Lorentz invariance needs a multi-component wave function that transforms as a spinor, which carries spin 1/2 and gives $g=2$ for the magnetic moment.
  - q: How does Wigner's classification define spin?
    a: Massive particles are classified by mass and by the irreducible representation of the rotation group in the rest frame (spin); massless ones by helicity.
  - q: Why does ferromagnetism not come from the dipole interaction between spins?
    a: Dipolar energies are far too small; alignment comes from exchange, the electrostatic energy depending on the relative spin through the antisymmetry of the wave function.
  - q: What is the Haldane gap?
    a: Antiferromagnetic Heisenberg chains of integer spin have a finite gap to excitations, while those with half-integer spin are gapless.
  - q: What is the proton spin puzzle?
    a: Quark spins carry only a fraction of the proton's spin $1/2$; the rest comes from gluons and orbital motion, and how to separate them is partly a matter of definition.
