cards:
  - q: What does a singularity usually tell you about a model?
    a: That the description fails there; either a neglected effect becomes important (viscosity, finite size, quantum corrections) or the variables are badly chosen.
  - q: Give a simple equation with finite-time blow-up.
    a: $\dot y=y^2$ has the solution $y=1/(t_*-t)$, which diverges at the finite time $t_*$.
  - q: What happens when a nonlinear wave steepens?
    a: The solution would become multivalued, and weak solutions with shocks (fixed by a conservation law and an entropy condition) take over; in optics the same folding gives caustics.
  - q: What do the Penrose and Hawking–Penrose singularity theorems prove?
    a: That under energy conditions and global assumptions some geodesics are incomplete (for example once a trapped surface forms); they do not say that curvature diverges or what replaces the singularity.
  - q: How does the Schwarzschild horizon differ from the singularity at r = 0?
    a: The horizon is a coordinate artefact with finite curvature; $r=0$ is a real curvature singularity.
  - q: Why do phase transitions need an infinite system?
    a: A finite partition function is analytic in the parameters; non-analytic behaviour appears only in the thermodynamic limit, when Lee–Yang zeros approach the real axis.
  - q: What did Perelman do with Ricci-flow singularities?
    a: He classified them and showed how to cut them out by surgery, which proved the geometrisation (and Poincaré) conjecture.
    detail: true  # site only, not in the Anki deck
  - q: What is critical collapse?
    a: Near the threshold of black-hole formation the mass scales as a power law with a universal exponent in numerical collapse of fields, so the onset of a singularity behaves like a critical phenomenon.
    detail: true  # site only, not in the Anki deck
