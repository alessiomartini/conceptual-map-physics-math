id: mathematics-physics-fit
title: "Why mathematics fits physics"
short: Why mathematics fits physics
domain: concept
area: concepts
order: 390
one_liner: Mathematical structures invented for other reasons keep turning out to describe nature, and physics keeps handing mathematics new problems; why this works is an open question with several competing answers.
summary: >-
  Wigner called it "unreasonable": the concepts of mathematics, chosen for their formal beauty, repeatedly provide
  precisely the language that physical laws need, often decades after their invention. The thread collects the
  episodes, the traffic in the other direction (physics creating mathematics), the cases where the fit fails or is
  only partial, and the main positions on the explanation. The positions are listed under "Definitions", not ranked.
thread:
  - "**The observation:** Wigner (1960) argued that the success of mathematics in physics is a miracle we neither understand nor deserve, since mathematical concepts are formed by mathematicians for their own interest and still fit regularities of nature with striking accuracy; Hamming (1980) added that the effect is real but that part of it is selection and part is a habit of reshaping the question ([[philosophy-of-mathematics]], [[philosophy-of-physics]]). ([Wigner 1960](https://doi.org/10.1002/cpa.3160130102); [Hamming 1980](https://doi.org/10.1080/00029890.1980.11994966))"
  - "**Mathematics ahead of physics:** non-Euclidean and Riemannian geometry (1850s) became the language of general relativity (1915) ([[differential-geometry]], [[general-relativity]]); group theory and representation theory (Galois, Lie, Cartan, Weyl) became the classification of particles and of quantum numbers ([[group-theory]], [[lie-theory]], [[symmetries]], [[standard-model]]); complex numbers became essential in quantum mechanics ([[complex-analysis]], [[quantum-mechanics]]); Hilbert spaces and operator theory preceded and then fitted the quantum formalism ([[functional-analysis]]); fibre bundles and connections, developed in topology and geometry, turned out to be the mathematics of gauge fields, a correspondence recognised only in the 1970s ([[gauge-theory]], [[geometry-curvature]], [[topology]]); matrices and non-commutative algebra for Heisenberg's mechanics ([[linear-algebra]])."
  - "**Physics driving mathematics:** calculus was created with mechanics (Newton) and Fourier analysis with heat conduction ([[real-analysis]], [[pde]]); Dirac's delta function led to Schwartz's theory of distributions ([[functional-analysis]]); Witten's quantum field theory interpretation of the Jones polynomial gave knot invariants a new meaning and started topological quantum field theory ([[tqft]], [[topology-invariants]]); mirror symmetry, found in string theory, predicted counts of rational curves that algebraic geometers then proved ([[algebraic-geometry]], [[string-theory]], [[duality]]); the renormalisation group, random-matrix theory and Yang–Mills theory in four dimensions (still without a rigorous construction) keep posing problems to mathematicians ([[renormalization]], [[random-matrix-theory]], [[qft]]). ([Witten 1989](https://doi.org/10.1007/BF01217730); [Candelas et al. 1991](https://doi.org/10.1016/0550-3213%2891%2990292-6))"
  - "**Unification of apparently unrelated fields:** the same equations recur (harmonic oscillator, diffusion, Laplace equation, Gaussian integrals), and the same structures recur in different domains (the central limit theorem, symmetry, variational principles). This is part of the 'unreasonable' effect: a small stock of mathematical forms covers a large range of phenomena ([[harmonic-oscillator]], [[universality]], [[variational-principles]], [[symmetry-conservation-gauge]], [[linearity-superposition]])."
  - "**Mathematics as a guide to discovery:** the positron from the Dirac equation, the prediction of the Higgs mechanism, black holes, gravitational waves and the quantisation of angular momentum from representation theory are cases in which working out a mathematical structure came before an observation ([[qft]], [[spin-angular-momentum]], [[black-holes]])."
  - "**Selection and construction:** what gets reported is the success; failed attempts to apply mathematics (and mathematics that never found an application) are forgotten. Physics also *chooses* the quantities that can be described: it asks questions where measurements are repeatable, isolates systems and idealises them, and the parts of nature that do not lend themselves to this (turbulence at the level of individual eddies, complex adaptive systems) are described mostly by models and numerics ([[approximation-perturbation]], [[emergence]], [[complex-systems]])."
  - "**Effectiveness and limits:** the success is uneven. Fundamental physics is extremely well described, whereas biology, economics and the social sciences are much less so (Gelfand's remark on 'unreasonable ineffectiveness' in biology); the success also depends on scale, and effective descriptions at different scales use different mathematics ([[effective-theories-naturalness]], [[econophysics]], [[biophysics]], [[sociophysics]])."
  - "**Structure and the universe as mathematics:** structural realists hold that what theories get right is relational (mathematical) structure, which survives theory change, not the nature of objects; Tegmark's 'mathematical universe' goes further and identifies physical reality with a mathematical structure. Critics object that the latter is untestable, faces the problem of picking the structure, and conflates a description with what it describes ([[unification]], [[quantum-foundations]]). ([Tegmark 2007](https://arxiv.org/abs/0704.0646))"
  - "**The boundary of the physical in mathematics:** Gödel incompleteness, undecidability and computational complexity limit what can be computed or proved within a theory, even when the equations are known; they raise the question of whether some physical quantities (spectral gaps, long-time behaviour) are in principle undecidable, and show that 'the equations exist' does not mean 'the answers are available' ([[logic-set-theory]], [[computational-complexity]], [[computation-physics]], [[singularities-breakdown]])."
definitions:
  - "**What would an explanation of the fit look like? Four main families of answers, with different aims.** (a) *Platonist / realist*: mathematical objects exist independently of us and the physical world instantiates, or is, some of them (Tegmark's strongest form). *Why it exists:* it makes the fit unsurprising, and fits the sense of mathematicians that they discover rather than invent. *Problems:* epistemic access (how do we know abstract objects?), and why this subset of mathematics is physical (Benacerraf's problem)."
  - "(b) *Formalist / structural*: mathematics is the study of structures, patterns and consequences of axioms, and physics describes the structure of nature; what we can know of the world is its relational structure (epistemic structural realism) or that is all there is (ontic structural realism, e.g. in the debate about the identity of particles). *Why:* it explains why mathematics survives theory change (Newtonian gravity as a limit of general relativity, Fresnel's equations surviving the ether). *Problems:* the distinction between structure and objects is hard to make precise, and a purely structural reading says little about why *these* structures."
  - "(c) *Selection / anthropic / pragmatic*: the fit is partly a selection effect and partly a product of method: we study what can be modelled, we keep the mathematics that works, and we adapt the mathematics (new definitions, generalisations) to fit physical needs; the 'unreasonable' impression comes from remembering the hits. Hamming's discussion is in this spirit. *Why:* it needs no new metaphysics. *Problems:* it does not explain predictions that are accurate to many digits or discoveries that came from the mathematics first, which need more than adaptation."
  - "(d) *Cognitive / embodied*: mathematics grows out of human experience of space, number, motion and quantity (Lakoff and Núñez; evolutionary arguments), and our minds evolved in this universe, so some resonance is expected. *Why:* it explains the role of simple concepts (counting, geometry). *Problems:* it is much less convincing for abstract mathematics (Hilbert spaces, fibre bundles) that has no obvious evolutionary link, and it is empirically hard to test."
  - "**Overlaps and conflicts.** (a) and (b) agree that mathematical structure is real in some sense and differ on whether it is a separate realm; (b) and (c) agree that what survives is structure, but (c) treats the fit as largely produced by our choices; (c) and (d) both explain the fit through human activity and disagree about whether it is a cultural/methodological or a biological matter. (a) conflicts most directly with (c) and (d), which attribute the fit to us. The positions are not exhaustive and many authors combine them (for example, a structural realism with a selection effect). This page lists them and does not choose among them ([[philosophy-of-mathematics]], [[philosophy-of-physics]])."
caveats:
  - "The famous episodes are usually less clean than the slogan 'mathematics first, physics later'. Riemann's geometry was motivated by questions about space and physics; Lie groups arose in the study of differential equations; fibre bundles and gauge fields were found in parallel, and the dictionary was recognised only afterwards. The history of each case (who knew what, when) is more intertwined than the retelling suggests."
  - "'Unreasonable effectiveness' is mostly shown by a few striking cases; there is no systematic count of how much mathematics has found an application, and there is no clean measure of 'fit'. Claims that nearly all mathematics finds applications, or none of it does, are not supported by data."
  - "Mathematics does not do the work alone: physical interpretation, experimental input and judgement about which approximations to make are needed to turn a structure into a theory. Many mathematically elegant frameworks (a number of unified theories, certain approaches to quantum gravity) have not been confirmed, and beauty is not evidence in itself ([[string-theory]], [[quantum-gravity]], [[unification]])."
  - "The claim that mirror symmetry or Witten's results 'predicted' mathematical theorems needs care: the physical derivations are not rigorous, and the proofs by mathematicians (Givental, Lian–Liu–Yau, for mirror symmetry) used different methods; the physics supplied the conjectures."
  - "Tegmark's mathematical universe hypothesis is a speculative proposal, not a physical theory in the usual sense; the same holds for the physical implications of 'ontic' structural realism. The more modest claims, that mathematics is the right language for the regularities we have found, are accepted much more widely."
  - "Wigner's article is an essay, not an argument with a conclusion, and it has been criticised from both directions: as a non-problem (selection, adaptation) and as understated (the reach of abstract structure in modern physics). Hamming's reply is itself partly speculative; the historical claims in both are matters for historians of science."
