cards:
  - q: What did Wigner mean by the 'unreasonable effectiveness' of mathematics?
    a: That mathematical concepts, formed for formal reasons, turn out to give exact and far-reaching laws of nature, and that we have no good explanation of why.
  - q: Give three cases of mathematics found before its physical use.
    a: Riemannian geometry and general relativity; group and representation theory and the classification of particles; fibre bundles and connections and gauge fields.
  - q: Give three cases of physics creating mathematics.
    a: Calculus (mechanics), distributions (Dirac delta), knot invariants and topological quantum field theory (Witten), enumerative results from mirror symmetry.
  - q: What are the four main families of explanations of the fit?
    a: Platonist/realist, structural/formalist, selection (anthropic/pragmatic), and cognitive/embodied; they overlap and conflict, and none is settled.
  - q: What does the selection argument say?
    a: We remember the successes, we select problems that can be modelled and we adapt the mathematics, so part of the effect is produced by method.
  - q: What is structural realism?
    a: The view that what survives theory change, and what theories get right, is relational mathematical structure rather than the nature of objects.
  - q: Where is the fit of mathematics weaker?
    a: In biology, economics and the social sciences, and in turbulence-like problems, where models are more specific and less accurate than in fundamental physics.
  - q: Why does Tegmark's hypothesis meet criticism?
    a: It is hard to test, requires a way to pick the physical structure, and critics say it conflates a description with the thing described.
