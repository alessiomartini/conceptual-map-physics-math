id: anomalies
title: "Anomalies: when quantization breaks a symmetry"
short: Anomalies
domain: concept
area: concepts
order: 410
one_liner: A quantum anomaly is a classical symmetry that cannot be preserved by quantization; depending on which symmetry it is, it explains the decay of the neutral pion, the mass of the eta-prime, the charges of the Standard Model, the consistency of string theory, the edge modes of topological phases and the origin of a mass scale from a scale-invariant theory.
summary: >-
  An anomaly is a mismatch between a classical symmetry and its quantization: the action is invariant, but the
  measure of the path integral (or any regularization of the divergent loop) is not, and the Ward identity acquires
  an extra term. It is a property of the theory, not of the calculation, and its coefficient is quantized and does
  not change along the renormalization-group flow. Which symmetry is anomalous decides the physics: if it is a
  gauge symmetry, the theory is inconsistent and the anomaly must cancel (Standard Model, string theory); if it is
  global, a physical process is allowed (the neutral-pion decay, the $\eta'$ mass, baryon-number violation) and the
  anomaly can be matched between ultraviolet and infrared; if it is the scale symmetry, a mass scale appears. The
  full taxonomy and the formal treatment are in [[symmetries]] and [[symmetry-conservation-gauge]]; this thread is
  about what anomalies do. Their generalization to non-invertible and higher-form symmetries is in
  [[generalized-symmetries]].
thread:
  - "**The statement:** in a classical theory with a symmetry, Noether's theorem gives a conserved current $\\partial_\\mu j^\\mu = 0$. In the quantum theory the current is a composite operator defined by regularization, and for some symmetries no regularization preserves the conservation law: $\\partial_\\mu j^\\mu = \\mathcal{A}$ with $\\mathcal{A}$ built from background gauge fields or the metric. The anomaly is local, has quantized coefficients and is not generated or removed by changing the regularization, except for local counterterms that move it between currents ([[quantization]], [[qft]], [[symmetry-conservation-gauge]])."
  - "**The triangle diagram:** the first calculation was the decay of the neutral pion into two photons through a fermion loop ([Steinberger 1949](https://doi.org/10.1103/PhysRev.76.1180)). The axial-vector current in massless QED is classically conserved, but the triangle diagram with one axial and two vector vertices cannot be regularized so that both the vector and the axial Ward identities hold. Adler and Bell–Jackiw found that the vector one can be kept and the axial one gives $\\partial_\\mu j_5^\\mu = \\frac{e^2}{8\\pi^2}F_{\\mu\\nu}\\tilde F^{\\mu\\nu}$ (up to sign convention), with $\\tilde F^{\\mu\\nu}=\\tfrac12\\epsilon^{\\mu\\nu\\rho\\sigma}F_{\\rho\\sigma}$. ([Adler 1969](https://doi.org/10.1103/PhysRev.177.2426), [Bell–Jackiw 1969](https://doi.org/10.1007/BF02823296), [Bardeen 1969](https://doi.org/10.1103/PhysRev.184.1848))"
  - "**Fujikawa's view, the measure:** the anomaly is the Jacobian of the fermionic measure under a chiral rotation. Its value is the index density of the Dirac operator, so the integral of the anomaly is the difference of the numbers of zero modes of opposite chirality: the Atiyah–Singer index theorem. This links the anomaly to topology and to instantons, and explains why the coefficient is an integer multiple of a fixed unit ([[topology-invariants]], [[differential-geometry]]). ([Fujikawa 1979](https://doi.org/10.1103/PhysRevLett.42.1195))"
  - "**Physical consequence, $\\pi^0\\to\\gamma\\gamma$:** if the axial current were conserved with the pion as its pseudo-Goldstone boson, the decay amplitude would vanish in the chiral limit. The anomaly fixes it to $\\Gamma(\\pi^0\\to\\gamma\\gamma)=\\frac{\\alpha^2 m_\\pi^3}{64\\pi^3 f_\\pi^2}\\left(\\frac{N_c}{3}\\right)^2$, about $7.8$ eV, which agrees with the measured value at the percent level and is one of the classic evidences for three colours ([[standard-model]], [[spontaneous-symmetry-breaking]]). ([PrimEx 2020](https://doi.org/10.1126/science.aay6641))"
  - "**Physical consequence, the $\\eta'$ and the strong-CP structure:** with three light quarks QCD has an approximate $U(3)_L\\times U(3)_R$ chiral symmetry, and spontaneous breaking should give nine light pseudo-Goldstone bosons, but the $\\eta'$ is heavy ($958$ MeV). The axial $U(1)$ is anomalous with respect to the gluons, $\\partial_\\mu j_5^\\mu\\propto N_f\\, g^2\\, G\\tilde G$, and 't Hooft showed that instantons produce the effect. The Witten–Veneziano relation ties the $\\eta'$ mass to the topological susceptibility of pure Yang–Mills theory at large $N_c$. The same anomaly makes the $\\theta$ angle physical and underlies the axion solution to the strong-CP problem ([[beyond-standard-model]]). ([’t Hooft 1976](https://doi.org/10.1103/PhysRevLett.37.8), [’t Hooft 1976b](https://doi.org/10.1103/PhysRevD.14.3432), [Witten 1979](https://doi.org/10.1016/0550-3213%2879%2990031-2), [Veneziano 1979](https://doi.org/10.1016/0550-3213%2879%2990332-8), [Peccei–Quinn 1977](https://doi.org/10.1103/PhysRevLett.38.1440), [Weinberg 1978](https://doi.org/10.1103/PhysRevLett.40.223), [Wilczek 1978](https://doi.org/10.1103/PhysRevLett.40.279))"
  - "**Anomaly matching:** the anomaly coefficient of a *global* symmetry is the same at every scale, so the infrared theory (massless quarks and gluons confining into pions, baryons, ...) must reproduce the anomaly of the ultraviolet degrees of freedom. 't Hooft turned this into a test of chiral-symmetry breaking: either there are massless composite fermions with the right anomaly, or the symmetry is spontaneously broken and the Goldstone bosons carry it through a Wess–Zumino term. It does not prove that QCD breaks chiral symmetry, but it restricts the options ([[renormalization]], [[effective-theories-naturalness]], [[universality]]). ([’t Hooft 1980](https://doi.org/10.1007/978-1-4684-7571-5_9), [Wess–Zumino 1971](https://doi.org/10.1016/0370-2693%2871%2990582-X))"
  - "**The Wess–Zumino–Witten term:** the pion effective theory has a term that is not captured by the sigma-model action, whose coefficient is fixed by the anomaly and counts the colours $N_c$. It gives $\\pi^0\\to\\gamma\\gamma$, $\\gamma\\to 3\\pi$ and makes the baryon a soliton (skyrmion) whose spin and statistics are fixed by $N_c$ ([[effective-field-theory]], [[topology]], [[identical-particles-statistics]]). ([Witten 1983](https://doi.org/10.1016/0550-3213%2883%2990063-9))"
  - "**Gauge anomalies must cancel, the Standard Model:** an anomalous gauge symmetry makes the theory non-unitary or non-renormalizable, so the triangle diagrams with three gauge bosons must cancel. In one generation the conditions $\\sum Y^3=0$, $\\sum Y=0$ and the mixed ones are satisfied only with the observed charges of quarks and leptons, three colours and the same number of quark and lepton doublets; for example the electric charges of $u$ (three colours), $d$ (three colours), $e$, $\\nu$ add to $3\\cdot\\frac23-3\\cdot\\frac13-1=0$. The cancellation is a strong hint of grand unification, in which a generation fits in $\\bar 5\\oplus 10$ of $SU(5)$ or in the $16$ of $SO(10)$, but the Standard Model alone does not explain it ([[standard-model]], [[unification]], [[gauge-theory]])."
  - "**Baryon number is anomalous:** $B$ and $L$ are accidental global symmetries of the Standard Model but have an electroweak anomaly, so $B+L$ is violated by instantons (suppressed as $e^{-4\\pi/\\alpha_W}$ at zero temperature, utterly negligible) and by sphalerons at high temperature, where the rate is not suppressed. $B-L$ is anomaly-free. This is the ingredient of electroweak baryogenesis and leptogenesis ([[beyond-standard-model]], [[cosmology]]). ([’t Hooft 1976](https://doi.org/10.1103/PhysRevLett.37.8))"
  - "**Gravitational and global anomalies:** in $d=4k+2$ dimensions chiral fermions and self-dual forms can have pure gravitational anomalies ([Alvarez-Gaumé–Witten 1984](https://doi.org/10.1016/0550-3213%2884%2990066-X)). Global anomalies, detected by large gauge transformations rather than by Feynman diagrams, also exist: an $SU(2)$ gauge theory with an odd number of fermion doublets is inconsistent ([Witten 1982](https://doi.org/10.1016/0370-2693%2882%2990728-6)). In ten dimensions the anomalies of type I and heterotic supergravity cancel only through the Green–Schwarz mechanism and only for $SO(32)$ and $E_8\\times E_8$, which launched the first superstring revolution ([[string-theory]], [[quantum-gravity]]). ([Green–Schwarz 1984](https://doi.org/10.1016/0370-2693%2884%2991565-X))"
  - "**Anomaly inflow:** an anomalous theory can live on the boundary of a higher-dimensional one whose response compensates it. Chiral fermion zero modes on a domain wall are anomalous, and the bulk Chern–Simons-like term makes the combined system consistent; the edge of a quantum Hall state is chiral and anomalous, and the bulk Hall response supplies the missing charge. The anomaly of a $d$-dimensional theory is thus an invertible topological field theory in $d+1$ dimensions, and a classification of anomalies is a classification of symmetry-protected topological phases (via cobordism). A symmetric gapped boundary of an anomalous bulk is impossible ([[topological-phases]], [[exp-quantum-hall]], [[tqft]]). ([Callan–Harvey 1985](https://doi.org/10.1016/0550-3213%2885%2990489-4), [Witten–Yonekura 2019](https://arxiv.org/abs/1909.08775), [Freed–Hopkins 2016](https://arxiv.org/abs/1604.06527), [Kapustin et al. 2014](https://arxiv.org/abs/1406.7329), [Wang et al. 2017](https://arxiv.org/abs/1705.06728))"
  - "**Anomalies in solids:** a Weyl semimetal has pairs of Weyl nodes with opposite chirality, and parallel electric and magnetic fields pump charge between nodes at the rate given by the ABJ anomaly, giving a negative longitudinal magnetoresistance that was observed in Dirac and Weyl semimetals ([[condensed-matter]], [[topological-phases]]). ([Nielsen–Ninomiya 1983](https://doi.org/10.1016/0370-2693%2883%2991529-0), [Son–Spivak 2013](https://arxiv.org/abs/1206.1627), [Xiong et al. 2015](https://doi.org/10.1126/science.aac6089))"
  - "**Anomalies on the lattice:** a single chiral fermion cannot be put on a lattice with local, translation-invariant, hermitian action (fermion doubling, Nielsen–Ninomiya): the doublers cancel the anomaly. Chiral symmetry can be realized only through a modified form, the Ginsparg–Wilson relation, solved by domain-wall and overlap fermions, with the anomaly reappearing through the index of the lattice Dirac operator ([[lattice-field-theory]], [[discrete-continuum]]). ([Nielsen–Ninomiya 1981](https://doi.org/10.1016/0550-3213%2881%2990361-8), [Ginsparg–Wilson 1982](https://doi.org/10.1103/PhysRevD.25.2649), [Lüscher 1998](https://arxiv.org/abs/hep-lat/9802011))"
  - "**The scale (trace) anomaly:** a classically scale-invariant theory (massless Yang–Mills, massless $\\lambda\\phi^4$, massless QED) has $T^\\mu{}_\\mu=0$, but after renormalization a scale appears, $T^\\mu{}_\\mu=\\frac{\\beta(g)}{2g}F^a_{\\mu\\nu}F^{a\\mu\\nu}$ plus mass terms. It is the same fact as the running of couplings and as dimensional transmutation: $\\Lambda_{\\rm QCD}$ is generated from a dimensionless coupling, and most of the proton mass comes from QCD dynamics rather than from the quark masses ([[scaling-dimensional-analysis]], [[renormalization]], [[universality]]). ([Callan et al. 1970](https://doi.org/10.1016/0003-4916%2870%2990394-5), [Crewther 1972](https://doi.org/10.1103/PhysRevLett.28.1421))"
  - "**The trace anomaly in curved space:** on a curved background $\\langle T^\\mu{}_\\mu\\rangle$ is proportional to curvature invariants: in two dimensions $\\frac{c}{24\\pi}R$, in four dimensions a combination of $c\\,W^2$ and $a\\,E_4$ (Weyl tensor squared, Euler density). The coefficients $c$ and $a$ measure degrees of freedom; the Euler coefficient $a$ decreases along renormalization-group flows (a-theorem, Komargodski–Schwimmer, [[cft]]). In string theory the Weyl anomaly of the worldsheet cancels only in critical dimension ($26$ for the bosonic string) ([[string-theory]], [[general-relativity]]). ([Duff 1977](https://doi.org/10.1016/0550-3213%2877%2990410-2), [Polyakov 1981](https://doi.org/10.1016/0370-2693%2881%2990743-7), [Komargodski–Schwimmer 2011](https://arxiv.org/abs/1107.3987))"
  - "**A scale anomaly in quantum mechanics:** the Hamiltonian $H=\\frac{p^2}{2m}+\\frac{g}{r^2}$ and the two-dimensional delta potential $-\\frac{\\hbar^2}{2m}\\nabla^2-g\\,\\delta^2(\\mathbf r)$ are classically scale invariant (the coupling is dimensionless), with a conformal algebra. In the quantum theory the singular potential needs regularization (or a self-adjoint extension); the renormalized coupling runs, a bound state of energy $E\\sim\\frac{\\hbar^2}{ma^2}$ appears with $a$ set by the regulator, and the dilatation symmetry is broken. For strong attraction ($g$ below a critical value) the spectrum is unbounded below unless a scale is introduced, and the extension gives a geometric tower of bound states with a discrete scale invariance. The same mechanism underlies the Efimov effect, and this is the simplest quantum-mechanical model of dimensional transmutation ([[quantum-mechanics]], [[singularities-breakdown]], [[approximation-perturbation]]). ([Holstein 1993](https://doi.org/10.1119/1.17328), [Essin–Griffiths 2006](https://doi.org/10.1119/1.2165248), [Camblong et al. 2000](https://arxiv.org/abs/hep-th/0003255))"
  - "**Holography:** in AdS/CFT a global anomaly of the boundary theory is reproduced by a Chern–Simons term of the bulk gauge field, which makes the bulk gauge variation non-zero at the boundary; the trace anomaly is reproduced by the holographic Weyl anomaly, in terms of the bulk curvature ([[holography]])."
  - "**Why anomalies are useful:** they are exact (not corrected beyond one loop in the appropriate sense), quantized, independent of the coupling and of the energy scale, and computable in a free ultraviolet theory. This is what lets them constrain strongly coupled infrared physics, test proposed dualities (both sides must have the same anomalies, [[duality]]), classify topological phases and bound what a consistent theory of gravity can contain ([[renormalization]], [[emergence]]). Their extension to higher-form and non-invertible symmetries is the content of [[generalized-symmetries]]."
definitions:
  - "**What does 'anomaly' mean? Several meanings in use.** (a) *Failure of a Ward identity:* the divergence of a current does not vanish in the quantum theory, $\\partial_\\mu j^\\mu=\\mathcal A$. *Why:* it is the original, diagrammatic definition (triangle). *Problems:* it depends on how the current is defined, since a local counterterm can move the anomaly from one current to another (vector versus axial), so it is meaningful only once one specifies which symmetries are kept."
  - "(b) *Non-invariance of the measure:* the path-integral measure is not invariant under the symmetry (Jacobian). *Why:* it exhibits the anomaly as an index density and treats global anomalies. *Problems:* needs a regularization of the measure, and for chiral gauge theories (Standard Model) the measure is not even defined without extra input."
  - "(c) *Obstruction to coupling to a background gauge field:* the partition function of a theory with a global symmetry is not invariant under gauge transformations of the background field. *Why:* it is the definition that does not require the symmetry to be gauged and is the one used for 't Hooft matching. *Problems:* the anomaly is defined only up to local counterterms and requires a choice of background."
  - "(d) *Boundary of an invertible topological theory:* the anomaly is a $(d+1)$-dimensional invertible field theory such that the $d$-dimensional theory is not well-defined by itself but is a boundary of it (inflow). *Why:* it unifies perturbative and global anomalies, and the classification by cobordism. *Problems:* the classification assumes properties (unitarity, locality, the validity of the cobordism hypothesis) that are conjectural in part."
  - "**Overlaps and conflicts.** All four coincide for perturbative anomalies of Lie-group symmetries in $d=2,4$ (triangle, box). They differ for global anomalies (invisible in (a)), for discrete and non-invertible symmetries (where the Ward identity has no current, [[generalized-symmetries]]), and in the meaning of 'cancelling': gauge anomalies must vanish, 't Hooft anomalies cannot be removed and must be matched, and the scale anomaly is not cancelled at all but is physical."
caveats:
  - "'Anomaly' here means quantum anomaly. It is unrelated to 'anomalies' in the sense of discrepancies between measurement and theory (muon $g-2$, flavour anomalies); the two uses of the word should not be mixed."
  - "The anomaly is not a failure of regularization or a bug: it is a property of the theory, and different regularizations agree on it. What a regularization decides is which symmetry is preserved, vector or axial, and that choice is physical only through what is coupled to the electromagnetic field."
  - "The Adler–Bardeen statement that the ABJ coefficient receives no higher-order corrections holds for the abelian anomaly in a suitable scheme; for the singlet axial current in QCD the relation between the anomaly, confinement and the $\\eta'$ is not a perturbative question."
  - "The $\\pi^0\\to\\gamma\\gamma$ amplitude is exact in the chiral limit and gets percent-level corrections from $m_u-m_d$ and $\\eta$ mixing; saying that 'the anomaly explains the decay' is correct only in that limit. The $N_c$ dependence is one of the arguments for three colours, not a direct measurement."
  - "'Anomaly matching proves chiral symmetry breaking in QCD' is too strong: matching is a necessary condition that composite massless fermions or Goldstone bosons must satisfy, and arguments about which option is realized depend on further dynamical assumptions."
  - "The cancellation of Standard Model gauge anomalies is a consistency condition, but what it implies for the underlying structure (grand unification, charge quantization) is an interpretation, since other charge assignments can satisfy it with extra fermions, and the Standard Model is consistent with it for reasons not understood from within the model."
  - "'Most of the proton mass is due to the trace anomaly' depends on the decomposition of the energy-momentum tensor used, which is scheme and scale dependent, and not on an unambiguous split of the mass into quark-mass, kinetic and anomaly parts."
  - "Chiral gauge theories (the Standard Model) still cannot be put on the lattice in a fully satisfactory way, despite Ginsparg–Wilson solutions for vector-like theories; the lattice is not a non-perturbative definition of the electroweak theory."
  - "The cobordism classification of anomalies depends on assumptions (unitarity, reflection positivity, the structure of the symmetry) and on conjectures; it gives candidate anomalies, and realizing all of them is not guaranteed. In the quantum-mechanical example, the self-adjoint extension introduces a free parameter, so the scale is not predicted and the result is a property of the singular potential, not of every scale-invariant system."
