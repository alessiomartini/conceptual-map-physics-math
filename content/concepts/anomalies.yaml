cards:
  - q: What is a quantum anomaly?
    a: A classical symmetry of the action that cannot be preserved by quantization; the Ward identity acquires an extra term, with a quantized, scale-independent coefficient.
  - q: Why must gauge anomalies cancel, and what does that fix in the Standard Model?
    a: An anomalous gauge symmetry makes the theory inconsistent (non-unitary). Cancelling the triangle diagrams within each generation fixes the hypercharges and requires three colours, so that quark and lepton charges add to zero.
  - q: What does the ABJ anomaly predict for the neutral pion?
    a: Its decay to two photons, with $\Gamma=\alpha^2m_\pi^3/(64\pi^3 f_\pi^2)\,(N_c/3)^2\approx 7.8$ eV; without the anomaly the amplitude would vanish in the chiral limit.
  - q: Why is the $\eta'$ heavy?
    a: The axial $U(1)$ is anomalous with respect to the gluons (instantons), so it is not a symmetry and there is no ninth light pseudo-Goldstone boson.
  - q: What does 't Hooft anomaly matching say?
    a: The anomaly of a global symmetry is the same in the ultraviolet and in the infrared, so the infrared must contain massless states, spontaneous breaking, or topological order that reproduce it.
  - q: What is the trace (scale) anomaly?
    a: A classically scale-invariant theory has $T^\mu{}_\mu\neq0$ after quantization ($\beta(g)F^2/2g$ in Yang–Mills); it is the origin of running couplings and dimensional transmutation.
  - q: What is anomaly inflow?
    a: The anomaly of a $d$-dimensional theory is cancelled by the response of a $(d+1)$-dimensional bulk (domain-wall fermions, quantum Hall edge), so the anomaly is an invertible topological field theory in $d+1$ dimensions.
  - q: Where does the scale anomaly appear in quantum mechanics?
    a: In the $1/r^2$ potential and the two-dimensional delta potential, which are classically scale invariant; regularization breaks the symmetry and introduces a bound-state scale.
    detail: true
  - q: What happens with chiral fermions on the lattice?
    a: By the Nielsen–Ninomiya theorem a single Weyl fermion cannot be put on the lattice; chiral symmetry survives only in the Ginsparg–Wilson form (overlap, domain-wall fermions).
    detail: true
