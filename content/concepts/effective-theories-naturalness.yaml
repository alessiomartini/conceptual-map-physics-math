cards:
  - q: What is decoupling?
    a: Heavy particles drop out of low-energy physics, apart from a renormalisation of the couplings and corrections suppressed by powers of E/M.
  - q: Why was Fermi's theory of beta decay a successful effective theory?
    a: The contact four-fermion interaction is the low-energy limit of W exchange, with G_F ~ g^2/M_W^2; its amplitudes grow with energy, signalling the need for new physics at about M_W.
  - q: How does an operator of dimension d scale in an effective theory with cutoff Λ?
    a: Its effects are suppressed by (E/Λ)^(d-4); irrelevant operators (d>4) are negligible at low energy, relevant ones dominate.
  - q: What is Weinberg's recipe for an effective Lagrangian?
    a: Include all terms allowed by the symmetries and field content, ordered by dimension (or by powers of momentum), with coefficients fixed by data or by matching to the underlying theory.
  - q: Is general relativity useless as a quantum theory because it is non-renormalisable?
    a: No; as an effective theory it gives definite quantum corrections at energies far below the Planck scale. It is the ultraviolet completion that is missing.
  - q: What does the dimension-five operator in the Standard Model effective theory describe?
    a: Neutrino masses, of order v^2/Λ, with Λ a large scale beyond the Standard Model.
  - q: What is technical naturalness?
    a: A small parameter is natural if setting it to zero increases the symmetry of the theory, so that quantum corrections stay proportional to it (fermion masses and chiral symmetry, for example).
  - q: What is the hierarchy problem?
    a: The Higgs mass is far below the Planck or unification scale, and nothing in the Standard Model protects it from large quantum corrections, so it seems to need an unexplained cancellation.
  - q: What is the cosmological constant problem?
    a: The observed vacuum energy is tens of orders of magnitude (about 120 for a Planck cutoff) below the estimate from quantum fields, and no symmetry is known to make it small.
  - q: Which kind of heavy particle does not decouple?
    a: One whose mass comes from the Higgs vev (the top quark, a heavy chiral generation); its effects at low energy grow with its mass instead of vanishing.
