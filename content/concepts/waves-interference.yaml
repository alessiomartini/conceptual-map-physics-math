cards:
  - q: What does the dispersion relation $\omega(k)$ tell you?
    a: How the frequency of a plane-wave component depends on its wavenumber; it fixes the phase and group velocities and whether a packet spreads.
  - q: What is the difference between phase and group velocity?
    a: Phase velocity $\omega/k$ is the speed of a crest; group velocity $d\omega/dk$ is the speed of the packet envelope and usually of energy. Only the group (or front) velocity is bounded by $c$.
  - q: Why do interference fringes appear and when do they disappear?
    a: Amplitudes add, so intensity contains the cross term $2\,\mathrm{Re}(A_1^*A_2)$, which depends on the phase difference. The fringes vanish if the sources are incoherent or if which-path information is available.
  - q: By what angle does a wave diffract through an aperture of size $a$?
    a: By an angle of order $\lambda/a$; ray optics is the limit $\lambda\ll a$.
  - q: What is the de Broglie relation and what showed it experimentally?
    a: $\lambda=h/p$; electron diffraction from a nickel crystal (Davisson–Germer 1927) and later multi-slit electron interference.
  - q: Why do free matter waves spread?
    a: The free Schrödinger equation has $\omega=\hbar k^2/2m$, so the group velocity depends on $k$ and the packet disperses.
  - q: How does LIGO detect gravitational waves?
    a: A Michelson-type laser interferometer measures the tiny differential change in arm length caused by a passing wave, as a shift in the interference of the two beams.
  - q: What is Anderson localization?
    a: In a sufficiently disordered medium, interference between scattering paths makes waves exponentially localized instead of diffusing.
  - q: When does the superposition principle for waves fail?
    a: When the wave equation is nonlinear (large amplitude, shocks, solitons) or when the medium responds to the wave.
