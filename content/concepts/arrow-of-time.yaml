id: arrow-of-time
title: "Irreversibility and the arrow of time: reversible laws, irreversible world"
short: Irreversibility and the arrow of time
domain: concept
area: concepts
order: 170
one_liner: The fundamental laws are (almost) symmetric under time reversal, yet eggs break and never reassemble; the thread follows how statistical mechanics, initial conditions, fluctuation theorems, decoherence and cosmology try to explain the asymmetry.
summary: >-
  Newton, Maxwell, Schrödinger and Einstein give equations that work equally well run backwards, while experience
  has a clear direction: heat flows from hot to cold, memories concern the past, waves spread outwards. The thread
  follows the standard resolution (irreversibility is a statement about typical macroscopic behaviour from special
  initial conditions, not about the microscopic laws), the objections of Loschmidt and Zermelo, the role of coarse
  graining and of the low-entropy beginning of the universe, the exact fluctuation theorems that make 'the second
  law is statistical' quantitative, Landauer's link with information, decoherence and measurement, and the tiny but
  real violation of time-reversal symmetry in weak interactions. Entropy itself and the second law are told in
  the entropy-information thread and fluctuation-dissipation relations in the fluctuations thread; here the
  focus is on where the direction comes from. The word 'arrow of time' is used for several different things, listed
  under "Definitions".
thread:
  - "**The puzzle:** if $x(t)$ solves Newton's equations then so does $x(-t)$ with reversed velocities, and similarly for Maxwell's equations and the Schrödinger equation with complex conjugation. A film of two billiard balls colliding looks fine backwards, a film of a glass shattering does not. Where does the asymmetry come from? ([[classical-mechanics]], [[electromagnetism]], [[quantum-mechanics]], [[symmetries]])"
  - "**Thermodynamics:** Clausius and Kelvin formulate the second law as a one-way statement about heat and work, and entropy $S$ never decreases in an isolated system ([[thermodynamics]], [[entropy-information]]). The macroscopic law is irreversible by construction; the challenge is to derive it from reversible microscopic dynamics."
  - "**Boltzmann and the H-theorem:** starting from the kinetic equation for a dilute gas, with the *Stosszahlansatz* (molecular chaos: velocities of colliding particles are uncorrelated before the collision), Boltzmann proved that $H = \\int f\\ln f\\,d^3v$ never increases, so $-k_BH$ plays the role of entropy and the Maxwell distribution is the equilibrium ([[statistical-mechanics]], [[non-equilibrium]])."
  - "**Loschmidt's and Zermelo's objections:** (Loschmidt, 1876) reverse all velocities in a state that has just relaxed and the gas will run back to its initial state, so $H$ cannot decrease for all initial conditions; (Zermelo, 1896, after Poincaré's recurrence theorem) a bounded system returns arbitrarily close to its initial state, so $H$ must eventually increase again. Boltzmann's reply was statistical: the number of microstates that behave irreversibly vastly exceeds the number that do not, and recurrence times are astronomically long ([[statistical-mechanics]], [[dynamical-systems]], [[chaos]])."
  - "**Coarse-graining and typicality:** entropy is defined for a macrostate (a set of microstates indistinguishable by coarse observables); Liouville evolution preserves the fine-grained Gibbs entropy, so the increase comes from the loss of information in the coarse description. Chaotic mixing spreads a region of phase space into filaments that explore the energy shell, and for a typical initial condition the macrostate evolves to the largest one ([[entropy-information]], [[chaos]], [[information-theory]], [[emergence]])."
  - "**The Past Hypothesis:** reversibility works in both directions: a typical state is also likely to have come from a higher-entropy past, so statistics alone would predict that entropy increases both ways from any given moment. The observed one-way increase requires the extra assumption that the early universe had a very low entropy (Boltzmann's remark; the term 'Past Hypothesis' is due to Albert), a boundary condition not derived from the dynamical laws ([[cosmology]], [[philosophy-of-physics]], [[exp-cmb]])."
  - "**The cosmological arrow:** the low entropy of the early universe is puzzling because the hot, smooth, nearly homogeneous state seems thermal; the missing contribution is gravity, for which clumping increases entropy, so the smoothness of the CMB actually is a low-entropy state. Penrose related this to the Weyl curvature being small at the beginning; black holes are the endpoint of gravitational entropy ([[cosmology]], [[general-relativity]], [[black-holes]], [[entropy-information]])."
  - "**Fluctuation theorems:** for small systems and short times the second law is violated with computable probability. The Evans–Searles theorem gives the ratio of the probabilities of entropy production $+\\Sigma$ and $-\\Sigma$, $P(\\Sigma)/P(-\\Sigma) = e^{\\Sigma}$ ([Evans–Cohen–Morriss 1993](https://doi.org/10.1103/PhysRevLett.71.2401), [Evans–Searles 1994](https://doi.org/10.1103/PhysRevE.50.1645)); Gallavotti and Cohen proved a version for chaotic steady states ([Gallavotti–Cohen 1995](https://doi.org/10.1007/BF02179860)); Jarzynski's equality $\\langle e^{-\\beta W}\\rangle = e^{-\\beta\\Delta F}$ ([Jarzynski 1997](https://doi.org/10.1103/PhysRevLett.78.2690)) and Crooks' relation $P_F(W)/P_R(-W) = e^{\\beta(W-\\Delta F)}$ ([Crooks 1999](https://doi.org/10.1103/PhysRevE.60.2721)) turn the second law into an exact statement: the arrow is the statement that the reverse of a typical trajectory is exponentially improbable ([[fluctuations-response]], [[non-equilibrium]], [[stochastic-processes]], [[biophysics]], [[soft-matter]]). They have been tested on colloidal particles ([Wang et al. 2002](https://doi.org/10.1103/PhysRevLett.89.050601)) and RNA hairpins ([Collin et al. 2005](https://doi.org/10.1038/nature04061))."
  - "**Information and Landauer:** erasing a bit of memory must dissipate at least $k_BT\\ln 2$ of heat, which resolves Maxwell's demon: the demon must forget, and forgetting is the irreversible step. Thermodynamic irreversibility and logical irreversibility are linked ([[entropy-information]], [[information-theory]], [[quantum-information]]). ([Landauer 1961](https://doi.org/10.1147/rd.53.0183))"
  - "**Decoherence and measurement:** a quantum system coupled to many environmental degrees of freedom loses its interference terms in the pointer basis ([Zurek 1981](https://doi.org/10.1103/PhysRevD.24.1516)); the process is effectively irreversible because the information leaks into the environment, and it explains why we do not see superpositions of macroscopic objects. Whether the collapse is real, is merely apparent or has a fundamental time asymmetry is a matter of interpretation ([[quantum-foundations]], [[quantum-mechanics]], [[quantum-information]], [[philosophy-of-physics]])."
  - "**Radiation and causal arrows:** the retarded solutions of Maxwell's equations (waves that spread outward from a source) are used, although the advanced solutions are equally valid; the asymmetry is again a boundary condition (no incoming radiation from infinity), as in the Wheeler–Feynman absorber theory. Memory and causation share the arrow: records are of the past because the past has lower entropy ([[electromagnetism]], [[classical-field-theory]], [[special-relativity]])."
  - "**Weak-interaction T violation:** the weak interaction violates parity (Wu 1957) and CP (kaon decays, [Christenson et al. 1964](https://doi.org/10.1103/PhysRevLett.13.138)); by the CPT theorem, which holds for local Lorentz-invariant quantum field theories, CP violation means T violation. A direct, time-reversal-asymmetric transition rate was measured in the B meson system ([BaBar 2012](https://doi.org/10.1103/PhysRevLett.109.211801)). The effect is tiny, involves only rare processes, and cannot account for the macroscopic arrow ([[exp-kaon-cp]], [[exp-wu-parity]], [[standard-model]], [[qft]], [[symmetry-conservation-gauge]])."
definitions:
  - "**What is 'the arrow of time'? Several different asymmetries that are often assumed to be one.** (a) *Thermodynamic arrow*: entropy of an isolated system increases toward the future. *Why:* it is the best-defined, quantitative form, from thermodynamics to the fluctuation theorems. *Problems:* the entropy of the whole universe is hard to define, and for a system in equilibrium or in a recurrence the arrow disappears locally."
  - "(b) *Cosmological arrow*: the universe expands and had a low-entropy beginning. *Why:* it supplies the boundary condition that makes (a) work. *Problems:* the expansion alone is not the cause (a contracting universe could in principle have entropy increase too), and why the initial state was special is open; some propose that it needs a deeper theory or a multiverse explanation."
  - "(c) *Radiative / causal arrow*: waves are emitted, not absorbed; causes precede effects. *Why:* it is the arrow of everyday explanation and of the retarded Green's function. *Problems:* in the fundamental equations causation is not asymmetric, and attempts to derive it from (a) are philosophical; some, following Russell, hold that 'cause' is not a fundamental concept."
  - "(d) *Psychological / epistemic arrow*: we remember the past and not the future. *Why:* it is how time is experienced. *Problems:* it is usually argued to follow from (a) since records require entropy increase, but this reduction is an argument, not a theorem."
  - "(e) *Quantum arrow*: collapse or decoherence is irreversible. *Why:* it is the arrow in every experiment with a measurement. *Problems:* in unitary quantum mechanics decoherence is the dilution of information in the environment, a form of (a); in collapse theories it would be fundamental and has not been detected."
  - "(f) *Particle-physics arrow*: the weak interaction is not T-invariant. *Why:* it is the only place where a fundamental law distinguishes the two directions. *Problems:* the effect is too small and too specific to explain (a)-(e), and CPT invariance means it is really a statement about matter versus antimatter."
  - "**Overlaps and conflicts.** Most physicists regard (a), supplemented by the Past Hypothesis (b), as the root of (c) and (d), with (e) as an example of (a) and (f) as unrelated. Others (Price, Carroll, Albert) emphasise that this reduction rests on the boundary condition and is not a derivation from the laws; and a few approaches (Prigogine's irreversible dynamics, some proposals in quantum gravity) take irreversibility to be a feature of the fundamental laws. There is no consensus on which is basic, so the thread keeps them separate."
caveats:
  - "The H-theorem is not a theorem about all initial conditions: it relies on the *Stosszahlansatz*, which is time-asymmetric by assumption (uncorrelated *before* collisions, correlated afterwards). Lanford (1975) proved it rigorously for a hard-sphere gas only for a short fraction of a mean free time, so the full derivation of irreversible behaviour from reversible mechanics remains incomplete mathematically."
  - "'The second law is statistical' means violations are exponentially unlikely in the number of particles, not forbidden. The fluctuation theorems quantify this and have been verified in micro-scale experiments, but they do not allow macroscopic perpetual motion: for $N\\sim10^{23}$ the probabilities are below any reasonable threshold and the Poincaré recurrence time exceeds the age of the universe."
  - "The Past Hypothesis is an extra assumption, not a derived result, and whether it needs explaining is debated. Some argue that no explanation is needed (it is one more initial condition), others that a typical-state argument cannot apply because the right measure on cosmological initial conditions is not known (the measure problem)."
  - "Gravitational entropy has no agreed definition: the Bekenstein–Hawking entropy is for black holes, and the 'Weyl curvature hypothesis' is a proposal, not a theorem. Statements that 'gravity makes the smooth early universe low entropy' are qualitative."
  - "Coarse graining is observer- or choice-dependent: different choices of macro-variables give different entropies. The standard defence is that the relevant observables (pressure, density, temperature) are natural for us, which introduces a subjective element that some find uncomfortable and others regard as harmless."
  - "CPT is a theorem for local, Lorentz-invariant QFTs with a Hermitian Hamiltonian; the inference 'CP violation implies T violation' depends on it. The kaon and B-meson T asymmetries are properties of weak transitions, and they do not cause the entropy increase of a cooling cup of coffee."
  - "Decoherence explains the *appearance* of classical, irreversible outcomes for a subsystem; it does not by itself solve the measurement problem, because the total state stays pure and unitary, and it needs the same low-entropy initial conditions (an initially uncorrelated environment) to work as a one-way process."
