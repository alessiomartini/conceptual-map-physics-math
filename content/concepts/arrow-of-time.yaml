cards:
  - q: Why is irreversibility puzzling if the microscopic laws are time-reversal symmetric?
    a: Each reversed trajectory is also a solution, yet we see only one direction at the macroscopic level; the asymmetry must come from initial conditions and statistics, not from the equations.
  - q: What is the Loschmidt objection to the H-theorem?
    a: Reverse all velocities after relaxation and the gas returns to its initial state, so $H$ cannot decrease for every microstate; the theorem can only hold for typical states.
  - q: What assumption makes Boltzmann's H-theorem time-asymmetric?
    a: "The Stosszahlansatz (molecular chaos): colliding particles are uncorrelated before the collision, but not after."
  - q: What is the Past Hypothesis, and why is it needed?
    a: The assumption that the early universe had very low entropy. Without it, statistics alone predicts entropy increase both toward the future and toward the past of any given state.
  - q: What do the Jarzynski and Crooks relations say?
    a: "Jarzynski: $\\langle e^{-\\beta W}\\rangle=e^{-\\beta\\Delta F}$ for work over repeated non-equilibrium protocols. Crooks: $P_F(W)/P_R(-W)=e^{\\beta(W-\\Delta F)}$, the forward-to-reverse probability ratio."
  - q: How does Landauer's principle link information to irreversibility?
    a: Erasing a bit dissipates at least $k_BT\ln 2$ of heat; the demon's memory reset is the irreversible step that saves the second law.
  - q: Does time-reversal violation in kaon and B-meson decays explain the arrow of time?
    a: No. It is a tiny effect in rare weak processes, via CP violation and the CPT theorem, and is unrelated to the macroscopic entropy increase.
  - q: Name three distinct things people call the arrow of time.
    a: Thermodynamic (entropy increase), cosmological (expansion from a low-entropy start), and psychological or causal (memory of the past, causes before effects); there are also radiative, quantum and particle-physics versions.
  - q: What did Lanford prove about the Boltzmann equation?
    detail: true  # site only, not in the Anki deck
    a: That it follows rigorously from hard-sphere dynamics in the Boltzmann–Grad limit, but only for a short time of order a fraction of the mean free time.
