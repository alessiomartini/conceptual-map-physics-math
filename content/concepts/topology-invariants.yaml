id: topology-invariants
title: "Topology and topological invariants: what survives smooth deformation"
short: Topology and topological invariants
domain: concept
area: concepts
order: 150
one_liner: Integers that cannot change under smooth deformations (winding numbers, Chern numbers, indices) explain vortices, quantised Hall conductance, topological insulators, anyons and the index theorem.
summary: >-
  A topological invariant is a number attached to a space, a field configuration or a Hamiltonian that stays
  the same under every continuous deformation, so it can only take discrete values and can only change when
  something singular happens (a vortex nucleates, a gap closes). The thread follows this idea from the winding
  number of a phase around a loop, through the Gauss–Bonnet and Chern numbers, to topological defects, the
  Kosterlitz–Thouless transition, quantised Hall conductance, topological insulators and anyons, with the
  Atiyah–Singer index theorem as the mathematical backbone. The geometry that produces the local curvature
  (connection, holonomy, Berry phase) lives in a companion thread; here the focus is on the integers that remain
  after integrating it. The caveats say what 'topological protection' really guarantees.
thread:
  - "**The idea:** many physical quantities are defined by a smooth field, but some functions of the field are integers that do not change under continuous deformation: how many times a phase winds around a loop, how many holes a surface has, how many times a map covers a sphere. An integer cannot change gradually, so it is robust to anything that does not tear the configuration ([[topology]], [[differential-geometry]])."
  - "**Winding number:** a map from a circle to a circle, $\\theta(\\varphi)$, has an integer winding number $n = \\frac{1}{2\\pi}\\oint d\\theta$. It classifies vortices of a superfluid or superconductor order parameter $\\psi = |\\psi|e^{i\\theta}$ (circulation quantised in units of $h/m$) and the phase of a wavefunction around a point where it vanishes. The general statement is homotopy: maps from a sphere $S^k$ to the space of ground states are classified by the homotopy group $\\pi_k$ ([[topology]])."
  - "**Gauss–Bonnet and Chern numbers:** for a closed surface the integral of the Gaussian curvature is $2\\pi\\chi$, with $\\chi = 2 - 2g$ the Euler characteristic: a local, metric-dependent quantity integrates to a topological integer. The Chern–Weil construction generalises this: the integral of the curvature of a complex vector bundle over a closed surface is $2\\pi$ times an integer, the first Chern number ([[differential-geometry]], [[geometry-curvature]])."
  - "**Topological defects:** when the order parameter lives in a space with non-trivial homotopy, defects are stable: vortices ($\\pi_1$) in superfluids and XY magnets, dislocations and disclinations in crystals, disclination lines in nematic liquid crystals, domain walls ($\\pi_0$), hedgehogs and monopoles ($\\pi_2$), skyrmions and instantons ($\\pi_3$). The same classification applies to cosmic strings and monopoles in grand-unified models, where the 't Hooft–Polyakov monopole is a field-theory soliton ([[phase-transitions]], [[soft-matter]], [[cosmology]], [[gauge-theory]], [[classical-field-theory]])."
  - "**Dirac monopole:** the existence of a single magnetic charge $g$ forces the electric charge to be quantised, $qg = 2\\pi n\\hbar$, because the wavefunction must be single-valued around the Dirac string ([Dirac 1931](https://doi.org/10.1098/rspa.1931.0130)). The argument is a topological one: the gauge field of a monopole is a connection on a non-trivial $U(1)$ bundle over $S^2$, whose Chern number is the integer $n$ ([[electromagnetism]], [[quantum-mechanics]], [[gauge-theory]])."
  - "**Aharonov–Bohm:** around a flux tube the particle sees $F = 0$ along its path but acquires the phase $e^{iq\\Phi/\\hbar}$; because the space outside the tube is not simply connected, the phase depends on the winding of the path around it, so interference patterns shift in a way that depends only on the winding class. The holonomy side of the story is told in the geometry thread ([[exp-aharonov-bohm]], [[geometry-curvature]], [[quantum-mechanics]])."
  - "**Kosterlitz–Thouless:** in a two-dimensional system with a $U(1)$ order parameter (XY magnet, superfluid film) long-range order is forbidden by the Mermin–Wagner theorem, yet a phase transition exists: below a temperature $T_{KT}$ vortices and antivortices are bound in pairs, above it they unbind and destroy the quasi-long-range order. The transition is driven by the topological defects, has no local order parameter and no symmetry breaking in the Landau sense, and the helicity modulus jumps universally ([Kosterlitz–Thouless 1973](https://doi.org/10.1088/0022-3719/6/7/010)) ([[phase-transitions]], [[statistical-mechanics]], [[renormalization]], [[universality]])."
  - "**Integer quantum Hall effect:** a two-dimensional electron gas in a strong magnetic field has Hall conductance $\\sigma_{xy} = \\nu e^2/h$ with $\\nu$ an integer to a precision of parts in $10^9$ ([von Klitzing et al. 1980](https://doi.org/10.1103/PhysRevLett.45.494)). TKNN showed that $\\nu$ is the sum of the Chern numbers of the occupied Bloch bands, i.e. the integral of the Berry curvature over the Brillouin zone torus ([Thouless et al. 1982](https://doi.org/10.1103/PhysRevLett.49.405)). Laughlin's and Halperin's arguments relate the same integer to the pumping of charge along the edge ([[exp-quantum-hall]], [[topological-phases]], [[condensed-matter]])."
  - "**Bulk–boundary correspondence:** where a region with Chern number $C$ meets one with a different number, the gap must close, leaving $|\\Delta C|$ protected chiral edge modes; in the quantum Hall case these carry the current. Haldane's model showed that a quantised Hall conductance needs no net magnetic field, only broken time-reversal symmetry ([Haldane 1988](https://doi.org/10.1103/PhysRevLett.61.2015)) ([[topological-phases]], [[condensed-matter]])."
  - "**Topological insulators:** with time-reversal symmetry the Chern number vanishes, but a $\\mathbb Z_2$ invariant can survive: the quantum spin Hall insulator has a gapped bulk and helical edge states protected by time reversal ([Kane–Mele 2005](https://doi.org/10.1103/PhysRevLett.95.146802)); the three-dimensional version has protected Dirac surface states. The 'tenfold way' classifies free-fermion gapped phases by symmetry class and dimension through K-theory, with invariants of type $\\mathbb Z$, $\\mathbb Z_2$ or trivial ([Hasan–Kane 2010](https://doi.org/10.1103/RevModPhys.82.3045)) ([[topological-phases]], [[group-theory]], [[random-matrix-theory]])."
  - "**Anyons:** in two space dimensions the exchange of identical particles is classified by the braid group instead of the permutation group, so statistics need not be bosonic or fermionic ([Leinaas–Myrheim 1977](https://doi.org/10.1007/BF02727953)); the flux-charge composites of Wilczek give the picture, with an exchange phase $e^{i\\theta}$ ([Wilczek 1982](https://doi.org/10.1103/PhysRevLett.48.1144)). Fractional quantum Hall quasiparticles are the leading candidates, and non-abelian anyons would store information in the topology of braiding, which is the basis of topological quantum computation ([Kitaev 2003](https://doi.org/10.1016/S0003-4916%2802%2900018-0)) ([[quantum-information]], [[topological-phases]])."
  - "**TQFT and topological order:** an invariant of the ground state (ground-state degeneracy on a torus, braiding data) not captured by any local order parameter is described at low energy by a topological quantum field theory, whose partition functions are topological invariants of the spacetime manifold: Chern–Simons theory computes knot invariants and describes quantum Hall fluids ([[tqft]], [[qft]], [[emergence]], [[category-theory]])."
  - "**Index theorems, the mathematical backbone:** the Atiyah–Singer theorem says that the analytic index of an elliptic operator (the number of zero modes of one chirality minus the other, $\\dim\\ker D - \\dim\\ker D^\\dagger$) equals a topological integral of characteristic classes ([Atiyah–Singer 1968](https://doi.org/10.2307/1970715)). Gauss–Bonnet, Riemann–Roch and the Hirzebruch signature theorem are special cases. In physics it counts zero modes of fermions in an instanton or vortex background, underlies the chiral anomaly, and gives the number of protected edge states in the classification of topological phases ([[differential-geometry]], [[qft]], [[gauge-theory]], [[functional-analysis]], [[lie-theory]])."
caveats:
  - "'Topologically protected' means protected against perturbations that keep the relevant gap open and respect the relevant symmetry, not against everything. Quantum Hall edge modes survive disorder because the bulk is gapped and backscattering needs a counter-propagating channel, but strong disorder closing the gap, or a perturbation connecting two edges, destroys the quantisation. In real devices the quantisation also needs a finite temperature that is low relative to the gap."
  - "The protection of $\\mathbb Z_2$ topological insulators is symmetry-dependent: surface Dirac states are stable only while time-reversal symmetry holds. A magnetic impurity or field opens a gap in the surface spectrum. Such phases are called symmetry-protected, as opposed to intrinsically topologically ordered phases with fractionalised excitations."
  - "The classification by K-theory (tenfold way) is for non-interacting fermions. Interactions change it: some free classifications collapse (the one-dimensional $\\mathbb Z$ classification of class BDI reduces to $\\mathbb Z_8$ with interactions), and new phases exist with no free analogue (fractional quantum Hall states, string-net phases). The full classification of interacting phases is only partly known and is an active research topic."
  - "Integer quantisation of the Hall conductance is exact for the Chern number, but the measured plateau being so precise also requires disorder to localise states between Landau levels; the topological argument alone does not explain the plateaus' finite width. TKNN is a statement about a clean periodic system; Laughlin's gauge argument and later non-commutative-geometry proofs cover the disordered case."
  - "Kosterlitz–Thouless is a topological transition only in the sense that vortex unbinding drives it; the description is a renormalisation-group flow of the vortex fugacity and stiffness, the transition is of infinite order with an essential singularity $\\xi \\sim e^{b/\\sqrt{t}}$ in the correlation length, and the jump in the superfluid stiffness is universal but the transition temperature is not."
  - "A winding number or a Chern number classifies configurations up to *continuous* deformation. Physical operations (a pulse that changes the gap, a vortex that nucleates) are continuous in time but pass through singular configurations where the invariant changes; the integer is conserved only along deformations that avoid those. Homotopy groups also classify only the topology of the order-parameter space and say nothing about energetics, so a topologically stable defect can still be energetically costly or mobile."
  - "Anyons are a statement about excitations in two space dimensions with a gap. They are not fundamental particles (in 3+1 dimensions only bosons and fermions exist), and the braiding of non-abelian anyons in a real device has not been demonstrated as a working quantum computation. Claims of 'Majorana' signatures in nanowires have been contested."
  - "The Atiyah–Singer theorem applies to elliptic operators on compact manifolds (with boundary versions of Atiyah–Patodi–Singer); using it for lattice systems, non-compact spaces or non-relativistic Hamiltonians is an analogy that needs adapting, and the index equals a *difference* of zero-mode numbers, so the total number of zero modes is not fixed."
