cards:
  - q: Why can a topological invariant take only discrete values?
    a: It is an integer built from the global structure (winding, covering, characteristic class) and cannot change continuously; it changes only when the configuration becomes singular, e.g. a vortex nucleates or a gap closes.
  - q: What does Gauss–Bonnet say, and why is it a model for the thread?
    a: The integral of the Gaussian curvature of a closed surface equals $2\pi\chi$, with $\chi$ the Euler characteristic. A local, metric-dependent quantity integrates to a topological integer.
  - q: Why do the vortices of a superfluid film drive the Kosterlitz–Thouless transition?
    a: Below $T_{KT}$ vortex-antivortex pairs are bound and the phase has quasi-long-range order; above it free vortices proliferate and destroy it. No symmetry is broken in the Landau sense.
  - q: What integer is the Hall conductance $\sigma_{xy} = \nu e^2/h$, according to TKNN?
    a: The sum of the Chern numbers of the occupied bands, i.e. the Berry curvature integrated over the Brillouin zone.
  - q: What protects the edge states of a quantum Hall system or topological insulator?
    a: A bulk invariant (Chern number or $\mathbb Z_2$) that cannot change without closing the gap, plus, for the $\mathbb Z_2$ case, time-reversal symmetry; the boundary between regions with different invariants must carry gapless modes.
  - q: Why can anyons exist in two dimensions but not in three?
    a: In 2D the exchange paths of identical particles are classified by the braid group, which has phase (or matrix) representations beyond $\pm 1$; in 3D the permutation group allows only bosons and fermions.
  - q: What does the Atiyah–Singer index theorem relate?
    a: The analytic index of an elliptic operator (zero modes of one chirality minus the other) to a topological integral of characteristic classes of the manifold and bundle.
  - q: Does topological protection mean immunity to any perturbation?
    a: No, only to those that preserve the gap and the required symmetry; strong disorder, symmetry-breaking terms or coupling between edges can destroy the protected property.
  - q: How does interaction change the free-fermion classification of topological phases?
    detail: true  # site only, not in the Anki deck
    a: Some free classifications collapse (e.g. $\mathbb Z \to \mathbb Z_8$ for 1D class BDI) and new interacting phases (fractional quantum Hall, string-net) appear with no free analogue.
