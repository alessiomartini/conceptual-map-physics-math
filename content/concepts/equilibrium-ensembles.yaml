cards:
  - q: What are the three standard equilibrium ensembles and what does each fix?
    a: Microcanonical fixes the energy (all accessible states equally likely), canonical fixes the temperature (weights $e^{-\beta E}$), grand-canonical fixes temperature and chemical potential (weights $e^{-\beta(E-\mu N)}$).
  - q: Why do the ensembles agree for large systems with short-range interactions?
    a: Fluctuations of the quantity that one ensemble fixes and another lets vary are of relative order $1/\sqrt N$, and the entropy is concave, so the distributions are sharply peaked at the same value.
  - q: How are fluctuations related to response functions in the canonical ensemble?
    a: The energy variance is $\langle(\Delta E)^2\rangle=k_BT^2C_V$, so equilibrium fluctuations measure the heat capacity.
  - q: When does ensemble equivalence fail?
    a: For long-range interactions (self-gravitating systems with non-concave microcanonical entropy and negative specific heat), for small systems, and across first-order transitions.
  - q: What is detailed balance?
    a: "The condition $p_iw_{i\\to j}=p_jw_{j\\to i}$ for every pair of states: each microscopic process is balanced by its reverse, which makes the Boltzmann distribution stationary."
  - q: What is local equilibrium and where is it used?
    a: Small cells equilibrate faster than gradients change, so temperature, pressure and chemical potential are defined locally; it underlies hydrodynamics and Fourier's law.
  - q: How does a non-equilibrium steady state differ from equilibrium?
    a: It is stationary but maintained by flows of energy or particles, with nonzero currents and entropy production, broken detailed balance and generally a non-Boltzmann distribution.
  - q: What does maximum entropy say about the canonical distribution?
    a: It is the distribution of maximum Shannon entropy for a given mean energy, so statistical mechanics can be read as inference from limited information (Jaynes).
