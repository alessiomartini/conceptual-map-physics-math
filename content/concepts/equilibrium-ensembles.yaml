id: equilibrium-ensembles
title: "Equilibrium and its ensembles"
short: Equilibrium and ensembles
domain: concept
area: concepts
order: 350
one_liner: Equilibrium is the state a closed system settles into and stays in, and statistical mechanics describes it with an ensemble chosen by what is fixed - energy, temperature, or chemical potential - which usually give the same answer, but not always.
summary: >-
  Thermodynamic equilibrium is a state in which macroscopic quantities no longer change and no net flows exist.
  Statistical mechanics describes it with a probability distribution over microstates: the microcanonical
  ensemble for fixed energy, the canonical ensemble for fixed temperature, the grand-canonical ensemble for fixed
  temperature and chemical potential. In large systems with short-range interactions the ensembles agree on all
  macroscopic quantities; they differ for small systems, for long-range interactions and at first-order
  transitions. The thread also covers detailed balance as the microscopic condition that makes the Boltzmann
  distribution stationary, local equilibrium as the working assumption of hydrodynamics, and the non-equilibrium
  steady state as the contrast case. Fluctuations and response, the entropy, and the arrow of time have their
  own threads, which this one points to.
thread:
  - "**What equilibrium means:** an isolated system left alone reaches a state in which its macroscopic variables are stationary and uniform, and the state is fully described by a few of them ($E$, $V$, $N$). The zeroth law says that temperature is the property shared by systems in thermal contact at equilibrium, which defines it ([[thermodynamics]], [[statistical-mechanics]], [[entropy-information]])."
  - "**Microcanonical ensemble:** for fixed $E,V,N$ all accessible microstates are equally likely, and $S=k_B\\ln\\Omega(E)$ with $\\Omega$ the number of states. It is the most direct statement of the equal-a-priori-probability postulate and the basis for the entropy; it is hard to compute with, and the postulate needs a justification (ergodicity, typicality, or maximum entropy) ([[randomness-probability]], [[integrability-chaos]], [[entropy-information]])."
  - "**Maximum entropy as the rule:** the equilibrium distribution can be derived as the one maximizing the Shannon entropy given the constraints, so that the canonical ensemble follows from fixing the mean energy ([Jaynes 1957](https://doi.org/10.1103/PhysRev.106.620)). This reading treats statistical mechanics as inference rather than as a theorem about dynamics ([[entropy-information]], [[randomness-probability]])."
  - "**Canonical and grand-canonical ensembles:** a system in contact with a heat bath has $p_i\\propto e^{-\\beta E_i}$, and the partition function $Z=\\sum_ie^{-\\beta E_i}$ generates all equilibrium quantities, for example $F=-k_BT\\ln Z$. Allowing exchange of particles adds the factor $e^{\\beta\\mu N}$. The choice is a matter of convenience, and a system can be treated in several ensembles ([[statistical-mechanics]], [[phase-transitions]], [[effective-theories-naturalness]])."
  - "**Fluctuations measure response:** in the canonical ensemble the energy variance equals $k_BT^2C_V$, and in the grand-canonical ensemble the particle-number variance is proportional to the compressibility. Fluctuations in the ensemble are therefore thermodynamic response functions, a first form of fluctuation–response relations ([[fluctuations-response]], [[universality]])."
  - "**Ensemble equivalence:** for short-range interactions in the thermodynamic limit, the ensembles give the same thermodynamics, because relative fluctuations of the fixed quantity scale as $1/\\sqrt N$ and the energy shell is sharply peaked. Equivalence is a property of the entropy being concave; it can be formulated at the level of thermodynamic functions, of macrostates and of the measures themselves ([Touchette 2015](https://doi.org/10.1007/s10955-015-1212-2))."
  - "**Where equivalence fails, long-range interactions:** in systems where the interaction energy is not extensive, such as self-gravitating systems, the microcanonical entropy can be non-concave, and specific heat can be negative in the microcanonical ensemble ([Thirring 1970](https://doi.org/10.1007/BF01403177)). Canonical averages then cannot reproduce the microcanonical ones; stellar systems relax through collisionless 'violent relaxation' to quasi-stationary states that are not Boltzmann ([Lynden-Bell 1967](https://doi.org/10.1093/mnras/136.1.101)) ([[general-relativity]], [[cosmology]], [[astrophysics]], [[stability]])."
  - "**Where equivalence fails, small systems and first-order transitions:** in a few-particle system fluctuations are not negligible and different ensembles give different distributions; near a first-order transition, the microcanonical ensemble shows phase coexistence with a non-concave entropy while the canonical one shows a jump ([[phase-transitions]], [[biophysics]], [[soft-matter]], [[emergence]])."
  - "**Detailed balance:** a dynamics with transition rates $w_{i\\to j}$ has the Boltzmann distribution as stationary state if $p_iw_{i\\to j}=p_jw_{j\\to i}$ for every pair, which is the statement that in equilibrium each microscopic process is balanced by its reverse. It is the basis of Monte Carlo sampling ([Metropolis et al. 1953](https://doi.org/10.1063/1.1699114)) and, with time-reversal symmetry, of Onsager's reciprocal relations ([Onsager 1931](https://doi.org/10.1103/PhysRev.37.405)) ([[computation-physics]], [[stochastic-processes]], [[arrow-of-time]])."
  - "**Linear response near equilibrium:** the response of an equilibrium system to a weak perturbation is given by equilibrium correlation functions, as in the Kubo formula ([Kubo 1957](https://doi.org/10.1143/JPSJ.12.570)) and the fluctuation–dissipation theorem; this is what lets equilibrium information predict transport ([[fluctuations-response]], [[linearity-superposition]], [[causality-analyticity]])."
  - "**Local equilibrium:** a system that is not in global equilibrium can often be described by temperature, pressure and chemical potential varying slowly in space, because collisions equilibrate small cells faster than gradients change. This assumption underlies the Navier–Stokes equations and Fourier's law, and it fails for rarefied gases, steep gradients or very fast processes ([[hydrodynamics]], [[non-equilibrium]], [[scaling-dimensional-analysis]], [[effective-theories-naturalness]])."
  - "**Non-equilibrium steady states (NESS):** a system driven by a continuous flow of energy or particles, such as a conductor between two reservoirs or a driven fluid, can reach a time-independent state with nonzero currents and entropy production. Detailed balance is broken, the stationary distribution is not Boltzmann in general, and no free energy is guaranteed to exist; it is a stationary state without being equilibrium ([[non-equilibrium]], [[complex-systems]], [[arrow-of-time]], [[entropy-information]])."
  - "**Approach to equilibrium:** how and why an isolated system equilibrates is the thermalization problem. For generic chaotic systems local observables relax to thermal values (eigenstate thermalization), integrable systems relax to a generalized ensemble, and disordered systems may fail to thermalize ([[integrability-chaos]], [[quantum-foundations]], [[arrow-of-time]])."
definitions:
  - "**What does 'equilibrium' mean? Several definitions are used.** (a) *Stationarity*: no macroscopic variable changes in time. *Why:* it is simple and measurable. *Problem:* it also holds for non-equilibrium steady states and for metastable states, so it does not distinguish them. (b) *No net currents and detailed balance*: stationary and every microscopic process balanced by its reverse. *Why:* it separates equilibrium from driven steady states and gives the Boltzmann distribution. *Problem:* it applies to a given dynamics and is hard to test in experiments, and some systems are stationary with zero currents but still without detailed balance. (c) *Maximum entropy (or minimum free energy) at fixed constraints*: the state a closed system reaches. *Why:* it gives equilibrium as a variational principle and defines the thermodynamic state variables. *Problem:* it presumes the constraints are the complete list, and in glasses or with conserved quantities extra constraints change the answer. (d) *Thermal contact consistency (zeroth law)*: transitive 'no heat flow between systems'. *Why:* it defines temperature operationally. *Problem:* it assumes weak coupling and short-range interactions. The definitions coincide for a typical gas or crystal and diverge for glasses, driven systems and long-range interactions."
caveats:
  - "'Equilibrium' is relative to a time scale: a glass, a diamond or a mixture of hydrogen and oxygen is stationary on human time scales without being in the equilibrium state of the full system, so equilibrium statistical mechanics applies only to the degrees of freedom that have time to equilibrate."
  - "A stationary state is not necessarily an equilibrium state: driven systems with steady currents (a heated rod, a current in a wire) are stationary but have entropy production and do not follow the Boltzmann distribution."
  - "The ensembles are different probability distributions, not different physical systems; their agreement is a theorem for short-range interactions in the thermodynamic limit, not a general principle. The negative specific heat of a star cluster is a genuine microcanonical result and is not a contradiction."
  - "The ergodic hypothesis (time averages equal ensemble averages) is neither necessary nor sufficient for statistical mechanics to work in practice: it is proved only for a few model systems, and many macroscopic observables are described correctly by statistical mechanics for reasons related to the large number of degrees of freedom and typicality."
  - "'Entropy always increases' applies to isolated systems and to the total of system and bath; a system in contact with a bath minimizes its free energy, and its own entropy can decrease."
