cards:
  - q: What is a connection and what is holonomy?
    a: A connection is a rule for transporting quantities between nearby points (parallel transport). Holonomy is the net change after transport around a closed loop; for small loops it is the curvature times the enclosed area.
  - q: What plays the role of the connection and of the curvature in electromagnetism?
    a: The potential $A_\mu$ is the $U(1)$ connection and the field strength $F_{\mu\nu}$ is its curvature.
  - q: Why does the Aharonov–Bohm effect show that more than local fields matter?
    a: The phase $e^{iq\Phi/\hbar}$ depends on the flux enclosed by the loop even where $F = 0$ along the path; it is a holonomy, a global property of the connection.
  - q: How does curvature appear in general relativity?
    a: The Levi-Civita connection defines parallel transport and geodesics; the Riemann tensor is the holonomy for infinitesimal loops and describes tidal forces.
  - q: Why is general relativity not simply a Yang–Mills theory?
    a: Its connection lives on the tangent bundle, tied to the metric and to diffeomorphisms, and the Einstein–Hilbert action is linear in curvature rather than quadratic as in Yang–Mills.
  - q: What is the Berry phase?
    a: The geometric phase acquired by a state that follows a non-degenerate eigenstate adiabatically around a closed loop in parameter space; it is the holonomy of the Berry connection, defined modulo $2\pi$.
  - q: What does the integral of the Berry curvature over a closed surface give?
    a: $2\pi$ times an integer, the Chern number, which underlies the quantised Hall conductance and topological phases.
  - q: Can a flat connection have non-trivial holonomy?
    detail: true  # site only, not in the Anki deck
    a: Yes, on a space that is not simply connected (e.g. around a solenoid in Aharonov–Bohm); curvature controls only the local part of holonomy.
