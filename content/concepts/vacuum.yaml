cards:
  - q: What is zero-point energy and why is it usually discarded?
    a: Each field mode is an oscillator with ground-state energy $\tfrac12\hbar\omega$, and the sum over modes diverges. Without gravity only energy differences matter, so the constant is removed by normal ordering.
  - q: What did the Lamb shift show about the vacuum?
    a: The $2S_{1/2}$ and $2P_{1/2}$ levels of hydrogen, degenerate in Dirac theory, differ by about 1 GHz because the electron interacts with the fluctuating electromagnetic vacuum; Bethe's estimate was the first renormalization calculation.
  - q: What does the Casimir force between ideal parallel plates equal, and what are the two ways to derive it?
    a: $F/A=-\pi^2\hbar c/(240\,d^4)$. It follows from the change of the field's zero-point energy between the plates, or from retarded van der Waals forces between the atoms of the plates; both agree for ideal plates.
  - q: In what sense does the vacuum respond to external fields?
    a: 'It is polarizable: virtual pairs screen charge (the running coupling) and strong fields make it nonlinear (Heisenberg–Euler light-by-light scattering, Schwinger pair production).'
  - q: What is a vacuum condensate, and what are two examples?
    a: A nonzero vacuum expectation value of an operator that breaks a symmetry; the Higgs field (electroweak symmetry) and the quark condensate $\langle\bar qq\rangle$ (chiral symmetry in QCD).
  - q: What is the $\theta$-vacuum?
    a: In a gauge theory with infinitely many topologically distinct classical vacua labelled by a winding number, instanton tunnelling mixes them into states labelled by an angle $\theta$; its smallness is the strong CP problem.
  - q: What is a false vacuum and how does it decay?
    a: A local, not global, minimum of the potential; it decays by nucleating bubbles of the true vacuum, with a rate $\propto e^{-B/\hbar}$ given by a bounce solution.
  - q: Why is the vacuum observer dependent in curved spacetime?
    a: "'No particles' depends on the choice of mode decomposition, which differs for different observers or time slicings; the Unruh effect and Hawking radiation are examples."
  - q: What is the cosmological-constant problem?
    a: Gravity couples to the vacuum energy, and estimates of zero-point energy with a high cutoff exceed the observed dark-energy density by many orders of magnitude (about 120 for a Planck cutoff); no accepted mechanism explains the cancellation.
  - q: Why is there no single definition of 'the vacuum'?
    a: Fock, ground-state, algebraic and effective-potential definitions coincide for free fields in flat space but differ with interactions, symmetry breaking, curvature or acceleration.
