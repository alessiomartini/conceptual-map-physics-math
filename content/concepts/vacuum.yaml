id: vacuum
title: "The vacuum: the ground state that is not empty"
short: The vacuum
domain: concept
area: concepts
order: 320
one_liner: The vacuum is the lowest-energy state, and what that means depends on the theory - nothing in Newtonian physics, a fluctuating ground state in quantum field theory, a condensate after symmetry breaking, a state that can be metastable, and a source of gravity whose size nobody can compute.
summary: >-
  In Newtonian mechanics the vacuum is empty space. In quantum field theory it is the state of lowest energy, and
  it turns out to have structure: the field modes still carry zero-point energy, the vacuum responds to external
  fields like a dielectric medium, it can contain condensates that break symmetries, it can be one of many
  degenerate states, and it can be only metastable. Because gravity couples to all energy, the vacuum is also
  the central object of the cosmological-constant problem. The thread follows these meanings in turn. The
  oscillator that gives zero-point energy is in the harmonic-oscillator thread, the quanta built on the vacuum
  in the particles thread, and the mechanism of symmetry breaking in the symmetry-breaking thread; this thread
  collects what they imply for the vacuum itself. There is no single notion of 'vacuum', see "Definitions".
thread:
  - "**Three meanings in classical and quantum physics:** (i) absence of matter and fields (Newtonian space); (ii) the state with no quanta, the Fock-space state annihilated by all annihilation operators; (iii) the state of lowest energy of the full interacting theory. In a free theory (ii) and (iii) coincide; with interactions or in curved spacetime they need not ([[qft]], [[particles-fields]], [[classical-mechanics]])."
  - "**Zero-point energy:** each field mode is a harmonic oscillator with ground-state energy $\\tfrac12\\hbar\\omega$, so the sum over modes diverges. Only energy differences are measured in non-gravitational physics, so the constant is normally discarded by normal ordering ([[harmonic-oscillator]], [[renormalization]])."
  - "**Lamb shift:** the vacuum fluctuations of the electromagnetic field shift the energy levels of hydrogen; the $2S_{1/2}$ and $2P_{1/2}$ levels, degenerate in Dirac theory, were found to differ by about 1 GHz ([Lamb–Retherford 1947](https://doi.org/10.1103/PhysRev.72.241)). A non-relativistic estimate of the shift ([Bethe 1947](https://doi.org/10.1103/PhysRev.72.339)) was the first renormalization calculation, and Welton gave the heuristic picture of the electron jittering in the fluctuating field ([Welton 1948](https://doi.org/10.1103/PhysRev.74.1157)) ([[exp-lamb-shift]], [[exp-g-2]])."
  - "**Casimir effect:** two neutral conducting plates change the allowed field modes between them and feel a force per unit area $F/A=-\\pi^2\\hbar c/(240\\,d^4)$ in the ideal case, measured to a few percent at sub-micron separations ([Lamoreaux 1997](https://doi.org/10.1103/PhysRevLett.78.5)). The force can also be derived from retarded van der Waals forces between the plate atoms without invoking zero-point energy, which is why its interpretation is debated, see \"Definitions\" ([Jaffe 2005](https://doi.org/10.1103/PhysRevD.72.021301)) ([[electromagnetism]], [[boundaries-boundary-conditions]])."
  - "**The vacuum as a polarizable medium:** virtual electron–positron pairs screen charge, so the effective charge depends on distance ([Uehling 1935](https://doi.org/10.1103/PhysRev.48.55)), and strong fields make the vacuum nonlinear: the Heisenberg–Euler effective Lagrangian predicts light-by-light scattering and birefringence ([Heisenberg–Euler 1936](https://doi.org/10.1007/BF01343663)). Schwinger gave the gauge-invariant treatment and the pair-production rate in a strong electric field ([Schwinger 1951](https://doi.org/10.1103/PhysRev.82.664)). The running of couplings is the same effect seen in the renormalization group ([[standard-model]], [[effective-field-theory]], [[linearity-superposition]])."
  - "**Condensates and the vacuum as a medium:** when a symmetry is spontaneously broken, the vacuum has a nonzero expectation value of some operator. In the Standard Model the Higgs field has a vacuum expectation value $v\\approx246\\,$GeV, which gives masses to $W$, $Z$ and fermions; in QCD the quark condensate $\\langle\\bar q q\\rangle\\neq0$ breaks chiral symmetry and relates the pion mass to the quark masses ([Gell-Mann–Oakes–Renner 1968](https://doi.org/10.1103/PhysRev.175.2195)). Condensates also enter sum-rule calculations ([Shifman–Vainshtein–Zakharov 1979](https://doi.org/10.1016/0550-3213(79)90022-1)) ([[spontaneous-symmetry-breaking]], [[exp-higgs]], [[gauge-theory]])."
  - "**Many vacua:** a gauge theory can have infinitely many classically distinct vacua labelled by an integer winding number, connected by instantons; tunnelling mixes them into a $\\theta$-vacuum, labelled by an angle $\\theta$ ([Callan–Dashen–Gross 1976](https://doi.org/10.1016/0370-2693(76)90277-X), [Jackiw–Rebbi 1976](https://doi.org/10.1103/PhysRevLett.37.172)). Whether $\\theta$ is nonzero is a measurable question, and experiments set it below about $10^{-10}$, which is the strong CP problem ([[topology-invariants]], [[approximation-perturbation]], [[beyond-standard-model]])."
  - "**Metastable vacua:** a field theory can have a local, not global, minimum of the potential. Such a false vacuum decays by bubble nucleation, with a rate $\\propto e^{-B/\\hbar}$ computed semiclassically from a bounce solution ([Coleman 1977](https://doi.org/10.1103/PhysRevD.15.2929), [Callan–Coleman 1977](https://doi.org/10.1103/PhysRevD.16.1762)). The measured Higgs and top masses put the Standard Model close to the boundary between a stable and a metastable electroweak vacuum, which is an open question and depends sensitively on the top mass and on physics at high energy ([[stability]], [[standard-model]], [[cosmology]])."
  - "**Vacuum in curved spacetime and for accelerated observers:** the notion of 'no particles' is not generally covariant. Different observers or different time slicings define different vacua, which is the content of the Unruh effect and of Hawking radiation ([Unruh 1976](https://doi.org/10.1103/PhysRevD.14.870), [Hawking 1975](https://doi.org/10.1007/BF02345020)) ([[general-relativity]], [[black-holes]], [[arrow-of-time]])."
  - "**The vacuum gravitates:** if the vacuum has energy density $\\rho_{\\rm vac}$, general relativity treats it as a cosmological constant. Naive estimates with a cutoff at the Planck scale exceed the observed dark-energy density by about 120 orders of magnitude, and even with a cutoff at the electroweak scale the mismatch is enormous ([Weinberg 1989](https://doi.org/10.1103/RevModPhys.61.1)); the accelerating expansion fixes the observed value ([Riess et al. 1998](https://doi.org/10.1086/300499)) ([[cosmology]], [[exp-supernovae-acceleration]], [[effective-theories-naturalness]], [[quantum-gravity]])."
  - "**Vacuum in matter:** in a solid the ground state plays the role of the vacuum and its excitations the role of particles: phonons, magnons, quasi-holes. Its properties (gap, topological order, condensate) decide which excitations exist, a many-body version of the same structure ([[condensed-matter]], [[topological-phases]], [[emergence]], [[exp-bec]])."
definitions:
  - "**What is 'the vacuum'? Several inequivalent definitions are used.** (a) *Fock vacuum*: the state annihilated by all annihilation operators of a chosen mode decomposition. *Why:* it is simple and defines particles by counting quanta. *Problems:* it depends on the chosen modes; in an interacting theory or in curved spacetime it is not an eigenstate of the Hamiltonian, and Haag's theorem says that the free and interacting Fock spaces are not unitarily equivalent."
  - "(b) *Lowest-energy state of the full Hamiltonian*: the ground state, usually assumed to be Poincaré invariant and unique. *Why:* it is the physical state at zero temperature and the reference for excitations. *Problems:* uniqueness fails with spontaneous symmetry breaking (a family of degenerate vacua) and with topological sectors; in curved or time-dependent backgrounds no global lowest-energy state exists."
  - "(c) *Algebraic vacuum*: a state on the algebra of local observables that is invariant under translations and has positive energy in every representation. *Why:* it avoids mode decompositions and treats different phases as inequivalent representations. *Problems:* it is abstract and gives no calculation rules; it applies cleanly in Minkowski space only."
  - "(d) *Effective vacuum*: the state that minimizes the effective potential, including quantum corrections. *Why:* it tells which vacuum the system settles in and which are metastable. *Problems:* the effective potential is gauge dependent off its extrema and non-convex in the naive form; the notion of 'minimum' depends on the cutoff and on which fields are included."
  - "**Casimir energy: real fluctuations or interaction forces?** One reading attributes the force to the change of zero-point energy of the field modes. *Why:* it is a short calculation that gives the exact ideal result. *Problem:* the divergent sum must be regularized, and the result depends on the interaction of the plates with the field at high frequency. The other reading derives the same force from fluctuating charges and currents in the plates, with no zero-point energy of the free field. *Why:* it needs no vacuum energy. *Problem:* it is less transparent for geometries where the plate–field coupling is not the cause. The two agree for ideal plates; the choice matters only for what the effect says about whether vacuum energy is physical."
  - "**Overlaps and conflicts.** All four vacua agree in a free theory in flat spacetime. They separate when there are interactions, symmetry breaking, curvature or acceleration, and the statement 'the vacuum energy is $X$' needs the definition and the regularization specified."
caveats:
  - "'The vacuum is full of virtual particles that pop in and out of existence' is a heuristic for terms in a perturbative expansion, not a description of a real process; virtual particles are not observable and the same quantity can be computed without them (for example with the field correlation functions or, for the Casimir force, with charge fluctuations in the plates)."
  - "The zero-point energy of the quantum fields is not by itself an observable in non-gravitational physics. Casimir and Lamb-shift effects depend on changes of the vacuum, not on its absolute energy, so they do not show that the absolute value computed from modes up to a cutoff is physical."
  - "The 120-orders-of-magnitude mismatch depends on the cutoff and is not a calculation of the vacuum energy in any consistent theory; the cosmological-constant problem is that the sum of all contributions, including the electroweak and QCD ones, would have to cancel to extraordinary precision, and there is no accepted mechanism. 'Dark energy is the vacuum energy' is an assumption, not a result."
  - "A false vacuum has a finite lifetime computed in a given model; claims that 'the universe could be destroyed' rest on extrapolating the Standard Model to energies far above those tested, and the lifetime is vastly longer than the age of the universe in the central estimates."
  - "The effective-field-theory view says that the vacuum and its energy depend on the cutoff scale at which the theory is defined, so asking for 'the' vacuum energy of nature has no answer inside a low-energy theory alone."
