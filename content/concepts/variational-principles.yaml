cards:
  - q: What is a variational principle?
    a: A statement that the realised solution is a stationary point of a functional of whole functions or paths; the Euler–Lagrange equation is the resulting differential equation.
  - q: Is the action always minimised by the physical path?
    a: No. It is stationary, $\delta S = 0$; it is a minimum only for sufficiently short times, and beyond conjugate points the path is a saddle.
  - q: How does Fermat's principle relate to wave optics?
    a: Paths of stationary optical length are where nearby paths add in phase; geometrical optics is the short-wavelength limit of wave optics.
  - q: Why does the path integral explain least action?
    a: With weight $e^{iS/\hbar}$, contributions away from $\delta S = 0$ oscillate and cancel for $\hbar \to 0$ (stationary phase), leaving the classical path.
  - q: What does the Rayleigh–Ritz method guarantee?
    a: For any trial state the energy expectation is at least the ground-state energy, so minimising over a family of trial states gives the best upper bound in that family.
  - q: Which functional do equilibrium thermodynamics and mean-field theory extremise?
    a: The free energy $F = E - TS$ is minimised at fixed temperature; entropy is maximised at fixed energy.
  - q: Which variational principles are used in numerical solutions of PDEs?
    detail: true  # site only, not in the Anki deck
    a: The Ritz and Galerkin methods, on which finite elements are built, use the weak form of the PDE or the equivalent energy minimisation in a finite-dimensional space.
  - q: Why is there no general variational principle for dissipative systems?
    a: Dissipation breaks time-reversal symmetry, while the standard action with fixed endpoints yields time-reversible equations; special cases need extra variables or non-standard formulations.
