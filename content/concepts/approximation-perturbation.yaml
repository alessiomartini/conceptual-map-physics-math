cards:
  - q: What is the basic idea of perturbation theory?
    a: Split the problem into a solvable part plus a small remainder, expand the answer in a power series in the small dimensionless parameter, and solve order by order.
  - q: What is the difference between a convergent and an asymptotic series?
    a: A convergent series approaches the value as more terms are added; an asymptotic series approaches it as the parameter goes to zero at fixed order, but typically diverges (terms grow like $n!$), so there is an optimal truncation with error $\sim e^{-c/\varepsilon}$.
  - q: What was Dyson's 1952 argument about QED?
    a: If the series in $e^2$ converged, the theory would be well defined for $e^2<0$, where like charges attract and the vacuum is unstable; so the series must have zero radius of convergence.
  - q: What makes a perturbation singular, and what is a boundary layer?
    a: A small parameter multiplying the highest derivative changes the nature of the problem at zero. Prandtl's boundary layer at high Reynolds number is a thin region near a wall where viscosity matters, matched to an inviscid outer solution.
  - q: Why do secular terms appear and how are they removed?
    a: A naive expansion of a nonlinear oscillator has terms growing like $t\sin t$ that invalidate it at long times; introducing slow time scales (Poincaré–Lindstedt, multiple scales) and cancelling them gives amplitude and frequency corrections.
  - q: What does WKB give, and where does it fail?
    a: $\psi\approx p^{-1/2}e^{\pm i\int p\,dx/\hbar}$, the Bohr–Sommerfeld rule and tunnelling factors $e^{-2\int|p|dx/\hbar}$; it fails at classical turning points, where connection formulas are needed.
  - q: Why can mean-field theory be right or wrong, and when?
    a: It is exact in limits of infinite dimension or range and is corrected by fluctuations; above the upper critical dimension its exponents are correct, below it (2D, 3D Ising) they are wrong.
  - q: Why is a variational estimate of the ground-state energy a bound?
    a: Because $E_0\le\langle\psi|H|\psi\rangle$ for any trial state, so every trial function gives an upper bound, with error second order in the error of the state.
  - q: What is special about effects of the form $e^{-1/g}$?
    a: Their Taylor series in $g$ is zero to all orders, so no finite order of perturbation theory sees them (tunnelling, instantons, Schwinger pair creation); resurgence relates them to the large-order growth of the perturbative series.
  - q: What does 'controlled approximation' mean?
    a: Depending on the author, a rigorous bound, a convergent expansion, an asymptotic expansion, or a power-counted expansion in a known ratio of scales with estimated errors; they are different guarantees.
