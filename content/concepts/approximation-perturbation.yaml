id: approximation-perturbation
title: "Approximation and perturbation theory: how to compute when you cannot solve exactly"
short: Approximation and perturbation theory
domain: concept
area: concepts
order: 140
one_liner: Almost nothing in physics is solved exactly, so physics runs on expansions in a small parameter; the thread follows the idea from Taylor series to asymptotic series, boundary layers, WKB, mean field and effective theories, and to the effects (instantons, $e^{-1/g}$) that no power series can see.
summary: >-
  Exactly solvable problems are the exception: the Kepler problem, the harmonic oscillator, the hydrogen atom,
  the two-dimensional Ising model. Everything else is treated as a solvable problem plus a small correction, and
  the correction is expanded in a small parameter (a mass ratio, a coupling, a ratio of scales, $\hbar$ over an
  action). The thread asks what such an expansion means and when it can be trusted. Many of the most useful
  series do not converge: they are asymptotic, good to a certain order and then worse (Dyson's argument about
  quantum electrodynamics). Some perturbations are singular, because the small parameter multiplies the highest
  derivative, and the solution then has a boundary layer (Prandtl) or needs several scales (multiple scales,
  WKB). Mean-field theory, variational bounds and effective field theories are approximations of a different
  kind, justified by structure rather than by a small number. Finally, some physics lies beyond all orders of
  perturbation theory (instantons, tunnelling, $e^{-1/g}$), which leads to non-perturbative methods and to
  resurgence. What "controlled approximation" means is listed under "Definitions in use".
thread:
  - "**The basic move:** split the problem into a solvable part and a small remainder, $H=H_0+\\varepsilon V$ or $F(x;\\varepsilon)=0$, assume the answer is a power series $x=x_0+\\varepsilon x_1+\\varepsilon^2x_2+\\dots$, and solve order by order, each order being a linear problem built on the previous ones. The art lies in choosing $H_0$ and the small parameter; the dimensionless parameter must be small for a reason, not just because we would like it to be ([[scaling-dimensional-analysis]], [[ode]], [[pde]], [[classical-mechanics]])."
  - "**Taylor expansion and its limits:** the simplest expansion is Taylor's, and it already shows the issues of the thread. The series of an analytic function converges inside a disc whose radius is set by the nearest singularity in the complex plane, possibly far from the real axis (the series of $1/(1+x^2)$ at $0$ has radius $1$ although the function is smooth everywhere on the real line). Truncation error, radius of convergence and the dependence on singularities elsewhere in the complex plane are the three questions to ask of any expansion ([[real-analysis]], [[complex-analysis]], [[numerical-analysis]])."
  - "**Perturbation series in celestial mechanics:** the planets are a sum of two-body Kepler problems plus mutual interactions of relative size about the planetary mass over the solar mass ($\\lesssim10^{-3}$). Lagrange and Laplace built the perturbation theory that predicted secular drifts of the orbits, and Le Verrier used it in 1846 to infer the position of Neptune from irregularities in Uranus' orbit. Poincaré then showed that the series have small denominators and that, in general, the Lindstedt series diverge, which led to chaos and, later, to the KAM theorem on the survival of most quasi-periodic orbits under small perturbations ([[classical-mechanics]], [[astrophysics]], [[dynamical-systems]], [[chaos]], [[stability]])."
  - "**Rayleigh–Schrödinger perturbation theory:** for $H=H_0+\\lambda V$ the energy shifts are $E_n^{(1)}=\\langle n|V|n\\rangle$ and $E_n^{(2)}=\\sum_{m\\ne n}|\\langle m|V|n\\rangle|^2/(E_n^{(0)}-E_m^{(0)})$. The method was taken by Schrödinger from Rayleigh's theory of vibrating strings and used in his 1926 papers to compute the Stark effect ([Schrödinger 1926, third communication](https://doi.org/10.1002/andp.19263851302)). The second-order shift of the ground state is always negative, and degenerate levels need the problem diagonalised in the degenerate subspace first ([[quantum-mechanics]], [[linear-algebra]], [[functional-analysis]], [[amo-physics]])."
  - "**Asymptotic versus convergent series:** a series $\\sum a_n\\varepsilon^n$ is *asymptotic* to $f$ if, for every fixed $N$, the error after $N$ terms is $o(\\varepsilon^N)$ as $\\varepsilon\\to0$, even if the series diverges for every $\\varepsilon\\ne0$. The terms typically first decrease and then grow like $n!$; the best truncation, at the smallest term, gives an accuracy of order $e^{-c/\\varepsilon}$, which is a limit on what the series can ever deliver ([[real-analysis]], [[complex-analysis]], [[numerical-analysis]])."
  - "**Dyson's argument:** Dyson (1952) observed that if the QED perturbation series in $e^2$ had a non-zero radius of convergence, the theory would make sense for small negative $e^2$, where like charges attract; then the vacuum would be unstable, because pairs of electrons and positrons could be created in separate clusters, lowering the energy without bound. Hence the series cannot converge, even though its first terms agree with experiment to many digits ([Dyson 1952](https://doi.org/10.1103/PhysRev.85.631); [[qft]], [[renormalization]], [[exp-g-2]], [[exp-lamb-shift]])."
  - "**Factorial growth in practice:** Bender and Wu computed the coefficients of the ground-state energy of the anharmonic oscillator $H=p^2/2+x^2/2+gx^4$ to high order and found that they grow factorially, in line with Dyson's argument that the sign of $g$ matters ([Bender and Wu 1969](https://doi.org/10.1103/PhysRev.184.1231)). Lipatov later tied the large-order growth in field theory to instanton contributions ([[quantum-mechanics]], [[qft]], [[exp-g-2]])."
  - "**Borel summation:** divergent series can sometimes be given a meaning. The Borel transform $B(t)=\\sum a_n t^n/n!$ has a finite radius of convergence when $a_n\\sim n!$, and the Laplace integral $\\int_0^\\infty e^{-t/\\varepsilon}B(t)\\,dt$ re-sums it. If $B$ has singularities on the positive real axis (renormalons in field theory) the integral is ambiguous, and the ambiguity is of the size of a non-perturbative correction ([[complex-analysis]], [[real-analysis]], [[qft]], [[renormalization]])."
  - "**Regular versus singular perturbations:** in a *regular* perturbation (e.g. $x^2+\\varepsilon x-1=0$) the limit $\\varepsilon\\to0$ is a smooth deformation and a single expansion works uniformly. In a *singular* one the limit changes the nature of the problem: $\\varepsilon x^2+x-1=0$ loses a root as $\\varepsilon\\to0$ (the missing root goes to infinity as $-1/\\varepsilon$), and $\\varepsilon y''+y'+y=0$ drops from second to first order. Typical signs are a small parameter multiplying the highest derivative, secular terms that grow with time, or an expansion that fails in some region ([[ode]], [[pde]], [[hydrodynamics]], [[numerical-analysis]])."
  - "**Boundary layers:** Prandtl (1904) argued that viscous flow past a body at high Reynolds number is nearly inviscid except in a thin layer next to the wall, of thickness of order $L/\\sqrt{\\mathrm{Re}}$, where viscosity and the no-slip condition matter. Mathematically the small parameter $1/\\mathrm{Re}$ multiplies the highest derivative; one solves an outer problem (inviscid) and an inner problem (stretched coordinate $y/\\delta$) and matches the two in an overlap region, which is the method of matched asymptotic expansions. The boundary layer explains drag and flow separation, and the paradox of d'Alembert (no drag in ideal flow) ([[hydrodynamics]], [[pde]], [[scaling-dimensional-analysis]], [[geophysics-climate]])."
  - "**Multiple scales:** a weakly damped or weakly nonlinear oscillator $\\ddot x+x+\\varepsilon x^3=0$ expanded naively gives terms like $t\\sin t$ that grow without bound (*secular terms*), although the true motion stays bounded. The remedy, due to Poincaré and Lindstedt for frequencies and generalised as the method of multiple scales, is to introduce slow times $T=\\varepsilon t$ and to demand that the secular terms cancel; this yields amplitude equations and frequency shifts. The same idea appears as the averaging method, the rotating-wave approximation in optics and the derivation of the Ginzburg–Landau and nonlinear Schrödinger equations ([[ode]], [[dynamical-systems]], [[optics]], [[plasma-physics]], [[pde]], [[stability]])."
  - "**WKB and semiclassics:** for the Schrödinger equation $-\\hbar^2\\psi''/2m+V\\psi=E\\psi$ the small parameter $\\hbar$ multiplies the highest derivative, so the problem is singular. Writing $\\psi=e^{iS/\\hbar}$ and expanding $S=S_0+\\hbar S_1+\\dots$ gives $\\psi\\approx p^{-1/2}\\exp(\\pm i\\!\\int p\\,dx/\\hbar)$ away from the classical turning points, where the approximation fails and connection formulas (Airy functions) are needed. It gives the Bohr–Sommerfeld quantisation rule and the tunnelling probability $\\sim e^{-2\\int|p|dx/\\hbar}$, which is already non-analytic in $\\hbar$. Its relatives are geometrical optics (wavelength much smaller than the scale of variation), the eikonal limit and the stationary-phase evaluation of path integrals ([[quantum-mechanics]], [[optics]], [[eom-action-quantum]], [[classical-mechanics]], [[variational-principles]], [[chaos]])."
  - "**Mean-field theory as an approximation:** replace the interaction of a degree of freedom with all the others by its interaction with their average (Weiss molecular field, Hartree–Fock, van der Waals, Landau theory, Bardeen–Cooper–Schrieffer). This is *not* an expansion in a small parameter of the original problem; it is exact in a limit (infinite dimension, infinite-range interactions, large number of neighbours) and is corrected by fluctuations around it, with the number of neighbours $z$ or $1/d$ as the nominal expansion parameter. It predicts a phase transition, but with the wrong critical exponents below the upper critical dimension ([[statistical-mechanics]], [[phase-transitions]], [[condensed-matter]], [[universality]], [[fluctuations-response]], [[emergence]])."
  - "**Variational approximation and bounds:** instead of expanding, choose a trial family and optimise. For the ground state, $E_0\\le\\langle\\psi|H|\\psi\\rangle$ for every trial $\\psi$, so any trial function gives a rigorous upper bound, whose error is second order in the error of $\\psi$. The Rayleigh–Ritz method, Hartree–Fock, the Gibbs–Bogoliubov inequality in statistical mechanics, and variational Monte Carlo and neural-network states are all of this type. Unlike a perturbation series, it comes with a one-sided bound but with no estimate of the distance from the true value ([[variational-principles]], [[quantum-mechanics]], [[statistical-mechanics]], [[optimization]], [[quantum-information]])."
  - "**Effective theories as controlled approximations:** at energies $E\\ll\\Lambda$ the unknown physics at scale $\\Lambda$ appears only through a finite number of local operators, each suppressed by powers of $E/\\Lambda$. The expansion parameter is a ratio of scales, so the error of truncating at a given order can be estimated: Fermi theory of the weak interaction is the standard example, with $G_F\\sim1/M_W^2$; chiral perturbation theory, the multipole expansion and the post-Newtonian expansion ($v/c$) are others. The renormalization group says which terms matter ([[effective-field-theory]], [[renormalization]], [[locality]], [[emergence]], [[universality]], [[scaling-dimensional-analysis]], [[general-relativity]])."
  - "**Large-$N$ and other non-small parameters:** a parameter need not be a coupling. A theory with $N$ components can often be solved at $N=\\infty$ (vector models, matrix models, gauge theories at large number of colours with 't Hooft coupling $g^2N$ fixed), and $1/N$ plays the role of $\\hbar$. The same applies to expansions in $1/d$, in $\\epsilon=4-d$ (Wilson and Fisher) and in $1/c$ for black holes and the holographic dictionary ([[phase-transitions]], [[gauge-theory]], [[holography]], [[random-matrix-theory]], [[renormalization]], [[duality]])."
  - "**Non-perturbative effects:** some quantities are $\\propto e^{-1/g}$ or $e^{-S_0/\\hbar}$, whose Taylor series in $g$ vanishes to all orders. Tunnelling through a barrier, the decay of a false vacuum, the splitting of a double-well ground state, the Schwinger pair production rate $\\propto e^{-\\pi m^2/eE}$, the confinement scale $\\Lambda\\sim\\mu\\,e^{-8\\pi^2/g^2b_0}$ and the non-perturbative tails of asymptotic series are of this type. The saddle points of the Euclidean path integral that give them are instantons, for example the pseudoparticle solutions of Yang–Mills theory ([Belavin et al. 1975](https://doi.org/10.1016/0370-2693%2875%2990163-X); [[qft]], [[gauge-theory]], [[eom-action-quantum]], [[quantum-mechanics]], [[standard-model]], [[symmetry-conservation-gauge]])."
  - "**Resurgence:** Écalle's resurgence theory (1980s) and its applications to quantum mechanics and field theory suggest that perturbative and non-perturbative sectors are not independent: the large-order growth of the perturbative coefficients encodes the instanton sector, and the ambiguity of the Borel sum of the perturbative series cancels against the ambiguity of the instanton contribution. In this picture the full answer is a *trans-series* $\\sum_k e^{-kA/g}\\,\\sum_n a_{k,n}g^n$ and the two kinds of terms are one object. It works in solved cases (double well, Painlevé equations, matrix models, topological string); its general status in four-dimensional field theory is an open research problem ([[complex-analysis]], [[qft]], [[string-theory]], [[integrability]], [[tqft]])."
definitions:
  - "**What is a 'controlled approximation'? Four answers that are often conflated.** (a) *Rigorous bound*: the exact value is guaranteed to lie within a computable interval (variational upper bounds, Rayleigh–Ritz, Hölder-type estimates). *Why it exists:* it is the only kind of statement a mathematician fully accepts. *Problems:* bounds are usually one-sided or too wide, and they are rare for interacting many-body or field-theory problems."
  - "(b) *Convergent expansion*: successive orders approach the exact value. *Why:* it allows the error to be reduced at will by working harder. *Problems:* convergence may be too slow to use, and many of the most successful expansions (QED, anharmonic oscillators, high-Reynolds-number flow) are not convergent at all."
  - "(c) *Asymptotic expansion*: the error after $N$ terms is smaller than the $N$-th term as the parameter goes to zero, with $N$ fixed. *Why:* it is the mathematically precise form of 'small parameter, then the first few terms are enough'. *Problems:* at a fixed finite parameter it says nothing about how many terms are useful; the best accuracy is limited (about $e^{-c/\\varepsilon}$) and non-perturbative effects can be of exactly that size."
  - "(d) *Parametric / power counting*: the neglected terms are suppressed by an identified small ratio (of scales, of couplings, of $1/N$), so the error can be estimated and improved by including the next order. *Why:* this is the working meaning in effective field theory, where one cannot prove convergence. *Problems:* the coefficients are assumed to be of order one ('naturalness'), and a large coefficient or an accidental near-degeneracy can invalidate the estimate."
  - "**Overlaps and conflicts.** A convergent expansion is also asymptotic; an asymptotic expansion is usually what a physicist means by 'perturbation theory'. Bounds and expansions answer different questions (a bound says where the value cannot be, an expansion says how it depends on the parameter) and neither implies the other. Mean-field theory is controlled in none of the four senses at finite dimension, but is exact in a limit, which is a fifth, structural kind of control. In practice physicists often use 'controlled' to mean (d), mathematicians (a) or (c), and numerical analysts (b). This map does not choose among them: when a paper calls an approximation controlled it is worth asking which of these it means, and what is being held small."
caveats:
  - "'Small parameter' is meaningful only when the parameter is dimensionless and the neglected terms are really small in the same units. A coupling that is small numerically (the fine-structure constant $\\approx1/137$) can multiply large factors (logarithms of ratios of scales, $n!$, factors of $\\pi$), and a parameter such as $\\alpha_s$ that is formally small at high energies is of order one at the scale of hadrons, where the perturbative series is useless ([[renormalization]], [[standard-model]], [[scaling-dimensional-analysis]])."
  - "The statement that Dyson's argument proves the QED series diverges is a heuristic argument, not a theorem; it is generally believed and consistent with the large-order behaviour found in simpler models (Bender–Wu), but QED is not defined rigorously in four dimensions, so the series being approximated has no mathematically precise counterpart. Also, the agreement of the first terms with experiment ($g-2$) holds despite the divergence, because for $\\alpha\\approx1/137$ the smallest term is estimated to occur at an order of about $1/\\alpha$, far beyond what has been computed ([[qft]], [[exp-g-2]])."
  - "Not every divergent series is useful as asymptotic, and not every asymptotic series is Borel-summable: a series with the wrong sign (the quartic oscillator with $g<0$) or with Borel singularities on the real axis has an ambiguous sum, and different re-summations may differ by non-perturbative terms. Statements such as 'resurgence resolves the ambiguity' are established for specific models, not for QCD ([[complex-analysis]], [[qft]])."
  - "Prandtl's boundary layer is an approximation to the Navier–Stokes equations, not a rigorous consequence of them. Matched asymptotic expansions work for many flows, but the validity of the Prandtl equations can fail (separation, singularity formation, instability of the layer), and the zero-viscosity limit of Navier–Stokes solutions towards Euler solutions is open in general for flows with boundaries ([[hydrodynamics]], [[pde]])."
  - "WKB is accurate for slowly varying potentials, not 'for small $\\hbar$' in an absolute sense, since $\\hbar$ has dimensions: the real condition is that the de Broglie wavelength changes little over one wavelength. In chaotic systems the semiclassical expansion of the density of states (Gutzwiller trace formula) is asymptotic and breaks down at times of order the Ehrenfest time $\\sim\\lambda^{-1}\\ln(1/\\hbar)$ ([[chaos]], [[quantum-mechanics]], [[optics]])."
  - "Mean-field theory is sometimes presented as the first term of a systematic expansion; this is true only around the upper critical dimension, where fluctuation corrections are small, and fails below it (in 2D and 3D Ising models the mean-field critical exponents are wrong). Also, mean-field results (e.g. the BCS gap) can be very accurate where fluctuations are suppressed for other reasons, so accuracy and justification are different things ([[phase-transitions]], [[universality]])."
  - "Effective field theory is controlled only inside its domain of validity, which is set by the neglected scale $\\Lambda$ that the theory itself cannot predict: it signals its own breakdown (loss of unitarity at energies of order $\\Lambda$), not the value of $\\Lambda$. The coefficients of the higher-dimension operators are fixed by data or by matching to a UV completion, not by the effective theory ([[effective-field-theory]])."
  - "Instanton and 'non-perturbative' statements are often made in the semiclassical (dilute-gas) approximation, which is itself an expansion in a small parameter; 'non-perturbative' means 'not visible in the series in the coupling', not 'exact'. Lipatov's link between large-order growth and instantons is established in a number of models, and conjectural beyond them ([[qft]], [[gauge-theory]])."
