id: many-body-problem
title: "The many-body problem"
short: The many-body problem
domain: concept
area: concepts
order: 360
one_liner: Two interacting bodies can be solved exactly, three generally cannot, and $N\sim10^{23}$ is hopeless head-on; physics copes by replacing the interacting problem with a simpler effective one - a mean field, quasiparticles, a density - and by understanding when each replacement works and why exact methods hit an exponential wall.
summary: >-
  Almost everything of interest in matter - atoms, molecules, solids, nuclei, plasmas, quantum fluids - is an
  interacting many-body system. The thread follows why the problem is hard (no closed solutions beyond two bodies
  classically, an exponentially large state space quantum mechanically), and the main strategies for it: mean-field
  theories, quasiparticles and Fermi-liquid theory, density functional theory, numerical methods that fail through
  the sign problem or succeed through low entanglement, and the statements that no method is expected to work in
  general. It connects emergence, effective theories and computational limits, and it relies on the structure of
  identical particles treated in its own thread.
thread:
  - "**Two bodies and three:** the classical two-body (Kepler) problem reduces to one body in a central field and is solved in closed form. For three bodies there are only special solutions, and Poincaré showed that the general problem has no additional simple integrals and exhibits sensitive dependence on initial conditions; Sundman's convergent series for it exists but is useless in practice. The difficulty is structural, not technical ([[classical-mechanics]], [[chaos]], [[integrability-chaos]], [[dynamical-systems]])."
  - "**Quantum two bodies and beyond:** hydrogen is exactly solvable, helium is not, and from there on the Schrödinger equation is solved only approximately even for a few electrons. In a many-electron atom the Coulomb repulsion between electrons prevents separation of the equation into one-electron problems ([[quantum-mechanics]], [[approximation-perturbation]], [[numerical-analysis]])."
  - "**The exponential wall:** the Hilbert space of $N$ two-level particles has dimension $2^N$, so storing a general state of a few hundred particles would need more numbers than there are atoms in the universe. Kohn argued that wave functions of large systems cannot be a useful object for this reason, since a variational ansatz with enough parameters to be accurate is itself unmanageable ([Kohn 1999](https://doi.org/10.1103/RevModPhys.71.1253)) ([[computation-physics]], [[computational-complexity]], [[linear-algebra]])."
  - "**Mean-field theory:** each particle moves in the average field of the others. For electrons the Hartree approximation ([Hartree 1928](https://doi.org/10.1017/S0305004100011919)) uses a product state; the Hartree–Fock method antisymmetrizes it to respect the Pauli principle and adds exchange. Mean field neglects correlations by construction and becomes exact in some limits, such as high dimension or infinite-range interactions ([[identical-particles-statistics]], [[statistical-mechanics]], [[phase-transitions]], [[variational-principles]])."
  - "**Correlation and collective effects:** the energy missed by Hartree–Fock is called the correlation energy. Interactions that are individually weak can have large collective effects: Bohm and Pines showed that the long-range Coulomb force in an electron gas separates into a collective plasma oscillation and a screened short-range residual interaction ([Bohm–Pines 1953](https://doi.org/10.1103/PhysRev.92.609)) ([[condensed-matter]], [[plasma-physics]], [[emergence]])."
  - "**Quasiparticles:** the low-energy excitations of an interacting system often behave like weakly interacting particles with renormalized mass and finite lifetime: electrons dressed by their screening cloud, phonons, magnons. The particle concept is relocated from the fundamental constituents to the excitations ([[particles-fields]], [[emergence]], [[universality]])."
  - "**Fermi-liquid theory:** Landau's picture says that a system of interacting fermions at low temperature has excitations in one-to-one correspondence with those of the free Fermi gas, because the Pauli principle leaves little phase space for scattering near the Fermi surface and lifetimes diverge as $(\\omega,T)^{-2}$. It explains why metals behave like free electrons with an effective mass, and it fails at some points: in one dimension (Luttinger liquids), at quantum critical points, and when the Fermi surface is unstable, as in superconductors ([[effective-theories-naturalness]], [[dimensionality]], [[spontaneous-symmetry-breaking]], [[renormalization]])."
  - "**Density functional theory:** Hohenberg and Kohn proved that the ground-state density determines all ground-state properties ([Hohenberg–Kohn 1964](https://doi.org/10.1103/PhysRev.136.B864)), and Kohn and Sham turned this into a practical scheme with an auxiliary non-interacting system that has the same density ([Kohn–Sham 1965](https://doi.org/10.1103/PhysRev.140.A1133)). It trades the $3N$-variable wave function for a function of three variables, with all the difficulty moved into the unknown exchange-correlation functional, which is approximated ([[condensed-matter]], [[variational-principles]], [[optimization]])."
  - "**Model Hamiltonians:** instead of the full electron-ion problem one studies the simplest lattice models that keep the essential competition, such as the Hubbard model of electrons hopping on a lattice with on-site repulsion ([Hubbard 1963](https://doi.org/10.1098/rspa.1963.0204)). Even this is exactly solved only in one dimension and in special limits, and it is an open question how much of high-temperature superconductivity it contains ([[lattice-field-theory]], [[topological-phases]], [[integrability]])."
  - "**Quantum Monte Carlo and the sign problem:** stochastic methods sample the many-body wave function and gave the first accurate ground-state energies of the electron gas ([Ceperley–Alder 1980](https://doi.org/10.1103/PhysRevLett.45.566)). For fermions, and for frustrated or real-time problems, the weights become positive and negative and statistical errors grow exponentially with system size and inverse temperature; the sign problem is believed to be intrinsically hard for some cases ([[randomness-probability]], [[computation-physics]], [[stochastic-processes]])."
  - "**Tensor networks and entanglement:** ground states of local gapped Hamiltonians have far less entanglement than generic states, with entropy growing with the boundary area rather than the volume ([Eisert–Cramer–Plenio 2010](https://doi.org/10.1103/RevModPhys.82.277)). Matrix product states exploit this, and the density-matrix renormalization group ([White 1992](https://doi.org/10.1103/PhysRevLett.69.2863)) is essentially exact for one-dimensional chains, with the cost of simulation controlled by the entanglement ([Vidal 2003](https://doi.org/10.1103/PhysRevLett.91.147902)) ([[entanglement-correlations]], [[quantum-information]], [[information-theory]])."
  - "**Strong correlation and the limits:** where none of the above applies - strongly correlated electrons, frustrated magnets, real-time dynamics far from equilibrium, quantum chemistry with near-degenerate states - there is no controlled method, which is why quantum simulators are proposed. Whether the ground state of a generic local Hamiltonian can be found efficiently is a question in computational complexity ([[computation-physics]], [[amo-physics]], [[non-equilibrium]])."
  - "**From microscopic to effective:** the many-body problem is where emergence is concrete. Superfluidity, magnetism and superconductivity are not visible in the equation for a few particles, and the effective description often needs different variables from the original ones. This is why Anderson's slogan that 'more is different' is a statement about many-body physics ([[emergence]], [[effective-field-theory]], [[scaling-dimensional-analysis]])."
definitions:
  - "**What does 'solving' a many-body problem mean? Several standards coexist.** (a) *An exact closed-form solution* of the equations of motion or of the spectrum, as for the Kepler problem, hydrogen or integrable chains. *Why:* it is the cleanest standard and gives every observable. *Problem:* it exists only for special, often one-dimensional, systems. (b) *A numerically exact calculation to controlled error*, as in exact diagonalization, DMRG for chains or sign-free Monte Carlo. *Why:* it gives reliable numbers for specific cases. *Problem:* the cost can scale exponentially with system size, and finite sizes may not reveal the thermodynamic limit. (c) *An effective description that predicts the observed low-energy physics*, such as Fermi-liquid theory or density functional theory with an approximate functional. *Why:* it explains and predicts, at low cost. *Problem:* its accuracy is judged by experiment or benchmarks and not guaranteed, and it can miss strongly correlated phases. The three coincide in weakly interacting or integrable cases and diverge in the strongly correlated regime."
caveats:
  - "The three-body problem is not 'unsolvable' in the sense of having no solutions: there are exact special solutions (Lagrange points, the figure-eight orbit) and the general solution exists as a convergent series; what fails is a closed-form solution in terms of known functions, and in practice long-time prediction because of chaos."
  - "Hartree–Fock gives a variational upper bound on the ground-state energy within its class of states, but it is not an 'exact result with small corrections': the correlation energy is a small fraction of the total but of the same size as chemical binding energies, so it matters."
  - "The Hohenberg–Kohn theorem is an existence statement: it does not give the exchange-correlation functional, and the Kohn–Sham orbitals and eigenvalues are auxiliary quantities with no strict physical meaning, even though they are often interpreted as band structures."
  - "'Quasiparticle' does not mean that the original particles are absent or that the new objects are weakly interacting in every sense: a quasiparticle is defined through a pole of the Green's function with finite weight, and in strongly correlated systems there may be no such pole."
  - "The sign problem is a statement about a particular algorithm (sampling with the given weights), not a proof that the physics is intractable in general, though for some classes it is NP-hard in the worst case; a different basis or method can remove it for specific models."
  - "Low entanglement is a property of ground states of certain Hamiltonians, not of states in general or of time evolution: after a quench entanglement grows linearly in time, and tensor-network simulation of long-time dynamics becomes costly."
