cards:
  - q: Why is the three-body problem harder than the two-body problem?
    a: The two-body problem reduces to one body in a central field and is integrable; for three bodies there are no extra integrals of motion in general, and motion can be chaotic.
  - q: Why is the quantum many-body problem exponentially hard?
    a: The Hilbert space of $N$ two-level particles has dimension $2^N$, so a general state cannot be stored or evolved for more than a few tens of particles.
  - q: What does Hartree–Fock theory assume and what does it miss?
    a: It assumes an antisymmetrized product of one-particle orbitals, each moving in the mean field of the others; it misses correlations, whose energy is the correlation energy.
  - q: What is a quasiparticle?
    a: A low-energy excitation of an interacting system that behaves like a particle with renormalized properties and finite lifetime, for instance a screened electron or a phonon.
  - q: Why does Fermi-liquid theory work for metals?
    a: The Pauli principle limits scattering phase space near the Fermi surface, so quasiparticle lifetimes grow as $(\omega,T)^{-2}$ and excitations map onto those of a free Fermi gas.
  - q: What does density functional theory replace the wave function with?
    a: The ground-state electron density, with an auxiliary non-interacting Kohn–Sham system and an approximated exchange-correlation functional.
  - q: What is the sign problem?
    a: In quantum Monte Carlo for fermions or frustrated systems the sampling weights are not all positive, so cancellations make the statistical error grow exponentially with system size.
  - q: Why do tensor networks work for some systems?
    a: Ground states of local gapped Hamiltonians obey an area law for entanglement, so they are well approximated by matrix product states with modest bond dimension.
