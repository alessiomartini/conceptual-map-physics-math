cards:
  - q: What does the physical Church–Turing thesis assert?
    a: That the functions computable by physical processes are those computable by a Turing machine (computability version), or that physical computers can be simulated efficiently by a classical machine (extended version); several versions exist.
  - q: Why does reversible computing avoid the Landauer cost?
    a: Landauer's cost is for erasing information; a logically reversible computation keeps the history, and only erasing the output or garbage must dissipate.
  - q: Why did Feynman propose quantum computers?
    a: Simulating quantum systems on classical machines seems to require exponential resources, while a quantum system can simulate another quantum system efficiently.
  - q: What is BQP and how does it relate to NP?
    a: The problems solvable by a quantum computer in polynomial time with bounded error. It contains factoring, but is not known to contain NP-complete problems.
  - q: Why is finding spin-glass ground states hard?
    a: Barahona showed it is NP-hard on non-planar lattices, so no efficient algorithm is expected for the worst case.
  - q: What is the sign problem and why does it matter?
    a: Monte Carlo weights that are not positive make the statistical error grow exponentially with system size; Troyer and Wiese showed it is NP-hard in general.
  - q: What did Cubitt, Perez-Garcia and Wolf prove?
    a: That deciding whether a 2D translation-invariant lattice Hamiltonian is gapped or gapless in the thermodynamic limit is undecidable, by encoding the halting problem.
  - q: In what sense is simulation a 'third way' of doing science?
    a: It sits between theory and experiment, giving numerical solutions of models too complex for analysis and allowing virtual experiments, with its own questions of validation.
  - q: What does Grover's algorithm achieve?
    detail: true  # site only, not in the Anki deck
    a: A quadratic speed-up for unstructured search, which is optimal; it does not turn NP-complete problems into polynomial-time ones.
