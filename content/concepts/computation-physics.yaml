id: computation-physics
title: "Computation and physics: what nature can compute and what we can compute about nature"
short: Computation and physics
domain: concept
area: concepts
order: 190
one_liner: Computers are physical systems and physics problems are computational problems; the thread links the physical Church–Turing thesis, reversible and quantum computing, the hardness of spin glasses and of the sign problem, simulation as a method, and the undecidability of the spectral gap.
summary: >-
  There are two traffic directions between computation and physics. From physics to computation: any computer is
  a physical device, so what it can do is limited by physical law (thermodynamic cost of erasing bits, quantum
  mechanics, relativity); this leads to reversible and quantum computing and to the physical Church–Turing thesis.
  From computation to physics: the questions we ask about physical systems have computational complexity, and some
  are NP-hard or even undecidable, which constrains what simulation and theory can deliver. The thread also treats
  simulation as a third way of doing science. The thermodynamic side (Landauer, Maxwell's demon) is told in the
  entropy thread and the discrete-versus-continuous side in the discreteness thread; both are linked, not repeated.
  The phrase 'physical Church–Turing thesis' has competing versions, listed under "Definitions".
thread:
  - "**Computers are physical:** a computation is a physical process, so bounds on computation are bounds on physics: the energy dissipated per erased bit, the speed of signals, the number of states in a region. Conversely, a physical theory is a rule for computing outcomes from inputs, and one can ask how hard that is ([[computational-complexity]], [[information-theory]], [[philosophy-of-physics]])."
  - "**Church–Turing:** Turing's machines define the computable functions, and Church's lambda calculus and Gödel's recursive functions turned out equivalent; the (mathematical) Church–Turing thesis says these capture every effective procedure. It concerns what a human following rules can compute, not what physical devices can do, which is the physical thesis below ([[logic-set-theory]], [[philosophy-of-mathematics]]). Turing's definition of computable numbers is the one cited in the discreteness thread ([[discrete-continuum]])."
  - "**Reversible computing and Landauer:** erasing information costs at least $k_BT\\ln2$ per bit, but a logically reversible computation need not dissipate energy at all. Bennett showed that any computation can be made logically reversible by keeping the history, at the cost of memory, and that the only unavoidable dissipation is in erasing the result or the garbage ([Bennett 1973](https://doi.org/10.1147/rd.176.0525)). The link between thermodynamic and logical irreversibility is told in [[entropy-information]], with the time-arrow side in [[arrow-of-time]] ([[thermodynamics]])."
  - "**Analog versus digital:** a physical system can encode a computation in continuous variables (differential analysers, optical and neural analog computers) or in discrete ones. With noise, analog machines do not give unlimited precision and tend to be simulable by digital ones to the stated accuracy; the real-number models of computation can solve problems a Turing machine cannot, but only if one assumes exact real values, which noise forbids ([[discrete-continuum]], [[numerical-analysis]], [[real-analysis]], [[stochastic-processes]])."
  - "**Quantum computation, Church–Turing and Deutsch:** Feynman noted that simulating quantum systems on a classical computer seems to need exponentially many resources, and proposed using quantum systems to simulate quantum systems ([Feynman 1982](https://doi.org/10.1007/BF02650179)). Deutsch formulated a quantum Church–Turing principle and a universal quantum computer, and gave the first problem solved faster in the quantum model ([Deutsch 1985](https://doi.org/10.1098/rspa.1985.0070)). Lloyd proved that a quantum computer can simulate local Hamiltonians efficiently ([Lloyd 1996](https://doi.org/10.1126/science.273.5278.1073)) ([[quantum-information]], [[quantum-mechanics]])."
  - "**Quantum complexity and BQP:** BQP is the class of problems solvable with a quantum computer in polynomial time with bounded error; it contains BPP and is contained in PSPACE, and the oracle separations of Bernstein and Vazirani give evidence that it is larger than BPP ([Bernstein–Vazirani 1997](https://doi.org/10.1137/S0097539796300921)). Shor's algorithm factors integers in polynomial time ([Shor 1997](https://doi.org/10.1137/S0097539795293172)); factoring is in BQP but is not known to be NP-complete, so quantum computers are not believed to solve NP-complete problems efficiently ([[computational-complexity]], [[quantum-information]], [[number-theory]])."
  - "**Quantum advantage experiments:** a programmable superconducting processor sampled the output of a random circuit in minutes, a task claimed to take a classical supercomputer thousands of years ([Arute et al. 2019](https://doi.org/10.1038/s41586-019-1666-5)); classical simulation methods later narrowed the gap, and the task has no practical application. Such experiments test the extended Church–Turing thesis rather than usefulness ([[quantum-information]], [[quantum-foundations]])."
  - "**Complexity of physical problems:** finding the ground state of an Ising spin glass on a non-planar lattice is NP-hard ([Barahona 1982](https://doi.org/10.1088/0305-4470/15/10/028)), so no efficient algorithm is expected for the worst case, though typical instances can be easier; finding the ground energy of a local quantum Hamiltonian is QMA-complete, the quantum analogue. Protein folding, optimisation of energy landscapes and decoding in error-correcting codes are related ([[complexity]], [[statistical-mechanics]], [[condensed-matter]], [[optimization]], [[complex-systems]])."
  - "**The sign problem:** Monte Carlo simulations of fermions, frustrated magnets or QCD at finite density have weights that are not positive, and the statistical error grows exponentially with system size and inverse temperature. Troyer and Wiese showed that the sign problem is NP-hard in general, so a generic solution would imply P = NP ([Troyer–Wiese 2005](https://doi.org/10.1103/PhysRevLett.94.170201)) ([[lattice-field-theory]], [[condensed-matter]], [[standard-model]], [[random-matrix-theory]])."
  - "**Chaos and prediction:** deterministic chaos limits prediction through exponential sensitivity to initial conditions, a limit on practical computation independent of complexity classes; a computer with finite precision follows a shadowing trajectory of the true system, not the true one ([[chaos]], [[dynamical-systems]], [[numerical-analysis]])."
  - "**Simulation as a third way:** besides theory and experiment, numerical simulation (molecular dynamics, lattice gauge theory, climate and cosmological N-body models, quantum Monte Carlo, density-functional theory) is now a main tool for connecting theory with data. It poses questions about what a simulation proves, how it is validated, and how emergent behaviour is read off from it ([[hydrodynamics]], [[geophysics-climate]], [[cosmology]], [[astrophysics]], [[lattice-field-theory]], [[philosophy-of-physics]])."
  - "**Undecidability in physics:** Cubitt, Perez-Garcia and Wolf proved that whether a translation-invariant 2D quantum Hamiltonian on a lattice is gapped or gapless in the thermodynamic limit is undecidable: no algorithm can decide it for all Hamiltonians, by encoding the halting problem in the couplings ([Cubitt et al. 2015](https://doi.org/10.1038/nature16059)). Related results concern the dynamics of chaotic systems and the phase diagrams of lattice models ([[condensed-matter]], [[quantum-information]], [[logic-set-theory]], [[computational-complexity]], [[phase-transitions]])."
  - "**Computation and gravity:** black holes are bounded by their area-law entropy, so a region of space can store at most about $A/4\\ell_P^2$ bits, and proposals for holography relate bulk geometry to entanglement and complexity of the boundary state; whether the universe can be seen as computation is an old hypothesis with no accepted formulation ([[black-holes]], [[holography]], [[quantum-gravity]], [[entropy-information]])."
definitions:
  - "**What is the 'physical Church–Turing thesis'? At least four versions are in circulation.** (a) *Simulation thesis* (Deutsch's principle): every finitely realisable physical system can be perfectly simulated by a universal computing machine operating by finite means. *Why:* it ties computation to physics and motivated the quantum computer. *Problems:* 'perfectly' and 'finite means' need interpretation for continuous variables, and the strongest version fails for a Turing machine and holds only for a quantum computer."
  - "(b) *Computability version* (Gandy, Arrighi–Dowek): any physical process computes only Turing-computable functions. *Why:* it follows from locality, finite density of information and bounded speed of signals if the dynamics is computable. *Problems:* it is a conjecture about nature; hypercomputation proposals (supertasks, closed timelike curves, relativistic Malament–Hogarth spacetimes) violate it but need unphysical resources."
  - "(c) *Extended or strong thesis*: any reasonable physical computer can be simulated efficiently (polynomial overhead) by a probabilistic Turing machine. *Why:* it ties complexity classes to nature. *Problems:* quantum computing (Shor) is believed to violate it, so it is a statement that is under test, not established."
  - "(d) *Quantum-extended thesis*: efficient physical computation is what a quantum computer can do, BQP. *Why:* it replaces (c) after Deutsch, Feynman and Shor. *Problems:* it is not proved that BQP is bigger than BPP, and it is unclear whether other theories (non-linear quantum mechanics, quantum gravity) offer more."
  - "**Overlaps and conflicts.** (a) and (b) are about what can be computed at all, (c) and (d) about what can be computed efficiently; (c) and (d) conflict. None of the versions is a theorem, since each depends on assumptions about physical law, so the thesis is an empirical hypothesis rather than a mathematical result, unlike the original Church–Turing thesis, which is a claim about an informal notion."
caveats:
  - "NP-hard is a worst-case statement. Spin-glass ground states for typical instances, the sign problem for specific models and many QCD observables can be handled by heuristics or by special structure (the sign problem is absent at zero density in lattice QCD, for half-filled Hubbard on bipartite lattices, and for stoquastic Hamiltonians), so 'NP-hard' does not mean intractable in practice."
  - "Quantum computers are not believed to solve NP-complete problems efficiently: BQP is not known to contain NP, and Grover's algorithm gives only a quadratic speed-up for unstructured search. Statements that they 'try all answers at once' are misleading, since measurement returns one outcome and the algorithm must use interference to amplify the right one."
  - "Complexity classes depend on a model of computation and on a notion of input size. Asymptotic results do not say which method is faster for the sizes used in practice, and the quantum speed-ups of Shor, or of simulating molecules, depend on error correction and on overhead that today's devices do not reach."
  - "The undecidability of the spectral gap concerns families of Hamiltonians with parameters encoding arbitrary computations; it does not say that gaps of specific physical models cannot be computed. It applies in the thermodynamic limit, and for any finite size the question is decidable. The Hamiltonians used are artificial, not those of a real material."
  - "'The universe is a computer' or 'it from bit' are interpretations, not results. Physical systems perform computations in the sense that their evolution can be simulated, but identifying the universe with one particular computation adds a hypothesis (e.g. a discrete, computable law) that is unsupported by experiment (see the discreteness thread)."
  - "Landauer's bound is about erasure of logical information in a thermal environment; computers today dissipate many orders of magnitude more than $k_BT\\ln2$ per operation, so the bound is not currently a practical constraint. Reversible computing is a physical possibility whose engineering cost is a research issue."
  - "A quantum-advantage experiment on random circuits shows hardness for classical sampling under complexity-theoretic assumptions, not a useful computation, and its classical simulation cost estimates have been revised downward by new algorithms."
