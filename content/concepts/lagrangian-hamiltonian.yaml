id: lagrangian-hamiltonian
title: "Lagrangian vs Hamiltonian: two pictures of the same dynamics"
short: Lagrangian vs Hamiltonian
domain: concept
area: concepts
order: 380
one_liner: The Lagrangian picture works on configuration space with a variational principle and keeps symmetries (including Lorentz covariance) manifest; the Hamiltonian picture works on phase space with a symplectic structure and a preferred time, and is the natural bridge to statistical mechanics, quantisation and numerics.
summary: >-
  The same classical dynamics can be written as second-order equations on configuration space (Euler–Lagrange) or
  as first-order flow on phase space (Hamilton's equations). The two are related by the Legendre transform, which
  is exactly where the trouble starts when constraints or gauge symmetries make it singular. Each picture makes
  different things easy: symmetry and covariance on the Lagrangian side; Poisson brackets, canonical
  transformations, Liouville's theorem, Hamilton–Jacobi theory and canonical quantisation on the Hamiltonian side.
  This thread compares them; the variational idea itself is in [[variational-principles]], the passage to quantum
  theory in [[quantization]] and [[eom-action-quantum]].
thread:
  - "**Two spaces:** the Lagrangian $L(q,\\dot q,t)$ lives on the tangent bundle of configuration space (positions and velocities) and gives $\\frac{d}{dt}\\frac{\\partial L}{\\partial \\dot q} - \\frac{\\partial L}{\\partial q} = 0$, $n$ second-order equations. The Hamiltonian $H(q,p,t)$ lives on phase space, the cotangent bundle, and gives $\\dot q = \\partial H/\\partial p$, $\\dot p = -\\partial H/\\partial q$, $2n$ first-order equations ([[classical-mechanics]], [[ode]], [[differential-geometry]])."
  - "**Legendre transform:** define $p = \\partial L/\\partial \\dot q$ and $H = p\\dot q - L$, trading velocities for momenta. It is invertible when the Hessian $\\partial^2 L/\\partial \\dot q_i \\partial \\dot q_j$ is non-degenerate; $H$ is then the energy when $L$ has no explicit time dependence and the constraints are time-independent. The same structure reappears in thermodynamics, where $F = E - TS$ is a Legendre transform of $E$ ([[thermodynamics]])."
  - "**Variational principle on phase space:** Hamilton's equations follow from $\\delta\\int (p\\dot q - H)\\,dt = 0$ with $q$ and $p$ varied independently. This first-order action is the one that appears in the phase-space path integral and in the symplectic form $\\omega = dp\\wedge dq$ ([[variational-principles]])."
  - "**Symplectic geometry and Poisson brackets:** phase space carries a closed non-degenerate two-form $\\omega$; time evolution is the flow generated by $H$, $\\dot f = \\{f,H\\} + \\partial_t f$, with $\\{q_i,p_j\\} = \\delta_{ij}$. Canonical transformations preserve $\\omega$ and the brackets; Liouville's theorem (phase-space volume is conserved) follows, and is the starting point of statistical mechanics ([[statistical-mechanics]], [[equilibrium-ensembles]])."
  - "**Noether in both pictures:** a continuous symmetry of the action gives a conserved charge $Q = p\\,\\delta q - \\ldots$ (Lagrangian), and in the Hamiltonian picture the charge is the *generator* of the symmetry: $\\delta f = \\{f, Q\\}$. Conservation of $Q$ then means $\\{Q,H\\} = 0$, and this is the form that carries over to quantum mechanics as $[Q,H] = 0$ ([[symmetries]], [[symmetry-conservation-gauge]])."
  - "**Hamilton–Jacobi:** a canonical transformation to coordinates that are all constants of the motion leads to the first-order PDE $\\partial_t S + H(q,\\partial_q S,t) = 0$. Its characteristics are the classical trajectories; it is the geometric-optics limit of the Schrödinger equation, with $\\psi \\sim e^{iS/\\hbar}$, and the formal link between mechanics, optics and the WKB method ([[pde]], [[optics]], [[classical-limit]])."
  - "**Integrability and chaos:** the Hamiltonian picture defines what 'integrable' means (as many Poisson-commuting integrals as degrees of freedom, motion on invariant tori), and perturbation theory for near-integrable systems (KAM theorem, Poincaré sections) is formulated there ([[integrability-chaos]], [[chaos]], [[dynamical-systems]], [[integrability]])."
  - "**Constraints and Dirac's procedure:** when the Legendre transform is singular (a Lagrangian linear in velocities, or one with gauge redundancy) the momenta are not independent: there are *primary constraints* $\\phi_a(q,p) \\approx 0$. Dirac's algorithm adds them to $H$ with multipliers, checks that they are preserved in time (generating secondary constraints), and separates *first-class* constraints, which generate gauge transformations, from *second-class* ones, which are removed with Dirac brackets. This is how electrodynamics, Yang–Mills theory and gravity are put in Hamiltonian form ([[gauge-theory]], [[classical-field-theory]]). ([Anderson & Bergmann 1951](https://doi.org/10.1103/PhysRev.83.1018); [Dirac 1950](https://doi.org/10.4153/CJM-1950-012-1); [Dirac 1958](https://doi.org/10.1098/rspa.1958.0141))"
  - "**Covariance:** the Lagrangian density $\\mathcal L$ is a Lorentz scalar, so relativistic invariance (and, in general relativity, diffeomorphism invariance) is manifest. The Hamiltonian needs a choice of time, which splits spacetime into space and time and hides the symmetry; it is still there, but as a closure of the algebra of charges. In general relativity the ADM formalism foliates spacetime, the Hamiltonian is a sum of constraints, and 'time evolution' is a gauge transformation ([[special-relativity]], [[general-relativity]], [[quantum-gravity]])."
  - "**Quantisation:** the Hamiltonian picture gives canonical quantisation: promote $q,p$ to operators with $[\\hat q,\\hat p] = i\\hbar$, i.e. $\\{\\,,\\}\\to -\\frac{i}{\\hbar}[\\,,]$; constraints become conditions on states (Dirac quantisation). The Lagrangian picture gives the path integral $\\int e^{iS/\\hbar}$, which keeps Lorentz covariance and is the practical route for gauge theories. The two agree where both are defined ([[quantum-mechanics]], [[qft]], [[quantization]], [[eom-action-quantum]]). ([Feynman 1948](https://doi.org/10.1103/RevModPhys.20.367))"
  - "**Field theory:** the Hamiltonian picture treats the fields and their conjugate momenta at each point of space as infinitely many canonical pairs; the Hamiltonian is the generator of time translations, and in quantum field theory it fixes the vacuum and the energy spectrum ([[particles-fields]], [[vacuum]]). Lattice and Hamiltonian methods (tensor networks, Hamiltonian lattice gauge theory) use this form directly ([[lattice-field-theory]])."
  - "**Numerics:** symplectic integrators (leapfrog/Verlet, higher-order splitting methods) advance the Hamiltonian flow by compositions of exactly solvable symplectic maps. They do not conserve $H$ exactly but conserve a nearby 'shadow' Hamiltonian, so energy errors stay bounded over very long runs; this is why they are used in celestial mechanics and molecular dynamics. Variational integrators are the Lagrangian counterpart, derived from a discrete action ([[numerical-analysis]], [[computation-physics]]). ([Forest & Ruth 1990](https://doi.org/10.1016/0167-2789%2890%2990019-L))"
  - "**Gauge theory:** the gauge fields' gauge redundancy shows up as first-class constraints in the Hamiltonian picture (for electromagnetism the Gauss law $\\nabla\\cdot\\mathbf{E} = \\rho$ generates gauge transformations). Non-abelian gauge theory was formulated in the Lagrangian picture ([Yang & Mills 1954](https://doi.org/10.1103/PhysRev.96.191)), where its covariance is manifest ([[standard-model]], [[geometry-curvature]])."
caveats:
  - "The two pictures are equivalent only when the Legendre transform is invertible. For singular Lagrangians the Hamiltonian picture needs Dirac's constrained dynamics, and Lagrangians that differ by a total derivative, or even by a non-trivial change of variables, can give different canonical structures for the same equations of motion; the Lagrangian for a given set of equations of motion is in general not unique."
  - "$H = p\\dot q - L$ is the energy only under conditions (no explicit time dependence, and coordinates that do not depend on time); in a rotating frame or with time-dependent constraints $H$ is conserved but is not the energy. Conversely the energy can be conserved while $H$ is not the generating function one wants."
  - "Claims that one picture is 'more fundamental' reflect taste and context. Lagrangian methods are usually preferred for relativistic theories and for gauge-fixing, Hamiltonian ones for statistical mechanics and for quantum mechanics with a Hilbert space and unitary time evolution. In quantum gravity the Hamiltonian is a constraint and the problem of time arises; this page does not choose a resolution ([[quantum-gravity]])."
  - "Canonical quantisation is not unique: operator-ordering ambiguities, the Groenewold–van Hove no-go result (no consistent map from all classical observables to operators preserving Poisson brackets) and non-trivial phase-space topology mean that 'promote brackets to commutators' is a recipe, not a theorem ([[quantization]])."
  - "Symplectic integrators preserve the symplectic structure, not the energy, and only for Hamiltonians that split into pieces whose flows are known. With adaptive step sizes the long-time advantage is lost unless the step-size control is itself made reversible or symplectic."
  - "Dissipative systems do not have a standard Hamiltonian formulation with the usual phase space; the damped oscillator can be written as Hamiltonian only with explicitly time-dependent Hamiltonians (Caldirola–Kanai) or doubled variables, whose physical meaning is debated ([[non-equilibrium]])."
  - "The phase-space path integral and the configuration-space path integral agree when the Hamiltonian is quadratic in momenta; otherwise measure factors and operator-ordering choices differ and have to be fixed carefully."
