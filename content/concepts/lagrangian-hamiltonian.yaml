cards:
  - q: How are the Lagrangian and Hamiltonian formulations related?
    a: By the Legendre transform $p = \partial L/\partial \dot q$, $H = p\dot q - L$; the Euler–Lagrange equations ($n$ second-order) become Hamilton's equations ($2n$ first-order) on phase space.
  - q: When does the Legendre transform fail, and what is done then?
    a: When the Hessian $\partial^2 L/\partial \dot q^2$ is singular (gauge symmetry, Lagrangians linear in velocities); momenta then obey constraints and Dirac's procedure (primary and secondary, first- and second-class constraints) is used.
  - q: What does a first-class constraint do?
    a: It generates a gauge transformation, a redundancy of the description rather than a physical degree of freedom.
  - q: What is the Noether charge in the Hamiltonian picture?
    a: The generator of the symmetry; its Poisson bracket with any observable gives the infinitesimal transformation, and conservation means $\{Q,H\}=0$.
  - q: Why is the Lagrangian picture preferred for relativistic theories?
    a: The Lagrangian density is a scalar, so Lorentz (and diffeomorphism) invariance is manifest, while the Hamiltonian requires a choice of time.
  - q: What do symplectic integrators conserve?
    a: The symplectic structure exactly, and a nearby 'shadow' Hamiltonian approximately, so the energy error stays bounded over very long times instead of drifting.
  - q: How do the two pictures lead to the two kinds of quantisation?
    a: Hamiltonian, canonical quantisation (Poisson brackets become commutators); Lagrangian, the path integral with weight $e^{iS/\hbar}$.
  - q: What is the Hamilton–Jacobi equation and why is it useful?
    a: $\partial_t S + H(q,\partial_q S) = 0$; its solution generates the trajectories and is the classical limit of the Schrödinger equation with $\psi \sim e^{iS/\hbar}$.
