id: boundaries-boundary-conditions
title: "Boundaries and boundary conditions: where the equations stop and the physics is decided"
short: Boundaries and boundary conditions
domain: concept
area: concepts
order: 210
one_liner: A differential equation alone does not determine a solution; the thread follows how boundary data make problems well posed, enter integral theorems and actions, create edge states and the Casimir force, and in holography encode a whole theory.
summary: >-
  Laws of physics are mostly local differential equations, and what picks the actual solution is the boundary or
  initial data. The thread follows this idea across the map: Dirichlet, Neumann and Robin conditions and Hadamard's
  well-posedness for PDEs, Stokes and divergence theorems that trade bulk for boundary, boundary terms that must be
  added to variational principles and to the Einstein–Hilbert action, edge states that live where a topological bulk
  ends, the Casimir effect as a boundary-induced force, finite-size effects near a critical point, and holography,
  where the boundary theory is the definition of the bulk. Cosmological initial conditions are in the arrow-of-time
  thread and the bulk-edge protection in the topology thread; here the focus is on the boundary itself.
thread:
  - "**Well-posed problems:** Hadamard asked that a problem have a solution, that it be unique and that it depend continuously on the data. For the Laplace equation this means Dirichlet data (the value on the boundary) or Neumann data (the normal derivative), or a Robin mix; for the wave equation Cauchy data on a spacelike surface; for the heat equation initial data. The same equation with the wrong kind of data is ill posed, for example the Cauchy problem for Laplace's equation ([[pde]], [[ode]], [[functional-analysis]], [[classical-field-theory]], [[electromagnetism]])."
  - "**Physical meaning of the usual conditions:** a conductor fixes the potential (Dirichlet), an insulated wall fixes zero heat flux (Neumann), a no-slip wall fixes the fluid velocity, and a free surface fixes the stress. Eigenvalues, hence spectra, depend on the boundary condition: a string with fixed ends and one with free ends have different modes ([[hydrodynamics]], [[optics]], [[harmonic-oscillator]], [[linearity-superposition]])."
  - "**Integral theorems:** the divergence theorem and the generalised Stokes theorem $\\int_M d\\omega=\\int_{\\partial M}\\omega$ turn local conservation laws into statements about fluxes through the boundary, give Gauss's law and Green's identities, and make uniqueness proofs for the Poisson equation possible ([[differential-geometry]], [[topology]], [[electromagnetism]], [[symmetry-conservation-gauge]])."
  - "**Boundary terms in variational principles:** when deriving equations of motion one integrates by parts and discards a total derivative, which is legitimate only if the variation vanishes on the boundary. A consistent variational problem for the metric needs an extra term, the Gibbons–Hawking–York term ([York 1972](https://doi.org/10.1103/PhysRevLett.28.1082), [Gibbons–Hawking 1977](https://doi.org/10.1103/PhysRevD.15.2752)), which also contributes to black-hole entropy computed from the Euclidean action ([[variational-principles]], [[eom-action-quantum]], [[general-relativity]], [[black-holes]], [[classical-mechanics]])."
  - "**Edge states and bulk-boundary correspondence:** in the integer quantum Hall effect, the bulk Chern number equals the number of chiral modes at the edge ([Halperin 1982](https://doi.org/10.1103/PhysRevB.25.2185), [Hatsugai 1993](https://doi.org/10.1103/PhysRevLett.71.3697)); topological insulators and superconductors generalise this. The edge is gapless because it is the interface between two phases with different invariants ([[topological-phases]], [[topology-invariants]], [[exp-quantum-hall]], [[condensed-matter]], [[tqft]])."
  - "**Casimir effect:** two neutral plates impose boundary conditions on the electromagnetic field, restricting the allowed modes and shifting the zero-point energy, which gives a measurable force between them. The measurement by [Lamoreaux 1997](https://doi.org/10.1103/PhysRevLett.78.5) agreed with theory at the level of 5 per cent ([[qft]], [[electromagnetism]], [[quantum-mechanics]], [[effective-field-theory]], [[renormalization]])."
  - "**Finite size and surfaces in statistical mechanics:** a system of linear size $L$ near a critical point has a correlation length cut off by $L$; Fisher's finite-size scaling ([Fisher–Barber 1972](https://doi.org/10.1103/PhysRevLett.28.1516)) says observables depend on $L/\\xi$, and is how critical exponents are extracted from simulations. Periodic, free or fixed boundaries change the finite-size corrections but not the universality class ([[phase-transitions]], [[statistical-mechanics]], [[universality]], [[scaling-dimensional-analysis]], [[lattice-field-theory]], [[renormalization]])."
  - "**Boundary conditions in conformal field theory and gauge theory:** the allowed boundary conditions of a CFT are classified by boundary states; a gauge field on a manifold with boundary has gauge transformations that no longer act trivially at the boundary, and these become physical 'large' symmetries ([[cft]], [[gauge-theory]], [[symmetries]], [[tqft]], [[string-theory]])."
  - "**Holography:** in the AdS/CFT correspondence ([Maldacena 1997](https://arxiv.org/abs/hep-th/9711200)) the boundary values of bulk fields act as sources for operators of the dual theory living on the conformal boundary, so the boundary data define the bulk dynamics. The correspondence turns a boundary condition into the specification of a theory, and entropy areas into entanglement entropy ([[holography]], [[quantum-gravity]], [[string-theory]], [[black-holes]], [[locality]], [[entropy-information]])."
  - "**Boundaries at infinity and in cosmology:** asymptotic falloff conditions define what an isolated system is (the ADM mass is a boundary integral); the Hartle–Hawking no-boundary proposal treats the absence of a boundary as the condition on the wave function of the universe ([[general-relativity]], [[cosmology]], [[quantum-gravity]], [[arrow-of-time]])."
definitions:
  - "**What is 'a boundary condition'? The word covers three different roles that are often mixed.** (a) *Mathematical well-posedness data*: the extra information that makes a PDE problem have a unique stable solution (Dirichlet, Neumann, Cauchy). *Why:* a differential equation has a family of solutions and only data pick one. *Problems:* which data are admissible depends on the type of equation (elliptic, parabolic, hyperbolic), and for non-linear equations well-posedness can fail or be unknown (for Navier–Stokes in 3D it is a Millennium problem)."
  - "(b) *Physical interface description*: an idealised summary of what happens at a material surface (perfect conductor, no-slip, reflecting wall). *Why:* it replaces a microscopic problem with a simple condition. *Problems:* it is an effective statement, and refining the model (slip length, rough walls, finite conductivity) changes it; the Casimir force depends on the model of the plates."
  - "(c) *Dynamical or dual data*: boundary values that are themselves variables, as in holography, where the boundary value is a source and the response a vev, or in gauge theory, where boundary degrees of freedom carry physical charges. *Why:* it explains why one must treat the boundary as part of the system. *Problems:* the status of the boundary (a real surface? a conformal boundary at infinity? an artefact of regularisation?) differs among settings, and holography is a conjecture beyond tested examples."
  - "**Overlaps and conflicts.** The same condition can play (a) and (b) at once (a conductor imposes Dirichlet data), and the boundary term of the action fixes which of (a) is consistent (a Dirichlet variational problem needs the Gibbons–Hawking–York term; Neumann for gravity is more delicate). Roles (a) and (c) conflict about whether data are chosen by the physicist or determined dynamically. The thread keeps the roles apart and does not choose one as basic."
caveats:
  - "'Initial conditions are boundary conditions in time' is a useful picture, but for hyperbolic equations the Cauchy problem is well posed while the boundary-value problem with data on a closed boundary is generally not; the two cases should not be exchanged."
  - "The bulk-boundary correspondence has exceptions: non-Hermitian systems and some systems with boundaries along particular directions do not follow the naive rule (the 'non-Hermitian skin effect'), and gapless edge modes are protected only as long as the relevant symmetry or invariant is preserved."
  - "The Casimir force is often explained as 'vacuum fluctuations pushing on the plates', but it can be derived from the interaction between the plates' charges (van der Waals–Lifshitz theory) without invoking zero-point energy, so the energy-of-the-vacuum reading is one picture rather than the only one. Sign and magnitude depend on geometry and material."
  - "The Gibbons–Hawking–York term fixes the Dirichlet problem for the metric on a boundary at finite distance; other choices of boundary conditions need different terms, and for asymptotically AdS spaces counterterms are also required for a finite action."
  - "Finite-size scaling gives exponents only if corrections to scaling are controlled; the choice of boundary conditions changes amplitudes, and estimates from small lattices can be biased."
  - "AdS/CFT is a duality between theories with specific asymptotics; the statements about boundary data defining the bulk do not directly apply to our universe, which is not asymptotically AdS."
