cards:
  - q: What are the three conditions of Hadamard for a well-posed problem?
    a: A solution exists, it is unique, and it depends continuously on the data.
  - q: What boundary data suit the Laplace, heat and wave equations?
    a: Laplace, Dirichlet or Neumann data on the boundary; heat, initial data (plus boundary data); wave, Cauchy data (value and time derivative) on an initial surface.
  - q: Why does the Einstein–Hilbert action need the Gibbons–Hawking–York term?
    a: The variation contains normal derivatives of the metric variation on the boundary; the extra term cancels them, giving a well-defined Dirichlet variational problem.
  - q: What does the bulk-boundary correspondence say in the quantum Hall effect?
    a: The Chern number of the bulk bands equals the number of chiral edge modes, so edge states are guaranteed where a topological bulk ends.
  - q: Where does the Casimir force come from?
    a: The plates restrict the allowed electromagnetic modes, shifting the zero-point energy by an amount depending on the separation; equivalently from the retarded interaction between the plates' charges.
  - q: What does finite-size scaling say?
    a: Near a critical point observables depend on $L/\xi$, so data from different system sizes collapse onto one curve, which allows critical exponents to be extracted.
  - q: What role does the boundary play in AdS/CFT?
    a: The boundary values of bulk fields are sources for operators in the dual conformal field theory that lives on the boundary, which defines the bulk dynamics.
  - q: Why is the Cauchy problem for Laplace's equation ill posed?
    a: Small high-frequency perturbations of the data grow exponentially in the solution, so continuous dependence on the data fails (Hadamard's example).
