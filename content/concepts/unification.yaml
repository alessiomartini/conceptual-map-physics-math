cards:
  - q: What did Maxwell's equations unify?
    a: Electricity, magnetism and optics. Electric and magnetic fields are parts of one field and light is an electromagnetic wave travelling at $c=1/\sqrt{\mu_0\varepsilon_0}$.
  - q: What does electroweak unification mean?
    a: The electromagnetic and weak interactions come from one $SU(2)\times U(1)$ gauge theory, broken by the Higgs field to electromagnetism, so the photon, $W$ and $Z$ are mixtures of the original gauge bosons.
  - q: Why is the electroweak theory only partly unified?
    a: It still has two independent gauge couplings; the Weinberg angle relating them is measured, not predicted.
  - q: What is the idea of grand unification?
    a: The three Standard Model gauge couplings run with energy and, when the gauge group is embedded in a simple group such as $SU(5)$, become equal at one high scale, with quarks and leptons in common multiplets.
  - q: What does grand unification predict that could be falsified?
    a: Proton decay, through the exchange of heavy gauge bosons, and relations among the couplings and fermion masses.
  - q: What did Kaluza and Klein propose?
    a: Five-dimensional general relativity with one compact dimension contains four-dimensional gravity plus a gauge field, which they identified with electromagnetism.
  - q: Which kinds of unification are not about forces?
    a: Unification of descriptions across scales (thermodynamics from statistical mechanics), and the equivalence of apparently different theories by duality.
    detail: true  # site only, not in the Anki deck
  - q: What is the main obstacle to unifying quantum mechanics with general relativity?
    a: Gravity quantized as an ordinary field theory is non-renormalizable and there is no experimentally tested theory at the Planck scale.
    detail: true  # site only, not in the Anki deck
