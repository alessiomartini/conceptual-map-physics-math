cards:
  - q: What does Ehrenfest's theorem say, and when does it reproduce Newton's law?
    a: The expectation values obey $d\langle x\rangle/dt=\langle p\rangle/m$ and $d\langle p\rangle/dt=-\langle V'(x)\rangle$; this is Newton's law only if $\langle V'(x)\rangle\approx V'(\langle x\rangle)$, i.e. for a packet narrow compared with the scale of variation of the force (exactly for harmonic potentials).
  - q: What does the WKB approximation do?
    a: Writing $\psi=Ae^{iS/\hbar}$ and keeping the leading order gives the Hamilton–Jacobi equation for $S$; waves become rays, as in the eikonal limit of optics. It fails at turning points and caustics.
  - q: What is the Wigner function and how does it evolve?
    a: A quasi-probability distribution on phase space with the correct position and momentum marginals; it evolves by the Moyal bracket (Poisson bracket plus $O(\hbar^2)$ terms), exactly classically for quadratic Hamiltonians, and may be negative.
  - q: What does the Gutzwiller trace formula relate?
    a: The quantum density of states to the classical periodic orbits (a smooth Weyl term plus a sum over orbits).
  - q: Why do macroscopic objects not appear in superpositions?
    a: Interaction with the environment decoheres superpositions of states the environment can distinguish, and the rate grows rapidly with the separation of the states; the surviving pointer states look classical.
  - q: How does the time over which a quantum packet follows a classical orbit scale with $\hbar$?
    a: As a power of $1/\hbar$ for regular systems and only as $\ln(1/\hbar)$ for chaotic ones (the Ehrenfest time).
  - q: Why do the limits $\hbar\to0$ and $t\to\infty$ not commute?
    a: For chaotic dynamics the quantum evolution departs from the classical one after the Ehrenfest time, which diverges as $\hbar\to0$ but is finite for any fixed $\hbar$; the long-time and small-$\hbar$ results depend on the order.
  - q: Why is there no single meaning of 'the classical limit'?
    a: Semiclassical expansion, Ehrenfest expectation values, phase-space distributions, decoherence and large-$N$ limits answer different questions and differ for chaos, superpositions, tunnelling and long times.
