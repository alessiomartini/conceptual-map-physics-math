cards:
  - q: What is the Schmidt decomposition and what does it give?
    a: Any bipartite pure state can be written $\sum_i\sqrt{p_i}|i\rangle_A|i\rangle_B$ with orthonormal sets on each side (the SVD of its coefficient matrix); the $p_i$ determine the entanglement entropy, and one term means no entanglement.
  - q: Is every entangled state nonlocal in Bell's sense?
    a: No. Werner constructed entangled mixed states that admit a local hidden-variable model; entanglement is weaker than Bell violation.
  - q: What is an area law for entanglement?
    a: The entanglement entropy of a region in a ground state of a local Hamiltonian grows with the area of its boundary rather than its volume (up to logarithmic corrections at criticality).
  - q: Why does limited entanglement make a many-body state easy to simulate?
    a: It can be written as a matrix product (tensor-network) state whose size grows with the entanglement, not with the full Hilbert-space dimension; DMRG exploits this.
  - q: What does the topological entanglement entropy measure?
    a: The constant term $-\gamma=-\ln\mathcal D$ in $S=\alpha L-\gamma$, where $\mathcal D$ is the total quantum dimension; it signals topological order.
  - q: What is the Ryu–Takayanagi formula?
    a: In holography, the entanglement entropy of a boundary region equals the area of the minimal bulk surface anchored on its boundary divided by $4G_N$.
  - q: Can entanglement be used to send signals faster than light?
    a: No. The reduced state of one party is independent of the other party's measurement choice, so entanglement alone transmits no information.
  - q: Why is there no single measure of entanglement for mixed states?
    a: Operationally meaningful quantities (distillable entanglement, entanglement cost), computable ones (negativity) and distance-based ones can order states differently; only for pure bipartite states do they coincide.
