cards:
  - q: What does the fluctuation–dissipation theorem relate?
    a: The spectrum of spontaneous equilibrium fluctuations of an observable to the dissipative (imaginary) part of its linear response to a weak conjugate force.
  - q: What is the Einstein relation?
    a: $D = \mu k_BT$, linking the diffusion coefficient of a Brownian particle to its mobility under an applied force; noise and drag have the same molecular origin.
  - q: What is Johnson–Nyquist noise?
    a: Thermal voltage fluctuations across a resistor $R$ at temperature $T$, with classical spectral density $S_V = 4k_BTR$; the resistance that dissipates also produces the noise.
  - q: What do the Kubo (Green–Kubo) formulas express?
    a: Linear response and transport coefficients as equilibrium correlation functions of the unperturbed system, e.g. conductivity or viscosity as time integrals of current autocorrelations.
  - q: What do the Kramers–Kronig relations follow from?
    a: Causality of the response function, which makes its Fourier transform analytic in the upper half-plane and ties real and imaginary parts together.
  - q: What are Onsager reciprocal relations?
    a: Symmetry $L_{ij}=L_{ji}$ of the transport matrix coupling different fluxes and forces, a consequence of microscopic time reversal (with a magnetic field, $L_{ij}(B)=L_{ji}(-B)$).
  - q: Why does the susceptibility diverge near a critical point?
    a: Static susceptibility is a variance of the order parameter; fluctuations become correlated over a diverging length, so the variance, and the response, blow up.
  - q: Does the fluctuation–dissipation theorem hold far from equilibrium?
    detail: true  # site only, not in the Anki deck
    a: Not in its standard form; its violation measures distance from equilibrium, and fluctuation theorems (Jarzynski, Crooks) give exact replacements valid at any driving.
