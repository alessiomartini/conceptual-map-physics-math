cards:
  - q: Why are there only bosons and fermions in three dimensions?
    a: Exchanging two particles twice is a loop that can be contracted in $d\ge3$, so the exchange phase squares to 1, giving $\pm1$ (symmetric or antisymmetric wave functions).
  - q: What does the spin–statistics theorem state and what does it assume?
    a: Integer-spin particles are bosons and half-integer-spin ones are fermions; it is proved in relativistic quantum field theory from Lorentz invariance, positive energy and locality.
  - q: Why does the Pauli principle matter for matter?
    a: It gives atomic shells and the periodic table and makes matter stable (the energy of $N$ electrons is bounded below proportionally to $N$); degeneracy pressure also supports white dwarfs and neutron stars.
  - q: What is the Hong–Ou–Mandel effect?
    a: Two identical photons entering a 50:50 beam splitter from opposite sides leave together by the same output, because the exchange amplitudes cancel in the coincidence.
  - q: What is an anyon and where can it exist?
    a: A particle whose exchange phase $e^{i\theta}$ is neither $+1$ nor $-1$; in two dimensions exchanges are described by the braid group, so any phase (or a matrix for non-abelian anyons) is allowed. They appear as quasiparticles in fractional quantum Hall states.
  - q: How is a one-dimensional gas of impenetrable bosons related to fermions?
    a: In 1D particles cannot pass each other, so the Tonks–Girardeau gas of hard-core bosons has the same energies and densities as free fermions (the Girardeau mapping), though the momentum distributions differ.
  - q: Why does an atom with an even number of fermions behave as a boson?
    a: Exchanging two such atoms exchanges an even number of fermion pairs, giving a phase $+1$, as long as the internal structure is not resolved.
  - q: What does the factor $1/N!$ in the classical partition function represent?
    a: Indistinguishability of identical particles, which removes the Gibbs paradox of the entropy of mixing.
  - q: Why is the link between spin and statistics debated as an explanation?
    a: Rigorous proofs use relativistic quantum field theory with its assumptions, and no accepted derivation exists from non-relativistic quantum mechanics alone, so the statement can be seen as a theorem of field theory or an extra postulate.
