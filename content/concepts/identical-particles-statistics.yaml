id: identical-particles-statistics
title: "Identical particles and quantum statistics: bosons, fermions, anyons"
short: Identical particles
domain: concept
area: concepts
order: 330
one_liner: Particles of the same species cannot be told apart in quantum mechanics, so exchange must only change the state by a phase; this gives bosons and fermions in three dimensions, anyons in two, and underlies the periodic table, stability of matter, lasers and superfluids.
summary: >-
  Two electrons are identical in a sense stronger than two coins from the same mint: no measurement can label them.
  The consequence is that wave functions are symmetric or antisymmetric under exchange, which fixes how many
  particles can occupy a state and therefore the structure of atoms, the stability of matter and the behaviour
  of gases at low temperature. The thread follows the idea from the 1920s counting arguments to the spin–statistics
  theorem, to the topological argument that allows other statistics in two dimensions, and to their observation
  in quantum Hall systems. The mathematics of the fields that create the particles is in the particles thread and
  the role of topology in the topology thread. Why the statistics is tied to spin is not explained in the same
  way by all arguments, see "Definitions".
thread:
  - "**Indistinguishability:** classically identical particles still follow separate trajectories, so in principle they can be labelled. In quantum mechanics trajectories are not defined, so observables must be unchanged when labels are swapped, and the state can change only by a phase under exchange ([[quantum-mechanics]], [[classical-mechanics]], [[symmetry-conservation-gauge]])."
  - "**Two classes in three dimensions:** applying the exchange twice is the identity, so the phase is $\\pm1$: symmetric wave functions (bosons) or antisymmetric ones (fermions). The Pauli exclusion principle, formulated for electrons in atoms ([Pauli 1925](https://doi.org/10.1007/BF02980631)), is the statement that two fermions cannot occupy the same single-particle state. The Bose–Einstein distribution came first from counting light quanta ([Bose 1924](https://doi.org/10.1007/BF01327326)), the Fermi–Dirac one from antisymmetric states ([Dirac 1926](https://doi.org/10.1098/rspa.1926.0133)) ([[statistical-mechanics]], [[thermodynamics]])."
  - "**Symmetrization as a postulate:** more complicated symmetry types (parastatistics) are consistent with indistinguishability, but only the symmetric and antisymmetric representations are seen in nature, and experiments set limits on small violations of the exclusion principle ([Messiah–Greenberg 1964](https://doi.org/10.1103/PhysRev.136.B248)) ([[group-theory]])."
  - "**Spin–statistics theorem:** integer-spin particles are bosons and half-integer-spin ones are fermions. It was derived for relativistic quantum field theory from Lorentz invariance, positive energy and locality (microcausality) ([Pauli 1940](https://doi.org/10.1103/PhysRev.58.716)). In non-relativistic quantum mechanics it is an extra input ([[qft]], [[causality-analyticity]], [[special-relativity]])."
  - "**Consequences for atoms and matter:** exclusion gives shells and the periodic table, and also the stability of matter: the energy of $N$ electrons and nuclei is bounded below by a quantity proportional to $N$ only because of the exclusion principle ([Dyson–Lenard 1967](https://doi.org/10.1063/1.1705209)), with a shorter proof via a kinetic-energy bound ([Lieb–Thirring 1975](https://doi.org/10.1103/PhysRevLett.35.687)). Degeneracy pressure supports white dwarfs and neutron stars ([[astrophysics]], [[condensed-matter]], [[nuclear-physics]])."
  - "**Bunching and antibunching:** identical bosons tend to arrive together and fermions to avoid each other. Two photons at a beam splitter exit together because of destructive interference between the exchange paths ([Hong–Ou–Mandel 1987](https://doi.org/10.1103/PhysRevLett.59.2044)); intensity correlations of atoms show bunching for bosons and antibunching for fermions ([Jeltes et al. 2007](https://doi.org/10.1038/nature05513)) ([[entanglement-correlations]], [[exp-bec]], [[amo-physics]])."
  - "**Macroscopic consequences at low temperature:** bosons can occupy one state, giving Bose–Einstein condensation, superfluidity and lasers; fermions fill a Fermi sea, giving metals, the degenerate electron gas and, with attraction, Cooper pairs that behave as bosons ([[exp-bec]], [[exp-superconductivity]], [[spontaneous-symmetry-breaking]])."
  - "**Statistics depends on dimension:** in two dimensions, exchanges of two particles can be performed clockwise or counterclockwise and these are not equivalent, so the relevant group is the braid group, not the permutation group, and the exchange phase $e^{i\\theta}$ can take any value ([Leinaas–Myrheim 1977](https://doi.org/10.1007/BF02727953)). Such particles are anyons ([Wilczek 1982](https://doi.org/10.1103/PhysRevLett.49.957)). In three dimensions a loop of exchange can be shrunk, which forces $\\theta=0$ or $\\pi$ ([[topology-invariants]], [[dimensionality]], [[group-theory]])."
  - "**Anyons in matter:** quasiparticles of the fractional quantum Hall state carry fractional charge and are expected to have fractional statistics ([Arovas–Schrieffer–Wilczek 1984](https://doi.org/10.1103/PhysRevLett.53.722)); the statistical phase has been measured in collision experiments ([Bartolomei et al. 2020](https://doi.org/10.1126/science.aaz5601)) and in an interferometer ([Nakamura et al. 2020](https://doi.org/10.1038/s41567-020-1019-1)). Non-abelian anyons, where braiding acts as a matrix on a degenerate space, are the basis of topological quantum computing ([Kitaev 2003](https://doi.org/10.1016/S0003-4916%2802%2900018-0)) ([[exp-quantum-hall]], [[topological-phases]], [[quantum-information]])."
  - "**Statistics in one dimension and exclusion statistics:** in 1D particles cannot pass each other, so bosons with impenetrable interactions can be mapped to free fermions ([Girardeau 1960](https://doi.org/10.1063/1.1703687)), realized in cold atoms ([Kinoshita et al. 2004](https://doi.org/10.1126/science.1100700)). A generalization defines statistics by how adding a particle reduces the available states ([Haldane 1991](https://doi.org/10.1103/PhysRevLett.67.937)) ([[integrability-chaos]], [[discrete-continuum]], [[emergence]])."
  - "**Particle statistics and locality in field theory:** in the algebraic approach, statistics is a property of superselection sectors of the local observables, and in 3+1 dimensions only bosons and fermions arise ([Doplicher–Haag–Roberts 1971](https://doi.org/10.1007/BF01877742)); in 2+1 dimensions braid statistics appears ([[locality]], [[particles-fields]], [[vacuum]])."
definitions:
  - "**What does 'identical particles' mean, and why does statistics follow? Several arguments are used.** (a) *Symmetrization postulate*: states of identical particles lie in the symmetric or antisymmetric subspace. *Why:* it is the simplest statement and reproduces atomic and gas physics. *Problems:* it is an assumption, not derived from the other axioms, and does not explain the link to spin."
  - "(b) *Configuration-space topology*: the state space of $N$ identical particles is the space of unordered configurations, whose fundamental group is the permutation group (in $d\\ge3$) or the braid group (in $d=2$); statistics is a one-dimensional unitary representation of it. *Why:* it explains why only $\\pm1$ exists in 3D and why anyons exist in 2D. *Problems:* it says which statistics are allowed, not which one goes with which spin; and non-abelian representations require further choices."
  - "(c) *Relativistic spin–statistics theorem*: derived from Lorentz invariance, positive energy and locality. *Why:* it ties statistics to spin and gives the observed assignment. *Problems:* the proofs need technical assumptions (a Hilbert space with a Poincaré-invariant vacuum), and no elementary derivation that avoids relativistic field theory is generally accepted."
  - "(d) *Algebraic superselection theory*: statistics is the way sectors of the local algebra combine. *Why:* it classifies the possibilities from locality alone. *Problems:* it is abstract and its applicability to condensed-matter anyons, which need not come from a Poincaré-invariant theory, is less direct."
  - "**Overlaps and conflicts.** In 3D with fixed particle number the four agree: bosons and fermions with the observed spin assignment. They differ in what they allow in two dimensions, in non-relativistic systems, and in effective descriptions (quasiparticles) where the 'particle' is not an elementary field quantum."
caveats:
  - "Exchange statistics is a property of identical particles of the same kind; the Pauli exclusion principle is not a force, and the repulsion that it produces comes from the antisymmetry of the wave function together with the Coulomb interaction (the 'exchange interaction'), not from an extra interaction."
  - "Composite particles obey the statistics set by the number of fermions inside: an atom with an even number of fermions is a boson. This holds as long as the internal structure is not probed; at high density or energy the composite nature shows up and the boson description fails."
  - "Anyons are quasiparticles of two-dimensional systems, not fundamental particles; three-dimensional anyons do not exist as point particles, though extended objects (loops, strings) in 3D can have non-trivial braiding. The experiments cited extract a phase from collective signals in specific devices and the interpretation depends on the model of the edge or interferometer."
  - "Indistinguishability does not mean that particles are entangled in a physically meaningful way: the antisymmetrization of electrons far apart in separate labs does not produce observable correlations. The meaningful entanglement of identical particles is defined with respect to modes, not labels."
  - "The Gibbs paradox is resolved in the classical limit by the factor $1/N!$ in the partition function, which corresponds to indistinguishability; it is a hint of quantum statistics, not a classical derivation of it."
