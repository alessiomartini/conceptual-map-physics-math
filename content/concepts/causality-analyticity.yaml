cards:
  - q: What does causality imply for a linear response function?
    a: The kernel vanishes for negative time, so its Fourier transform is analytic in the upper half of the complex frequency plane.
  - q: What do the Kramers–Kronig relations say?
    a: The real and imaginary parts of a causal response are Hilbert transforms of each other, so the refractive index at every frequency is determined by the absorption spectrum.
  - q: Why can a pulse have a group velocity larger than c without violating causality?
    a: The group velocity is not the signal velocity; information travels with the front of the pulse, whose speed is bounded by $c$ because the response is causal.
  - q: What is microcausality?
    a: Observables built from local fields at spacelike-separated points commute, so measuring one cannot affect the statistics of the other.
  - q: How does causality constrain scattering amplitudes?
    a: Causality makes amplitudes analytic functions of energy, so a dispersion relation ties their real and imaginary parts and, with unitarity, limits their high-energy growth (Froissart bound).
  - q: What is a positivity bound?
    a: A requirement, derived from analyticity and unitarity of forward scattering, that the coefficients of certain higher-derivative operators in an effective theory be positive if a consistent UV completion exists.
  - q: Why do Bell-inequality violations not contradict causality?
    a: The correlations cannot be used to send a signal, because each local outcome is random; no-signalling holds even though the correlations cannot come from local hidden variables.
    detail: true  # site only, not in the Anki deck
  - q: Does the choice of retarded rather than advanced waves follow from causality?
    a: No; the equations allow both, and the choice is a boundary condition associated with the thermodynamic arrow of time.
    detail: true  # site only, not in the Anki deck
