cards:
  - q: What is canonical quantization?
    a: Replace classical observables with operators and Poisson brackets with commutators, $\{A,B\}\to[\hat A,\hat B]/i\hbar$, with the Hamiltonian generating time evolution.
  - q: Why is quantization not unique?
    a: Classical functions of $x$ and $p$ do not fix the order of non-commuting operators, and terms proportional to $\hbar$ vanish in the classical limit, so different theories can share one classical limit.
  - q: What does the Groenewold–Van Hove result say?
    a: There is no map from all classical observables to operators that sends every Poisson bracket to the commutator; it already fails for polynomials of degree higher than two in $x,p$.
  - q: How does the path integral quantize a theory?
    a: It sums the weight $e^{iS/\hbar}$ over all histories, with no operators or ordering written explicitly, but with a measure and discretization that must be defined.
  - q: Why do gauge theories need ghosts?
    a: Integrating over all gauge-equivalent field configurations counts the same physics infinitely many times; fixing the gauge introduces a determinant (Faddeev–Popov), written with anticommuting ghost fields.
  - q: What is deformation quantization?
    a: Writing quantum mechanics on phase space with a non-commutative star product of functions, which reduces to the ordinary product and whose commutator reduces to the Poisson bracket as $\hbar\to0$.
  - q: Why is quantization of general relativity hard?
    a: The canonical theory is a set of constraints (the Wheeler–DeWitt equation) with no external time, and the perturbative theory is not renormalizable, so neither route gives an established complete theory.
  - q: Is quantization a derivation of quantum theory?
    a: No; nature is quantum and classical physics is its limit, so quantization is a heuristic for guessing quantum theories with a given limit, tested by experiment.
  - q: Why is the term 'second quantization' misleading?
    a: It does not quantize again; it rewrites the same quantum theory in terms of fields and occupation numbers, which is convenient for variable particle number.
