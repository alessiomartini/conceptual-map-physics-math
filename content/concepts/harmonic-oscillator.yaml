id: harmonic-oscillator
title: "The harmonic oscillator everywhere: from small oscillations to free fields"
short: The harmonic oscillator everywhere
domain: concept
area: concepts
order: 160
one_liner: Near any stable minimum a system is a collection of harmonic oscillators, and that single solvable model, classical and quantum, underlies normal modes, phonons, photons, coherent states and free quantum fields.
summary: >-
  Expand any potential around a stable minimum and the first non-trivial term is quadratic: a harmonic oscillator.
  Many coupled oscillators decouple into independent normal modes, and quantising each one gives the same ladder of
  equally spaced levels. The thread follows this one model through molecular vibrations, crystals (phonons), the
  electromagnetic field (photons), coherent states and free quantum fields, which are a collection of oscillators
  labelled by momentum, and ends with what the harmonic picture cannot do: anharmonicity, thermal expansion,
  parametric resonance and interactions. The general role of linearity (superposition, Fourier, Green's functions)
  is treated in the linearity thread and only referred to here.
thread:
  - "**Why it is everywhere:** for a potential $V(x)$ with a minimum at $x_0$, $V = V(x_0) + \\tfrac12 V''(x_0)(x-x_0)^2 + \\dots$; for small displacements the quadratic term dominates, the force is linear, and the motion is $x(t) = A\\cos(\\omega t + \\phi)$ with $\\omega^2 = V''(x_0)/m$. This is the content of 'small oscillations' and a first example of linearisation ([[classical-mechanics]], [[stability]], [[ode]], [[linearity-superposition]])."
  - "**Normal modes:** for $N$ coupled degrees of freedom the equations are $M\\ddot{\\mathbf q} = -K\\mathbf q$ and a change of coordinates diagonalises $M^{-1}K$ into $N$ independent oscillators with frequencies given by its eigenvalues. Molecular vibrations, coupled pendula, a vibrating string and the vibrations of a bridge are all sums of such modes ([[classical-mechanics]], [[linear-algebra]], [[linearity-superposition]])."
  - "**Quantum oscillator:** $H = \\hbar\\omega(a^\\dagger a + \\tfrac12)$, with $[a,a^\\dagger] = 1$. The energy levels $E_n = \\hbar\\omega(n+\\tfrac12)$ are equally spaced, $a^\\dagger$ and $a$ raise and lower $n$ by one, and the ground state keeps a zero-point energy $\\hbar\\omega/2$. The algebraic ladder solution is the template for all creation-and-annihilation operator methods ([[quantum-mechanics]], [[lie-theory]], [[functional-analysis]]). The first quantum treatment of oscillator-like systems is in ([Heisenberg 1925](https://doi.org/10.1007/BF01328377))."
  - "**Heat capacity and Planck's law:** treating the vibrations of a solid or the modes of a cavity as quantised oscillators gives specific heats that vanish at low temperature (Einstein, Debye) and the blackbody spectrum, whose average mode energy is $\\hbar\\omega/(e^{\\hbar\\omega/k_BT}-1)$ ([[thermodynamics]], [[statistical-mechanics]], [[exp-blackbody]], [[condensed-matter]]). The Debye model of a crystal as a collection of sound modes is in ([Debye 1912](https://doi.org/10.1002/andp.19123441404))."
  - "**Phonons:** a crystal is $N$ atoms coupled by springs, hence $3N$ normal modes labelled by wavevector and branch. Each mode, quantised, is an oscillator whose excitation number counts phonons, quasi-particles with energy $\\hbar\\omega_k$ that carry crystal momentum. Specific heat, thermal conductivity, sound and the electron–phonon interaction behind superconductivity are written in this language ([[condensed-matter]], [[exp-superconductivity]], [[emergence]])."
  - "**Photons and the quantised field:** the free electromagnetic field in a box decomposes into plane-wave modes, each with the dynamics of an oscillator; quantising them gives photons as the excitations, $a^\\dagger_{\\mathbf k\\lambda}$ creating one of momentum $\\mathbf k$ and polarisation $\\lambda$. Dirac's 1927 paper quantised the radiation field in exactly this way and derived spontaneous emission ([Dirac 1927](https://doi.org/10.1098/rspa.1927.0039)) ([[electromagnetism]], [[qft]], [[optics]], [[exp-lamb-shift]])."
  - "**Coherent states:** the eigenstates of the annihilation operator, $a|\\alpha\\rangle = \\alpha|\\alpha\\rangle$, are minimum-uncertainty wavepackets that oscillate like a classical particle without spreading, and have Poisson-distributed photon number. Glauber showed that the light of an ideal laser is a coherent state, which links classical waves and quantum photons; squeezed states reduce noise in one quadrature below this level ([Glauber 1963](https://doi.org/10.1103/PhysRev.131.2766)) ([[quantum-mechanics]], [[optics]], [[amo-physics]], [[quantum-information]])."
  - "**Free fields as oscillator collections:** a free scalar field $\\phi(x,t)$ with $\\ddot\\phi - \\nabla^2\\phi + m^2\\phi = 0$ is, mode by mode in momentum space, an oscillator of frequency $\\omega_k = \\sqrt{k^2+m^2}$. The Fock space of a free quantum field is the tensor product of the oscillator ladders, particles are the excitations, and the vacuum energy $\\tfrac12\\sum_k \\hbar\\omega_k$ is the (divergent) sum of zero-point energies, which gives the Casimir force when differences are taken ([[qft]], [[classical-field-theory]], [[lattice-field-theory]], [[renormalization]], [[cosmology]])."
  - "**Mode counting in other fields:** the same decomposition describes lattice vibrations of atoms in optical traps, magnons in magnets, plasmons in plasmas, the vibrational modes of a membrane or of the string worldsheet, and the transverse oscillations of a string in string theory, whose spectrum of states is that of an infinite set of oscillators ([[plasma-physics]], [[string-theory]], [[condensed-matter]], [[amo-physics]])."
  - "**Dissipation and driving:** a damped, driven oscillator has a resonance of width set by the damping, and its steady-state response is the prototype of linear response; coupling an oscillator to a bath of oscillators (Caldeira–Leggett) gives quantum Brownian motion and the fluctuation–dissipation theorem ([[non-equilibrium]], [[fluctuations-response]], [[stochastic-processes]])."
  - "**Where it fails: anharmonicity:** higher terms in the potential make the frequency depend on amplitude, so levels are no longer equally spaced (a Morse potential has a finite number of bound states), crystals expand on heating, phonons scatter off each other and heat conduction is finite. The Fermi–Pasta–Ulam experiment, which found that a nonlinear chain does not thermalise as expected, started the study of nonlinear lattices and led to solitons and the Toda lattice ([[dynamical-systems]], [[chaos]], [[integrability]], [[approximation-perturbation]])."
  - "**Where it fails: parametric resonance and interactions:** if a parameter such as the length of a pendulum or the cavity frequency is modulated at about twice the natural frequency, the amplitude grows exponentially (a swing, Mathieu equation), a mechanism behind particle production in the early universe after inflation and in the dynamical Casimir effect. In field theory, interaction terms like $\\lambda\\phi^4$ couple the oscillators, so particles scatter and decay; the free picture is the starting point of perturbation theory and Feynman diagrams, not the end ([[ode]], [[cosmology]], [[qft]], [[scattering-amplitudes]], [[stability]])."
caveats:
  - "'Any system is a harmonic oscillator near equilibrium' needs a stable minimum with non-zero curvature. At a degenerate minimum ($V''=0$, as at a critical point or along a flat direction) the leading term is quartic or higher and the motion is non-harmonic; zero modes (translations, rotations, Goldstone modes) give free motion rather than oscillation."
  - "The equal spacing of levels is special to the quadratic potential. Real molecules, nuclei and atoms in traps deviate, and 'harmonic' spectra (vibrational bands, Landau levels) are an approximation whose accuracy fades at high excitation. In a crystal the harmonic approximation gives infinite thermal conductivity and no thermal expansion; both come from anharmonic terms."
  - "Photons are excitations of field modes, not small balls: a mode's number state has no definite phase and a coherent state has indefinite photon number. The oscillator picture also does not give a position operator for the photon, and the particle interpretation depends on the choice of modes (it is observer- and background-dependent, e.g. in curved spacetime or accelerated frames)."
  - "The zero-point energy $\\tfrac12\\hbar\\omega$ per mode summed over a field is infinite, and physical results involve differences (Casimir effect) or require renormalisation; its gravitational effect (cosmological constant problem) is unresolved and the naive sum is not a reliable estimate of the vacuum energy density."
  - "A coherent state is a classical state of the field in the sense of expectation values and Poisson statistics, but it is still a quantum state; stating that 'the laser is classical' holds for amplitude averages and low-order correlation functions, not for every measurement."
  - "FPUT recurrence was an unexpected numerical observation (Fermi, Pasta, Ulam, Tsingou 1955 report, no journal DOI) and its resolution through solitons, near-integrability and KAM theory is partial; thermalisation of such chains on long times is still discussed."
  - "Normal modes of a linear damped or non-Hermitian system can be non-orthogonal with transient growth even when all modes decay; the 'sum of independent modes' picture then hides short-time behaviour. This concerns fluid shear flows and open optical systems."
