cards:
  - q: Why does the harmonic oscillator appear almost everywhere in physics?
    a: Any potential near a stable minimum is, to leading order, quadratic, so small oscillations about equilibrium are harmonic.
  - q: What are normal modes?
    a: Independent collective oscillation patterns obtained by diagonalising the coupled linear equations of motion; any small motion is a sum of them.
  - q: What are the energy levels of the quantum harmonic oscillator and what is special about them?
    a: $E_n=\hbar\omega(n+\tfrac12)$, equally spaced, with zero-point energy $\hbar\omega/2$; the ladder operators $a^\dagger$, $a$ move between levels.
  - q: What is a phonon, and what is a photon, in oscillator language?
    a: Each is a quantum of excitation of a normal mode, of lattice vibrations for phonons and of the electromagnetic field modes for photons.
  - q: What is a coherent state?
    a: An eigenstate of the annihilation operator; a non-spreading wavepacket that oscillates like a classical oscillator, with Poisson photon statistics. Laser light is the standard example.
  - q: Why is a free quantum field a collection of harmonic oscillators?
    a: In momentum space each mode obeys an oscillator equation with frequency $\sqrt{k^2+m^2}$; quantising gives a ladder per mode, and particles are the excitations.
  - q: Name two ways the harmonic picture fails.
    a: Anharmonicity (amplitude-dependent frequencies, thermal expansion, phonon scattering, finite heat conductivity) and interactions or parametric driving (exponential growth, particle production, scattering).
  - q: What is parametric resonance?
    detail: true  # site only, not in the Anki deck
    a: Exponential growth of oscillations when a parameter (length, frequency) is modulated at about twice the natural frequency; described by the Mathieu equation.
