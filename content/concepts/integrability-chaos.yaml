cards:
  - q: When is a Hamiltonian system with $n$ degrees of freedom integrable?
    a: When it has $n$ independent conserved quantities in involution (pairwise Poisson-commuting); the motion then lies on invariant tori and can be written with action–angle variables.
  - q: What does the KAM theorem say?
    a: For a small non-integrable perturbation of an integrable system, most invariant tori with sufficiently irrational frequencies survive, slightly deformed, while the resonant ones break up into islands and chaotic layers.
  - q: What is the fingerprint of integrability and chaos in quantum energy levels?
    a: Levels of a classically integrable system are uncorrelated (Poisson spacings); those of a classically chaotic system repel and follow random-matrix (Wigner–Dyson) statistics.
  - q: What is the eigenstate thermalization hypothesis?
    a: In a chaotic many-body system the expectation value of a local observable in a single energy eigenstate is, to a very good approximation, equal to the microcanonical thermal value at that energy.
  - q: How does an integrable system relax differently from a chaotic one?
    a: Its extra conserved charges prevent thermalization to the ordinary Gibbs state; it relaxes to a generalized Gibbs ensemble that keeps the values of all the charges.
  - q: What is the bound on chaos?
    a: In a thermal quantum system the exponential growth rate of the out-of-time-order correlator satisfies $\lambda_L\le 2\pi k_B T/\hbar$, saturated in holographic black-hole models.
  - q: What role does the Lax pair play in the KdV equation?
    a: The evolution is $\dot L=[M,L]$ for linear operators $L,M$, so the spectrum of $L$ is constant in time; this gives infinitely many conserved quantities and the soliton solutions.
    detail: true  # site only, not in the Anki deck
  - q: Why is an isolated chaotic quantum system a thermal bath for its own subsystems?
    a: Its eigenstates are so entangled that a small subsystem is described by a thermal reduced density matrix, with the rest acting as the bath, even though the full state evolves unitarily.
    detail: true  # site only, not in the Anki deck
