cards:
  - q: In which four ways does probability enter physics?
    a: Ignorance of microstates (statistical mechanics), effective randomness from sensitivity to initial conditions (chaos), noise from an unobserved environment (Brownian motion), and fundamental quantum probabilities (Born rule).
  - q: What did Einstein's 1905 Brownian-motion paper predict?
    a: A mean-square displacement growing linearly in time, $\langle x^2\rangle=2Dt$ with $D=k_BT/\gamma$; Perrin's measurements of it gave Avogadro's number and convinced most physicists that atoms exist.
  - q: Why is the thermodynamics of a gas deterministic although its microstates are random?
    a: By the law of large numbers the relative fluctuation of a macroscopic quantity is of order $1/\sqrt N$, about $10^{-11}$ for $N\sim10^{23}$, so averages are sharp; near critical points correlations spoil this.
  - q: What is the ergodic hypothesis?
    a: That the time average along one trajectory equals the phase-space (ensemble) average; true for ergodic systems by Birkhoff's theorem, but hard to establish for realistic many-body systems.
  - q: What does a large-deviation principle say?
    a: The probability of a macroscopic fluctuation decays exponentially with system size, $P(a)\sim e^{-NI(a)}$, with $I$ the rate function (the entropy cost of the fluctuation).
  - q: How can a deterministic system produce randomness?
    a: With a positive Lyapunov exponent small uncertainties grow exponentially, so after a finite time only a probability distribution on the attractor can be predicted.
  - q: What is the Born rule and what is special about it?
    a: The probability of outcome $a$ is $|\langle a|\psi\rangle|^2$. Unlike classical probability it is not removable by local hidden variables (Bell), though interpretations differ on whether it is postulated or derived.
  - q: Why use random matrices in physics?
    a: To model a Hamiltonian too complicated to specify, constrained only by symmetry; the resulting level repulsion matches heavy nuclei and quantum-chaotic systems and is a universality statement.
  - q: Frequentist, Bayesian and propensity probability, in one line each?
    detail: true  # site only, not in the Anki deck
    a: Limiting relative frequency in repeated trials; degree of belief given information; an objective tendency of a single setup. They share the same axioms but differ on what a probability statement is about.
