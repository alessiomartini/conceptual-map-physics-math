id: randomness-probability
title: "Randomness and probability in physics: ignorance, or the way the world is?"
short: Randomness and probability
domain: concept
area: concepts
order: 130
one_liner: Probability enters physics in at least four different ways (ignorance of microstates, effective randomness from chaos, fluctuations of many small causes, and fundamental quantum chance), and the law of large numbers is what lets thermodynamics stay deterministic anyway.
summary: >-
  Classical mechanics is deterministic, yet statistical mechanics, Brownian motion, chaos and quantum mechanics
  are all written in the language of probability. The thread asks where the randomness comes from in each case:
  from our ignorance of $10^{23}$ initial conditions (ensembles, the ergodic hypothesis), from sensitivity to
  initial conditions (chaos), from the sum of many small kicks (Einstein's and Perrin's Brownian motion), or from
  the structure of quantum theory itself (the Born rule). The law of large numbers and the central limit theorem
  explain why fluctuations of macroscopic quantities are tiny, and large-deviation theory quantifies the rare
  exceptions. Random matrices show probability used as a model of a Hamiltonian we cannot specify. What
  "probability" means is itself not settled, and the thread lists the competing meanings under "Definitions in use".
thread:
  - "**Four places where probability enters:** (1) *ignorance*: we cannot know or follow the $\\sim10^{23}$ microscopic variables, so we assign a distribution over microstates ([[statistical-mechanics]], [[thermodynamics]]); (2) *effective randomness*: a deterministic system with sensitive dependence on initial conditions makes any finite-precision description statistical ([[chaos]], [[dynamical-systems]]); (3) *noise*: a degree of freedom coupled to an unobserved environment feels a random force ([[stochastic-processes]], [[sde]], [[non-equilibrium]]); (4) *fundamental*: in quantum mechanics the theory itself predicts only probabilities for individual outcomes ([[quantum-mechanics]], [[quantum-foundations]]). Keeping these apart is the point of the thread: the mathematics ([[probability-theory]]) is the same, the physics is not."
  - "**Ensembles:** Gibbs replaced the single system by a (hypothetical) collection of copies distributed over phase space. The microcanonical, canonical and grand-canonical ensembles are the distributions that are stationary under the dynamics and compatible with the known constraints (energy, temperature, particle reservoir). Averages over the ensemble are then identified with measured values ([[statistical-mechanics]], [[classical-mechanics]], [[entropy-information]])."
  - "**Ergodic hypothesis:** why does an ensemble average equal what one system shows over time? Boltzmann's answer was that a single trajectory visits all accessible microstates with the right frequency, so the time average equals the phase-space average. Birkhoff's ergodic theorem makes this a theorem for systems that are ergodic (no invariant subsets of positive measure other than the trivial ones); whether realistic many-body systems are ergodic, and on what time scales, is a hard open question (KAM tori, glassy systems, many-body localisation) ([[dynamical-systems]], [[real-analysis]], [[non-equilibrium]], [[stability]])."
  - "**Maximum entropy:** Jaynes proposed that the equilibrium distribution is the one that maximises the Shannon entropy subject to the known constraints, so statistical mechanics becomes inference with incomplete information rather than a statement about dynamics ([Jaynes 1957](https://doi.org/10.1103/PhysRev.106.620)). It reproduces the Boltzmann–Gibbs ensembles but does not by itself explain why the real system relaxes to them ([[entropy-information]], [[information-theory]], [[statistics]])."
  - "**Brownian motion:** a grain of pollen jitters because it is hit unevenly by invisible molecules. Einstein (1905) derived that the mean-square displacement grows linearly in time, $\\langle x^2\\rangle = 2Dt$, with $D = k_BT/\\gamma$ tying the diffusion constant to the friction, and proposed it as a way to count molecules ([Einstein 1905](https://doi.org/10.1002/andp.19053220806)). Perrin's measurements (1908-1909) confirmed the law and gave Avogadro's number, which settled the reality of atoms for most physicists. The same relation is the first fluctuation-dissipation theorem ([[fluctuations-response]], [[stochastic-processes]], [[sde]], [[statistical-mechanics]], [[scaling-dimensional-analysis]])."
  - "**Law of large numbers and central limit theorem:** the sum of $N$ independent contributions has relative fluctuation of order $1/\\sqrt N$, and the distribution of the sum tends to a Gaussian. For $N\\sim10^{23}$ the relative fluctuation of energy or pressure is about $10^{-11}$, which is why the thermodynamics of a macroscopic body is, in practice, deterministic although its microscopic description is probabilistic. The theorems also say when this fails: near a critical point correlations are long ranged, the effective $N$ is small and fluctuations become large ([[thermodynamics]], [[phase-transitions]], [[universality]], [[emergence]], [[probability-theory]])."
  - "**Large deviations:** the probability of a macroscopic fluctuation away from the typical value is exponentially small in the system size, $P(a)\\sim e^{-N I(a)}$, with $I$ the rate function. Boltzmann's $S=k_B\\ln W$ is the prototype ($I$ is the entropy difference), and modern fluctuation theorems are large-deviation statements about work and entropy production ([Touchette 2009](https://doi.org/10.1016/j.physrep.2009.05.002); [[fluctuations-response]], [[non-equilibrium]], [[statistical-mechanics]])."
  - "**Chaos as a source of randomness:** with a positive Lyapunov exponent $\\lambda$ an initial uncertainty $\\delta_0$ grows as $\\delta_0e^{\\lambda t}$, so after a time of order $\\lambda^{-1}\\ln(1/\\delta_0)$ the trajectory cannot be predicted from the data and one switches to an invariant probability measure on the attractor. Lorenz's 1963 model made this concrete, and the Kolmogorov–Sinai entropy measures the rate at which the system generates information ([Lorenz 1963](https://doi.org/10.1175/1520-0469%281963%29020%3C0130%3ADNF%3E2.0.CO%3B2); [[chaos]], [[dynamical-systems]], [[entropy-information]], [[stability]])."
  - "**Born rule:** in quantum mechanics a state $|\\psi\\rangle$ gives the probability $|\\langle a|\\psi\\rangle|^2$ for the outcome $a$; Born introduced the probability interpretation in a paper on scattering ([Born 1926](https://doi.org/10.1007/BF01397477)). Unlike all the cases above, this randomness cannot be removed by adding more information about the system alone: Bell's theorem and its experimental tests exclude local hidden variables that would reproduce the statistics. Whether the Born rule is a postulate or follows from something else (many-worlds, decoherence plus a decision-theoretic argument, Bohmian typicality) depends on the interpretation ([[quantum-mechanics]], [[quantum-foundations]], [[locality]], [[linearity-superposition]], [[philosophy-of-physics]], [[quantum-information]])."
  - "**Quantum randomness and statistical mechanics:** a closed quantum system evolves unitarily and has no randomness at all, yet subsystems thermalise. In the eigenstate-thermalisation picture (Deutsch 1991, Srednicki 1994) a single energy eigenstate already looks thermal for local observables, and the 'ensemble' probability reflects entanglement with the rest of the system rather than ignorance in the classical sense ([Deutsch 1991](https://doi.org/10.1103/PhysRevA.43.2046); [[non-equilibrium]], [[quantum-information]], [[statistical-mechanics]], [[entropy-information]])."
  - "**Random matrices:** when a Hamiltonian is too complicated to write down (heavy nuclei, chaotic cavities, disordered conductors), one replaces it by a random matrix constrained only by symmetry. Level repulsion and the Wigner–Dyson spacing statistics follow, and Bohigas, Giannoni and Schmit proposed that they characterise quantum systems with a chaotic classical limit ([Bohigas et al. 1984](https://doi.org/10.1103/PhysRevLett.52.1)). Here probability is a model of our ignorance of the details, justified by universality ([[random-matrix-theory]], [[universality]], [[symmetry-conservation-gauge]], [[chaos]], [[nuclear-physics]])."
  - "**Probability as a tool across physics:** path integrals and Euclidean field theory make quantum field theory look like statistical mechanics, with $e^{-S/\\hbar}$ as a weight; lattice simulations sample it by Monte Carlo; and the renormalisation group can be read as a flow on probability distributions, with the central limit theorem as its simplest fixed point ([[qft]], [[lattice-field-theory]], [[renormalization]], [[eom-action-quantum]], [[variational-principles]])."
definitions:
  - "**What does 'probability' mean? Three main answers, and physics uses all of them.** (a) *Frequentist*: the probability of an event is the limiting relative frequency in an (ideal) infinite sequence of identical trials. *Why it exists:* it is operational and matches how statistical mechanics is checked experimentally (repeat many times). *Problems:* single events (the probability that this ice cube melts in the next hour) have no meaning, the 'infinite sequence' is an idealisation, and the law of large numbers cannot be used to define probability without circularity, since it is itself a probabilistic statement."
  - "(b) *Bayesian / epistemic*: probability is a degree of belief or plausibility given the available information, updated by Bayes' rule; Cox showed that consistent rules of plausible reasoning reproduce the probability calculus ([Cox 1946](https://doi.org/10.1119/1.1990764)), and Jaynes built statistical mechanics on it. *Why:* it handles single events and incomplete information naturally, and fits the 'ignorance' use of probability. *Problems:* priors are not fixed by the rules (the choice of maximum-entropy prior is itself a principle), and it is awkward to say that an atom's decay time is 'only' a state of knowledge."
  - "(c) *Propensity / objective chance*: probability is a physical tendency of a setup to produce outcomes, present even for a single trial (Popper). *Why:* it seems the natural reading of the Born rule and of radioactive decay. *Problems:* it is hard to say what property exactly is being attributed, and the same word 'chance' then covers things as different as a quantum measurement and a roulette wheel, whose randomness is only effective."
  - "**Overlaps and conflicts.** All three obey the same Kolmogorov axioms, so calculations agree; they differ in what a statement like 'the particle is in the left half with probability 1/2' asserts. In classical statistical mechanics the Bayesian reading is natural and the propensity reading is not (the underlying dynamics is deterministic). In quantum theory the Bayesian reading is defended by QBism and related views (the state is an agent's belief), while the propensity or objective-chance reading is closer to the collapse and many-worlds-with-branch-weights views. The frequentist and ergodic readings meet in the ergodic theorem, where time frequencies equal ensemble probabilities. This map does not choose among them: a physics paper normally assumes one without saying so, and it is useful to ask which one."
caveats:
  - "'Ignorance' and 'fundamental' randomness are not as sharply separated as the list suggests. A chaotic system is deterministic, but at finite precision its description is indistinguishable from a random one; and the claim that quantum randomness is fundamental is a statement about local hidden-variable theories, not about all deterministic completions: Bohmian mechanics and superdeterministic theories reproduce the Born statistics and are not ruled out by Bell's theorem."
  - "The ergodic hypothesis is not what justifies statistical mechanics in practice. Ergodicity is hard to prove for realistic systems, the relevant time scales can exceed the age of the universe, and observed equilibrium averages work for non-ergodic systems too; arguments based on typicality, on the central limit theorem for macroscopic observables, or on eigenstate thermalisation are the working alternatives. Which one is 'the' foundation is debated ([[philosophy-of-physics]])."
  - "The $1/\\sqrt N$ suppression of fluctuations assumes independent or weakly correlated contributions with finite variance. Long-range correlations (critical points, gravity), heavy-tailed distributions (Lévy flights, where the sum converges to a stable law instead of a Gaussian) and rare large events (where large deviations rather than the central limit theorem apply) all break it."
  - "Einstein's $\\langle x^2\\rangle = 2Dt$ is a long-time limit. On very short times the motion is ballistic (Langevin), and Brownian paths, though continuous, are nowhere differentiable, so the white-noise idealisation of a force is a mathematical convenience that requires care (Itô vs Stratonovich) ([[sde]], [[stochastic-processes]])."
  - "Random matrix statistics are a necessary signature, not a proof, of chaos: the Bohigas–Giannoni–Schmit conjecture has strong numerical and experimental support but no general proof, and integrable systems and some many-body-localised systems follow Poisson statistics instead ([[random-matrix-theory]], [[chaos]])."
  - "The Born rule is derived in some interpretations and postulated in others; claims that 'it has been derived' (from many-worlds branch counting, from decision theory, from typicality) are contested, because each derivation assumes something that is close to the rule itself. This page lists the options and does not endorse one ([[quantum-foundations]])."
