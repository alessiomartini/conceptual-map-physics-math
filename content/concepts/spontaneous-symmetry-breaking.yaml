cards:
  - q: What is spontaneous symmetry breaking?
    a: The Hamiltonian (or action) is invariant under a symmetry, but the ground state or equilibrium state is not; the system picks one of several equivalent states, and an order parameter becomes non-zero.
  - q: Why does spontaneous symmetry breaking need an infinite system?
    a: In a finite system the ground state is unique and symmetric (tunnelling connects the equivalent states); only in the thermodynamic limit do the sectors decouple, so an arbitrarily small symmetry-breaking field fixes the state.
  - q: What does Goldstone's theorem say?
    a: Each broken generator of a continuous global symmetry gives a gapless excitation (phonon, magnon, pion), at least in relativistic or short-range theories; non-relativistic systems can have fewer modes than broken generators.
  - q: Why are pions light?
    a: Chiral symmetry is spontaneously broken by the quark condensate, so pions are would-be Goldstone bosons; the small quark masses break the symmetry explicitly and make them pseudo-Goldstone bosons with small masses.
  - q: What happens to the Goldstone boson when the broken symmetry is gauged?
    a: It is absorbed as the longitudinal polarisation of the gauge boson, which becomes massive (Higgs mechanism, Meissner effect).
  - q: Where does most of the mass of a proton come from?
    a: From QCD dynamics (the energy of the quarks' and gluons' fields and the chiral-symmetry-breaking condensate), not from the Higgs field, which supplies only the small quark masses.
  - q: Why can't a continuous symmetry be spontaneously broken in one or two dimensions at nonzero temperature?
    a: Long-wavelength Goldstone fluctuations diverge and destroy long-range order (Mermin–Wagner, Hohenberg); only quasi-long-range order is possible, as in the XY model.
    detail: true  # site only, not in the Anki deck
  - q: Why is 'breaking a gauge symmetry' a misnomer?
    a: A gauge transformation is a redundancy and no state can break it (Elitzur); what changes is the physical spectrum, with massive gauge bosons.
  - q: How can spontaneous symmetry breaking leave defects?
    a: If the vacuum manifold has non-trivial topology, regions that cool independently choose different vacua and domain walls, strings or monopoles remain where they meet (Kibble–Zurek counting).
    detail: true  # site only, not in the Anki deck
