id: scaling-dimensional-analysis
title: "Scaling and dimensional analysis: what changes, and what doesn't, when the ruler changes"
short: Scaling and dimensional analysis
domain: concept
area: concepts
order: 120
one_liner: Physical laws cannot depend on the units we choose, and that alone fixes powers, dimensionless numbers and scaling laws; when a system has no preferred scale, the same logic produces self-similarity, fractals and the renormalisation group.
summary: >-
  Doubling the size of an animal, a pipe or a bomb does not double everything else. Because a law cannot care
  whether lengths are measured in metres or inches, only dimensionless combinations of the variables can matter,
  and often that is enough to guess the answer up to a number. The thread runs from the Buckingham Pi theorem and
  Reynolds' similarity, through power laws (Kolmogorov turbulence, allometry), to self-similar and fractal objects
  and to scale invariance in field theory, where the renormalisation group turns "how things change with scale"
  into a theory. Its limits (hidden scales, anomalous exponents, scaling that is only approximate) are collected under "Careful".
thread:
  - "**The idea:** the form of a physical law does not depend on the system of units. A relation among $n$ quantities can therefore be rewritten as a relation among dimensionless combinations of them, and the number of such combinations is smaller than $n$. Each time we know which quantities matter, units alone remove part of the unknown function ([[classical-mechanics]], [[thermodynamics]], [[hydrodynamics]])."
  - "**Buckingham Pi theorem:** if a law relates $n$ variables whose dimensions are built from $k$ independent basic units (length, mass, time, ...), it can be written as a relation among $n-k$ independent dimensionless groups $\\Pi_i$ ([Buckingham 1914](https://doi.org/10.1103/PhysRev.4.345)). The pendulum period $T$ can depend only on $\\sqrt{\\ell/g}$ times a function of the angle, with no need to solve the equation of motion ([[ode]], [[linear-algebra]])."
  - "**Similarity and dimensionless numbers:** two systems of different size obey the same equations in rescaled form if all their dimensionless groups coincide. The Reynolds number $\\text{Re}=UL/\\nu$ (velocity, size, kinematic viscosity) compares inertia to viscous forces; Reynolds found that the transition of pipe flow to turbulence is controlled by this single combination ([Reynolds 1883](https://doi.org/10.1098/rstl.1883.0029)). Mach, Froude, Péclet, Prandtl and the fine-structure constant play the same role in their domains; wind tunnels and ship-model tanks work because of this ([[hydrodynamics]], [[pde]], [[plasma-physics]], [[geophysics-climate]])."
  - "**Estimates from dimensions alone:** when the only relevant quantities are known, a power law follows up to a number. G. I. Taylor estimated the energy of the first atomic explosion from film of the expanding fireball: the radius $R$ can depend only on the energy $E$, the air density $\\rho$ and the time $t$, so $R \\sim (E t^2/\\rho)^{1/5}$ ([Taylor 1950](https://doi.org/10.1098/rspa.1950.0049)). The same reasoning fixes the Planck units from $G$, $\\hbar$ and $c$ and the Bohr radius from $\\hbar$, $m_e$ and $e$ ([[quantum-mechanics]], [[quantum-gravity]], [[astrophysics]])."
  - "**Scaling laws and power laws:** when there is no characteristic scale in a range, observables are power laws, $f(\\lambda x)=\\lambda^{a}f(x)$. Kolmogorov's 1941 theory of fully developed turbulence gives the energy spectrum $E(k)\\sim\\varepsilon^{2/3}k^{-5/3}$ in the inertial range, with $\\varepsilon$ the energy dissipation rate, from dimensional reasoning plus the assumption of a scale-by-scale cascade ([[hydrodynamics]], [[chaos]], [[non-equilibrium]])."
  - "**Allometry:** in biology many quantities scale with body mass $M$ as $M^{a}$; Kleiber found a metabolic rate close to $M^{3/4}$ ([Kleiber 1932](https://doi.org/10.3733/hilg.v06n11p315)), and West, Brown and Enquist derived the exponent from the geometry of space-filling, self-similar branching networks that minimise transport cost ([West et al. 1997](https://doi.org/10.1126/science.276.5309.122)). The 'square-cube law' (area $\\propto L^2$, volume $\\propto L^3$) is the simplest version, and the reason an ant scaled up to elephant size would not work ([[biophysics]], [[networks]], [[complex-systems]])."
  - "**Self-similarity and fractals:** an object is self-similar if it looks the same after a change of scale. Its fractal dimension $D$ appears in how a measured size depends on the ruler, $L(\\epsilon)\\sim\\epsilon^{1-D}$; Mandelbrot used this to show that the length of a coastline has no ruler-independent value ([Mandelbrot 1967](https://doi.org/10.1126/science.156.3775.636)). Fractal sets appear as attractors of chaotic maps, as critical clusters and as the paths of Brownian motion ([[chaos]], [[dynamical-systems]], [[stochastic-processes]], [[real-analysis]], [[topology]])."
  - "**Scale invariance in field theory:** a theory with no dimensionful parameter (massless, conformally coupled) is unchanged by $x\\to\\lambda x$; with the extra assumption of locality and Lorentz invariance this often enlarges to the full conformal group ([[cft]], [[symmetry-conservation-gauge]], [[symmetries]], [[lie-theory]]). Noether's theorem turns the symmetry into a conserved dilatation current, whose divergence is the trace of the stress tensor ([[classical-field-theory]], [[qft]])."
  - "**Scale anomalies and dimensional transmutation:** quantisation can break classical scale invariance. The regularisation of loops introduces a scale, couplings 'run' with energy through $\\beta(g)=\\mu\\,dg/d\\mu$, and a dimensionless coupling trades itself for a dimensionful scale (the QCD scale $\\Lambda$, hence the mass of the proton, [[standard-model]]). The same mechanism appears already in quantum mechanics, for the $1/r^2$ potential, where a regularisation is needed and the classical dilatation symmetry survives only as a discrete remnant ([[quantum-mechanics]], [[gauge-theory]], [[effective-field-theory]])."
  - "**Renormalisation group:** the quantitative theory of 'what changes with scale'. Coarse-graining and rescaling define a flow in the space of couplings; fixed points are scale invariant, and near them observables are power laws with *critical exponents* that need not equal their dimensional-analysis values ([Wilson 1971](https://doi.org/10.1103/PhysRevB.4.3174), [Wilson–Fisher 1972](https://doi.org/10.1103/PhysRevLett.28.240)). The difference between the naive and the actual exponent is called the anomalous dimension ([[renormalization]], [[phase-transitions]], [[statistical-mechanics]])."
  - "**Link to universality:** scale-free behaviour is not only a symmetry but a reason for robustness: at a fixed point the microscopic details are irrelevant and only a few relevant directions survive, so very different systems share the same exponents and scaling functions (data collapse). That is the content of [[universality]], and the reason power laws are a recurring sign of criticality ([[complexity]], [[random-matrix-theory]], [[econophysics]], [[sociophysics]], [[emergence]])."
caveats:
  - "Dimensional analysis is only as good as the list of relevant variables. Leave out a quantity (a hidden length, a viscosity, a surface tension) and the answer is wrong; include one too many and you lose predictive power. Moreover it determines a function only up to a function of the dimensionless groups: with $n-k>1$ groups there remains an unknown function of the others, and even with one group the numerical constant is not fixed."
  - "Exponents obtained by dimensional analysis assume 'complete similarity': the dimensionless constants are finite and nonzero as the extra scales go to zero or infinity. When they are not (self-similarity of the second kind, Barenblatt), the exponents are not fixed by dimensions and come from solving an eigenvalue problem or from the renormalisation group. Critical exponents and the anomalous dimensions of Kolmogorov's intermittency corrections are examples ([[renormalization]], [[hydrodynamics]])."
  - "Kolmogorov's $k^{-5/3}$ spectrum is well supported experimentally, but the exact scaling of higher-order structure functions deviates from the 1941 prediction because of intermittency (the cascade is not self-similar from one scale to the next). The $-5/3$ law should not be read as the whole story of turbulence ([[hydrodynamics]], [[chaos]])."
  - "The $3/4$ allometric exponent is an empirical regularity with a contested explanation. The network model of West, Brown and Enquist is one derivation; others predict different exponents, and data on some groups or ranges of mass fit $2/3$ or another value, so the 'universal quarter-power law' is debated, not settled ([[biophysics]])."
  - "A power law over a finite range is not proof of scale invariance. Many distributions (log-normal, stretched exponentials) look straight on a log-log plot over one or two decades, and real systems have cutoffs from finite size or a UV scale. Fractal dimension, likewise, is a property of an idealised set; a physical coastline is self-similar only over a limited range of scales ([[statistics]], [[complex-systems]])."
  - "Scale invariance and conformal invariance are not the same. For unitary, local, Lorentz-invariant theories scale invariance is proved to imply conformal invariance in two dimensions (Polchinski) and is believed to in four, but there is no general proof, and counterexamples exist outside those assumptions. A scale anomaly, finally, means that the classical dilatation symmetry is not a symmetry of the quantum theory: the trace of the stress tensor is proportional to the beta function ([[cft]], [[qft]])."
