cards:
  - q: What does the Buckingham Pi theorem say?
    a: A law among $n$ variables built from $k$ independent basic units can be rewritten as a relation among $n-k$ dimensionless groups, so units alone remove $k$ degrees of freedom from the unknown function.
  - q: What is the Reynolds number and why does it matter?
    a: $\text{Re}=UL/\nu$, the ratio of inertial to viscous forces; flows of different size and speed are dynamically similar when Re (and the other dimensionless groups) agree, which is why model tests work.
  - q: What did dimensional analysis give for the atomic-bomb fireball?
    a: Radius $R\sim (Et^2/\rho)^{1/5}$ for energy $E$, air density $\rho$ and time $t$, so measuring $R(t)$ gives $E$ without knowing any detail of the explosion.
  - q: What is the Kolmogorov 1941 prediction for turbulence?
    a: In the inertial range the energy spectrum is $E(k)\sim\varepsilon^{2/3}k^{-5/3}$, with $\varepsilon$ the energy dissipation rate; it is fixed by dimensional reasoning once a scale-by-scale cascade is assumed.
  - q: What is Kleiber's law and how was it explained?
    a: Metabolic rate scales roughly as body mass to the power $3/4$; West, Brown and Enquist derived it from space-filling, self-similar branching transport networks, though the explanation is debated.
  - q: What is a fractal dimension, in terms of measurement?
    a: The exponent $D$ in how a measured size depends on the ruler $\epsilon$, $L(\epsilon)\sim\epsilon^{1-D}$; for a coastline it shows that its length depends on the scale of measurement.
  - q: What is a scale anomaly?
    a: A classical scale symmetry broken by quantisation, because regularising loops introduces a scale; couplings then run and a dimensionless coupling is traded for a dimensionful scale (dimensional transmutation).
  - q: How does the renormalisation group relate to dimensional analysis?
    a: It makes scaling quantitative. Near a fixed point observables are power laws whose exponents differ from the naive dimensional ones by anomalous dimensions, and the fixed point explains why different systems share them.
  - q: Why is a straight line on a log-log plot not proof of scale invariance?
    detail: true  # site only, not in the Anki deck
    a: Other distributions (log-normal, stretched exponentials) mimic power laws over a decade or two, and real systems have cutoffs; one needs a wide range, a fit with alternatives and ideally data collapse.
