id: dimensionality
title: "Dimensionality: why the number of dimensions matters"
short: Dimensionality
domain: concept
area: concepts
order: 290
one_liner: Many results change qualitatively with the number of dimensions d — whether order exists, which theories are renormalizable, whether waves have tails, whether particles are fermions, bosons or anyons; the thread follows critical dimensions from Ising and Anderson localization to Kaluza–Klein and strings.
summary: >-
  Physics is usually written for d = 3 space dimensions, but the questions 'what if d were different?' and 'what
  happens in effectively one or two dimensions?' have sharp answers. Dimension fixes the form of Green's functions
  and force laws, decides whether fluctuations destroy order (lower critical dimension) or are irrelevant (upper
  critical dimension), which couplings are dimensionless and so which field theories are renormalizable, and
  which statistics and topology are possible. Real materials realise reduced dimensions, and unification
  proposals add extra ones. The word 'dimension' itself has several meanings, see "Definitions".
thread:
  - "**Geometry and force laws:** the flux of a conserved field through a sphere in $d$ spatial dimensions scales as $r^{d-1}$, so a point source gives a field falling as $1/r^{d-1}$ and a potential $1/r^{d-2}$ (Gauss's law); the inverse-square law is a statement about $d=3$ ([[electromagnetism]], [[classical-field-theory]], [[pde]]). Ehrenfest argued from the stability of orbits and atoms that $d=3$ is special; such arguments assume the form of the law is kept as $d$ varies and are suggestive, not proofs (see caveats)."
  - "**Wave propagation:** sharp signals without a tail (Huygens' principle) hold for the wave equation in odd spatial dimension $d\\ge3$; in $d=2$ (surface waves) and in even $d$ a disturbance leaves a wake. Diffusion, in contrast, has the same form in every $d$ but its Green's function is $(4\\pi Dt)^{-d/2}\\exp(-r^2/4Dt)$ ([[pde]], [[special-relativity]])."
  - "**Order and the lower critical dimension:** the Ising model has no order at $T>0$ in $d=1$ and has order in $d=2$ (the domain-wall argument of [Peierls 1936](https://doi.org/10.1017/S0305004100019174) and Onsager's exact solution, [Onsager 1944](https://doi.org/10.1103/PhysRev.65.117)); for continuous symmetries the lower critical dimension is $2$: Goldstone fluctuations destroy order in $d\\le2$ ([Mermin–Wagner 1966](https://doi.org/10.1103/PhysRevLett.17.1133); [Hohenberg 1967](https://doi.org/10.1103/PhysRev.158.383)) ([[phase-transitions]], [[statistical-mechanics]], [[spontaneous-symmetry-breaking]])."
  - "**What survives in two dimensions:** the $XY$ model has no true long-range order but a phase with power-law correlations and a transition driven by vortex unbinding ([Kosterlitz–Thouless 1973](https://doi.org/10.1088/0022-3719/6/7/010)), a topological transition with no local order parameter ([[topology-invariants]], [[topological-phases]])."
  - "**Upper critical dimension and the epsilon expansion:** above $d_c=4$ the Ising universality class is described by mean-field theory because the quartic coupling has negative dimension; below it fluctuations matter. Treating $\\epsilon=4-d$ as small gives controlled exponents ([Wilson–Fisher 1972](https://doi.org/10.1103/PhysRevLett.28.240)) ([[renormalization]], [[universality]], [[scaling-dimensional-analysis]], [[approximation-perturbation]])."
  - "**Dimension and renormalizability:** the engineering dimension of couplings depends on $d$: $\\phi^4$ is marginal in $d=4$, $\\phi^6$ in $d=3$, the Yang–Mills coupling is dimensionless in $d=4$ (so asymptotic freedom and dimensional transmutation), while Newton's constant has dimension length$^{d-2}$ and gravity is perturbatively non-renormalizable in $d=4$ ([[qft]], [[effective-field-theory]], [[gauge-theory]], [[effective-theories-naturalness]])."
  - "**Localization:** in the scaling theory of non-interacting electrons in a random potential all states are localized in $d=1$ and $d=2$, and a mobility edge exists only in $d\\ge3$ ([Anderson 1958](https://doi.org/10.1103/PhysRev.109.1492); [Abrahams et al. 1979](https://doi.org/10.1103/PhysRevLett.42.673)) ([[condensed-matter]], [[random-matrix-theory]])."
  - "**One dimension:** a fermion cannot go around another, so interactions are strong and the quasi-particle picture of Fermi liquids fails; the low-energy theory is the Luttinger liquid with spin-charge separation, solvable by bosonization ([Tomonaga 1950](https://doi.org/10.1143/ptp/5.4.544); [Luttinger 1963](https://doi.org/10.1063/1.1704046)). Many exactly solvable models live in $d=1+1$ ([[integrability]], [[quantum-mechanics]])."
  - "**Two dimensions:** exchange of identical particles can give anyons (see the topology thread), the fractional quantum Hall effect ([Tsui et al. 1982](https://doi.org/10.1103/PhysRevLett.48.1559)) and single-layer materials such as graphene with Dirac-like quasi-particles ([Novoselov et al. 2004](https://doi.org/10.1126/science.1102896)); conformal symmetry becomes infinite-dimensional (Virasoro), which makes two-dimensional CFTs and critical models exactly solvable ([[exp-quantum-hall]], [[cft]], [[tqft]])."
  - "**Growth and non-equilibrium in low dimension:** the Kardar–Parisi–Zhang equation for a growing interface in $1+1$ dimensions has universal exponents ($1/3$ and $1/2$ for height fluctuations and roughness) that appear in many systems ([Kardar–Parisi–Zhang 1986](https://doi.org/10.1103/PhysRevLett.56.889)) ([[non-equilibrium]], [[stochastic-processes]])."
  - "**Mathematics depends on $d$:** the cross product exists only in $d=3$ and $7$; the rotation group $SO(4)$ splits as $SU(2)\\times SU(2)$ up to a quotient, so two-forms can be self-dual only in $4$ dimensions (instantons); knots exist only in $3$ dimensions; $\\mathbb R^n$ has a unique smooth structure except for $n=4$, where there are uncountably many; spinor representations depend on $d$ modulo $8$ ([[differential-geometry]], [[topology]], [[group-theory]], [[lie-theory]])."
  - "**Gravity in other dimensions:** in $2+1$ dimensions general relativity has no local gravitational degrees of freedom and no Newtonian limit; in $d>4$ black holes can be rings and strings; and the number of dimensions drives string theory, which needs $26$ (bosonic) or $10$ (super) for consistency ([[general-relativity]], [[black-holes]], [[string-theory]])."
  - "**Extra dimensions:** Kaluza and Klein showed that gauge fields can be geometry in a compact fifth dimension ([Klein 1926](https://doi.org/10.1007/BF01397481)); in modern proposals compact dimensions solve the hierarchy problem by lowering the fundamental gravity scale ([Arkani-Hamed–Dimopoulos–Dvali 1998](https://arxiv.org/abs/hep-ph/9803315)); in holography, a $d$-dimensional theory is encoded in $d+1$ dimensions ([[unification]], [[beyond-standard-model]], [[holography]])."
definitions:
  - "**What is the 'dimension' of a space or a system? The meanings agree for smooth manifolds and differ for rough, discrete or emergent objects.** (a) *Topological / manifold dimension*: the number of coordinates needed locally; integer-valued and invariant under homeomorphism. *Why:* it fixes the topology, Gauss's law and the allowed field types. *Problems:* it says nothing about fractal or disordered structure."
  - "(b) *Fractal (Hausdorff or box-counting) dimension*: the exponent with which the number of covering balls grows as their size shrinks; can be non-integer. *Why:* it describes self-similar sets such as percolation clusters and strange attractors. *Problems:* different definitions can give different values, and physical systems are fractal only over a finite range of scales."
  - "(c) *Spectral dimension*: from the return probability of a random walk, $P(t)\\sim t^{-d_s/2}$, or from the density of states of the Laplacian. *Why:* it controls diffusion and critical behaviour on graphs and networks; it enters quantum-gravity proposals where $d_s$ flows with scale. *Problems:* it can differ from the Hausdorff dimension, and what the numbers mean for spacetime is speculative."
  - "(d) *Scaling or engineering dimension*: the power of mass (or length) of a quantity, as in $[\\phi]=(d-2)/2$. *Why:* it classifies couplings as relevant, marginal or irrelevant. *Problems:* it is the classical value and gets anomalous corrections in the quantum theory."
  - "(e) *Effective dimension*: a system behaves as $d$-dimensional below some length and as another dimension above it (a quasi-one-dimensional wire, a compactified extra dimension, a thin film). *Why:* it connects the idealised results to real samples. *Problems:* the crossover scale matters and results quoted for exactly $d=1,2$ hold only below it."
  - "**Overlaps and conflicts.** (a)–(d) coincide for ordinary smooth spaces. They separate on fractals and random geometries, where critical exponents depend on spectral and fractal dimensions, not on the embedding one. The thread says which one is meant when it matters."
caveats:
  - "Ehrenfest-type arguments that stable atoms or orbits need $d=3$ assume the force law keeps its Gauss-law form; they are heuristic. Anthropic arguments about why we live in three dimensions are likewise not derivations."
  - "'No order in $d\\le2$' is a statement for continuous symmetries and finite temperature with short-range interactions: $T=0$ order, long-range interactions, discrete symmetries (Ising in $d=2$) and the Kosterlitz–Thouless quasi-long-range order are all outside it. Real two-dimensional layers are also coupled to a third dimension."
  - "The epsilon expansion is an asymptotic series in $\\epsilon=4-d$; setting $\\epsilon=1$ works well for exponents but is resummed, and results in $d=2$ ($\\epsilon=2$) are only checked against exact solutions."
  - "Dimensional regularisation, where $d$ is analytically continued to non-integer values, is a technique and not a claim that fractional-dimensional spacetime exists."
  - "String-theory critical dimensions ($26$, $10$) come from anomaly cancellation in the worldsheet theory; non-critical strings and other formulations exist, so 'strings require ten dimensions' has qualifications. Compact dimensions also have to be stabilised, which is unresolved in realistic models."
