cards:
  - q: Why does Gauss's law give the inverse-square law only in three dimensions?
    a: The flux of a conserved field through a sphere in $d$ spatial dimensions scales as $r^{d-1}$, so the field of a point source falls as $1/r^{d-1}$; this is $1/r^2$ for $d=3$.
  - q: What does the Mermin–Wagner theorem say?
    a: A continuous symmetry cannot be spontaneously broken at nonzero temperature in $d\le2$ for short-range interactions, because Goldstone fluctuations destroy long-range order.
  - q: What are the lower and upper critical dimensions of the Ising model?
    a: The lower critical dimension is $1$ (no order at $T>0$ in $d=1$, order in $d=2$) and the upper critical dimension is $4$, above which mean-field exponents hold.
  - q: What is the idea of the epsilon expansion?
    a: Near $d=4$ the quartic coupling is weakly relevant, so critical exponents can be expanded in $\epsilon=4-d$ and evaluated at $\epsilon=1$ to estimate three-dimensional exponents (Wilson–Fisher).
  - q: What does the scaling theory of localization predict about dimension?
    a: For non-interacting electrons in a random potential, all states are localized in $d=1$ and $d=2$; a metal–insulator transition (mobility edge) exists only in $d\ge3$.
  - q: Why do one-dimensional interacting fermions not form a Fermi liquid?
    a: Particles cannot pass each other, so excitations are collective; the low-energy theory is the Luttinger liquid, with separate spin and charge modes.
  - q: Why is a $\phi^4$ coupling special in four dimensions?
    a: The field has dimension $(d-2)/2=1$, so $\phi^4$ has dimension $4=d$; the coupling is dimensionless (marginal) and the theory is renormalizable.
    detail: true  # site only, not in the Anki deck
  - q: Name some different notions of dimension used in physics.
    a: Topological dimension, fractal (Hausdorff or box-counting) dimension, spectral dimension, scaling (engineering) dimension, and effective dimension below a crossover scale.
