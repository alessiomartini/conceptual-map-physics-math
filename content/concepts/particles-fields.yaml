cards:
  - q: How does quantum field theory turn a field into particles?
    a: Each mode of the field is a harmonic oscillator whose $n$-th level is read as $n$ quanta of energy $\hbar\omega$; creation and annihilation operators change the number of quanta.
  - q: How did Wigner define an elementary particle?
    a: As an irreducible unitary representation of the Poincaré group, labelled by mass and spin (helicity if massless).
  - q: What does photon antibunching show that thermal bunching does not?
    a: Antibunching cannot be reproduced by a classical field and shows the light consists of quanta; bunching of thermal light can be explained by classical intensity fluctuations with a quantized detector.
  - q: What is the Unruh effect?
    a: A uniformly accelerated detector in the Minkowski vacuum responds as if immersed in a thermal bath of temperature $T=\hbar a/(2\pi ck_B)$; the vacuum and the particle content depend on the choice of mode decomposition.
  - q: Why is particle number not an invariant notion?
    a: The split of field modes into positive and negative frequency, which defines the vacuum, differs between inertial and accelerated observers and in curved spacetime, so the number of quanta can differ.
  - q: How is an unstable particle described in quantum field theory?
    a: As a pole of the propagator or S-matrix at complex energy; the real part is the mass and the imaginary part gives the width (inverse lifetime).
  - q: Give examples of quasiparticles.
    a: Phonons, magnons, holes, Landau quasiparticles in a Fermi liquid, Cooper pairs and anyons in the fractional quantum Hall state; they are collective excitations with their own dispersion.
  - q: Why is there no single definition of a particle?
    a: Representation-theoretic, Fock-space, detector, pole and quasiparticle definitions agree for free fields in flat spacetime and differ for interactions, curved or accelerated backgrounds, confinement and many-body systems.
