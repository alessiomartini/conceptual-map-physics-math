id: generalized-symmetries
title: "Generalized symmetries: symmetry as topological operators"
short: Generalized symmetries
domain: concept
area: concepts
order: 400
one_liner: Since 2014 a symmetry is defined by the topological operators of a theory, not only by a group acting on states; this admits symmetries acting on lines and surfaces (higher-form), mixing of symmetries (higher groups) and operators with no inverse (non-invertible), and gives new constraints on confinement, on infrared phases and on topological order.
summary: >-
  The textbook picture is a group acting on the Hilbert space, with a conserved charge for each continuous
  generator ([[symmetry-conservation-gauge]]). The generalized-symmetry programme starts from the observation that
  a charge is an operator supported on a codimension-one surface that can be moved freely, i.e. a topological
  operator, and keeps only that property. Then there can be topological operators on surfaces of any
  codimension (higher-form symmetries, charged objects are lines and surfaces such as Wilson loops), they need not
  be invertible (Kramers–Wannier duality in the Ising model is a symmetry in this sense), and they obey fusion
  rules of a higher category instead of a group law. Anomalies of these symmetries ([[anomalies]]) constrain what
  the low-energy phase can be: gapless, symmetry-breaking, or topologically ordered. This thread is meant as a
  guide to the idea, its main examples and its limits; the symmetry-breaking side is in
  [[spontaneous-symmetry-breaking]], the mathematics in [[category-theory]] and [[tqft]].
thread:
  - "**Starting point, symmetry as a topological operator:** in a $d$-dimensional theory a conserved current gives a charge $Q=\\oint_{\\Sigma_{d-1}} \\star J$ on a codimension-one surface. Conservation, $d\\star J = 0$, says exactly that $\\Sigma$ can be deformed freely as long as it does not cross a charged local operator; crossing one gives the Ward identity. Gaiotto, Kapustin, Seiberg and Willett took this property as the definition: a $p$-form symmetry is a set of topological operators on codimension-$(p+1)$ surfaces, and the objects they act on are $p$-dimensional extended operators ([[symmetries]]). ([Gaiotto et al. 2014](https://arxiv.org/abs/1412.5148))"
  - "**Higher-form symmetries:** a $1$-form symmetry has a conserved two-form current, $\\partial_\\mu J^{\\mu\\nu}=0$; its topological operators live on surfaces in four dimensions (on lines in three, on points in two) and its charged objects are line operators. Pure Maxwell theory has an electric and a magnetic $U(1)$ $1$-form symmetry, charged objects being Wilson and 't Hooft lines; the massless photon is the Goldstone boson of the spontaneously broken electric one. Pure $SU(N)$ Yang–Mills theory has a $\\mathbb{Z}_N$ centre $1$-form symmetry acting on Wilson lines in the fundamental representation ([[gauge-theory]], [[electromagnetism]])."
  - "**Confinement as unbroken $1$-form symmetry:** in pure Yang–Mills theory the area law for the Wilson loop (confinement) is equivalent to an unbroken centre symmetry, and the perimeter law to a broken one; at finite temperature the Polyakov loop is the order parameter for the centre symmetry of the thermal circle, and the deconfinement transition is its spontaneous breaking. These centre-symmetry ideas are older than the general framework ([’t Hooft 1978](https://doi.org/10.1016/0550-3213%2878%2990153-0), [Polyakov 1978](https://doi.org/10.1016/0370-2693%2878%2990737-2)); GKSW gave them a uniform language ([[phase-transitions]], [[lattice-field-theory]])."
  - "**Anomalies of higher-form symmetries:** a $1$-form symmetry can have an 't Hooft anomaly, detected by coupling to a background two-form gauge field $B$. In $SU(N)$ Yang–Mills the shift $\\theta\\to\\theta+2\\pi$ is a symmetry of the physics only if $B=0$; with $B$ switched on the partition function changes by a phase (fractional instanton number), a mixed anomaly between $\\theta$-periodicity and the centre symmetry. Anomaly matching then forces the infrared to be non-trivial at $\\theta=\\pi$: either two degenerate vacua or a gapless theory. ([Gaiotto et al. 2017](https://arxiv.org/abs/1703.00501))"
  - "**'t Hooft anomaly matching in this language:** an anomaly is a property of the symmetry operators that cannot change along the renormalization-group flow, so the infrared theory must reproduce it ([’t Hooft 1980](https://doi.org/10.1007/978-1-4684-7571-5_9)). The infrared options are only three: gapless degrees of freedom, spontaneous breaking, or a gapped topologically ordered state (a TQFT) with the right anomaly. This is why anomalies are among the few exact non-perturbative handles on strongly coupled theories ([[anomalies]], [[renormalization]], [[tqft]])."
  - "**Topological order as higher-form symmetry breaking:** in the $\\mathbb{Z}_N$ gauge theory in $2+1$ dimensions the anyons are line operators charged under a $\\mathbb{Z}_N$ $1$-form symmetry, and the gapped phase can be read as a spontaneously broken $1$-form symmetry whose topological lines are the Wilson and 't Hooft lines. Many features of gauge theories and topological order (ground-state degeneracy on a torus, deconfined excitations) become statements about symmetry breaking of higher-form symmetries ([[topological-phases]], [[exp-quantum-hall]], [[topology-invariants]]). ([McGreevy 2022](https://arxiv.org/abs/2204.03045))"
  - "**Higher groups:** $0$-form and $1$-form symmetries can be entangled: the background fields obey modified relations such as $\\delta B_2 = A_1\\cup A_1$ (or, with $U(1)$, $\\delta B_2\\propto F_A$), so that the symmetry structure is a $2$-group, not a product. These appear in gauge theories with matter in appropriate representations, in the Standard Model and in string compactifications, and they enter the anomaly constraints ([[standard-model]], [[string-theory]]). ([Cordova et al. 2018](https://arxiv.org/abs/1802.04790), [Benini et al. 2018](https://arxiv.org/abs/1803.09336))"
  - "**Non-invertible symmetries in $1+1$ dimensions, the Ising model:** the critical Ising model has a $\\mathbb{Z}_2$ spin flip $\\eta$ and also a topological line $N$ with $N\\times N = 1+\\eta$ and quantum dimension $\\sqrt 2$. $N$ is the Kramers–Wannier duality defect: crossing it exchanges the order and disorder operators $\\sigma\\leftrightarrow\\mu$. It has no inverse, because it kills states that are not invariant under $\\eta$. The duality of the high- and low-temperature phases ([Kramers–Wannier 1941](https://doi.org/10.1103/PhysRev.60.252)) is thus a symmetry at the critical point, as the fusion algebra of topological lines in rational CFTs, computed by Verlinde's formula, makes explicit ([Verlinde 1988](https://doi.org/10.1016/0550-3213%2888%2990603-7), [Fröhlich et al. 2004](https://doi.org/10.1103/PhysRevLett.93.070601), [[cft]], [[duality]])."
  - "**Fusion categories and constraints on flows:** the topological lines of a $2$d theory form a fusion category, and gauging a (sub)symmetry produces a dual theory with a dual category ([[category-theory]]). Chang, Lin, Shao, Wang and Yin showed that topological defect lines constrain renormalization-group flows: a non-invertible line with certain anomaly-like data forbids a trivially gapped infrared theory, so the flow must end in a gapless or degenerate phase ([[renormalization]]). ([Bhardwaj–Tachikawa 2017](https://arxiv.org/abs/1704.02330), [Chang et al. 2018](https://arxiv.org/abs/1802.04445))"
  - "**Self-duality plus gauging gives non-invertible:** a theory $T$ with a $\\mathbb{Z}_N$ symmetry whose gauging gives back $T$ has a topological defect that implements 'gauge, then identify'. This is the general mechanism of Kramers–Wannier-type defects. It also explains the connection with duality: a duality of a family of theories is a symmetry at its self-dual points. Coupling a theory to a topological field theory is the elementary operation behind both ([[duality]]). ([Kapustin–Seiberg 2014](https://arxiv.org/abs/1401.0740))"
  - "**Non-invertible symmetries in $3+1$ dimensions, the axion and QED:** in massless QED the axial $U(1)$ is not a symmetry, since the ABJ anomaly gives $d\\star j_A\\propto F\\wedge F$ and the current is not conserved. Choi–Lam–Shao and Córdova–Ohmori showed that a topological operator survives for rational angles: one dresses the axial rotation with a fractional quantum Hall state (a TQFT) on its support to cancel the $F\\wedge F$ variation. This operator is non-invertible and gives selection rules in the infrared. The construction applies to the Standard Model and to axion-like couplings, revisiting the meaning of $\\pi^0\\to\\gamma\\gamma$ ([[anomalies]], [[standard-model]]). ([Choi et al. 2022](https://arxiv.org/abs/2205.05086), [Córdova–Ohmori 2022](https://arxiv.org/abs/2205.06243))"
  - "**Duality defects in $3+1$ dimensions:** Kramers–Wannier-like non-invertible defects exist at special values of the coupling in $\\mathcal{N}=4$ super Yang–Mills and in other gauge theories with a duality that combines with gauging a $1$-form symmetry; here the topological defects are $3$-dimensional and obey a higher fusion category ([[supersymmetry]], [[holography]]). ([Kaidi et al. 2021](https://arxiv.org/abs/2111.01141))"
  - "**Lattice realizations:** on the lattice the topological defects are operators commuting with the Hamiltonian away from their support. In the transverse-field Ising chain the Kramers–Wannier duality is a non-on-site operator that maps $\\mathbb{Z}_2$-even operators to their dual and whose square is a lattice translation (times the spin flip), so it does not act as a unitary, on-site group action; this is the lattice version of the $N\\times N=1+\\eta$ rule. Topological defects in lattice models can be built from fusion categories, in a way that carries the CFT data ([[discrete-continuum]], [[lattice-field-theory]], [[condensed-matter]]). ([Aasen et al. 2020](https://arxiv.org/abs/2008.08598))"
  - "**Quantum gravity and global symmetries:** the conjecture that quantum gravity has no exact global symmetries (black holes can swallow charge, string theory and AdS/CFT examples gauge everything) extends to generalized symmetries, with the same open questions about higher-form and non-invertible symmetries ([[quantum-gravity]], [[black-holes]], [[holography]]). ([Banks–Seiberg 2010](https://arxiv.org/abs/1011.5120), [Harlow–Ooguri 2018](https://arxiv.org/abs/1810.05338))"
  - "**SymTFT, the current organizing idea:** the symmetry of a $d$-dimensional theory, with all its anomalies, can be encoded in a topological field theory in $d+1$ dimensions (the symmetry TFT); the physical theory is a boundary condition, and different dual or gauged versions of the theory correspond to different topological boundary conditions of the same bulk. Pedagogical entry points are the lecture notes below ([[tqft]], [[category-theory]], [[anomalies]]). ([Schafer-Nameki 2023](https://arxiv.org/abs/2305.18296), [Shao 2023](https://arxiv.org/abs/2308.00747))"
definitions:
  - "**What is a symmetry? Four definitions in use.** (a) *Group action on Hilbert space:* a group $G$ acts by unitary or antiunitary operators $U(g)$ that commute with $H$ (Wigner). *Why:* it gives representations, degeneracies, selection rules and superselection sectors. *Problems:* it needs a global group acting on states; it does not accommodate gauge redundancy, anomalies appear as projective or obstructed actions, and a non-invertible operator is not a unitary of this kind."
  - "(b) *Noether symmetry:* a continuous transformation leaving the action invariant, with a conserved current. *Why:* it ties symmetry to conservation laws and to the generator of the transformation. *Problems:* it needs a Lagrangian and a continuous parameter; discrete symmetries have no current, a symmetry may be anomalous (the current is not conserved), and symmetries that are not visible in a given Lagrangian description (emergent or dual symmetries) are missed."
  - "(c) *Topological defect:* a symmetry is a topological operator, supported on a submanifold of any codimension, that can be deformed without changing correlation functions unless it crosses charged operators. *Why:* it contains (a) and (b) as the invertible codimension-one case, it covers higher-form symmetries, and it does not need a Lagrangian. *Problems:* not every topological operator is clearly a 'symmetry' (for example operators that annihilate states, or that exist only in a given phase), and it is not obvious that the defects in one description are the same as in another."
  - "(d) *Categorical symmetry:* the symmetry is the whole higher fusion category of topological defects, with its fusion rules and associators; anomalies are the obstruction to a trivial fibre functor, and a symmetric theory is a module or boundary of the SymTFT. *Why:* it makes gauging, duality and anomalies precise and treats non-invertible symmetries on the same footing. *Problems:* the classification of higher categories in $d>2$ is incomplete, and it is not settled which defects count (local versus global, genuine versus non-genuine, ones that require extra dimensions)."
  - "**Overlaps and conflicts.** For a finite or compact invertible $0$-form group all four agree. They separate for non-invertible operators: in QED the axial current is not conserved, so (b) says no symmetry, while (c) and (d) say there is a non-invertible symmetry, and (a) says its operator is not a unitary group action. Whether invertibility should be required in the word 'symmetry' is partly a matter of convention; what is not conventional is that the topological operators give selection rules and Ward identities."
caveats:
  - "Much of this is not new in its examples: Kramers–Wannier duality (1941), centre symmetry and the Polyakov loop (1978), the fusion rules of rational CFTs (1988) and topological order were known. What is new since 2014 is the unified definition, the systematic generalization to higher dimensions and the use of anomalies of these symmetries as constraints."
  - "The centre-symmetry criterion for confinement holds in pure gauge theory. With dynamical matter in the fundamental representation (real QCD) the $\\mathbb{Z}_N$ $1$-form symmetry is explicitly broken, strings can break, and the Wilson loop obeys a perimeter law in both phases; there is no sharp symmetry criterion that separates 'confined' from 'Higgs' regimes, and this is related to their continuity (Fradkin–Shenker)."
  - "A non-invertible symmetry is not a group: charges obey a fusion algebra, not an additive conservation law, the operators are not unitary and can annihilate states. Statements such as 'conserved quantum number' have to be reformulated, and it is still debated how much of the usual machinery (superselection, Goldstone-like theorems, constraints on scattering amplitudes) carries over."
  - "Anomaly-matching arguments assume that the symmetry is exact and that its anomaly is the same in the infrared; an emergent infrared symmetry cannot be used to constrain the ultraviolet, and the three possible infrared realizations (gapless, broken, TQFT) are not excluded by anomalies alone, they only restrict the options."
  - "Describing topological order as spontaneous breaking of higher-form symmetry is a useful dictionary, not an identification: the symmetry operators of lattice topological orders are often emergent, and not every topological order is of gauge-theory type (chiral and fracton phases need more structure, [[topological-phases]])."
  - "The claim that quantum gravity has no global symmetries, and its extension to generalized symmetries, is a conjecture supported by black-hole arguments and string-theory examples, not a theorem. Non-invertible symmetries seem to be allowed in gravity in some examples and the exact statement is under discussion."
  - "Lattice realizations of non-invertible symmetries are non-on-site, so they have a subtle relation to locality and to the Hilbert-space tensor product; the lattice duality operator mixes with translations and its continuum limit needs care."
  - "Classification is incomplete: fusion $2$-categories relevant to $3+1$ dimensions, and the physical meaning of all possible topological defects, are active research. Applications to phenomenology (axion couplings, flavour, naturalness) are being developed and should be read as proposals."
