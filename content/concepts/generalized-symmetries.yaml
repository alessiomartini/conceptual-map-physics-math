cards:
  - q: What is the defining property of a symmetry in the generalized-symmetry viewpoint?
    a: A symmetry is a set of topological operators, supported on submanifolds of any codimension, that can be deformed freely unless they cross charged operators. The usual charge is the codimension-one case.
  - q: What is a $1$-form symmetry and what does it act on?
    a: A symmetry with a conserved two-form current and topological operators of codimension two; it acts on line operators, for example Wilson lines.
  - q: What does centre symmetry say about confinement in pure Yang–Mills theory?
    a: The $\mathbb{Z}_N$ centre $1$-form symmetry is unbroken in the confined phase (Wilson loop with area law) and broken in the deconfined phase; dynamical fundamental matter breaks it explicitly.
  - q: What is a non-invertible symmetry? Give the simplest example.
    a: A topological defect with no inverse, obeying fusion rules instead of a group law. In the Ising model the Kramers–Wannier duality line $N$ obeys $N\times N=1+\eta$, with $\eta$ the spin flip.
  - q: Why can the axial symmetry of QED survive as a symmetry although the ABJ anomaly breaks it?
    a: For rational rotation angles the axial rotation can be dressed with a fractional quantum Hall state on its support to cancel the anomalous variation; the resulting topological operator is non-invertible.
  - q: What constraint does an 't Hooft anomaly place on the infrared of a theory?
    a: The infrared must reproduce the anomaly, so it is gapless, spontaneously breaks the symmetry, or is gapped with topological order; a trivially gapped symmetric phase is excluded.
  - q: What is a higher group (2-group) symmetry?
    a: A symmetry structure in which the $0$-form and $1$-form symmetries are not independent; the background gauge fields obey modified relations such as $\delta B_2 = A\cup A$.
    detail: true
  - q: What is the SymTFT?
    a: A topological field theory in $d+1$ dimensions that encodes the symmetry and anomaly of a $d$-dimensional theory; the physical theory is a boundary condition of it.
    detail: true
