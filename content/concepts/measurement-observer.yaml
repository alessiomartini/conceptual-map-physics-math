id: measurement-observer
title: "Measurement and the observer: what it costs, what it disturbs, what it means"
short: Measurement and the observer
domain: concept
area: concepts
order: 200
one_liner: Measuring is a physical process with errors, costs and back-action; the thread follows it from error theory and Maxwell's demon to the quantum measurement problem, weak measurements, relativity of simultaneity and the ultimate limits of metrology.
summary: >-
  Every number in physics comes out of an apparatus. Classical error theory treats the apparatus as a passive
  source of noise, thermodynamics shows that acquiring and erasing information has a cost, quantum mechanics makes
  the disturbance unavoidable and raises the question of what a measurement is, relativity forbids a single
  observer-independent 'now', and statistics tells how much any estimator can extract from the data. The thread
  follows these layers and their links. Entropy and Landauer's principle are told in the entropy-information
  thread and the irreversibility of decoherence in the arrow-of-time thread; here the focus is on the act of
  measuring. The word 'measurement' has no single meaning in quantum theory, see "Definitions".
thread:
  - "**Classical measurement and error:** a measured value is an estimate with a statistical error (random, reduced by averaging as $1/\\sqrt N$) and a systematic error (a bias, not reduced by averaging). Gauss's least squares and the propagation of errors are the working tools; classically the apparatus can in principle be made to disturb the system as little as desired ([[statistics]], [[probability-theory]], [[numerical-analysis]], [[randomness-probability]])."
  - "**Estimation limits:** the Cramér–Rao bound says the variance of any unbiased estimator of a parameter $\\theta$ is at least $1/F(\\theta)$, where $F$ is the Fisher information of the data; it is the statistical counterpart of 'you cannot learn more than the data contain' ([[statistics]], [[information-theory]], [[probability-theory]])."
  - "**Maxwell's demon and the cost of information:** a demon that measures molecules and sorts them seems to beat the second law. Szilard's one-molecule engine ([Szilard 1929](https://doi.org/10.1007/BF01341281)) assigned an entropy $k_B\\ln 2$ to one bit of information, and Landauer's principle ([Landauer 1961](https://doi.org/10.1147/rd.53.0183)) located the unavoidable cost in erasing the memory, not in the measurement; the bound has been checked on a single colloidal particle in a double-well trap ([Bérut et al. 2012](https://doi.org/10.1038/nature10872)) ([[thermodynamics]], [[entropy-information]], [[arrow-of-time]], [[fluctuations-response]])."
  - "**Quantum measurement and back-action:** measuring $A$ changes the state; the uncertainty relation limits the joint sharpness of non-commuting observables and any measurement of one disturbs the other. The Born rule gives the probabilities of the outcomes and the projection postulate the state after, while between measurements the evolution is unitary: two different rules, the *measurement problem* ([[quantum-mechanics]], [[quantum-foundations]], [[linear-algebra]], [[exp-stern-gerlach]], [[exp-double-slit]])."
  - "**Decoherence:** interaction with an environment suppresses interference between pointer states, so the system looks like a classical mixture from the inside ([[quantum-foundations]], [[arrow-of-time]]); reviews are in [Zurek 2003](https://doi.org/10.1103/RevModPhys.75.715). It explains why macroscopic superpositions are not seen but, being unitary, does not choose a single outcome."
  - "**Interpretive routes:** Everett's relative-state formulation ([Everett 1957](https://doi.org/10.1103/RevModPhys.29.454)) keeps unitary evolution only; the Ghirardi–Rimini–Weber model adds spontaneous localisation ([Ghirardi–Rimini–Weber 1986](https://doi.org/10.1103/PhysRevD.34.470)); Bohmian mechanics adds particle positions. They agree on the standard predictions and differ in what exists ([[quantum-foundations]], [[philosophy-of-physics]], [[exp-bell-tests]])."
  - "**Weak and continuous measurement:** coupling weakly enough that the state is barely disturbed gives 'weak values', which for pre- and post-selected ensembles can lie outside the spectrum ([Aharonov–Albert–Vaidman 1988](https://doi.org/10.1103/PhysRevLett.60.1351)); continuous monitoring turns measurement into a stochastic process for the state (quantum trajectories) ([[quantum-mechanics]], [[sde]], [[stochastic-processes]], [[quantum-information]])."
  - "**Measurement in relativity:** there is no absolute simultaneity, so 'measuring at the same time' is frame dependent. In general relativity a 'measurement of a field value at a point' is not diffeomorphism invariant; observables are relational (the distance between two events, proper time along a worldline), which is a source of the problem of observables in quantum gravity ([[special-relativity]], [[general-relativity]], [[quantum-gravity]], [[exp-michelson-morley]], [[exp-pound-rebka]])."
  - "**Quantum metrology:** with $N$ independent probes the phase uncertainty scales as $1/\\sqrt N$ (the standard quantum limit); squeezed light in an interferometer reduces the noise below the vacuum level ([Caves 1981](https://doi.org/10.1103/PhysRevD.23.1693)), and entangled probes can in principle reach the Heisenberg scaling $1/N$ ([Giovannetti–Lloyd–Maccone 2004](https://doi.org/10.1126/science.1104149)). Gravitational-wave detectors use this ([[quantum-information]], [[optics]], [[exp-ligo]], [[amo-physics]], [[frontier-measuring]])."
  - "**What cannot be measured:** the limits are of different kinds: practical (cost, noise), in principle in a theory (uncertainty, no-cloning), and structural (regions beyond a horizon, the pre-recombination universe). Which limit a statement refers to matters ([[frontier-unmeasurable]], [[black-holes]], [[exp-cmb]])."
definitions:
  - "**What is a 'measurement' in quantum theory? The answers differ on whether it is a special process and whether it produces a single outcome.** (a) *Copenhagen / textbook*: an interaction with a classical apparatus, described by the Born rule and projection. *Why:* it is the operational recipe that every experiment uses. *Problems:* it does not say where the quantum-classical cut lies, nor why the apparatus is not itself quantum."
  - "(b) *Decoherence only*: a measurement is an ordinary unitary interaction that entangles system and environment, making the pointer states stable and interference unobservable. *Why:* it needs no new postulate and explains the preferred basis. *Problems:* the global state is still a superposition, so by itself it does not explain why one outcome is seen; it is therefore usually combined with another interpretation."
  - "(c) *Many worlds (Everett)*: all outcomes occur, in branches of the universal wave function; the apparent single outcome is the branch the observer is in. *Why:* it keeps the Schrödinger equation as the only dynamics. *Problems:* deriving the Born probabilities (the role of decision theory, branch counting) is contested, and some regard the ontology as extravagant."
  - "(d) *Collapse models (GRW, CSL, gravity-related proposals)*: collapse is a real, rare physical process, amplified with the number of particles. *Why:* it makes the measurement problem a matter of dynamics. *Problems:* they modify quantum mechanics and are testable (excess heating, interference of large molecules), with the parameter space being narrowed by experiments but not closed."
  - "(e) *QBism and other epistemic views*: the quantum state is an agent's degrees of belief, and a measurement is an action of the agent on the world, updating those beliefs. *Why:* it removes the paradox by denying that the state is a description of reality. *Problems:* it relocates the question to what the world is independently of the agents, and critics see it as giving up on objective description."
  - "**Overlaps and conflicts.** (a) is operationally contained in all others; (b) is shared by (c) and by most versions of (a) and (e) as an explanation of why classicality emerges; (c) and (d) contradict each other on whether the Schrödinger equation is exact; (e) and (c) disagree on whether the state is real. All reproduce standard quantum mechanics in current experiments, which is why the choice is not decided by data yet, and the thread does not pick one."
caveats:
  - "'Measurement disturbs the system' is a loose slogan: the uncertainty relation $\\Delta x\\,\\Delta p\\ge\\hbar/2$ is a statement about the spread of preparations, not about the instrument's disturbance, and the Heisenberg error–disturbance relation in its naive form can be violated while a corrected version holds. The two readings are different theorems."
  - "Landauer's bound applies to logically irreversible erasure; measurements can be made thermodynamically reversible in principle. Claims that 'information is physical' hold only with that qualification, and the $k_BT\\ln 2$ figure is a lower bound reached in the quasi-static limit."
  - "Weak values are statistical features of pre- and post-selected ensembles; their interpretation (as 'the value of the observable between the two measurements') is debated, and anomalous values can also arise from classical post-selection of noise."
  - "Decoherence is sometimes presented as solving the measurement problem; it removes interference for a subsystem but, as noted in the arrow-of-time thread, the total state stays pure. Whether this suffices is the interpretive question."
  - "The Heisenberg scaling $1/N$ is a bound under assumptions on how the probes enter; with noise (loss, dephasing) the advantage over the standard quantum limit is generally reduced to a constant factor."
  - "The 'observer' in quantum measurement does not need to be conscious; this reading (von Neumann–Wigner) is a minority view. Most interpretations treat the observer as any system that records the outcome."
