cards:
  - q: Why does Maxwell's demon not violate the second law?
    a: The demon must store the molecular positions and eventually erase that memory; erasing a bit dissipates at least $k_BT\ln 2$ of heat (Landauer), which compensates the entropy decrease.
  - q: What does the Cramér–Rao bound state?
    a: The variance of any unbiased estimator of $\theta$ is at least $1/F(\theta)$, the inverse of the Fisher information of the data.
  - q: What is the measurement problem?
    a: Quantum theory has unitary evolution between measurements and a probabilistic, state-changing rule at measurements; it does not say what distinguishes a measurement, nor why a single outcome is seen.
  - q: Does decoherence solve the measurement problem?
    a: It explains why interference between pointer states becomes unobservable, but the total state remains a superposition, so by itself it does not explain a single outcome.
  - q: Name the main interpretive routes for what a measurement is.
    a: Copenhagen (classical apparatus, projection), decoherence plus another interpretation, many worlds, collapse models (GRW/CSL) and QBism-type epistemic views.
  - q: What is a weak value?
    a: The result of weakly coupling to an observable on a pre- and post-selected ensemble; it can lie outside the eigenvalue range and does not mean the observable "had" that value.
  - q: What is the standard quantum limit and the Heisenberg limit in metrology?
    a: With $N$ independent probes the phase error scales as $1/\sqrt N$ (standard quantum limit); entangled probes can in principle reach $1/N$ (Heisenberg scaling).
  - q: Why is 'measure at the same time' ill-defined in relativity?
    a: Simultaneity depends on the observer's frame; in general relativity local field values are not gauge invariant, so observables must be relational.
