id: linearity-superposition
title: "Linearity and superposition: when the sum of solutions is a solution"
short: Linearity
domain: concept
area: concepts
order: 80
one_liner: Where the response to a sum is the sum of the responses, problems can be split into simple pieces and solved exactly — and where it fails, physics becomes hard and rich.
summary: >-
  Linearity is the most powerful simplification in physics: waves, small vibrations, quantum states and
  linear response all obey it. Chaos, turbulence, gravity and interacting fields are what is left when it fails.
thread:
  - "**The idea:** an equation $L u = f$ is linear if $L(a u_1 + b u_2) = a L u_1 + b L u_2$. Then solutions can be added and rescaled (superposition), and a general solution is built from a few simple ones ([[linear-algebra]], [[ode]], [[pde]])."
  - "**Fourier and Green's functions:** a linear, translation-invariant problem is diagonalised by plane waves $e^{ikx}$; the response to a point source (the Green's function) gives the response to any source by summing ([[pde]], [[real-analysis]], [[functional-analysis]])."
  - "**Small oscillations and normal modes:** near a stable equilibrium the forces are linear in the displacement, and any motion is a sum of independent normal modes ([[classical-mechanics]], [[stability]])."
  - "**Maxwell's equations in vacuum:** the fields add, so light beams pass through each other and interference exists; the sources enter linearly too ([[electromagnetism]], [[optics]], [[classical-field-theory]])."
  - "**Quantum mechanics:** the Schrödinger equation is linear, so states live in a Hilbert space and any superposition of states is a state — the origin of interference, entanglement and quantum computing ([[quantum-mechanics]], [[quantum-information]], [[exp-double-slit]]). ([Schrödinger 1926](https://doi.org/10.1002/andp.19263840404))"
  - "**Linear response:** a weak perturbation produces a response proportional to it, described by susceptibilities and fluctuation–dissipation relations ([[statistical-mechanics]], [[non-equilibrium]], [[condensed-matter]])."
  - "**Perturbation theory as linearisation:** treat a nonlinear problem as a solvable linear one plus small corrections, order by order; Feynman diagrams are its organised form ([[qft]], [[scattering-amplitudes]], [[effective-field-theory]])."
  - "**Linearised gravity:** weak fields on flat space give linear wave equations for the metric perturbation, hence gravitational waves that superpose ([[general-relativity]], [[exp-ligo]])."
  - "**Where it breaks, classically:** nonlinear terms cause sensitivity to initial conditions, solitons and pattern formation; the advective term of Navier–Stokes drives turbulence ([[chaos]], [[hydrodynamics]], [[dynamical-systems]], [[integrability]]). ([Lorenz 1963](https://doi.org/10.1175/1520-0469%281963%29020%3C0130:DNF%3E2.0.CO;2), [Zabusky–Kruskal 1965](https://doi.org/10.1103/PhysRevLett.15.240))"
  - "**Where it breaks, in fundamental theories:** Einstein's equations are nonlinear (gravity gravitates), Yang–Mills gluons carry colour charge and interact with each other, and strong light in a medium gives nonlinear optics ([[general-relativity]], [[gauge-theory]], [[standard-model]], [[optics]])."
  - "**Measurement:** the linear evolution of quantum states sits uneasily with definite outcomes; interpretations differ on whether the linearity is exact ([[quantum-foundations]], [[philosophy-of-physics]])."
caveats:
  - "Quantum mechanics is linear in the state, not in the observables: expectation values $\\langle\\psi|A|\\psi\\rangle$ are quadratic in $\\psi$, and probabilities (the squared amplitudes) do not add — the cross terms are interference."
  - "A 'linear' equation can still depend nonlinearly on its parameters: the normal-mode frequencies of a linear system depend nonlinearly on masses and couplings, and the Green's function is not linear in the potential."
  - "Linearity is often approximate and scale-dependent: the harmonic approximation fails at large amplitude, linear response at strong fields, and linearised gravity near strong sources."
  - "Linear does not mean simple: a linear equation with infinitely many degrees of freedom (a quantum field, a linear PDE in a rough domain) can still be hard, and some nonlinear systems (integrable ones) can be solved exactly."
