resources:
  - "Arfken, Weber & Harris, *Mathematical Methods for Physicists*"
  - "Kubo, Toda & Hashitsume, *Statistical Physics II* (linear response)"
cards:
  - q: What does it mean for an equation to be linear, and why is that useful?
    a: Sums and multiples of solutions are solutions. A hard problem can be split into simple pieces (modes, Fourier components, point sources) and recombined.
  - q: Why is the Schrödinger equation's linearity not the same as probabilities adding?
    a: The equation is linear in the wavefunction, so amplitudes add. Probabilities are squared amplitudes, so superposed alternatives give interference cross terms.
  - q: What is a Green's function?
    detail: true  # site only, not in the Anki deck
    a: The response of a linear system to a point source; the response to any source is the sum (integral) of Green's functions weighted by the source.
  - q: Name fundamental theories where linearity fails.
    a: General relativity (gravity sources itself), Yang–Mills theory (gluons carry charge), and Navier–Stokes (advection gives turbulence).
