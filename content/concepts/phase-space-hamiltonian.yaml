cards:
  - q: What does Liouville's theorem say?
    a: The Hamiltonian flow preserves phase-space volume; the density is constant along a trajectory, so a cloud of states can deform but not change volume.
  - q: What is the Poisson bracket and what does it do?
    a: $\{f,g\}=\sum_i(\partial_{q_i}f\,\partial_{p_i}g-\partial_{p_i}f\,\partial_{q_i}g)$; it makes observables a Lie algebra, gives time evolution $\dot f=\{f,H\}$ and generates symmetries.
  - q: What is a canonical transformation?
    a: A change of phase-space variables that preserves the symplectic form, hence the form of Hamilton's equations and all Poisson brackets.
  - q: How are Poisson brackets related to quantum commutators?
    a: Dirac's rule $\{f,g\}\to[\hat f,\hat g]/i\hbar$; it holds for the basic pair $\{q,p\}=1$ but not consistently for all observables.
  - q: Why does the entropy $-\int\rho\ln\rho$ not grow under Hamiltonian flow?
    a: Volume conservation keeps the fine-grained distribution's entropy constant; growth appears only after coarse-graining, once the flow has spread the distribution into fine filaments.
  - q: What does the KAM theorem say?
    a: For small perturbations of an integrable system most invariant tori survive, slightly deformed; the resonant ones break up and produce chaotic layers.
  - q: What does Gromov's non-squeezing theorem add to Liouville?
    a: Symplectic maps cannot squeeze a ball into a cylinder of smaller cross-section in a conjugate $(q_i,p_i)$ plane, though volume-preserving maps could.
