id: phase-space-hamiltonian
title: "Phase space and Hamiltonian structure"
short: Phase space and Hamiltonian structure
domain: concept
area: concepts
order: 350
one_liner: Hamiltonian mechanics describes a system as a point moving in phase space with a built-in symplectic geometry, and that geometry - conserved phase-space volume, Poisson brackets, canonical transformations - is what survives into statistical mechanics and, with brackets turned into commutators, into quantum mechanics.
summary: >-
  Positions and momenta together form the phase space of a system, and Hamilton's equations are a flow on it
  that preserves a special two-form, the symplectic form. The thread follows what this structure gives: Liouville's
  theorem and the density of states in statistical mechanics, Poisson brackets as the algebra of observables,
  canonical transformations as the changes of variables that keep the form of the equations, the recipe that
  replaces brackets by commutators in quantum mechanics, and the questions of ergodicity and of what survives of
  regular motion when a perturbation breaks integrability. The dynamics of integrable and chaotic systems is
  treated in the integrability-and-chaos thread; here the focus is the structure that all of them share.
thread:
  - "**Phase space:** a system with $n$ degrees of freedom is described by $2n$ coordinates $(\\vb q,\\vb p)$; a state is one point, and the motion is a curve generated by the Hamiltonian $H$ through $\\dot q_i=\\partial H/\\partial p_i$, $\\dot p_i=-\\partial H/\\partial q_i$. Unlike configuration space, trajectories cannot cross, so the future is fixed by a single point ([[classical-mechanics]], [[variational-principles]], [[ode]])."
  - "**Symplectic structure:** the phase space carries the closed, non-degenerate two-form $\\omega=\\sum_i dq_i\\wedge dp_i$, and Hamilton's equations say that the flow of $H$ is the vector field dual to $dH$ through $\\omega$. The dimension is even and the geometry has no local invariants, only global ones ([[differential-geometry]], [[geometry-curvature]], [[topology-invariants]])."
  - "**Liouville's theorem:** the Hamiltonian flow preserves the phase-space volume $\\prod dq_i\\,dp_i$, and indeed all the $\\omega^k$; a cloud of initial conditions can stretch and fold but not change volume. This is what makes the uniform measure on an energy surface a natural stationary distribution, and it underlies the microcanonical ensemble ([[statistical-mechanics]], [[equilibrium-ensembles]], [[dynamical-systems]])."
  - "**Non-squeezing:** conservation of volume is not the whole story. Gromov showed that a ball in phase space cannot be mapped symplectically into a thin cylinder of smaller cross-section in a conjugate pair $(q_i,p_i)$ ([Gromov 1985](https://doi.org/10.1007/BF01388806)), a rigidity that has no analogue for volume-preserving maps alone and is sometimes read as a classical trace of the uncertainty principle ([[quantum-mechanics]], [[classical-limit]])."
  - "**Poisson brackets:** $\\{f,g\\}=\\sum_i(\\partial_{q_i}f\\,\\partial_{p_i}g-\\partial_{p_i}f\\,\\partial_{q_i}g)$ is antisymmetric, bilinear and obeys the Jacobi identity, so observables form a Lie algebra. The evolution of any observable is $\\dot f=\\{f,H\\}$, and $f$ is conserved exactly when it brackets to zero with $H$ ([[lie-theory]], [[symmetries]])."
  - "**Symmetries and conserved quantities:** the Hamiltonian version of Noether's theorem says that a function $G$ generates a flow through $\\{\\cdot,G\\}$, and if that flow leaves $H$ invariant then $G$ is conserved. Momentum generates translations, angular momentum rotations, and $H$ itself generates time evolution ([[symmetry-conservation-gauge]], [[group-theory]])."
  - "**Canonical transformations:** changes of variables $(q,p)\\to(Q,P)$ that preserve the symplectic form, and therefore the form of Hamilton's equations and all brackets. Generating functions produce them, and the Hamilton–Jacobi equation is the search for the transformation that makes the new Hamiltonian trivial; this is the route to action–angle variables ([[variational-principles]], [[pde]], [[integrability]])."
  - "**From brackets to commutators:** Dirac observed that the quantum commutator has the same algebraic properties as the Poisson bracket and proposed the correspondence $\\{f,g\\}\\to[\\hat f,\\hat g]/i\\hbar$ ([Dirac 1925](https://doi.org/10.1098/rspa.1925.0150)). The correspondence is exact for the basic pair $\\{q,p\\}=1$ but cannot be kept for all observables, since no consistent quantization of every function exists ([[quantum-mechanics]], [[classical-limit]], [[linear-algebra]])."
  - "**Quantum mechanics on phase space:** the Wigner function turns a quantum state into a quasi-probability on phase space, and the Moyal bracket, a deformation of the Poisson bracket in powers of $\\hbar$, reproduces the commutator, as found by Groenewold and Moyal ([Groenewold 1946](https://doi.org/10.1016/S0031-8914%2846%2980059-4), [Moyal 1949](https://doi.org/10.1017/S0305004100000487)). The Wigner function can be negative, which marks non-classicality ([[classical-limit]], [[quantum-foundations]], [[entanglement-correlations]])."
  - "**Ergodicity:** a system is ergodic if the time average of an observable equals the average over the energy surface for almost every initial condition. Von Neumann proved the quasi-ergodic hypothesis for Hamiltonian flows in an operator sense ([von Neumann 1932](https://doi.org/10.1073/pnas.18.1.70)), and Birkhoff had proved the pointwise version shortly before. Proving ergodicity for a physical Hamiltonian is hard and often false: integrable systems are not ergodic, and the justification of equilibrium by dynamics is far from complete ([[statistical-mechanics]], [[randomness-probability]], [[arrow-of-time]])."
  - "**Mixing and the arrow:** volume conservation means that fine-grained entropy $-\\int\\rho\\ln\\rho$ is constant under Hamiltonian flow; entropy growth appears only after coarse-graining, because a mixing flow drags a blob into filaments that look uniform at finite resolution ([[entropy-information]], [[arrow-of-time]], [[non-equilibrium]])."
  - "**Beyond integrability:** in an integrable system the motion lies on invariant tori in action–angle variables. A small perturbation destroys the resonant tori but, by the Kolmogorov–Arnold–Moser theorem, leaves most of the others, deformed; the remnants of broken tori form the chaotic layers seen in the Hénon–Heiles model ([Hénon–Heiles 1964](https://doi.org/10.1086/109234)) and, when resonances overlap, widespread chaos ([Chirikov 1979](https://doi.org/10.1016/0370-1573%2879%2990023-1)). The theorem and its quantum counterparts are discussed in [[integrability-chaos]] ([[chaos]], [[stability]], [[approximation-perturbation]])."
  - "**Beyond mechanics:** the same structure appears wherever a flow preserves a symplectic form: geometric optics, fluid vortices and plasma kinetic theory (Vlasov equation) are Hamiltonian after a suitable choice of variables, and symplectic integrators exploit it numerically to keep energy errors bounded over long times ([[hydrodynamics]], [[plasma-physics]], [[numerical-analysis]])."
definitions:
  - "**What does 'phase space' refer to? Several uses overlap.** (a) *The symplectic manifold of a Hamiltonian system*, with coordinates $(q,p)$ and a closed two-form. *Why:* it has a precise geometric meaning and carries Liouville, brackets and canonical transformations. *Problem:* it presupposes a Hamiltonian description, which dissipative or constrained systems may not have in an obvious way. (b) *The space of all states of any dynamical system*, as in the dynamical-systems usage where the phase portrait of a damped oscillator is drawn. *Why:* it is the natural arena for flows and attractors. *Problem:* there is no symplectic form and no volume conservation, so Liouville does not hold. (c) *Kinematic phase space in particle physics*, the allowed region of final-state momenta weighted by the Lorentz-invariant measure. *Why:* it counts final states in cross sections. *Problem:* it is the momentum part of (a) only, with no dynamics. The first two agree for Hamiltonian systems and differ in what is conserved; the third is a different object under the same name."
caveats:
  - "Liouville's theorem is often quoted as 'phase-space density is constant', which is true only along a trajectory (the convective derivative vanishes); the density at a fixed point of phase space changes as the flow moves."
  - "Conservation of phase-space volume does not forbid dissipation in a real system: friction is described by coupling to many extra degrees of freedom, and the volume in the reduced space shrinks while the total volume is conserved."
  - "The correspondence $\\{\\cdot,\\cdot\\}\\to[\\cdot,\\cdot]/i\\hbar$ is a heuristic guide, not a theorem for all observables: the Groenewold–van Hove no-go result shows it cannot hold for all polynomials in $q$ and $p$, which is why operator ordering has to be chosen."
  - "The Wigner function is not a probability distribution on phase space: it can be negative and the uncertainty principle forbids sharp joint values of $q$ and $p$; only its marginals are true probabilities."
  - "A system being chaotic or even ergodic does not by itself explain thermodynamic behaviour: the relevant time scales may be astronomically long, and observables of interest (few-body, coarse-grained) can thermalize in systems that are not ergodic."
  - "The KAM theorem concerns sufficiently small perturbations and non-resonant tori, and with more than two degrees of freedom the invariant tori do not separate the phase space, so slow Arnold diffusion along the resonances is possible; how important it is in realistic systems is still debated."
