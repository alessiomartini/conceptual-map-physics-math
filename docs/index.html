nitary entropy curves (Penington; Almheiri–Engelhardt–Marolf–Maxfield 2019).","Firewall paradox (AMPS 2012); ER = EPR proposal."]},{"key":"experiments","label":"Empirical basis","value":["<a class=\"ref\" href=\"#exp-ligo\">Gravitational-Wave Detection (LIGO/Virgo/KAGRA)<\/a> (mergers, ringdown, area theorem test), <a class=\"ref\" href=\"#exp-eht\">Event Horizon Telescope Black-Hole Images<\/a> (shadows), stellar orbits around Sgr A* (Nobel 2020).","Analog Hawking radiation in BECs (Steinhauer)."]},{"key":"limits","label":"Limits & open problems","value":["Hawking radiation of astrophysical black holes is far too cold to observe.","The fate of interior and singularity remains unclear; island derivations rely on semiclassical gravity/replica wormholes."]},{"key":"applications","label":"Applications","value":["Gravitational-wave astronomy, galaxy evolution (AGN feedback), tests of GR; theoretical laboratory for quantum gravity."]},{"key":"frontiers","label":"Where research is going","value":["Microscopic understanding of the interior; black holes as quantum error-correcting codes; precision tests of Kerr with next-generation GW detectors."]}],"connections":["general-relativity","quantum-gravity","holography","thermodynamics","string-theory","quantum-information","astrophysics","chaos"],"prerequisites":["general-relativity","qft"],"resources":[],"cards":[{"q":"What is the Hawking temperature of a Schwarzschild black hole?","a":"$T_H = \\dfrac{\\hbar c^3}{8\\pi G M k_B}$ (≈ 60 nK for a solar mass)."},{"q":"What is the black-hole information paradox?","a":"Hawking radiation computed semiclassically is thermal, so evaporation seems to turn pure states into mixed ones, contradicting unitarity."},{"q":"What is the Page curve?","a":"The entanglement entropy of radiation for unitary evaporation: rises, peaks at the Page time (~half evaporation), then falls to zero."},{"q":"What did Strominger and Vafa achieve in 1996?","a":"A microscopic count of D-brane bound states reproducing the Bekenstein–Hawking entropy of certain 5D extremal black holes."},{"q":"What is the island formula?","a":"$S(R) = \\min\\,\\mathrm{ext}_I \\big[\\frac{\\mathrm{Area}(\\partial I)}{4G} + S_{\\rm matter}(R \\cup I)\\big]$; including islands reproduces the Page curve."}],"search":"black holes & black-hole thermodynamics black holes regions of no escape that behave as thermodynamic objects and sit at the crossroads of gravity, quantum theory and information.  "},{"id":"quantum-gravity","title":"Quantum Gravity","short":null,"domain":"physics","area":"gravity","one_liner":"The search for a consistent quantum theory of spacetime itself.","summary":"GR works as an EFT below the Planck scale ($\\sim 10^{19}$ GeV), but its UV completion is unknown. Approaches include string theory, holography, loop quantum gravity, asymptotic safety, causal dynamical triangulations and causal sets. Evidence is mostly theoretical: black-hole entropy, consistency, and the hope of testable relics.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What are the microscopic degrees of freedom of spacetime?","What replaces singularities (Big Bang, black hole interiors)?","Is spacetime emergent, and from what (entanglement)?"]},{"key":"key_results","label":"Fundamental results","value":["Non-renormalizability of perturbative GR; GR as a valid EFT at low energies.","Bekenstein–Hawking entropy and the holographic principle (’t Hooft, Susskind).","AdS/CFT gives a non-perturbative definition of quantum gravity in AdS (<a class=\"ref\" href=\"#holography\">Holography & AdS/CFT<\/a>).","Loop quantum gravity: discrete area and volume spectra; spin networks.","Asymptotic safety (Weinberg 1979; Reuter): evidence for a UV fixed point in truncations.","Swampland conjectures: no global symmetries, weak gravity conjecture, distance conjecture."]},{"key":"experiments","label":"Empirical basis","value":["No direct evidence. Constraints from Lorentz-invariance tests (GRB timing), CMB tensor modes, tabletop proposals for gravitationally mediated entanglement."]},{"key":"limits","label":"Limits & open problems","value":["The Planck scale is ~15 orders beyond colliders; quantum gravity in de Sitter (our universe) is poorly understood."]},{"key":"applications","label":"Applications","value":["Conceptual, but has driven advances in mathematics, QFT and quantum information."]},{"key":"frontiers","label":"Where research is going","value":["De Sitter holography and observers; algebras of observables (type II von Neumann algebras, Chandrasekaran–Longo–Penington–Witten 2022); swampland vs data (DESI hints).","Tabletop tests of quantum nature of gravity."]}],"connections":["general-relativity","string-theory","holography","black-holes","effective-field-theory","quantum-information","cosmology","quantum-foundations"],"prerequisites":["general-relativity","qft"],"resources":[],"cards":[{"q":"What is the Planck energy?","a":"$E_P = \\sqrt{\\hbar c^5/G} \\approx 1.2\\times 10^{19}$ GeV."},{"q":"What does the holographic principle claim?","a":"The number of degrees of freedom in a region of quantum gravity scales with the area of its boundary in Planck units, not its volume."},{"q":"What is the weak gravity conjecture?","a":"In any consistent quantum gravity with a U(1) gauge field, there exists a state with charge-to-mass ratio at least that of an extremal black hole (gravity is the weakest force)."},{"q":"Name four approaches to quantum gravity.","a":"String theory/holography, loop quantum gravity, asymptotic safety, causal dynamical triangulations (also causal sets, group field theory)."},{"q":"What type of von Neumann algebra appears for observables outside a black hole when gravity is included perturbatively?","a":"Type II (crossed product of the type III₁ QFT algebra), allowing finite entropy differences (Witten; Chandrasekaran–Penington–Witten)."}],"search":"quantum gravity  the search for a consistent quantum theory of spacetime itself.  "},{"id":"string-theory","title":"String Theory","short":null,"domain":"physics","area":"gravity","one_liner":"One-dimensional strings whose vibrations include the graviton, giving a finite perturbative quantum gravity unified with gauge forces.","summary":"Consistency requires supersymmetry and ten dimensions (superstrings); compactification yields 4D physics. Strings unify via dualities into M-theory, contain D-branes, and led to AdS/CFT. Its mathematical output (mirror symmetry, enumerative geometry) is huge; its experimental confirmation is absent and the landscape of vacua complicates prediction.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["Can gravity and gauge forces be unified in a single quantum theory?","Which low-energy physics can emerge, and is our universe in the landscape?","What is the non-perturbative definition of the theory (M-theory)?"]},{"key":"key_results","label":"Fundamental results","value":["Graviton in the closed-string spectrum; critical dimensions 26 (bosonic) and 10 (superstring).","Green–Schwarz anomaly cancellation (1984): SO(32) and E₈×E₈.","Calabi–Yau compactifications; heterotic phenomenology.","Dualities (T, S, U) and M-theory in 11D (Witten 1995); D-branes (Polchinski 1995).","Strominger–Vafa black-hole entropy; AdS/CFT (Maldacena 1997).","Mirror symmetry predicted rational curve counts on the quintic (Candelas et al. 1991).","KKLT and LVS constructions of de Sitter vacua (contested)."]},{"key":"experiments","label":"Empirical basis","value":["None direct. Indirect support only through its consistency and its role in holography."]},{"key":"limits","label":"Limits & open problems","value":["Huge landscape (~10^500 or more vacua), unclear predictivity; no non-perturbative background-independent formulation; de Sitter constructions disputed."]},{"key":"applications","label":"Applications","value":["Mathematics (mirror symmetry, Gromov–Witten theory, moonshine); holographic models of QCD and condensed matter; amplitudes techniques."]},{"key":"frontiers","label":"Where research is going","value":["Swampland program; string compactifications with controlled moduli stabilization; celestial and flat-space holography; string field theory; machine learning on Calabi–Yau data."]}],"connections":["quantum-gravity","holography","cft","gauge-theory","black-holes","algebraic-geometry","differential-geometry","scattering-amplitudes","beyond-standard-model"],"prerequisites":["qft","general-relativity","cft"],"resources":["Polchinski, <em>String Theory<\/em> (2 vols)","Tong, <em>Lectures on String Theory<\/em> (free online)","Becker, Becker, Schwarz, <em>String Theory and M-Theory<\/em>"],"cards":[{"q":"Why does string theory necessarily include gravity?","a":"The closed-string spectrum always contains a massless spin-2 state, whose interactions reproduce GR at low energy."},{"q":"What are the critical dimensions of bosonic and superstring theory?","a":"26 and 10 (M-theory: 11)."},{"q":"What did Green and Schwarz show in 1984?","a":"Gauge and gravitational anomalies cancel in type I superstrings for gauge group SO(32) (also E₈×E₈), starting the first superstring revolution."},{"q":"What is a D-brane?","a":"A dynamical hypersurface on which open strings end (Dirichlet boundary conditions); carries RR charge and supports gauge theories."},{"q":"What is the string landscape?","a":"The vast set of metastable vacua from flux compactifications, each with different low-energy physics."},{"q":"What spectacular mathematical prediction came from mirror symmetry?","a":"The number of rational curves of each degree on the quintic Calabi–Yau threefold (e.g. 2875 lines, 609250 conics), later proven."}],"search":"string theory  one-dimensional strings whose vibrations include the graviton, giving a finite perturbative quantum gravity unified with gauge forces.  "},{"id":"holography","title":"Holography & AdS/CFT","short":"Holography","domain":"physics","area":"gravity","one_liner":"Quantum gravity in a spacetime is equivalent to a non-gravitational quantum field theory on its boundary.","summary":"Maldacena's AdS/CFT correspondence (1997) relates type IIB strings on AdS₅×S⁵ to N=4 SYM. It is the best understood non-perturbative definition of quantum gravity, a tool for strongly coupled systems, and the source of the idea that spacetime emerges from entanglement (Ryu–Takayanagi).","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How does a gravitational bulk emerge from boundary quantum degrees of freedom?","How do we compute strongly coupled dynamics with classical gravity?","Does holography extend to flat and de Sitter spacetimes?"]},{"key":"key_results","label":"Fundamental results","value":["GKP–Witten dictionary: $Z_{\\rm CFT}[\\phi_0] = Z_{\\rm grav}[\\phi \\to \\phi_0]$.","Large N and strong coupling ↔ classical gravity; $\\lambda^{-1/2}$ ~ string corrections.","Ryu–Takayanagi (2006): $S_A = \\mathrm{Area}(\\gamma_A)/4G_N$; HRT and quantum extremal surfaces.","Hawking–Page transition ↔ confinement/deconfinement; black-hole horizon ↔ thermal state.","η/s = 1/4π; fluid/gravity correspondence.","Holographic quantum error correction (Almheiri–Dong–Harlow 2015); entanglement wedge reconstruction.","JT gravity and SYK as a solvable low-dimensional example; ensemble averaging and replica wormholes."]},{"key":"experiments","label":"Empirical basis","value":["None directly; holographic models qualitatively match QGP viscosity and some strange-metal phenomenology."]},{"key":"limits","label":"Limits & open problems","value":["Best established in AdS with supersymmetry and large N; our universe is approximately de Sitter."]},{"key":"applications","label":"Applications","value":["QGP physics, strange metals, quantum chaos (fast scrambling), information paradox, quantum error correction."]},{"key":"frontiers","label":"Where research is going","value":["Flat-space (celestial, Carrollian) and de Sitter holography; bulk reconstruction and complexity; factorization puzzles and baby universes."]}],"connections":["string-theory","cft","quantum-gravity","black-holes","quantum-information","hydrodynamics","gauge-theory","condensed-matter","integrability"],"prerequisites":["cft","general-relativity","string-theory"],"resources":["Hartman, <em>Lectures on Quantum Gravity and Black Holes<\/em> (Cornell notes)","Harlow, <em>Jerusalem lectures on black holes and quantum information<\/em> (2014)","Ammon &amp; Erdmenger, <em>Gauge/Gravity Duality<\/em>"],"cards":[{"q":"What is the original AdS/CFT duality?","a":"Type IIB string theory on AdS₅×S⁵ ≡ 4D N=4 SU(N) super-Yang–Mills, with $g_s \\sim g^2_{YM}$ and $L^4/\\alpha'^2 = \\lambda = g^2_{YM}N$."},{"q":"State the Ryu–Takayanagi formula.","a":"The entanglement entropy of boundary region A equals the area of the minimal bulk surface homologous to A, divided by $4G_N$."},{"q":"What does the Hawking–Page transition correspond to in the CFT?","a":"The confinement/deconfinement transition of the large-N gauge theory on a sphere."},{"q":"Why is holography described as quantum error correction?","a":"Bulk operators can be reconstructed from many different boundary regions, like logical qubits encoded redundantly in physical qubits."},{"q":"What is the SYK model and why does it matter for holography?","a":"N Majorana fermions with random all-to-all q-body couplings; solvable at large N, maximally chaotic, with low-energy Schwarzian dynamics dual to JT gravity in AdS₂."}],"search":"holography & ads/cft holography quantum gravity in a spacetime is equivalent to a non-gravitational quantum field theory on its boundary.  "},{"id":"statistical-mechanics","title":"Statistical Mechanics","short":"Stat mech","domain":"physics","area":"matter","one_liner":"Deriving macroscopic laws from the statistics of enormous numbers of microscopic degrees of freedom.","summary":"Boltzmann and Gibbs explained thermodynamics through ensembles and entropy as counting. Partition functions connect microscopic Hamiltonians to free energies, and the same mathematics (path integrals, RG) is shared with QFT. It extends beyond physics to inference, machine learning and finance.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do macroscopic properties emerge from microscopic dynamics?","Why and how do systems reach equilibrium?","What determines the phases of matter?"]},{"key":"key_results","label":"Fundamental results","value":["Boltzmann entropy $S = k_B \\ln W$; Gibbs ensembles; partition function $Z = \\mathrm{Tr}\\,e^{-\\beta H}$.","Equipartition; fluctuation–response relations; Bose–Einstein and Fermi–Dirac statistics.","Boltzmann's H-theorem and the debate on irreversibility (Loschmidt, Zermelo).","Onsager's exact 2D Ising solution; mean-field theory; Lee–Yang zeros.","Quantum–classical mapping: a d-dimensional quantum system at T=0 ↔ (d+1)-dimensional classical system.","Spin glasses: Parisi's replica symmetry breaking (Nobel 2021)."]},{"key":"experiments","label":"Empirical basis","value":["Brownian motion (Perrin 1908 confirms atoms via Einstein's theory); specific heats of solids; <a class=\"ref\" href=\"#exp-bec\">Bose–Einstein Condensation of Atoms<\/a>."]},{"key":"limits","label":"Limits & open problems","value":["Foundations of ergodicity and the arrow of time remain subtle; non-equilibrium needs other tools."]},{"key":"applications","label":"Applications","value":["Materials, chemistry, biophysics, information theory and inference, neural networks (Hopfield, Boltzmann machines; Nobel 2024), finance."]},{"key":"frontiers","label":"Where research is going","value":["Statistical physics of learning (high-dimensional inference, glassy landscapes), eigenstate thermalization, quantum many-body thermodynamics."]}],"connections":["thermodynamics","phase-transitions","renormalization","condensed-matter","non-equilibrium","probability-theory","information-theory","complex-systems","random-matrix-theory"],"prerequisites":["classical-mechanics","quantum-mechanics","probability-theory"],"resources":["Kardar, <em>Statistical Physics of Particles<\/em> and <em>of Fields<\/em>","Sethna, <em>Entropy, Order Parameters, and Complexity<\/em> (free online)"],"cards":[{"q":"What is the canonical partition function and how is free energy obtained from it?","a":"$Z = \\mathrm{Tr}\\, e^{-\\beta H}$, and $F = -k_B T \\ln Z$."},{"q":"What is the fluctuation–dissipation theorem?","a":"The linear response of a system in equilibrium is determined by its equilibrium fluctuations (e.g. $\\chi'' \\propto (1-e^{-\\beta\\omega}) S(\\omega)$)."},{"q":"What is the quantum–classical correspondence in stat mech?","a":"A quantum system in d dimensions at temperature T maps to a classical system in d+1 dimensions with imaginary-time extent $\\hbar/k_BT$."},{"q":"What did Parisi contribute to spin glass theory?","a":"The replica-symmetry-breaking solution of the Sherrington–Kirkpatrick model, revealing a hierarchical landscape of many pure states."},{"q":"How did Perrin's experiments (1908) matter?","a":"Measuring Brownian motion confirmed Einstein's theory and gave Avogadro's number, settling the existence of atoms."}],"search":"statistical mechanics stat mech deriving macroscopic laws from the statistics of enormous numbers of microscopic degrees of freedom.  "},{"id":"phase-transitions","title":"Phase Transitions & Critical Phenomena","short":"Phase transitions","domain":"physics","area":"matter","one_liner":"How matter changes state, and why systems at critical points become scale-invariant and universal.","summary":"First-order transitions have latent heat; continuous ones have diverging correlation lengths and power laws with universal exponents. Landau theory, scaling and the RG explain universality. Quantum phase transitions at zero temperature and transitions beyond the Landau paradigm (topological, deconfined) extend the story.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["Why do sharp phase transitions exist in the thermodynamic limit?","Why do critical exponents depend only on dimension, symmetry and range of interactions?","Which transitions fall outside symmetry-breaking order parameters?"]},{"key":"key_results","label":"Fundamental results","value":["Landau theory of order parameters; Ginzburg criterion; upper critical dimension 4 (for φ⁴).","Scaling hypothesis (Widom, Kadanoff) and scaling relations; RG derivation of exponents (Wilson 1971).","Mermin–Wagner theorem: no continuous symmetry breaking at T&gt;0 in d ≤ 2 (short-range).","Berezinskii–Kosterlitz–Thouless transition by vortex unbinding (Nobel 2016).","Quantum phase transitions; quantum criticality (Sachdev).","Deconfined quantum criticality proposal (Senthil et al. 2004)."]},{"key":"experiments","label":"Empirical basis","value":["Liquid–gas critical opalescence; λ-transition of He-4; superfluid films (BKT, Bishop–Reppy 1978); heavy-fermion quantum critical points."]},{"key":"limits","label":"Limits & open problems","value":["Non-equilibrium transitions (directed percolation etc.) and glass transition lack complete theory."]},{"key":"applications","label":"Applications","value":["Materials design, superconductors, magnetism, percolation in networks and epidemics, early-universe transitions."]},{"key":"frontiers","label":"Where research is going","value":["Measurement-induced phase transitions in monitored quantum circuits; transitions between topological orders; fuzzy-sphere numerics of 3D CFTs."]}],"connections":["statistical-mechanics","renormalization","cft","condensed-matter","topological-phases","symmetries","non-equilibrium","networks"],"prerequisites":["statistical-mechanics"],"resources":[],"cards":[{"q":"What is the Mermin–Wagner theorem?","a":"Continuous symmetries cannot be spontaneously broken at finite temperature in $d \\le 2$ with short-range interactions."},{"q":"What drives the BKT transition?","a":"Unbinding of vortex–antivortex pairs in 2D XY systems, giving a transition to quasi-long-range order without symmetry breaking."},{"q":"What is the upper critical dimension of the Ising/φ⁴ universality class, and what happens above it?","a":"$d_c = 4$; above it mean-field exponents are exact."},{"q":"What is a quantum phase transition?","a":"A non-analytic change of the ground state as a parameter (pressure, field, doping) is tuned at T=0, driven by quantum fluctuations."},{"q":"What are the critical exponents ν and η?","a":"$\\xi \\sim |t|^{-\\nu}$ for the correlation length; $G(r) \\sim r^{-(d-2+\\eta)}$ at criticality."}],"search":"phase transitions & critical phenomena phase transitions how matter changes state, and why systems at critical points become scale-invariant and universal.  "},{"id":"condensed-matter","title":"Condensed Matter Theory","short":"Condensed matter","domain":"physics","area":"matter","one_liner":"Emergent collective behaviour of many interacting electrons, spins and atoms.","summary":"\"More is different\" (Anderson): band theory, Fermi liquids, superconductivity, magnetism and their breakdowns. It has the largest community in physics and continuously produces new phases (quantum Hall, topological insulators, moiré materials) together with conceptual tools (RG, anomalies, entanglement) shared with high energy.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What phases can many-body quantum matter form, and what are their low-energy excitations?","Why do some materials superconduct, and at what temperatures?","What happens when interactions are strong and quasiparticle pictures fail (strange metals)?"]},{"key":"key_results","label":"Fundamental results","value":["Bloch's theorem and band theory; metals, insulators, semiconductors.","Landau Fermi-liquid theory: interacting electrons as quasiparticles.","BCS theory (1957): Cooper pairing via phonons; Anderson–Higgs mechanism in superconductors.","Anderson localization (1958): disorder can localize all states (in 1D, 2D).","Integer and fractional quantum Hall effects; Laughlin wavefunction; anyons.","Luttinger liquids in 1D; Kondo effect and Wilson's numerical RG.","Kohn–Hohenberg density functional theory (Nobel Chemistry 1998)."]},{"key":"experiments","label":"Empirical basis","value":["<a class=\"ref\" href=\"#exp-superconductivity\">Discovery of Superconductivity<\/a>, <a class=\"ref\" href=\"#exp-quantum-hall\">Quantum Hall Effects<\/a>, cuprate high-Tc (1986), graphene (2004), twisted bilayer graphene superconductivity (2018)."]},{"key":"limits","label":"Limits & open problems","value":["No consensus theory of high-Tc cuprates and strange metals; strongly correlated systems resist both analytic and numerical methods."]},{"key":"applications","label":"Applications","value":["Transistors, magnetic storage, superconducting magnets and qubits, LEDs, photovoltaics, metrology standards."]},{"key":"frontiers","label":"Where research is going","value":["Moiré materials and fractional Chern insulators (observed 2023 in twisted MoTe₂ and rhombohedral graphene); nickelate superconductors; altermagnets; quantum spin liquids."]}],"connections":["statistical-mechanics","phase-transitions","topological-phases","qft","effective-field-theory","quantum-information","holography","random-matrix-theory","gauge-theory","amo-physics"],"prerequisites":["quantum-mechanics","statistical-mechanics"],"resources":["Ashcroft &amp; Mermin, <em>Solid State Physics<\/em>","Altland &amp; Simons, <em>Condensed Matter Field Theory<\/em>","Anderson, <em>More is different<\/em> (Science 1972)"],"cards":[{"q":"What does Bloch's theorem state?","a":"Eigenstates in a periodic potential can be written $\\psi_k(r) = e^{ik\\cdot r}u_k(r)$ with $u_k$ periodic."},{"q":"What is a Landau Fermi liquid?","a":"A metal whose low-energy excitations are long-lived quasiparticles adiabatically connected to free fermions, with renormalized parameters."},{"q":"What is the mechanism of BCS superconductivity?","a":"Phonon-mediated attraction binds electrons into Cooper pairs that condense, opening a gap at the Fermi surface."},{"q":"What is Anderson localization?","a":"Interference in a disordered potential makes electron wavefunctions exponentially localized, suppressing diffusion."},{"q":"What is a strange metal?","a":"A metallic state (e.g. in cuprates) with resistivity linear in T over a wide range and no well-defined quasiparticles."},{"q":"What is a fractional Chern insulator?","a":"A lattice analogue of the fractional quantum Hall state in a flat Chern band without external magnetic field; observed in 2023 in moiré materials."}],"search":"condensed matter theory condensed matter emergent collective behaviour of many interacting electrons, spins and atoms.  "},{"id":"topological-phases","title":"Topological Phases of Matter","short":"Topological phases","domain":"physics","area":"matter","one_liner":"Phases distinguished not by symmetry breaking but by global, topological properties of their quantum wavefunctions.","summary":"From the quantum Hall effect onward, robust quantized responses arise from topology: Chern numbers, symmetry-protected invariants, and long-range entanglement with anyonic excitations. Described by topological quantum field theories, they are candidates for fault-tolerant quantum memory.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["Which gapped phases exist beyond the Landau symmetry-breaking paradigm?","Why are some responses (Hall conductance) quantized exactly?","Can topological order store quantum information robustly?"]},{"key":"key_results","label":"Fundamental results","value":["TKNN (1982): Hall conductance is a Chern number.","Haldane model (1988): Chern insulator without net field.","Kane–Mele / BHZ: Z₂ topological insulators (2005–2006); periodic table of topological insulators and superconductors (Kitaev; Schnyder et al. 2008).","Topological order (Wen): ground-state degeneracy on tori, anyons, long-range entanglement; topological entanglement entropy.","Kitaev chain (Majorana zero modes) and Kitaev honeycomb model.","SPT phases classified by group cohomology and cobordism."]},{"key":"experiments","label":"Empirical basis","value":["<a class=\"ref\" href=\"#exp-quantum-hall\">Quantum Hall Effects<\/a>; HgTe quantum wells (König 2007); ARPES of Bi₂Se₃ surface states; anyon braiding in FQH interferometers (2020)."]},{"key":"limits","label":"Limits & open problems","value":["Majorana detection in nanowires has been contested; non-abelian anyons not yet used for computing."]},{"key":"applications","label":"Applications","value":["Resistance standard (quantum Hall); topological quantum computation; spintronics."]},{"key":"frontiers","label":"Where research is going","value":["Non-abelian anyons on quantum processors; fracton phases; topological phases in non-equilibrium (Floquet, time crystals); classification via higher categories."]}],"connections":["condensed-matter","symmetries","quantum-information","topology","category-theory","gauge-theory","phase-transitions"],"prerequisites":["condensed-matter"],"resources":[],"cards":[{"q":"What topological invariant gives the integer quantum Hall conductance?","a":"The first Chern number of the occupied Bloch bands, $\\sigma_{xy} = C\\, e^2/h$ (TKNN)."},{"q":"What is topological order?","a":"Long-range entangled gapped phases with ground-state degeneracy depending on topology and anyonic excitations, not captured by local order parameters."},{"q":"What is an SPT phase?","a":"A symmetry-protected topological phase — short-range entangled, trivial without symmetry, but not deformable to a product state while preserving the symmetry (e.g. Haldane chain, TIs)."},{"q":"What is the topological entanglement entropy?","a":"A constant correction $-\\gamma$ in $S_A = \\alpha |\\partial A| - \\gamma$, with $\\gamma = \\ln \\mathcal{D}$ (total quantum dimension)."},{"q":"What is a Majorana zero mode?","a":"A zero-energy bound state that is its own antiparticle, appearing at ends of topological superconducting wires; pairs encode a non-local qubit."}],"search":"topological phases of matter topological phases phases distinguished not by symmetry breaking but by global, topological properties of their quantum wavefunctions.  "},{"id":"random-matrix-theory","title":"Random Matrix Theory","short":"RMT","domain":"physics","area":"matter","one_liner":"The universal statistics of eigenvalues of large random matrices, from nuclei to the Riemann zeta function.","summary":"Wigner introduced random Hamiltonians to model heavy nuclei. The spectra depend only on symmetry class (Dyson's threefold way, later tenfold), producing universal level repulsion. RMT appears in quantum chaos, disordered conductors, number theory, 2D gravity, wireless communication, statistics and finance.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What are the universal statistical properties of spectra of complex systems?","Which symmetry classes exist and what are their universal laws?","Why do zeros of the Riemann zeta function look like GUE eigenvalues?"]},{"key":"key_results","label":"Fundamental results","value":["Wigner semicircle law; Marchenko–Pastur law for covariance matrices.","Dyson's threefold way (GOE, GUE, GSE; β = 1, 2, 4); Altland–Zirnbauer tenfold classification.","Level spacing: Wigner surmise $p(s) \\propto s^\\beta e^{-c s^2}$; Tracy–Widom distribution for the largest eigenvalue.","Montgomery–Odlyzko: pair correlation of zeta zeros matches GUE.","Matrix models ↔ 2D quantum gravity; JT gravity ↔ double-scaled matrix integral (Saad–Shenker–Stanford 2019).","Universality theorems (Erdős–Yau, Tao–Vu)."]},{"key":"experiments","label":"Empirical basis","value":["Neutron resonance spectra of heavy nuclei; microwave billiards; universal conductance fluctuations."]},{"key":"limits","label":"Limits & open problems","value":["Describes universal statistics, not system-specific features; short-range correlated or sparse matrices need extensions."]},{"key":"applications","label":"Applications","value":["Covariance cleaning in finance (Marchenko–Pastur), MIMO wireless capacity, neural network loss landscapes, quantum chaos diagnostics."]},{"key":"frontiers","label":"Where research is going","value":["Spectral form factor and ramp in many-body chaos and black holes; free probability in deep learning; heavy-tailed RMT."]}],"connections":["chaos","quantum-mechanics","number-theory","probability-theory","holography","condensed-matter","statistical-mechanics","econophysics"],"prerequisites":[],"resources":[],"cards":[{"q":"What is the Wigner semicircle law?","a":"The eigenvalue density of large Wigner matrices (properly normalized) converges to $\\rho(x) = \\frac{1}{2\\pi}\\sqrt{4-x^2}$."},{"q":"What do the Dyson indices β = 1, 2, 4 correspond to?","a":"GOE (time-reversal invariant, real symmetric), GUE (broken time reversal, complex Hermitian), GSE (time-reversal with half-integer spin, quaternion self-dual)."},{"q":"What is the Marchenko–Pastur law used for in finance?","a":"It gives the eigenvalue spectrum of pure-noise sample covariance matrices, used to separate signal eigenvalues from noise in correlation matrices."},{"q":"What is the Tracy–Widom distribution?","a":"The limiting fluctuation law of the largest eigenvalue of Gaussian ensembles; also appears in KPZ growth and longest increasing subsequences."},{"q":"What is the Montgomery–Odlyzko law?","a":"Normalized spacings of nontrivial zeros of the Riemann zeta function follow GUE statistics."},{"q":"What is the spectral form factor's \"ramp\" a signature of?","a":"Random-matrix-like spectral rigidity (long-range level correlations), a hallmark of quantum chaos."}],"search":"random matrix theory rmt the universal statistics of eigenvalues of large random matrices, from nuclei to the riemann zeta function.  "},{"id":"non-equilibrium","title":"Non-Equilibrium Statistical Physics","short":"Non-equilibrium","domain":"physics","area":"matter","one_liner":"Systems driven, relaxing or living away from thermal equilibrium, from fluctuating molecules to active matter.","summary":"Most of nature is out of equilibrium. The field ranges from linear response and kinetic theory to exact fluctuation theorems, stochastic thermodynamics, non-equilibrium phase transitions, active matter and the thermalization of isolated quantum systems.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What general laws govern systems away from equilibrium?","How do isolated quantum systems thermalize, or avoid it?","What new collective phases appear in driven and active systems?"]},{"key":"key_results","label":"Fundamental results","value":["Boltzmann equation; Onsager reciprocal relations; Green–Kubo formulas.","Fluctuation theorems (Evans–Searles, Gallavotti–Cohen, Crooks) and Jarzynski equality $\\langle e^{-\\beta W}\\rangle = e^{-\\beta \\Delta F}$.","KPZ universality for growing interfaces; directed percolation universality.","Eigenstate thermalization hypothesis (Deutsch 1991, Srednicki 1994).","Many-body localization; quantum many-body scars; discrete time crystals.","Thermodynamic uncertainty relations (Barato–Seifert 2015).","Vicsek model and Toner–Tu theory: flocking with long-range order in 2D."]},{"key":"experiments","label":"Empirical basis","value":["Single-molecule pulling verifying Jarzynski/Crooks; cold-atom thermalization experiments; time crystals on qubit platforms; bacterial and active colloid suspensions."]},{"key":"limits","label":"Limits & open problems","value":["No general variational principle comparable to free-energy minimization; stability of MBL in the thermodynamic limit debated."]},{"key":"applications","label":"Applications","value":["Molecular motors and biophysics, chemical reaction networks, nanoscale engines, climate, traffic."]},{"key":"frontiers","label":"Where research is going","value":["Active matter, non-reciprocal interactions and phase transitions; stochastic thermodynamics of computation; prethermalization and Floquet engineering."]}],"connections":["statistical-mechanics","thermodynamics","hydrodynamics","phase-transitions","complex-systems","stochastic-processes","chaos","biophysics"],"prerequisites":["statistical-mechanics"],"resources":[],"cards":[{"q":"State the Jarzynski equality.","a":"$\\langle e^{-\\beta W} \\rangle = e^{-\\beta \\Delta F}$ for work done in arbitrary non-equilibrium driving between equilibrium states."},{"q":"What is the eigenstate thermalization hypothesis?","a":"Matrix elements of local observables in energy eigenstates of chaotic systems are smooth functions of energy on the diagonal plus exponentially small random off-diagonal terms, so single eigenstates look thermal."},{"q":"What is the KPZ equation?","a":"$\\partial_t h = \\nu \\nabla^2 h + \\frac{\\lambda}{2}(\\nabla h)^2 + \\eta$; in 1+1D it has exponents $z = 3/2$ and Tracy–Widom fluctuations."},{"q":"What do Green–Kubo relations give?","a":"Transport coefficients as time integrals of equilibrium current–current correlation functions."},{"q":"What is a thermodynamic uncertainty relation?","a":"A bound relating precision of a current to dissipation, $\\mathrm{Var}(J)/\\langle J\\rangle^2 \\ge 2k_B/\\Sigma$ (entropy production)."}],"search":"non-equilibrium statistical physics non-equilibrium systems driven, relaxing or living away from thermal equilibrium, from fluctuating molecules to active matter.  "},{"id":"amo-physics","title":"Atomic, Molecular & Optical Physics","short":"AMO & quantum optics","domain":"physics","area":"scales","one_liner":"Controlling single atoms, molecules and photons with lasers, the most precise measurements in physics.","summary":"AMO physics gave lasers, laser cooling, atomic clocks and Bose–Einstein condensates, and now builds programmable quantum simulators and computers from neutral atoms and ions. Its precision makes it a probe of fundamental physics (fine-structure constant, EDMs, variation of constants, dark matter).","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do light and matter interact at the single-quantum level?","How precisely can we measure time, frequency and fundamental constants?","Can controllable atomic systems simulate hard many-body problems?"]},{"key":"key_results","label":"Fundamental results","value":["Einstein's A and B coefficients; laser principle; Jaynes–Cummings model; cavity QED.","Laser cooling and trapping (Nobel 1997); evaporative cooling to BEC (1995).","Optical frequency comb (Hall, Hänsch; Nobel 2005).","Optical lattice clocks with fractional uncertainty below 10⁻¹⁸.","Feshbach resonances to tune interactions; BEC–BCS crossover."]},{"key":"experiments","label":"Empirical basis","value":["<a class=\"ref\" href=\"#exp-bec\">Bose–Einstein Condensation of Atoms<\/a>; quantum gas microscopes; Rydberg-atom arrays; electron EDM bound (ACME, JILA)."]},{"key":"limits","label":"Limits & open problems","value":["Scaling quantum simulators while keeping fidelity; decoherence."]},{"key":"applications","label":"Applications","value":["GPS and timekeeping, quantum sensing (gravimeters, magnetometers), quantum computing, spectroscopy, attosecond science (Nobel 2023)."]},{"key":"frontiers","label":"Where research is going","value":["Nuclear clock with thorium-229 (2024); redefinition of the SI second with optical clocks; tweezer arrays with thousands of atoms; tests of new physics with clocks."]}],"connections":["quantum-mechanics","quantum-information","electromagnetism","condensed-matter","beyond-standard-model"],"prerequisites":[],"resources":[],"cards":[{"q":"What made Bose–Einstein condensation of atoms possible in 1995?","a":"Laser cooling followed by evaporative cooling in magnetic traps to ~100 nK (Cornell, Wieman, Ketterle)."},{"q":"What is an optical frequency comb?","a":"A mode-locked laser producing equally spaced frequencies, linking optical frequencies to microwave standards for precise frequency measurement."},{"q":"What is the Jaynes–Cummings model?","a":"A two-level atom coupled to a single quantized cavity mode; the basic model of cavity QED (vacuum Rabi oscillations)."},{"q":"What is a Feshbach resonance used for?","a":"Tuning the scattering length of ultracold atoms with a magnetic field, controlling interaction strength and sign."}],"search":"atomic, molecular & optical physics amo & quantum optics controlling single atoms, molecules and photons with lasers, the most precise measurements in physics.  "},{"id":"nuclear-physics","title":"Nuclear Physics","short":null,"domain":"physics","area":"scales","one_liner":"The structure of atomic nuclei and of strongly interacting matter, from QCD to neutron stars.","summary":"Nuclei are bound by the residual strong force. The field spans nuclear structure (shell model, collective models), nuclear reactions and astrophysics (nucleosynthesis), hot QCD matter in heavy-ion collisions, and the dense matter in neutron stars.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do protons and neutrons emerge from quarks and gluons, and how do they bind into nuclei?","What are the limits of nuclear existence (drip lines, superheavy elements)?","What is the equation of state of dense nuclear matter?"]},{"key":"key_results","label":"Fundamental results","value":["Semi-empirical mass formula; shell model with spin–orbit coupling and magic numbers (Mayer, Jensen).","Yukawa's meson exchange; chiral EFT for nuclear forces.","Stellar nucleosynthesis (B²FH 1957); r-process in neutron-star mergers (GW170817 kilonova).","Quark–gluon plasma created at RHIC/LHC behaves as a near-perfect liquid.","Proton spin crisis (EMC 1988): quarks carry only ~30% of the proton spin."]},{"key":"experiments","label":"Empirical basis","value":["Rutherford scattering (<a class=\"ref\" href=\"#exp-rutherford\">Rutherford (Geiger–Marsden) Scattering<\/a>), fission (1938), heavy-ion collisions, FRIB rare isotopes, neutron-star mass/radius from NICER."]},{"key":"limits","label":"Limits & open problems","value":["Ab initio calculations of heavy nuclei are hard; the dense-matter phase diagram at high baryon density is largely unknown."]},{"key":"applications","label":"Applications","value":["Nuclear energy, medicine (PET, radiotherapy), dating, nuclear weapons policy, astrophysics."]},{"key":"frontiers","label":"Where research is going","value":["Electron–Ion Collider (EIC) for nucleon structure; proton radius puzzle (mostly resolved towards the smaller value); neutron lifetime puzzle; neutron-star EOS from GW and NICER."]}],"connections":["standard-model","lattice-field-theory","astrophysics","effective-field-theory","hydrodynamics"],"prerequisites":[],"resources":[],"cards":[{"q":"What are the nuclear magic numbers?","a":"2, 8, 20, 28, 50, 82, 126 — closed shells explained by the shell model with strong spin–orbit coupling."},{"q":"Where are most elements heavier than iron produced?","a":"By neutron capture — the slow s-process in AGB stars and the rapid r-process, e.g. in neutron-star mergers (kilonova of GW170817)."},{"q":"What is the neutron lifetime puzzle?","a":"Beam experiments measure ~888 s while trap experiments measure ~878 s, a ~4σ discrepancy."},{"q":"What was the proton spin crisis?","a":"EMC (1988) found quark spins contribute only a small fraction of the proton's spin; the remainder comes from gluon spin and orbital angular momentum."}],"search":"nuclear physics  the structure of atomic nuclei and of strongly interacting matter, from qcd to neutron stars.  "},{"id":"astrophysics","title":"Astrophysics","short":null,"domain":"physics","area":"scales","one_liner":"Stars, galaxies, compact objects and the high-energy universe, used as both objects of study and natural laboratories.","summary":"Applying all of physics to the cosmos: stellar structure and evolution, compact objects, galaxies and their dynamics, high-energy astrophysics, and multi-messenger astronomy combining light, neutrinos, cosmic rays and gravitational waves.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do stars form, live and die?","How do galaxies and supermassive black holes form and co-evolve?","What accelerates the highest-energy cosmic rays?"]},{"key":"key_results","label":"Fundamental results","value":["Stellar structure equations; Hertzsprung–Russell diagram; Chandrasekhar limit ~1.4 M☉.","Pulsars as neutron stars (Bell Burnell, Hewish 1967).","Galaxy rotation curves imply dark matter (Rubin, Ford).","Solar neutrino problem resolved by oscillations (SNO 2001).","Multi-messenger GW170817: GW + gamma rays + kilonova, $c_{GW} = c$ to 10⁻¹⁵."]},{"key":"experiments","label":"Empirical basis","value":["JWST, Gaia, Chandra, Fermi, IceCube, Pierre Auger, <a class=\"ref\" href=\"#exp-ligo\">Gravitational-Wave Detection (LIGO/Virgo/KAGRA)<\/a>, <a class=\"ref\" href=\"#exp-eht\">Event Horizon Telescope Black-Hole Images<\/a>, NANOGrav."]},{"key":"limits","label":"Limits & open problems","value":["Observational (no controlled experiments); complex baryonic feedback in galaxy formation."]},{"key":"applications","label":"Applications","value":["Tests of fundamental physics, cosmology, origin of elements, exoplanets."]},{"key":"frontiers","label":"Where research is going","value":["JWST early massive galaxies; nanohertz gravitational-wave background (2023); fast radio bursts; exoplanet atmospheres; Rubin Observatory transient sky."]}],"connections":["general-relativity","cosmology","nuclear-physics","plasma-physics","black-holes","beyond-standard-model"],"prerequisites":[],"resources":[],"cards":[{"q":"What is the Chandrasekhar limit?","a":"The maximum mass (~1.4 M☉) of a white dwarf supported by electron degeneracy pressure."},{"q":"What did GW170817 establish?","a":"First binary neutron-star merger, with electromagnetic counterparts; GW speed equals c to ~10⁻¹⁵, kilonova r-process, independent H₀ estimate."},{"q":"What did pulsar timing arrays report in 2023?","a":"Evidence for a nanohertz stochastic gravitational-wave background (Hellings–Downs correlation), likely from supermassive black-hole binaries."}],"search":"astrophysics  stars, galaxies, compact objects and the high-energy universe, used as both objects of study and natural laboratories.  "},{"id":"plasma-physics","title":"Plasma Physics","short":null,"domain":"physics","area":"scales","one_liner":"Ionized gases governed by collective electromagnetic forces — 99% of visible matter and the route to fusion energy.","summary":"Plasmas are described by kinetic theory (Vlasov) and magnetohydrodynamics. The field underpins controlled fusion, space weather and much of astrophysics.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do charged-particle collective effects and magnetic fields shape plasma dynamics?","Can a hot plasma be confined long enough for net fusion energy?"]},{"key":"key_results","label":"Fundamental results","value":["Debye screening; plasma frequency; Landau damping (collisionless damping, Landau 1946).","Magnetohydrodynamics; Alfvén waves (Nobel 1970); magnetic reconnection.","Lawson criterion for fusion ignition."]},{"key":"experiments","label":"Empirical basis","value":["National Ignition Facility achieved target gain &gt; 1 (Dec 2022); JET and tokamak records; Parker Solar Probe."]},{"key":"limits","label":"Limits & open problems","value":["Turbulent transport and instabilities make confinement hard to predict."]},{"key":"applications","label":"Applications","value":["Fusion energy (ITER, stellarators, private ventures), semiconductor etching, space weather forecasting."]},{"key":"frontiers","label":"Where research is going","value":["High-field compact tokamaks with HTS magnets; stellarator optimization (W7-X); AI control of plasmas."]}],"connections":["electromagnetism","hydrodynamics","astrophysics","non-equilibrium"],"prerequisites":[],"resources":[],"cards":[{"q":"What is Landau damping?","a":"Collisionless damping of plasma waves due to resonant energy exchange with particles moving near the phase velocity."},{"q":"What is the Lawson criterion?","a":"The condition on the product of density, temperature and confinement time ($nT\\tau_E$) for fusion power to exceed losses."}],"search":"plasma physics  ionized gases governed by collective electromagnetic forces — 99% of visible matter and the route to fusion energy.  "},{"id":"biophysics","title":"Biological Physics","short":"Biophysics","domain":"physics","area":"scales","one_liner":"Physical principles of living matter, from molecular machines to collective behaviour of cells and organisms.","summary":"Uses statistical mechanics, information theory and non-equilibrium physics to understand how life computes, senses, moves and organizes itself.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do molecular machines work reliably in a noisy thermal environment?","How do cells sense, compute and make decisions near physical limits?","What physical principles govern morphogenesis and collective motion?"]},{"key":"key_results","label":"Fundamental results","value":["Berg–Purcell limit on chemical sensing; kinetic proofreading (Hopfield, Ninio 1974).","Turing patterns (1952) for morphogenesis.","Protein folding funnels; AlphaFold structure prediction (Nobel Chemistry 2024).","Hopfield networks as associative memory (Nobel Physics 2024)."]},{"key":"experiments","label":"Empirical basis","value":["Optical tweezers on molecular motors (kinesin steps of 8 nm); single-molecule fluorescence; flocking of starlings (STARFLAG)."]},{"key":"limits","label":"Limits & open problems","value":["Biological complexity resists minimal models; data-rich but theory-poor."]},{"key":"applications","label":"Applications","value":["Drug design, synthetic biology, neuroscience, medical imaging."]},{"key":"frontiers","label":"Where research is going","value":["Physics of learning in neural systems; active matter in tissues; information-theoretic optimality in development."]}],"connections":["statistical-mechanics","non-equilibrium","complex-systems","information-theory","networks"],"prerequisites":[],"resources":[],"cards":[{"q":"What is kinetic proofreading?","a":"Spending free energy (e.g. GTP hydrolysis) on irreversible intermediate steps to amplify discrimination beyond equilibrium limits (Hopfield 1974)."},{"q":"What is a Turing pattern?","a":"A stationary spatial pattern arising from diffusion-driven instability in a reaction–diffusion system with a slowly diffusing activator and a fast inhibitor."}],"search":"biological physics biophysics physical principles of living matter, from molecular machines to collective behaviour of cells and organisms.  "},{"id":"complex-systems","title":"Complex Systems","short":null,"domain":"physics","area":"complex","one_liner":"Many interacting parts producing emergent, often unpredictable collective behaviour — across physics, biology, economics and society.","summary":"A meta-field (associated with the Santa Fe Institute) studying emergence, self-organization, adaptation and heavy-tailed statistics. Tools come from statistical physics, nonlinear dynamics, network theory, agent-based modelling and information theory.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How does collective behaviour emerge from simple local rules?","Are there universal laws (scaling, criticality) across complex systems?","How predictable and controllable are complex adaptive systems?"]},{"key":"key_results","label":"Fundamental results","value":["Self-organized criticality (Bak–Tang–Wiesenfeld 1987, sandpile model).","Scaling laws in biology (Kleiber's law, West–Brown–Enquist) and cities (Bettencourt–West).","Cellular automata and computational universality (Rule 110, Game of Life).","Emergence of cooperation in evolutionary games (Axelrod).","Power laws and their generative mechanisms (preferential attachment, multiplicative processes)."]},{"key":"experiments","label":"Empirical basis","value":["Mostly empirical data analysis (ecosystems, markets, cities, earthquakes — Gutenberg–Richter law) and simulations."]},{"key":"limits","label":"Limits & open problems","value":["Risk of vague universality claims; power laws often over-claimed; models are hard to validate."]},{"key":"applications","label":"Applications","value":["Epidemiology, ecology, urban planning, financial systemic risk, climate, organizational science."]},{"key":"frontiers","label":"Where research is going","value":["Higher-order interactions (hypergraphs); data-driven model discovery; tipping points and early-warning signals; AI systems as complex systems."]}],"connections":["statistical-mechanics","networks","chaos","sociophysics","econophysics","complexity","non-equilibrium","biophysics","dynamical-systems"],"prerequisites":[],"resources":["Mitchell, <em>Complexity: A Guided Tour<\/em>","Thurner, Hanel, Klimek, <em>Introduction to the Theory of Complex Systems<\/em>"],"cards":[{"q":"What is self-organized criticality?","a":"Driven dissipative systems that spontaneously evolve to a critical state with power-law avalanches, without parameter tuning (BTW sandpile)."},{"q":"What is Kleiber's law?","a":"Metabolic rate scales with body mass as $M^{3/4}$ across organisms."},{"q":"What is the Gutenberg–Richter law?","a":"The number of earthquakes of magnitude ≥ M falls as $10^{-bM}$ with $b \\approx 1$ — a power law in released energy."},{"q":"How do cities scale according to Bettencourt and West?","a":"Socioeconomic outputs scale superlinearly with population (exponent ≈ 1.15), infrastructure sublinearly (≈ 0.85)."}],"search":"complex systems  many interacting parts producing emergent, often unpredictable collective behaviour — across physics, biology, economics and society.  "},{"id":"complexity","title":"Complexity (Algorithmic, Computational & Physical)","short":"Complexity","domain":"physics","area":"complex","one_liner":"Quantifying how hard something is to describe, compute or prepare — and why this matters for physics.","summary":"Different notions: Kolmogorov (description length), computational (resources to solve problems), and physical (circuit complexity of quantum states, statistical complexity of processes). Computational complexity limits simulability of physical systems; quantum circuit complexity has been proposed to track the growth of black-hole interiors.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How much information or computation is needed to describe or simulate a system?","Which physical problems are intractable (e.g. NP-hard spin glasses, QMA-hard ground states)?","Does complexity have a geometric or gravitational meaning?"]},{"key":"key_results","label":"Fundamental results","value":["Kolmogorov complexity is uncomputable; connections to Shannon entropy.","Finding Ising spin-glass ground states is NP-hard (Barahona 1982); local Hamiltonian problem is QMA-complete (Kitaev).","Nielsen's geometric approach to circuit complexity.","Complexity = volume / action conjectures (Susskind et al.) for black-hole interiors; Brown–Susskind second law of complexity.","Krylov complexity and operator growth (Parker et al. 2019)."]},{"key":"experiments","label":"Empirical basis","value":["Quantum advantage experiments test where classical simulation becomes intractable."]},{"key":"limits","label":"Limits & open problems","value":["Holographic complexity lacks a precise boundary definition; many notions are not observable."]},{"key":"applications","label":"Applications","value":["Limits of simulation, cryptography, quantum computing benchmarks."]},{"key":"frontiers","label":"Where research is going","value":["Complexity in holography; pseudorandom quantum states and the hardness of the AdS/CFT dictionary; complexity of learning."]}],"connections":["computational-complexity","information-theory","quantum-information","holography","chaos","complex-systems"],"prerequisites":[],"resources":[],"cards":[{"q":"Is Kolmogorov complexity computable?","a":"No — there is no algorithm that computes the shortest description length of an arbitrary string."},{"q":"What is the complexity class of finding the ground-state energy of a local Hamiltonian?","a":"QMA-complete (Kitaev), the quantum analogue of NP."},{"q":"What do \"complexity = volume\" conjectures propose?","a":"The volume of the maximal slice through a black-hole interior is dual to the quantum circuit complexity of the boundary state, growing linearly for exponentially long times."}],"search":"complexity (algorithmic, computational & physical) complexity quantifying how hard something is to describe, compute or prepare — and why this matters for physics.  "},{"id":"networks","title":"Network Science","short":"Networks","domain":"physics","area":"complex","one_liner":"The structure and dynamics of systems best described as nodes and links.","summary":"Real networks (internet, social, biological, financial) share small-world and heavy-tailed degree properties that shape spreading, robustness and synchronization. Statistical physics provides random-graph ensembles, percolation, and community detection methods.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What universal structures do real networks share and why?","How do processes (epidemics, cascades, synchronization) depend on network structure?","How robust are networks to failures and attacks?"]},{"key":"key_results","label":"Fundamental results","value":["Erdős–Rényi random graphs and the giant-component transition at mean degree 1.","Small-world networks (Watts–Strogatz 1998).","Scale-free networks via preferential attachment (Barabási–Albert 1999).","Vanishing epidemic threshold on scale-free networks (Pastor-Satorras–Vespignani 2001).","Robust-yet-fragile: resilient to random failure, vulnerable to targeted hub attacks.","Kuramoto model of synchronization; community detection via modularity and stochastic block models."]},{"key":"experiments","label":"Empirical basis","value":["Empirical datasets (WWW, citation, protein interaction, airline, interbank networks)."]},{"key":"limits","label":"Limits & open problems","value":["Many scale-free claims weak under rigorous statistics (Broido–Clauset 2019); networks ignore higher-order and temporal structure."]},{"key":"applications","label":"Applications","value":["Epidemic modelling, systemic risk in banking, recommendation systems, power grids, neuroscience (connectome)."]},{"key":"frontiers","label":"Where research is going","value":["Higher-order networks (simplicial complexes, hypergraphs), multilayer and temporal networks, network geometry, graph neural networks."]}],"connections":["graph-theory","complex-systems","phase-transitions","sociophysics","econophysics","statistical-mechanics","probability-theory"],"prerequisites":[],"resources":["Barabási, <em>Network Science<\/em> (free online)","Newman, <em>Networks<\/em>"],"cards":[{"q":"At what mean degree does a giant component appear in an Erdős–Rényi graph?","a":"At mean degree $\\langle k\\rangle = 1$ (percolation transition)."},{"q":"What mechanism generates scale-free degree distributions in the Barabási–Albert model?","a":"Growth with preferential attachment (new nodes link proportionally to degree), giving $P(k) \\sim k^{-3}$."},{"q":"Why do scale-free networks have a vanishing epidemic threshold?","a":"The threshold scales as $\\langle k\\rangle/\\langle k^2\\rangle$, and $\\langle k^2\\rangle$ diverges for degree exponents ≤ 3."},{"q":"What does the Kuramoto model describe?","a":"Synchronization of coupled phase oscillators with distributed natural frequencies; above a critical coupling a macroscopic fraction locks."}],"search":"network science networks the structure and dynamics of systems best described as nodes and links.  "},{"id":"sociophysics","title":"Sociophysics","short":null,"domain":"physics","area":"complex","one_liner":"Statistical-physics models of opinions, culture, crowds and collective human behaviour.","summary":"Treats individuals as interacting agents with simple rules, looking for collective phases (consensus, polarization) and universal statistics in social data, increasingly validated with digital trace data.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do opinions, norms and languages spread and reach consensus or polarize?","Are there quantitative regularities in human collective behaviour?"]},{"key":"key_results","label":"Fundamental results","value":["Voter model; Sznajd model; bounded-confidence models (Deffuant, Hegselmann–Krause) producing polarization.","Schelling segregation model (1971): mild preferences give strong segregation.","Axelrod culture model; Ising-like models of social influence; pedestrian social-force model (Helbing).","Universal statistics: turnout distributions, city sizes (Zipf), human mobility scaling."]},{"key":"experiments","label":"Empirical basis","value":["Social-media data, mobile-phone mobility traces, online controlled experiments (e.g. MusicLab, Salganik et al. 2006)."]},{"key":"limits","label":"Limits & open problems","value":["Humans are not spins; model validation is weak; ethical and data-access constraints."]},{"key":"applications","label":"Applications","value":["Crowd safety, misinformation dynamics, policy design, epidemics with behaviour."]},{"key":"frontiers","label":"Where research is going","value":["Echo chambers and algorithmic feedback; higher-order social interactions; computational social science with large-scale data and LLM agents."]}],"connections":["complex-systems","networks","statistical-mechanics","econophysics","phase-transitions"],"prerequisites":[],"resources":[],"cards":[{"q":"What does Schelling's segregation model show?","a":"Even mild individual preferences for similar neighbours lead to strong macroscopic segregation."},{"q":"What is the voter model?","a":"Agents adopt a random neighbour's opinion; on lattices in d ≤ 2 it coarsens to consensus."},{"q":"What do bounded-confidence models produce?","a":"Agents only interact if opinions are close enough, leading to clustering into consensus, polarization or fragmentation depending on the confidence threshold."}],"search":"sociophysics  statistical-physics models of opinions, culture, crowds and collective human behaviour.  "},{"id":"econophysics","title":"Econophysics & Physics of Finance","short":"Econophysics","domain":"physics","area":"complex","one_liner":"Statistical-physics methods applied to markets, prices and wealth.","summary":"Born from the observation that asset returns have heavy tails and volatility clustering, econophysics imports scaling, random-matrix and agent-based ideas into finance. Its toolbox overlaps strongly with quantitative research: stochastic processes, RMT cleaning, market microstructure and price impact.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What are the universal statistical properties (stylized facts) of financial markets?","How do prices form from order flow, and what is the impact of trades?","Where do crises and instabilities come from?"]},{"key":"key_results","label":"Fundamental results","value":["Bachelier (1900): random-walk model of prices, five years before Einstein's Brownian motion.","Stylized facts: fat-tailed returns (tail exponent ≈ 3, Gopikrishnan et al.), volatility clustering, absence of linear autocorrelation, leverage effect.","Square-root law of market impact: $\\Delta p \\propto \\sigma\\sqrt{Q/V}$.","RMT cleaning of correlation matrices (Laloux, Bouchaud et al. 1999).","Minority game and agent-based models; Pareto law of wealth."]},{"key":"experiments","label":"Empirical basis","value":["High-frequency order-book data; flash crash of 2010 as empirical case study."]},{"key":"limits","label":"Limits & open problems","value":["Markets are reflexive and non-stationary; universal laws are approximate."]},{"key":"applications","label":"Applications","value":["Risk management, portfolio construction, execution algorithms, systemic-risk monitoring."]},{"key":"frontiers","label":"Where research is going","value":["Microstructure with large datasets; endogeneity and Hawkes processes; deep learning for limit order books; climate-finance risk."]}],"connections":["stochastic-processes","random-matrix-theory","complex-systems","networks","statistical-mechanics","sociophysics","probability-theory"],"prerequisites":[],"resources":["Bouchaud &amp; Potters, <em>Theory of Financial Risk and Derivative Pricing<\/em>","Bouchaud, Bonart, Donier, Gould, <em>Trades, Quotes and Prices<\/em>"],"cards":[{"q":"Name three stylized facts of asset returns.","a":"Heavy-tailed distributions (tail exponent ≈ 3), volatility clustering (long memory in |r|), and near-zero linear autocorrelation of returns."},{"q":"What is the square-root law of market impact?","a":"The price impact of a metaorder of size Q scales as $\\sigma\\sqrt{Q/V}$, where V is daily volume."},{"q":"Who first modelled prices as a random walk?","a":"Louis Bachelier, in his 1900 thesis <em>Théorie de la spéculation<\/em>."},{"q":"What is a Hawkes process used for in finance?","a":"Self-exciting point process modelling clustered arrivals of orders/trades; its near-critical branching ratio reflects market endogeneity."}],"search":"econophysics & physics of finance econophysics statistical-physics methods applied to markets, prices and wealth.  "},{"id":"logic-set-theory","title":"Logic & Set Theory","short":"Logic & sets","domain":"math","area":"foundations","one_liner":"What a proof is, what can be proven, and the universe of sets in which most mathematics is built.","summary":"Mathematical logic studies formal systems: proof theory, model theory, computability and set theory. Its landmark results are limitative — Gödel, Turing, Cohen — showing that no consistent formal system captures all mathematical truth and that some questions (the continuum hypothesis) are independent of ZFC.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What is a proof, and what can formal systems prove?","What is computable?","What are the foundations of mathematics (sets, types, categories), and which axioms should we accept?"]},{"key":"key_results","label":"Fundamental results","value":["Gödel's completeness theorem (1929) and incompleteness theorems (1931).","Turing (1936): the halting problem is undecidable; Church–Turing thesis.","ZFC axioms; Cantor's diagonal argument; cardinal and ordinal arithmetic.","Gödel (1940) and Cohen (1963, forcing): the continuum hypothesis is independent of ZFC.","Löwenheim–Skolem and compactness theorems in model theory.","Curry–Howard correspondence: proofs as programs; homotopy type theory as alternative foundation."]},{"key":"motivating_examples","label":"Motivating examples","value":["Russell's paradox prompting axiomatic set theory; Hilbert's program for a complete consistent foundation."]},{"key":"limits","label":"Limits & open problems","value":["Incompleteness shows no single formal system settles all questions; large-cardinal axioms are needed for some statements."]},{"key":"applications","label":"Applications","value":["Theory of computation, programming language semantics, proof assistants (Lean, Coq), databases, verification."]},{"key":"frontiers","label":"Where research is going","value":["Formalization of mathematics in Lean (mathlib, Fermat's Last Theorem project); large cardinals and inner model theory; AI-assisted theorem proving."]}],"connections":["category-theory","computational-complexity","information-theory"],"prerequisites":[],"resources":["Enderton, <em>A Mathematical Introduction to Logic<\/em>","Kunen, <em>Set Theory<\/em>"],"cards":[{"q":"State Gödel's first incompleteness theorem.","a":"Any consistent, effectively axiomatized theory containing basic arithmetic has true statements it cannot prove."},{"q":"What does Gödel's second incompleteness theorem say?","a":"Such a theory cannot prove its own consistency."},{"q":"What is the status of the continuum hypothesis?","a":"Independent of ZFC — consistent (Gödel, constructible universe) and its negation consistent (Cohen, forcing)."},{"q":"What is the Curry–Howard correspondence?","a":"Propositions correspond to types and proofs to programs (terms) of those types."},{"q":"What did Turing prove in 1936?","a":"No algorithm decides whether an arbitrary Turing machine halts; hence Hilbert's Entscheidungsproblem is unsolvable."}],"search":"logic & set theory logic & sets what a proof is, what can be proven, and the universe of sets in which most mathematics is built.  "},{"id":"category-theory","title":"Category Theory","short":null,"domain":"math","area":"foundations","one_liner":"The mathematics of structure and composition — objects, morphisms, functors and universal properties.","summary":"Introduced by Eilenberg and Mac Lane (1945) for algebraic topology, it became the organizing language of algebraic geometry (Grothendieck), homological algebra, logic and now physics (TQFTs, generalized symmetries) and computer science. Higher categories capture homotopy-coherent structure.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What is common to constructions across different fields?","How can mathematical objects be characterized by their relations (universal properties)?","What is the right framework for homotopy-coherent and higher-dimensional algebra?"]},{"key":"key_results","label":"Fundamental results","value":["Yoneda lemma: an object is determined by the functor it represents.","Adjoint functors; limits and colimits; equivalence of categories.","Abelian and derived categories; homological algebra.","Grothendieck toposes and sheaves; elementary topos as foundations of logic.","Atiyah–Segal axioms: a TQFT is a symmetric monoidal functor from cobordisms to vector spaces; cobordism hypothesis (Baez–Dolan; Lurie).","∞-categories (Joyal, Lurie) for homotopy theory."]},{"key":"motivating_examples","label":"Motivating examples","value":["Homology as a functor from spaces to groups; fundamental group; duality of vector spaces."]},{"key":"limits","label":"Limits & open problems","value":["Abstraction can obscure concrete computation; higher-categorical foundations are technically heavy."]},{"key":"applications","label":"Applications","value":["Functional programming (monads), database theory, TQFT and anyons (modular tensor categories), generalized symmetries, applied category theory."]},{"key":"frontiers","label":"Where research is going","value":["Higher categories in physics (fusion 2-categories for symmetries), condensed mathematics (Clausen–Scholze), univalent foundations."]}],"connections":["logic-set-theory","topology","algebraic-geometry","group-theory","symmetries","topological-phases"],"prerequisites":[],"resources":["Riehl, <em>Category Theory in Context<\/em> (free online)","Mac Lane, <em>Categories for the Working Mathematician<\/em>"],"cards":[{"q":"State the Yoneda lemma.","a":"For a functor $F: C^{op} \\to \\mathbf{Set}$, natural transformations $\\mathrm{Hom}(-,A) \\Rightarrow F$ correspond bijectively to elements of $F(A)$; hence $A \\mapsto \\mathrm{Hom}(-,A)$ is fully faithful."},{"q":"What is an adjunction?","a":"Functors $F \\dashv G$ with natural bijections $\\mathrm{Hom}(FX, Y) \\cong \\mathrm{Hom}(X, GY)$ (e.g. free ⊣ forgetful)."},{"q":"What is a TQFT in categorical terms?","a":"A symmetric monoidal functor from a cobordism category to vector spaces (Atiyah–Segal)."},{"q":"What category describes anyons in a 2D topological phase?","a":"A unitary modular tensor category."}],"search":"category theory  the mathematics of structure and composition — objects, morphisms, functors and universal properties.  "},{"id":"group-theory","title":"Algebra (Groups, Rings, Fields)","short":"Algebra","domain":"math","area":"algebra","one_liner":"The study of algebraic structures and their symmetries, from groups to rings, fields and modules.","summary":"Abstract algebra formalizes symmetry (groups), arithmetic (rings and fields) and linear structure (modules). Galois theory links field extensions to groups; the classification of finite simple groups is one of the largest collective proofs ever.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What are the possible symmetry groups and how are they built from simple pieces?","When can polynomial equations be solved by radicals?","What are the structures of rings, fields and their ideals?"]},{"key":"key_results","label":"Fundamental results","value":["Lagrange, Sylow theorems; Jordan–Hölder; isomorphism theorems.","Galois theory: the general quintic is not solvable by radicals (Abel–Ruffini; Galois).","Classification of finite simple groups (completed ~2004): cyclic, alternating, Lie type, 26 sporadic (largest: the Monster).","Structure theorem for finitely generated modules over a PID; Hilbert's basis theorem and Nullstellensatz.","Monstrous moonshine (Borcherds 1992): Monster representations ↔ coefficients of the j-function, via a vertex operator algebra (a CFT)."]},{"key":"motivating_examples","label":"Motivating examples","value":["Symmetries of crystals and molecules; Rubik's cube; solving cubic and quartic equations."]},{"key":"limits","label":"Limits & open problems","value":["Infinite groups are wildly diverse; many classification problems are undecidable (word problem, Novikov–Boone)."]},{"key":"applications","label":"Applications","value":["Cryptography (finite fields, elliptic curves), coding theory, crystallography, particle physics symmetries."]},{"key":"frontiers","label":"Where research is going","value":["Geometric group theory, representation stability, condensed mathematics."]}],"connections":["linear-algebra","lie-theory","number-theory","algebraic-geometry","symmetries","category-theory"],"prerequisites":[],"resources":["Dummit &amp; Foote, <em>Abstract Algebra<\/em>","Artin, <em>Algebra<\/em>"],"cards":[{"q":"Why is the general quintic not solvable by radicals?","a":"Its Galois group $S_5$ is not solvable ($A_5$ is simple and non-abelian)."},{"q":"What are the families in the classification of finite simple groups?","a":"Cyclic groups of prime order, alternating groups $A_n$ ($n\\ge5$), groups of Lie type, and 26 sporadic groups."},{"q":"What is monstrous moonshine?","a":"The coefficients of the modular j-function decompose into dimensions of Monster group representations, explained by Borcherds via a vertex operator algebra (string-theory/CFT construction)."},{"q":"State Sylow's first theorem.","a":"If $p^k$ is the highest power of a prime $p$ dividing $|G|$, then $G$ has a subgroup of order $p^k$."}],"search":"algebra (groups, rings, fields) algebra the study of algebraic structures and their symmetries, from groups to rings, fields and modules.  "},{"id":"linear-algebra","title":"Linear Algebra & Representation Theory","short":"Linear algebra","domain":"math","area":"algebra","one_liner":"Vector spaces, linear maps and how groups and algebras act on them.","summary":"The most-used mathematics in science: eigenvalues, decompositions and tensor products are the language of quantum mechanics, data analysis and numerical computation. Representation theory studies groups acting linearly, decomposing symmetry into irreducible pieces.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How can linear maps be classified and decomposed?","How do groups act on vector spaces, and what are their irreducible representations?"]},{"key":"key_results","label":"Fundamental results","value":["Spectral theorem; Jordan normal form; singular value decomposition; Cayley–Hamilton.","Tensor products, exterior algebras, determinants.","Maschke's theorem: representations of finite groups (char 0) are completely reducible.","Character theory: number of irreps = number of conjugacy classes; Schur's lemma; orthogonality relations.","Peter–Weyl theorem for compact groups."]},{"key":"motivating_examples","label":"Motivating examples","value":["Normal modes of oscillation; principal component analysis; angular momentum addition (Clebsch–Gordan)."]},{"key":"limits","label":"Limits & open problems","value":["Infinite-dimensional and modular (char p) representation theory are much harder."]},{"key":"applications","label":"Applications","value":["Quantum mechanics, machine learning, signal processing, graph spectral methods, numerical simulation."]},{"key":"frontiers","label":"Where research is going","value":["Geometric representation theory; randomized numerical linear algebra; tensor decompositions."]}],"connections":["group-theory","lie-theory","functional-analysis","quantum-mechanics","numerical-analysis","random-matrix-theory"],"prerequisites":[],"resources":["Axler, <em>Linear Algebra Done Right<\/em>","Fulton &amp; Harris, <em>Representation Theory<\/em>"],"cards":[{"q":"What is the singular value decomposition?","a":"Any real/complex matrix factors as $A = U\\Sigma V^\\dagger$ with unitary U, V and non-negative diagonal Σ."},{"q":"What does Schur's lemma say?","a":"Intertwiners between irreducible representations are zero or isomorphisms; over ℂ, self-intertwiners of an irrep are scalars."},{"q":"How many irreducible complex representations does a finite group have?","a":"As many as conjugacy classes."},{"q":"What does the Peter–Weyl theorem state?","a":"Matrix coefficients of irreps of a compact group form an orthonormal basis of $L^2(G)$, generalizing Fourier series."}],"search":"linear algebra & representation theory linear algebra vector spaces, linear maps and how groups and algebras act on them.  "},{"id":"lie-theory","title":"Lie Groups & Lie Algebras","short":"Lie theory","domain":"math","area":"algebra","one_liner":"Continuous symmetry groups and their infinitesimal generators.","summary":"Lie groups are groups that are smooth manifolds; their Lie algebras linearize them. Cartan and Killing classified simple Lie algebras via root systems and Dynkin diagrams. Lie theory is the mathematical backbone of gauge theory and particle classification.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What are the continuous symmetry groups and how are they classified?","What are their representations?"]},{"key":"key_results","label":"Fundamental results","value":["Lie's correspondence: simply connected Lie groups ↔ Lie algebras.","Killing–Cartan classification of complex simple Lie algebras: $A_n, B_n, C_n, D_n$ and exceptional $G_2, F_4, E_6, E_7, E_8$.","Highest-weight theory; Weyl character formula; Borel–Weil–Bott.","Kac–Moody and affine Lie algebras; Virasoro algebra."]},{"key":"motivating_examples","label":"Motivating examples","value":["Rotation group SO(3) and spin SU(2); Lorentz group; SU(3) flavour (Eightfold Way)."]},{"key":"limits","label":"Limits & open problems","value":["Unitary representations of non-compact groups (e.g. Lorentz) are infinite-dimensional and subtle."]},{"key":"applications","label":"Applications","value":["Gauge theories and the Standard Model, quantum mechanics (angular momentum), robotics, control theory."]},{"key":"frontiers","label":"Where research is going","value":["Geometric Langlands; quantum groups; exceptional structures in physics (E₈ in heterotic strings)."]}],"connections":["group-theory","linear-algebra","differential-geometry","gauge-theory","symmetries","number-theory"],"prerequisites":["group-theory","linear-algebra"],"resources":[],"cards":[{"q":"What are the exceptional simple Lie algebras?","a":"$G_2, F_4, E_6, E_7, E_8$."},{"q":"Which Lie group double-covers SO(3), and why does it matter physically?","a":"SU(2); its half-integer representations describe spin-1/2 particles."},{"q":"What does a Dynkin diagram encode?","a":"The simple roots of a semisimple Lie algebra and the angles between them (Cartan matrix)."},{"q":"Which gauge group did Gell-Mann's Eightfold Way use (as flavour symmetry)?","a":"SU(3), with hadrons in octets and decuplets; predicted the Ω⁻."}],"search":"lie groups & lie algebras lie theory continuous symmetry groups and their infinitesimal generators.  "},{"id":"number-theory","title":"Number Theory","short":null,"domain":"math","area":"algebra","one_liner":"Properties of the integers and primes, studied with tools from algebra, analysis and geometry.","summary":"Simple questions with deep answers. Analytic number theory studies prime distribution via the zeta function; algebraic number theory studies number fields; arithmetic geometry studies Diophantine equations through geometry. The Langlands program connects them all with representation theory.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How are the primes distributed?","When do polynomial equations have integer or rational solutions?","What hidden symmetries link Galois representations, automorphic forms and L-functions?"]},{"key":"key_results","label":"Fundamental results","value":["Prime number theorem $\\pi(x) \\sim x/\\ln x$ (Hadamard, de la Vallée Poussin 1896).","Quadratic reciprocity; class field theory.","Fermat's Last Theorem (Wiles 1995) via modularity of semistable elliptic curves.","Mor
