 this structure.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["Given forces or a Lagrangian, how does a system evolve in time?","Which quantities are conserved, and why (symmetry)?","When is motion integrable (solvable by quadratures) and when is it chaotic?","What is the geometric structure (phase space, symplectic form, Poisson bracket) behind dynamics?"]},{"key":"key_results","label":"Fundamental results","value":["Newton's laws; Galilean invariance.","Principle of stationary action: $\\delta S = 0$ gives the Euler–Lagrange equations.","Noether's theorem: continuous symmetry implies a conserved quantity (time → energy, space → momentum, rotation → angular momentum).","Hamiltonian mechanics, Poisson brackets, canonical transformations, Hamilton–Jacobi equation.","Liouville's theorem: Hamiltonian flow preserves phase-space volume.","Liouville–Arnold theorem: $n$ independent commuting integrals ⇒ motion on invariant tori (action–angle variables).","KAM theorem: most invariant tori survive small non-integrable perturbations.","Kepler problem and its hidden SO(4) symmetry (Laplace–Runge–Lenz vector)."]},{"key":"experiments","label":"Empirical basis","value":["Planetary motion (Kepler's laws) and celestial mechanics, including the prediction of Neptune (1846).","<a class=\"ref\" href=\"#exp-cavendish\">Cavendish Torsion Balance<\/a> measured Newton's constant $G$.","Foucault pendulum: Earth's rotation; non-inertial frames."]},{"key":"limits","label":"Limits & open problems","value":["Fails at high speeds (→ <a class=\"ref\" href=\"#special-relativity\">Special Relativity<\/a>), small scales (→ <a class=\"ref\" href=\"#quantum-mechanics\">Quantum Mechanics<\/a>), strong gravity (→ <a class=\"ref\" href=\"#general-relativity\">General Relativity<\/a>).","Long-time prediction is impossible for chaotic systems despite determinism.","The many-body problem is generically non-integrable; one needs statistical methods."]},{"key":"applications","label":"Applications","value":["Orbital mechanics and spacecraft navigation, robotics, engineering dynamics.","Molecular dynamics simulations; symplectic integrators.","Accelerator beam dynamics; plasma confinement."]},{"key":"frontiers","label":"Where research is going","value":["Mostly a mature field; active work in geometric mechanics, symplectic topology (Arnold conjecture, Floer theory) and celestial mechanics (n-body stability).","Structure-preserving numerical methods and learning Hamiltonian dynamics from data."]}],"connections":["chaos","classical-field-theory","symmetries","differential-geometry","dynamical-systems","statistical-mechanics","quantum-mechanics"],"prerequisites":[],"resources":["Landau &amp; Lifshitz, <em>Mechanics<\/em> (Vol. 1)","Arnold, <em>Mathematical Methods of Classical Mechanics<\/em>","Goldstein, <em>Classical Mechanics<\/em>"],"cards":[{"q":"What does Noether's theorem state?","a":"Every continuous (differentiable) symmetry of the action corresponds to a conserved current/quantity."},{"q":"Which symmetry gives energy conservation? Which gives angular momentum?","a":"Time-translation invariance → energy; rotational invariance → angular momentum."},{"q":"What does Liouville's theorem say about Hamiltonian flow?","a":"It preserves phase-space volume (the symplectic form, hence the Liouville measure)."},{"q":"What does the Liouville–Arnold theorem guarantee for an integrable system with $n$ degrees of freedom?","a":"With $n$ independent Poisson-commuting conserved quantities, bounded motion lies on $n$-tori and can be written in action–angle variables."},{"q":"What does the KAM theorem say?","a":"Under small smooth perturbations of an integrable Hamiltonian, most invariant tori (those with sufficiently irrational frequencies) survive, slightly deformed."},{"q":"What extra conserved vector does the Kepler problem have, and what symmetry does it signal?","a":"The Laplace–Runge–Lenz vector; a hidden SO(4) symmetry for bound orbits (why orbits close)."},{"q":"What is the geometric object underlying Hamiltonian mechanics?","a":"A symplectic manifold (phase space) with a closed non-degenerate 2-form; the Hamiltonian generates a flow via $\\iota_{X_H}\\omega = dH$."}],"search":"classical mechanics  how bodies move under forces, reformulated as the geometry of phase space.  "},{"id":"special-relativity","title":"Special Relativity","short":null,"domain":"physics","area":"classical","one_liner":"Physics is the same in all inertial frames and the speed of light is invariant, so space and time merge into Minkowski spacetime.","summary":"Einstein (1905) replaced Galilean invariance with Lorentz invariance. Simultaneity becomes relative, time dilates and lengths contract, and energy and mass are equivalent. Lorentz (Poincaré) symmetry is a non-negotiable input for every fundamental theory built later.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do measurements of space and time relate between observers in uniform motion?","What is the correct dynamics at speeds close to $c$?","How do energy, momentum and mass relate?"]},{"key":"key_results","label":"Fundamental results","value":["Lorentz transformations; the invariant interval $ds^2 = -c^2dt^2 + d\\vec x^2$.","Relativity of simultaneity, time dilation, length contraction.","$E^2 = (pc)^2 + (mc^2)^2$; $E = mc^2$ at rest.","Maxwell's equations are already Lorentz invariant; mechanics had to change.","The Poincaré group as the symmetry of flat spacetime; particles classified by its representations (Wigner)."]},{"key":"experiments","label":"Empirical basis","value":["<a class=\"ref\" href=\"#exp-michelson-morley\">Michelson–Morley Experiment<\/a>: no ether wind.","Time dilation of cosmic-ray muons; Ives–Stilwell experiment; atomic clocks on aircraft (Hafele–Keating 1971).","Particle accelerators verify relativistic kinematics daily."]},{"key":"limits","label":"Limits & open problems","value":["Assumes flat spacetime; gravity requires <a class=\"ref\" href=\"#general-relativity\">General Relativity<\/a>.","Classical; combining it with quantum mechanics forces <a class=\"ref\" href=\"#qft\">Quantum Field Theory<\/a> (particle number is not conserved)."]},{"key":"applications","label":"Applications","value":["GPS (together with GR corrections), accelerator design, nuclear energy bookkeeping, synchrotron radiation."]},{"key":"frontiers","label":"Where research is going","value":["Precision tests of Lorentz invariance (Standard-Model Extension), motivated by quantum-gravity models that might break it."]}],"connections":["electromagnetism","general-relativity","qft","symmetries","classical-mechanics"],"prerequisites":["classical-mechanics","electromagnetism"],"resources":[],"cards":[{"q":"What are the two postulates of special relativity?","a":"The laws of physics are the same in all inertial frames; the speed of light in vacuum is the same for all inertial observers."},{"q":"Write the relativistic energy–momentum relation.","a":"$E^2 = (pc)^2 + (mc^2)^2$"},{"q":"What group is the full symmetry of Minkowski spacetime?","a":"The Poincaré group (Lorentz transformations + translations)."},{"q":"How did Wigner use the Poincaré group?","a":"Elementary particles are unitary irreducible representations of the Poincaré group, labelled by mass and spin (or helicity if massless)."},{"q":"Which everyday technology needs both special and general relativistic clock corrections?","a":"GPS (SR slows satellite clocks by ~7 μs/day, GR speeds them up by ~45 μs/day)."}],"search":"special relativity  physics is the same in all inertial frames and the speed of light is invariant, so space and time merge into minkowski spacetime.  "},{"id":"electromagnetism","title":"Classical Electromagnetism","short":null,"domain":"physics","area":"classical","one_liner":"Maxwell's equations unify electricity, magnetism and light as one Lorentz-invariant gauge field.","summary":"Maxwell's theory is the prototype of every field theory: local, relativistic, and a U(1) gauge theory. Light is an electromagnetic wave. The potentials $A_\\mu$ carry gauge redundancy, a structure later generalized to Yang–Mills theory.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do charges and currents create fields, and how do fields act on charges?","What is light?","How does electromagnetic energy and momentum propagate?"]},{"key":"key_results","label":"Fundamental results","value":["Maxwell's equations; in covariant form $\\partial_\\mu F^{\\mu\\nu} = J^\\nu$, $dF = 0$.","Electromagnetic waves travel at $c = 1/\\sqrt{\\mu_0\\epsilon_0}$.","Gauge invariance $A_\\mu \\to A_\\mu + \\partial_\\mu \\lambda$; charge conservation.","Poynting theorem; radiation from accelerated charges (Larmor formula).","Electric–magnetic duality of the source-free equations; Dirac's argument that a magnetic monopole would quantize charge."]},{"key":"experiments","label":"Empirical basis","value":["Faraday's induction (1831), Hertz's radio waves (1887), Ørsted's deflected compass.","<a class=\"ref\" href=\"#exp-michelson-morley\">Michelson–Morley Experiment<\/a> (no medium for light)."]},{"key":"limits","label":"Limits & open problems","value":["Self-force of a point charge (Abraham–Lorentz) is pathological; resolved only partly by QED.","Cannot explain blackbody radiation, photoelectric effect, atomic stability → <a class=\"ref\" href=\"#quantum-mechanics\">Quantum Mechanics<\/a>."]},{"key":"applications","label":"Applications","value":["All of electrical engineering, optics, telecommunications, antennas, MRI, accelerators."]},{"key":"frontiers","label":"Where research is going","value":["Metamaterials and transformation optics; topological photonics; nonlinear and strong-field electrodynamics."]}],"connections":["special-relativity","classical-field-theory","gauge-theory","qft","amo-physics","plasma-physics"],"prerequisites":[],"resources":[],"cards":[{"q":"Write Maxwell's equations in covariant form.","a":"$\\partial_\\mu F^{\\mu\\nu} = J^\\nu$ and $\\partial_{[\\lambda} F_{\\mu\\nu]} = 0$ (i.e. $dF=0$), with $F = dA$."},{"q":"What is the gauge symmetry of electromagnetism?","a":"U(1): $A_\\mu \\to A_\\mu + \\partial_\\mu\\lambda$ leaves $F_{\\mu\\nu}$ invariant."},{"q":"What did Dirac show about magnetic monopoles?","a":"The existence of a single monopole would force electric charge to be quantized ($eg = 2\\pi n$ in natural units)."},{"q":"Why did electromagnetism push physics towards relativity?","a":"Maxwell's equations are Lorentz-invariant, not Galilean-invariant, and predict a fixed speed of light."}],"search":"classical electromagnetism  maxwell's equations unify electricity, magnetism and light as one lorentz-invariant gauge field.  "},{"id":"classical-field-theory","title":"Classical Field Theory","short":null,"domain":"physics","area":"classical","one_liner":"Dynamics of continuous fields defined at every point of spacetime, derived from a local action.","summary":"The Lagrangian formalism extended to infinitely many degrees of freedom. Fields, Lagrangian densities, Noether currents, solitons and instantons all live here. It is the classical starting point that <a class=\"ref\" href=\"#qft\">Quantum Field Theory<\/a> quantizes and <a class=\"ref\" href=\"#general-relativity\">General Relativity<\/a> geometrizes.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do we describe systems with infinitely many degrees of freedom and local interactions?","What are the conserved currents and stress-energy of a field?","What non-perturbative classical solutions (solitons, instantons, vortices) exist?"]},{"key":"key_results","label":"Fundamental results","value":["Field Euler–Lagrange equations from $S = \\int d^4x\\, \\mathcal{L}(\\phi, \\partial\\phi)$.","Noether currents and the canonical/Belinfante stress-energy tensor.","Klein–Gordon, Dirac (as classical field), Maxwell, Yang–Mills, Einstein–Hilbert actions.","Spontaneous symmetry breaking at the classical level; Goldstone modes; Higgs mechanism.","Topological solitons: kinks, vortices, monopoles (’t Hooft–Polyakov), instantons; classification by homotopy groups."]},{"key":"experiments","label":"Empirical basis","value":["Indirect, through electromagnetism, elasticity, fluids and gravity, which are all classical field theories."]},{"key":"limits","label":"Limits & open problems","value":["Classical; quantum fluctuations and renormalization require <a class=\"ref\" href=\"#qft\">Quantum Field Theory<\/a>."]},{"key":"applications","label":"Applications","value":["Elasticity, fluid dynamics, electromagnetism, gravitational waves, nonlinear optics, cosmological scalar fields (inflation)."]},{"key":"frontiers","label":"Where research is going","value":["Soliton dynamics, integrable field theories, geometric formulations (jet bundles, covariant phase space)."]}],"connections":["classical-mechanics","electromagnetism","qft","gauge-theory","hydrodynamics","topology","symmetries"],"prerequisites":["classical-mechanics","special-relativity"],"resources":[],"cards":[{"q":"What labels topological solitons in a field theory?","a":"Homotopy classes of maps from the boundary at infinity to the vacuum manifold (e.g. $\\pi_0$ kinks, $\\pi_1$ vortices, $\\pi_2$ monopoles, $\\pi_3$ instantons/skyrmions)."},{"q":"What is the Higgs mechanism at the classical level?","a":"When a gauged symmetry is spontaneously broken, the would-be Goldstone bosons are absorbed as longitudinal modes of massive gauge fields."},{"q":"What is the Goldstone theorem (classical statement)?","a":"Each spontaneously broken continuous global symmetry generator gives a massless mode (in Lorentz-invariant theories)."}],"search":"classical field theory  dynamics of continuous fields defined at every point of spacetime, derived from a local action.  "},{"id":"thermodynamics","title":"Thermodynamics","short":null,"domain":"physics","area":"classical","one_liner":"Universal laws for energy, heat and entropy that hold regardless of microscopic details.","summary":"A phenomenological theory of equilibrium built on four laws. Its universality is the reason it survived every revolution: it constrains black holes, information processing and the early universe alike. <a class=\"ref\" href=\"#statistical-mechanics\">Statistical Mechanics<\/a> explains it microscopically.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What can and cannot be done with heat and work?","Why do processes have a direction in time?","What are the equilibrium states of macroscopic systems and their response functions?"]},{"key":"key_results","label":"Fundamental results","value":["Zeroth to third laws; entropy as a state function; $dU = TdS - pdV + \\mu dN$.","Carnot efficiency $1 - T_c/T_h$ is the maximum for any heat engine.","Thermodynamic potentials, Legendre transforms and Maxwell relations.","Landauer's principle: erasing one bit costs at least $k_BT\\ln 2$ of dissipated heat.","Black-hole thermodynamics: $S = A/4G\\hbar$ (Bekenstein–Hawking)."]},{"key":"experiments","label":"Empirical basis","value":["Joule's mechanical equivalent of heat; calorimetry; low-temperature physics approaching absolute zero.","Experimental tests of Landauer's principle with colloidal particles (Bérut et al. 2012)."]},{"key":"limits","label":"Limits & open problems","value":["Describes equilibrium; far-from-equilibrium systems need <a class=\"ref\" href=\"#non-equilibrium\">Non-Equilibrium Statistical Physics<\/a> statistical physics.","Fluctuations matter for small systems (stochastic thermodynamics)."]},{"key":"applications","label":"Applications","value":["Engines, refrigeration, chemistry, materials, climate, computation energy bounds."]},{"key":"frontiers","label":"Where research is going","value":["Quantum thermodynamics (resource theories, quantum heat engines), stochastic thermodynamics, thermodynamics of computation and of black holes."]}],"connections":["statistical-mechanics","black-holes","quantum-information","non-equilibrium"],"prerequisites":[],"resources":[],"cards":[{"q":"State the second law in terms of entropy.","a":"The entropy of an isolated system never decreases."},{"q":"What is the Carnot efficiency?","a":"$\\eta = 1 - T_c/T_h$, the maximum efficiency of any heat engine between two reservoirs."},{"q":"What is Landauer's principle?","a":"Logically irreversible erasure of one bit dissipates at least $k_B T \\ln 2$ of heat."},{"q":"What is the Bekenstein–Hawking entropy?","a":"$S_{BH} = \\frac{k_B c^3 A}{4 G \\hbar}$: a quarter of the horizon area in Planck units."}],"search":"thermodynamics  universal laws for energy, heat and entropy that hold regardless of microscopic details.  "},{"id":"hydrodynamics","title":"Hydrodynamics","short":null,"domain":"physics","area":"classical","one_liner":"The universal effective theory of conserved quantities at long wavelengths and late times.","summary":"Classically, the Navier–Stokes equations for fluids. In modern language hydrodynamics is an <a class=\"ref\" href=\"#effective-field-theory\">Effective Field Theory<\/a>: a gradient expansion of conserved currents around local equilibrium. It describes water and air, but also the quark–gluon plasma, electron fluids in graphene, and black-hole horizons (fluid/gravity correspondence).","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do conserved densities (energy, momentum, charge) relax at long distances and late times?","How does turbulence arise and what are its statistical laws?","Which systems behave as nearly perfect fluids, and why?"]},{"key":"key_results","label":"Fundamental results","value":["Euler and Navier–Stokes equations; Reynolds number as control parameter.","Kolmogorov 1941: energy cascade with spectrum $E(k) \\propto k^{-5/3}$ in the inertial range.","Relativistic hydrodynamics (Israel–Stewart, BRSSS) and the gradient expansion.","Holography: $\\eta/s = 1/4\\pi$ for a large class of strongly coupled plasmas (KSS).","Hydrodynamics as EFT: Schwinger–Keldysh effective actions (Crossley–Glorioso–Liu, Haehl–Loganayagam–Rangamani)."]},{"key":"experiments","label":"Empirical basis","value":["Wind tunnels, turbulence experiments (von Kármán flow, grid turbulence).","RHIC and LHC heavy-ion collisions: elliptic flow shows the quark–gluon plasma is an almost perfect fluid.","Electron hydrodynamics in graphene (viscous flow, negative nonlocal resistance)."]},{"key":"limits","label":"Limits & open problems","value":["Global regularity of 3D Navier–Stokes is an open Millennium problem.","Turbulence has no first-principles theory of intermittency (deviations from K41).","Breaks down when gradients are comparable to the mean free path."]},{"key":"applications","label":"Applications","value":["Aerodynamics, weather and climate, oceanography, astrophysical flows, blood flow, heavy-ion physics."]},{"key":"frontiers","label":"Where research is going","value":["Hydrodynamic EFTs with fluctuations; hydrodynamic attractors; fracton and dipole-conserving hydrodynamics.","Machine learning for turbulence closure; rigorous results on Euler blow-up (computer-assisted proofs)."]}],"connections":["effective-field-theory","holography","statistical-mechanics","non-equilibrium","chaos","pde","nuclear-physics"],"prerequisites":["classical-field-theory","thermodynamics"],"resources":[],"cards":[{"q":"In modern language, what is hydrodynamics?","a":"The effective theory of conserved currents organized as a derivative expansion around local thermal equilibrium."},{"q":"What is the Kolmogorov 1941 energy spectrum of turbulence?","a":"$E(k) \\propto \\varepsilon^{2/3} k^{-5/3}$ in the inertial range."},{"q":"What value of $\\eta/s$ does holography give, and why is it interesting?","a":"$\\eta/s = \\hbar/(4\\pi k_B)$; the quark–gluon plasma at RHIC/LHC is measured close to this, making it nearly a perfect fluid."},{"q":"Which observable in heavy-ion collisions revealed fluid behaviour of the QGP?","a":"Elliptic flow $v_2$: anisotropic momentum distribution from pressure gradients of the almond-shaped overlap region."},{"q":"Which Millennium problem concerns hydrodynamics?","a":"Existence and smoothness of solutions of the 3D incompressible Navier–Stokes equations."}],"search":"hydrodynamics  the universal effective theory of conserved quantities at long wavelengths and late times.  "},{"id":"chaos","title":"Chaos","short":"Chaos","domain":"physics","area":"classical","one_liner":"Deterministic systems whose sensitivity to initial conditions makes long-term prediction impossible.","summary":"Classical chaos is exponential divergence of nearby trajectories (positive Lyapunov exponents) combined with mixing. Quantum chaos asks what replaces this in quantum systems: level statistics of <a class=\"ref\" href=\"#random-matrix-theory\">Random Matrix Theory<\/a>, the eigenstate thermalization hypothesis, and out-of-time-order correlators, with a bound on the quantum Lyapunov exponent saturated by black holes.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["When does deterministic dynamics become unpredictable?","What universal routes to chaos exist?","What is the quantum analogue of chaos and how do isolated quantum systems thermalize?"]},{"key":"key_results","label":"Fundamental results","value":["Poincaré's discovery of homoclinic tangles in the three-body problem.","Lorenz attractor (1963); strange attractors with fractal dimension.","Feigenbaum universality in period-doubling ($\\delta \\approx 4.669$).","Lyapunov exponents, Kolmogorov–Sinai entropy, ergodic hierarchy.","Bohigas–Giannoni–Schmit conjecture: chaotic quantum spectra follow RMT statistics; integrable ones are Poissonian.","Maldacena–Shenker–Stanford bound: $\\lambda_L \\le 2\\pi k_B T/\\hbar$, saturated by black holes and the SYK model."]},{"key":"experiments","label":"Empirical basis","value":["Chaotic circuits and lasers; Rayleigh–Bénard convection showing period doubling (Libchaber).","Microwave billiards and nuclear spectra confirming RMT level statistics.","OTOC measurements on trapped ions and superconducting qubits."]},{"key":"limits","label":"Limits & open problems","value":["Few general theorems for realistic high-dimensional systems; ergodicity is rarely provable.","Quantum chaos has no single agreed definition."]},{"key":"applications","label":"Applications","value":["Weather forecasting limits and ensemble prediction, secure communication, mixing in engineering, celestial mechanics (asteroid dynamics)."]},{"key":"frontiers","label":"Where research is going","value":["Many-body quantum chaos, operator growth and Krylov complexity, scrambling, deep thermalization.","Links with black holes (fast scramblers) and quantum error correction."]}],"connections":["classical-mechanics","dynamical-systems","random-matrix-theory","statistical-mechanics","black-holes","complex-systems","hydrodynamics"],"prerequisites":[],"resources":[],"cards":[{"q":"What quantity measures sensitivity to initial conditions?","a":"The (maximal) Lyapunov exponent $\\lambda$; separations grow as $e^{\\lambda t}$."},{"q":"What is the Feigenbaum constant $\\delta$?","a":"The universal ratio ($\\approx 4.669$) of successive period-doubling intervals for unimodal maps."},{"q":"What does the Bohigas–Giannoni–Schmit conjecture state?","a":"Quantum systems with chaotic classical limits have energy-level statistics described by random matrix ensembles (level repulsion); integrable ones show Poisson statistics."},{"q":"What is the chaos bound of Maldacena, Shenker and Stanford?","a":"The quantum Lyapunov exponent from OTOCs obeys $\\lambda_L \\le 2\\pi k_B T / \\hbar$."},{"q":"What is an OTOC used for?","a":"Out-of-time-order correlators $\\langle [W(t),V]^\\dagger[W(t),V]\\rangle$ diagnose operator growth and scrambling (quantum butterfly effect)."}],"search":"chaos chaos deterministic systems whose sensitivity to initial conditions makes long-term prediction impossible.  "},{"id":"quantum-mechanics","title":"Quantum Mechanics","short":null,"domain":"physics","area":"quantum","one_liner":"States are vectors in a Hilbert space, observables are operators, and probabilities come from amplitudes squared.","summary":"Built 1900–1930 to explain blackbody radiation, atomic spectra and the photoelectric effect. Its formal core (Hilbert space, unitary evolution, Born rule, tensor products) is extremely well tested and underlies chemistry, materials and electronics. What it says about reality (measurement) is still debated: see <a class=\"ref\" href=\"#quantum-foundations\">Quantum Foundations<\/a>.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What are the possible states and measurement outcomes of microscopic systems, and with which probabilities?","Why are atomic spectra discrete and why is matter stable?","How do composite systems behave (entanglement, identical particles)?"]},{"key":"key_results","label":"Fundamental results","value":["Schrödinger equation $i\\hbar\\,\\partial_t\\psi = H\\psi$; Heisenberg picture; path integral (Feynman).","Canonical commutation $[x,p]=i\\hbar$ and the uncertainty relation $\\Delta x\\,\\Delta p \\ge \\hbar/2$.","Born rule: $P(a) = |\\langle a|\\psi\\rangle|^2$.","Hydrogen spectrum; spin; Pauli exclusion; spin–statistics connection (proved in QFT).","Perturbation theory, variational principle, WKB, scattering theory, Berry phase.","Stone–von Neumann theorem: the canonical commutation relations have an essentially unique irreducible representation (finitely many degrees of freedom).","Bell's theorem: no local hidden-variable theory reproduces quantum predictions."]},{"key":"experiments","label":"Empirical basis","value":["<a class=\"ref\" href=\"#exp-photoelectric\">Photoelectric Effect<\/a>, <a class=\"ref\" href=\"#exp-stern-gerlach\">Stern–Gerlach Experiment<\/a>, <a class=\"ref\" href=\"#exp-davisson-germer\">Davisson–Germer Experiment<\/a>, <a class=\"ref\" href=\"#exp-double-slit\">Single-Particle Double-Slit Interference<\/a>, <a class=\"ref\" href=\"#exp-bell-tests\">Bell Tests<\/a>","Atomic spectroscopy (Balmer series, fine and hyperfine structure); <a class=\"ref\" href=\"#exp-lamb-shift\">Lamb Shift<\/a> showed its limits."]},{"key":"limits","label":"Limits & open problems","value":["Non-relativistic, fixed particle number → <a class=\"ref\" href=\"#qft\">Quantum Field Theory<\/a>.","The measurement problem; the classical limit and decoherence.","Exact solution of many-body problems is exponentially hard classically."]},{"key":"applications","label":"Applications","value":["Chemistry, semiconductors and transistors, lasers, MRI, atomic clocks, quantum technologies."]},{"key":"frontiers","label":"Where research is going","value":["Quantum control and engineered many-body systems; tests of macroscopic superpositions; quantum metrology."]}],"connections":["quantum-foundations","quantum-information","qft","amo-physics","condensed-matter","functional-analysis","classical-mechanics","random-matrix-theory"],"prerequisites":["classical-mechanics","linear-algebra"],"resources":["Sakurai &amp; Napolitano, <em>Modern Quantum Mechanics<\/em>","Weinberg, <em>Lectures on Quantum Mechanics<\/em>"],"cards":[{"q":"State the Born rule.","a":"The probability of outcome $a$ when measuring an observable in state $|\\psi\\rangle$ is $|\\langle a|\\psi\\rangle|^2$ (for non-degenerate $a$)."},{"q":"What does the Stone–von Neumann theorem say?","a":"Any irreducible representation of the Weyl form of the canonical commutation relations with finitely many degrees of freedom is unitarily equivalent to the Schrödinger representation."},{"q":"Why does Stone–von Neumann fail in QFT, and why does it matter?","a":"With infinitely many degrees of freedom there are unitarily inequivalent representations, which is what allows spontaneous symmetry breaking and different phases."},{"q":"What is the Berry phase?","a":"A geometric phase acquired under adiabatic cyclic evolution, equal to the holonomy of the Berry connection on parameter space."},{"q":"Which experiment demonstrated the wave nature of electrons?","a":"Davisson–Germer (1927), electron diffraction from a nickel crystal."}],"search":"quantum mechanics  states are vectors in a hilbert space, observables are operators, and probabilities come from amplitudes squared.  "},{"id":"quantum-foundations","title":"Quantum Foundations","short":null,"domain":"physics","area":"quantum","one_liner":"What quantum mechanics says about reality, measurement and probability.","summary":"The formalism works; its interpretation does not command consensus. Foundations studies the measurement problem, nonlocality, contextuality and the status of the wavefunction, and has turned philosophical questions into experiments (Bell tests) and resources (quantum information).","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What happens during a measurement, and why do we see definite outcomes?","Is the wavefunction physical (ontic) or knowledge (epistemic)?","What kinds of correlations does nature allow, and why exactly the quantum ones?"]},{"key":"key_results","label":"Fundamental results","value":["Bell (1964) and CHSH inequalities; Tsirelson bound $2\\sqrt{2}$ on quantum CHSH correlations.","Kochen–Specker theorem: quantum mechanics is contextual.","Gleason's theorem: in dimension ≥ 3 the Born rule is the only consistent probability measure on projectors.","Decoherence (Zeh, Zurek): environment-induced loss of interference explains the appearance of classicality but not unique outcomes.","PBR theorem: under preparation independence, the wavefunction is ontic.","No-cloning and no-signalling theorems."]},{"key":"experiments","label":"Empirical basis","value":["<a class=\"ref\" href=\"#exp-bell-tests\">Bell Tests<\/a> (Aspect 1982; loophole-free 2015).","Matter-wave interference with large molecules (&gt;25,000 amu); macroscopic superpositions in superconducting circuits and mechanical oscillators."]},{"key":"limits","label":"Limits & open problems","value":["Interpretations (Copenhagen, many-worlds, Bohmian mechanics, QBism, objective collapse) mostly make identical predictions."]},{"key":"applications","label":"Applications","value":["Device-independent cryptography and certified randomness grew directly out of Bell nonlocality."]},{"key":"frontiers","label":"Where research is going","value":["Tests of objective collapse models (GRW, Diósi–Penrose) with optomechanics and underground detectors.","Gravitationally induced entanglement proposals (Bose et al., Marletto–Vedral) to test whether gravity is quantum.","Reconstructions of quantum theory from information-theoretic axioms; Wigner's friend no-go theorems."]}],"connections":["quantum-mechanics","quantum-information","quantum-gravity","probability-theory"],"prerequisites":["quantum-mechanics"],"resources":[],"cards":[{"q":"What is the measurement problem?","a":"Unitary evolution produces superpositions of pointer states, yet measurements yield single definite outcomes; the theory does not say when or how this happens."},{"q":"What is the Tsirelson bound?","a":"The maximum quantum value of the CHSH expression, $2\\sqrt{2}$ (local hidden variables give at most 2, no-signalling allows 4)."},{"q":"What does decoherence explain, and what does it not?","a":"It explains suppression of interference between pointer states and the emergence of classical behaviour; it does not by itself explain why one outcome occurs."},{"q":"What does the Kochen–Specker theorem rule out?","a":"Non-contextual hidden-variable models (in Hilbert-space dimension ≥ 3)."},{"q":"What does the PBR theorem claim?","a":"Assuming independent preparations have independent physical states, the quantum state must be ontic (distinct states correspond to disjoint distributions over reality)."}],"search":"quantum foundations  what quantum mechanics says about reality, measurement and probability.  "},{"id":"quantum-information","title":"Quantum Information & Computation","short":"Quantum information","domain":"physics","area":"quantum","one_liner":"Entanglement and superposition as resources for computing, communicating and sensing.","summary":"Treats quantum states as information carriers. It produced quantum algorithms, error correction, entanglement theory and cryptography, and its language (entanglement entropy, tensor networks, error-correcting codes, complexity) now organizes condensed matter and quantum gravity.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What can quantum computers compute efficiently that classical ones cannot?","How can fragile quantum information be protected from noise?","How do we quantify and manipulate entanglement?"]},{"key":"key_results","label":"Fundamental results","value":["Shor's algorithm (1994): factoring in polynomial time; Grover search with quadratic speedup.","Quantum error correction (Shor, Steane, CSS codes, stabilizer formalism); threshold theorem: below a noise threshold, arbitrarily long computation is possible.","Topological codes: toric/surface code (Kitaev).","No-cloning; teleportation; superdense coding; BB84 quantum key distribution.","Entanglement entropy, area laws for gapped ground states (1D: Hastings).","Gottesman–Knill: Clifford circuits are classically simulable; magic (non-stabilizerness) is the resource."]},{"key":"experiments","label":"Empirical basis","value":["Superconducting and trapped-ion processors; random-circuit sampling claims (Google 2019 and later).","Below-threshold surface-code memory (Google Willow, 2024); logical qubits on neutral-atom arrays.","Satellite QKD (Micius 2017)."]},{"key":"limits","label":"Limits & open problems","value":["Error rates and overheads; no proven exponential speedup for most practical problems.","BQP vs classical complexity classes is unproven (see <a class=\"ref\" href=\"#computational-complexity\">Computational Complexity<\/a>)."]},{"key":"applications","label":"Applications","value":["Cryptanalysis (RSA, ECC) motivating post-quantum cryptography; quantum simulation of chemistry and materials; quantum sensing; QKD."]},{"key":"frontiers","label":"Where research is going","value":["Fault-tolerant architectures, qLDPC codes, magic-state distillation and cultivation.","Useful quantum advantage in simulation; quantum learning theory.","Holographic codes and the view of spacetime as an error-correcting code."]}],"connections":["quantum-mechanics","quantum-foundations","computational-complexity","information-theory","holography","condensed-matter","topological-phases","amo-physics"],"prerequisites":["quantum-mechanics","linear-algebra"],"resources":["Nielsen &amp; Chuang, <em>Quantum Computation and Quantum Information<\/em>","Preskill, Caltech Ph219 lecture notes"],"cards":[{"q":"What does the quantum threshold theorem state?","a":"If physical error rates are below a constant threshold (and noise is suitably local), logical errors can be suppressed arbitrarily with polylogarithmic overhead."},{"q":"What is the Gottesman–Knill theorem?","a":"Circuits of Clifford gates, stabilizer-state preparation and Pauli measurements can be efficiently simulated classically."},{"q":"What problem does Shor's algorithm solve and how fast?","a":"Integer factoring and discrete logarithms in polynomial time (via period finding with the quantum Fourier transform)."},{"q":"What is the area law for entanglement?","a":"For ground states of gapped local Hamiltonians, the entanglement entropy of a region scales with its boundary, not its volume (proved in 1D by Hastings)."},{"q":"What is the surface code?","a":"A topological stabilizer code on a 2D lattice with only nearest-neighbour checks and a high (~1%) threshold; leading candidate for fault tolerance."},{"q":"What is BB84?","a":"The first quantum key distribution protocol (Bennett–Brassard 1984); security comes from disturbance caused by measuring non-orthogonal states."}],"search":"quantum information & computation quantum information entanglement and superposition as resources for computing, communicating and sensing.  "},{"id":"qft","title":"Quantum Field Theory","short":"QFT","domain":"physics","area":"hep","one_liner":"The framework combining quantum mechanics and special relativity, where particles are excitations of quantum fields.","summary":"QFT is the language of particle physics, condensed matter and much of cosmology. Locality, Lorentz invariance and unitarity force particles to be created and destroyed, imply antiparticles and the spin–statistics connection, and make infinities appear that are tamed by <a class=\"ref\" href=\"#renormalization\">Renormalization & the Renormalization Group<\/a>. It is extremely successful perturbatively but lacks a complete mathematical definition in four dimensions.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do we describe relativistic quantum systems with variable particle number?","How do interactions modify particle properties and scattering?","What are the possible phases and dynamics of quantum fields (confinement, symmetry breaking, conformality)?"]},{"key":"key_results","label":"Fundamental results","value":["Canonical and path-integral quantization; Feynman diagrams; LSZ reduction.","CPT theorem and spin–statistics theorem.","QED: electron $g-2$ agrees with experiment to about one part in $10^{12}$.","Renormalizability and the renormalization group; asymptotic freedom of non-abelian gauge theories (Gross–Wilczek, Politzer 1973).","Anomalies (ABJ) and anomaly matching (’t Hooft).","Coleman–Mandula theorem: spacetime and internal symmetries cannot mix nontrivially (loophole: supersymmetry, Haag–Łopuszański–Sohnius).","Wightman and Osterwalder–Schrader axioms; Reeh–Schlieder theorem."]},{"key":"experiments","label":"Empirical basis","value":["<a class=\"ref\" href=\"#exp-lamb-shift\">Lamb Shift<\/a>, <a class=\"ref\" href=\"#exp-g-2\">Muon and Electron g−2<\/a> (electron and muon), <a class=\"ref\" href=\"#exp-deep-inelastic\">SLAC Deep Inelastic Scattering<\/a>, LEP precision electroweak tests, <a class=\"ref\" href=\"#exp-higgs\">Higgs Boson Discovery<\/a>."]},{"key":"limits","label":"Limits & open problems","value":["No rigorous construction of interacting 4D QFTs (Yang–Mills existence and mass gap is a Millennium problem).","Perturbation series are asymptotic, not convergent; strong coupling needs lattice, dualities or bootstrap.","Does not include gravity consistently beyond effective field theory."]},{"key":"applications","label":"Applications","value":["Particle physics, condensed matter (quasiparticles, critical phenomena), cosmology (inflationary perturbations), statistical mechanics."]},{"key":"frontiers","label":"Where research is going","value":["Generalized symmetries and anomalies; non-perturbative methods (bootstrap, resurgence, lattice); amplitudes.","QFT in de Sitter and cosmological correlators; mathematical QFT (factorization algebras, TQFT)."]}],"connections":["gauge-theory","standard-model","renormalization","effective-field-theory","symmetries","cft","scattering-amplitudes","lattice-field-theory","condensed-matter","quantum-gravity","functional-analysis"],"prerequisites":["quantum-mechanics","special-relativity","classical-field-theory"],"resources":["Peskin &amp; Schroeder, <em>An Introduction to QFT<\/em>","Schwartz, <em>Quantum Field Theory and the Standard Model<\/em>","Weinberg, <em>The Quantum Theory of Fields<\/em> (3 vols)","Tong, <em>Lectures on Quantum Field Theory<\/em> (free online)"],"cards":[{"q":"Why does combining quantum mechanics with special relativity require fields?","a":"Relativistic energies allow particle creation and causality requires local commuting observables; fields provide local operators and variable particle number."},{"q":"What does the CPT theorem state?","a":"Any Lorentz-invariant local QFT with a Hermitian Hamiltonian is invariant under the combined operation of charge conjugation, parity and time reversal."},{"q":"What does the Coleman–Mandula theorem forbid, and what is the loophole?","a":"A nontrivial mixing of Poincaré and internal symmetries in an interacting theory with a mass gap; supersymmetry (fermionic generators) evades it."},{"q":"What is asymptotic freedom?","a":"The coupling of non-abelian gauge theories (with few enough fermions) decreases at high energy; discovered 1973 by Gross, Wilczek, Politzer."},{"q":"What is the Reeh–Schlieder theorem?","a":"Acting with operators localized in any open region on the vacuum produces a dense set of states; the vacuum is highly entangled across regions."},{"q":"Are perturbative QFT series convergent?","a":"No, they are generally asymptotic (factorial growth of coefficients; Dyson's argument for QED), connected to instantons and renormalons."}],"search":"quantum field theory qft the framework combining quantum mechanics and special relativity, where particles are excitations of quantum fields.  "},{"id":"gauge-theory","title":"Gauge Theory","short":null,"domain":"physics","area":"hep","one_liner":"Forces arise from requiring symmetries to hold locally; mathematically, connections on principal bundles.","summary":"Gauge symmetry is a redundancy of description, not a physical symmetry, but it dictates the form of interactions. Yang–Mills theory with a compact Lie group underlies the strong and electroweak forces. Physically, gauge theories show confinement, Higgsing and topological phases.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["Which interactions are consistent with local symmetry, and why are force carriers spin-1?","What are the phases of gauge theories (Coulomb, Higgs, confining, topological)?","Why are quarks confined and what generates the mass gap?"]},{"key":"key_results","label":"Fundamental results","value":["Yang–Mills action $\\frac{1}{4g^2}\\int \\mathrm{tr}\\,F\\wedge\\star F$; covariant derivative; non-abelian field strength.","’t Hooft–Veltman (1971): renormalizability of spontaneously broken gauge theories.","Faddeev–Popov quantization and BRST symmetry.","Wilson loops as order parameters; area law ⇔ confinement.","Instantons, θ-vacua, the strong CP problem.","’t Hooft large-N expansion: planar diagrams dominate, suggesting a string description.","Seiberg–Witten (1994): exact low-energy solution of N=2 SU(2) gauge theory; Seiberg duality in N=1."]},{"key":"experiments","label":"Empirical basis","value":["All of electroweak and QCD phenomenology; jets at colliders; lattice QCD hadron masses agree with experiment.","Aharonov–Bohm effect: potentials have physical (holonomy) effects (<a class=\"ref\" href=\"#exp-aharonov-bohm\">Aharonov–Bohm Effect<\/a>)."]},{"key":"limits","label":"Limits & open problems","value":["Confinement and the mass gap are not proven analytically for 4D Yang–Mills."]},{"key":"applications","label":"Applications","value":["Standard Model; emergent gauge fields in condensed matter (spin liquids, quantum Hall); Donaldson and Seiberg–Witten invariants of 4-manifolds."]},{"key":"frontiers","label":"Where research is going","value":["Generalized (higher-form, non-invertible) symmetries diagnosing confinement; IR phases of QCD-like theories; dualities in 3D."]}],"connections":["qft","standard-model","differential-geometry","lie-theory","symmetries","lattice-field-theory","string-theory","topology","electromagnetism"],"prerequisites":["qft","lie-theory"],"resources":[],"cards":[{"q":"Geometrically, what is a gauge field?","a":"A connection on a principal $G$-bundle; its curvature is the field strength $F = dA + A\\wedge A$."},{"q":"What criterion distinguishes confinement using Wilson loops?","a":"An area law $\\langle W(C)\\rangle \\sim e^{-\\sigma\\,\\mathrm{Area}}$ signals confinement (linear potential); a perimeter law signals deconfinement/Higgs phases."},{"q":"What did ’t Hooft and Veltman prove in 1971?","a":"Yang–Mills theories with spontaneous symmetry breaking (Higgs mechanism) are renormalizable."},{"q":"What is the large-N limit of ’t Hooft?","a":"Take $N\\to\\infty$ with $\\lambda = g^2N$ fixed; planar diagrams dominate and the expansion in $1/N$ resembles a string genus expansion."},{"q":"What is the strong CP problem?","a":"QCD allows a CP-violating $\\theta F\\tilde F$ term, but the neutron EDM bounds $|\\bar\\theta| \\lesssim 10^{-10}$; why so small?"},{"q":"What did Seiberg and Witten solve in 1994?","a":"The exact low-energy effective action (prepotential) of N=2 supersymmetric SU(2) Yang–Mills via an auxiliary elliptic curve, exhibiting monopole condensation and confinement."}],"search":"gauge theory  forces arise from requiring symmetries to hold locally; mathematically, connections on principal bundles.  "},{"id":"standard-model","title":"The Standard Model","short":"Standard Model","domain":"physics","area":"hep","one_liner":"The $SU(3)\\times SU(2)\\times U(1)$ gauge theory of all known particles and three of the four forces.","summary":"Three generations of quarks and leptons, gauge bosons, and one Higgs doublet, with about 19 free parameters (more with neutrino masses). It has passed every collider test, with the Higgs boson discovered in 2012. It is known to be incomplete: no gravity, no dark matter, no neutrino mass mechanism, no explanation for its parameters.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What are the elementary constituents of matter and their interactions?","How do particles get mass?","Why do matter and antimatter behave differently?"]},{"key":"key_results","label":"Fundamental results","value":["Glashow–Weinberg–Salam electroweak theory; Higgs mechanism; prediction of W, Z and neutral currents.","QCD with quarks and gluons; asymptotic freedom; confinement; chiral symmetry breaking (pions as pseudo-Goldstone bosons).","CKM matrix: three generations allow CP violation (Kobayashi–Maskawa).","Anomaly cancellation within each generation (fixes hypercharges).","Accidental symmetries: baryon and lepton number (anomalous; violated by sphalerons)."]},{"key":"experiments","label":"Empirical basis","value":["<a class=\"ref\" href=\"#exp-wu-parity\">Wu Experiment (Parity Violation)<\/a>, neutral currents (Gargamelle 1973), W/Z discovery (UA1/UA2 1983), <a class=\"ref\" href=\"#exp-deep-inelastic\">SLAC Deep Inelastic Scattering<\/a>, top quark (Tevatron 1995), <a class=\"ref\" href=\"#exp-higgs\">Higgs Boson Discovery<\/a>, LEP Z-pole (3 light neutrinos)."]},{"key":"limits","label":"Limits & open problems","value":["Massless neutrinos in the minimal version, contradicted by <a class=\"ref\" href=\"#exp-neutrino-oscillations\">Neutrino Oscillations<\/a>.","No dark matter candidate; insufficient CP violation for baryogenesis.","Hierarchy problem (Higgs mass sensitivity), strong CP problem, flavour puzzle, metastable vacuum."]},{"key":"applications","label":"Applications","value":["Predicts all collider physics, nuclear and atomic processes, early-universe evolution after ~10⁻¹² s."]},{"key":"frontiers","label":"Where research is going","value":["Higgs couplings and self-coupling at the HL-LHC (from ~2030 after Long Shutdown 3); flavour anomalies; electroweak precision.","Future colliders (FCC-ee, CEPC, muon collider) under discussion."]}],"connections":["gauge-theory","qft","beyond-standard-model","effective-field-theory","symmetries","cosmology","nuclear-physics","lattice-field-theory"],"prerequisites":["qft","gauge-theory"],"resources":[],"cards":[{"q":"What is the gauge group of the Standard Model?","a":"$SU(3)_c \\times SU(2)_L \\times U(1)_Y$ (modulo a discrete quotient)."},{"q":"What is the minimum number of generations for CP violation in the CKM matrix, and who showed it?","a":"Three; Kobayashi and Maskawa (1973), before the third generation was found."},{"q":"Which precise Z-pole measurement fixed the number of light neutrino species?","a":"The Z invisible width measured at LEP gives $N_\\nu = 2.98 \\pm 0.01$, i.e. three."},{"q":"Approximately how many free parameters does the Standard Model have?","a":"About 19 (masses, mixing angles, couplings, θ_QCD), plus ~7–9 more for massive neutrinos."},{"q":"What is the hierarchy problem?","a":"The Higgs mass receives quadratically sensitive corrections from heavy scales; why is it so far below the Planck scale without fine-tuning?"},{"q":"What fixes the hypercharges of the fermions in each generation?","a":"Cancellation of gauge and gravitational anomalies (together with the observed representations)."}],"search":"the standard model standard model the $su(3)\\times su(2)\\times u(1)$ gauge theory of all known particles and three of the four forces.  "},{"id":"beyond-standard-model","title":"Beyond the Standard Model","short":"BSM","domain":"physics","area":"hep","one_liner":"Searches for the physics that must complete the Standard Model.","summary":"Motivated by hard data (neutrino masses, dark matter, baryon asymmetry, dark energy) and by puzzles of naturalness (hierarchy, strong CP, flavour). Candidates include supersymmetry, composite Higgs, axions, grand unification, extra dimensions and dark sectors. The LHC has found no new particles so far, pushing the field towards precision, low-mass hidden sectors and cosmology.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What is dark matter?","Where do neutrino masses come from?","Why is there more matter than antimatter?","Why is the electroweak scale so small compared to the Planck scale (and is naturalness a good guide)?"]},{"key":"key_results","label":"Fundamental results","value":["Grand unification ideas (Georgi–Glashow SU(5), SO(10)); gauge coupling running; proton decay predictions (minimal SU(5) excluded).","Seesaw mechanism for small neutrino masses.","Peccei–Quinn mechanism and the axion as a solution to strong CP and a dark-matter candidate.","Sakharov conditions for baryogenesis; leptogenesis.","Supersymmetry: cancellation of quadratic divergences; gauge coupling unification in the MSSM."]},{"key":"experiments","label":"Empirical basis","value":["LHC searches; direct dark-matter detection (XENONnT, LZ, PandaX); axion haloscopes (ADMX); proton decay (Super-K); EDMs; <a class=\"ref\" href=\"#exp-g-2\">Muon and Electron g−2<\/a>."]},{"key":"limits","label":"Limits & open problems","value":["Huge model space with weak experimental guidance; naturalness has so far failed as a predictor at the LHC."]},{"key":"applications","label":"Applications","value":["Drives detector and accelerator technology; cosmology model building."]},{"key":"frontiers","label":"Where research is going","value":["Feebly interacting particles and dark sectors; axion searches across many mass decades; neutrino mass ordering (JUNO), CP phase (DUNE, Hyper-K); 0νββ.","Muon g−2 tension largely resolved by lattice QCD (2025); flavour physics at Belle II and LHCb.","Relaxion, swampland-inspired and anthropic approaches to naturalness."]}],"connections":["standard-model","cosmology","string-theory","effective-field-theory","astrophysics","nuclear-physics"],"prerequisites":["standard-model"],"resources":[],"cards":[{"q":"What are the three Sakharov conditions?","a":"Baryon number violation; C and CP violation; departure from thermal equilibrium."},{"q":"How does the type-I seesaw make neutrinos light?","a":"Heavy right-handed Majorana neutrinos of mass $M$ give light masses $m_\\nu \\sim m_D^2/M$."},{"q":"What problem does the axion solve?","a":"The strong CP problem — the Peccei–Quinn field dynamically relaxes θ̄ to zero; the axion is also a dark-matter candidate."},{"q":"What happened to the muon g−2 anomaly by 2025?","a":"Fermilab's final measurement (0.127 ppm) agrees with the 2025 Theory Initiative prediction based on lattice-QCD hadronic vacuum polarization; the anomaly largely disappeared, though data-driven e⁺e⁻ inputs remain in tension."},{"q":"What would observing neutrinoless double beta decay prove?","a":"Neutrinos are Majorana particles and lepton number is violated."}],"search":"beyond the standard model bsm searches for the physics that must complete the standard model.  "},{"id":"renormalization","title":"Renormalization & the Renormalization Group","short":"Renormalization","domain":"physics","area":"hep","one_liner":"How physics changes with the scale of observation, and why theories at long distances forget most microscopic details.","summary":"Born as a trick to remove infinities in QED, transformed by Wilson into a physical idea: integrating out short-distance modes generates a flow in the space of couplings. Fixed points are scale-invariant theories; relevant and irrelevant directions explain universality in critical phenomena and why effective theories work.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["Why are low-energy physics predictions insensitive to unknown high-energy details?","How do couplings depend on scale, and what are the fixed points?","Why do very different systems share the same critical exponents (universality)?"]},{"key":"key_results","label":"Fundamental results","value":["Callan–Symanzik equation and beta functions $\\mu\\, dg/d\\mu = \\beta(g)$.","Wilsonian RG: relevant, marginal, irrelevant operators; universality classes.","Wilson–Fisher fixed point and the ε-expansion ($d = 4-\\varepsilon$).","Kadanoff block-spin picture; Polchinski and Wetterich exact (functional) RG equations.","c-theorem (Zamolodchikov, 2D) and a-theorem (Komargodski–Schwimmer, 4D): RG flows are irreversible.","Dimensional transmutation (Λ_QCD from a dimensionless coupling)."]},{"key":"experiments","label":"Empirical basis","value":["Running of α_s measured from many processes; running of α_em.","Critical exponents measured in fluids, magnets and superfluid helium (λ-point in space, Lipa et al.)."]},{"key":"limits","label":"Limits & open problems","value":["Non-perturbative RG flows are hard to compute; Landau poles signal theories that are incomplete (e.g. QED, φ⁴ in 4D)."]},{"key":"applications","label":"Applications","value":["Critical phenomena, polymer physics, turbulence models, machine-learning analogies, finance (scaling laws)."]},{"key":"frontiers","label":"Where research is going","value":["RG and entanglement (entanglement renormalization, MERA); RG in de Sitter; RG flows between CFTs and the space of QFTs."]}],"connections":["qft","effective-field-theory","phase-transitions","cft","statistical-mechanics","standard-model"],"prerequisites":["qft","statistical-mechanics"],"resources":["Wilson &amp; Kogut, <em>The renormalization group and the ε expansion<\/em> (1974)","Cardy, <em>Scaling and Renormalization in Statistical Physics<\/em>"],"cards":[{"q":"What is a relevant operator in Wilsonian RG?","a":"An operator whose coupling grows towards the IR at a fixed point (scaling dimension $\\Delta &lt; d$); it must be tuned to reach the critical point."},{"q":"Why does universality occur?","a":"Different microscopic systems flow to the same IR fixed point; irrelevant couplings that distinguish them die off."},{"q":"What does the c-theorem state?","a":"In 2D unitary QFTs there is a function decreasing along RG flows that equals the central charge at fixed points, so $c_{UV} &gt; c_{IR}$."},{"q":"What is the 4D analogue of the c-theorem?","a":"The a-theorem (Komargodski–Schwimmer 2011): the Euler anomaly coefficient a decreases along RG flows."},{"q":"What is dimensional transmutation?","a":"A classically scale-invariant theory with a running dimensionless coupling generates a dynamical scale, e.g. $\\Lambda_{QCD} \\approx 200$–$300$ MeV."},{"q":"What does a Landau pole signal?","a":"The coupling diverges at a finite UV scale; the theory is not UV complete and must be an effective theory."}],"search":"renormalization & the renormalization group renormalization how physics changes with the scale of observation, and why theories at long distances forget most microscopic details.  "},{"id":"effective-field-theory","title":"Effective Field Theory","short":"EFT","domain":"physics","area":"hep","one_liner":"Write the most general theory allowed by symmetries at a given scale and organize it as an expansion in energy over cutoff.","summary":"EFT is the modern philosophy of QFT: every theory is effective below some scale. Heavy physics shows up as higher-dimension operators suppressed by powers of the heavy scale. This explains why the Standard Model works, makes General Relativity a sensible quantum EFT, and gives systematic tools from pion physics to gravitational-wave templates.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How can we make predictions without knowing the UV completion?","Which low-energy observables carry information about high-energy physics?","Which EFTs can be UV completed at all (positivity, swampland)?"]},{"key":"key_results","label":"Fundamental results","value":["Decoupling theorem (Appelquist–Carazzone).","Power counting; matching and running; Weinberg's folk theorem.","Chiral perturbation theory for pions; Fermi theory as the EFT of weak interactions; SMEFT (dimension-6 operators).","Heavy-quark EFT, soft-collinear EFT, NRQED/NRQCD, non-relativistic EFTs for nuclear forces.","GR as an EFT: computable quantum corrections at long distances (Donoghue).","Positivity bounds: unitarity, causality and analyticity constrain EFT coefficients (Adams et al. 2006)."]},{"key":"experiments","label":"Empirical basis","value":["Fermi theory predicted weak decays before the W was found; SMEFT fits to LHC data constrain new physics scales."]},{"key":"limits","label":"Limits & open problems","value":["Breaks down near its cutoff; cannot by itself explain unnaturally small parameters (hierarchy, cosmological constant)."]},{"key":"applications","label":"Applications","value":["Gravitational-wave templates (post-Newtonian EFT, worldline EFT), effective field theory of inflation and of large-scale structure, condensed matter (Fermi liquid)."]},{"key":"frontiers","label":"Where research is going","value":["EFT-hedron and positivity; swampland constraints from quantum gravity; UV/IR mixing challenges to naturalness."]}],"connections":["renormalization","qft","standard-model","general-relativity","quantum-gravity","hydrodynamics","condensed-matter","string-theory"],"prerequisites":["qft","renormalization"],"resources":[],"cards":[{"q":"What does the decoupling theorem say?","a":"Heavy particles of mass $M$ affect low-energy physics only through renormalization of couplings and operators suppressed by powers of $1/M$."},{"q":"What is SMEFT?","a":"The Standard Model extended by all higher-dimension operators built from SM fields with SM symmetries (2499 baryon-number-conserving dimension-6 operators for three generations)."},{"q":"Why was Fermi's theory a successful EFT?","a":"It described weak decays with the dimension-6 four-fermion operator suppressed by $G_F \\sim 1/M_W^2$; its breakdown at ~100 GeV pointed to the W boson."},{"q":"What are positivity bounds in EFT?","a":"Constraints on signs/sizes of EFT coefficients (e.g. $(\\partial\\phi)^4$ coefficient &gt; 0) following from unitarity, causality, and analyticity of the UV completion."},{"q":"Name the main EFT used to model inspiralling compact binaries.","a":"Post-Newtonian/post-Minkowskian worldline EFT (Goldberger–Rothstein NRGR) and the EFT-inspired amplitude methods."}],"search":"effective field theory eft write the most general theory allowed by symmetries at a given scale and organize it as an expansion in energy over cutoff.  "},{"id":"symmetries","title":"Symmetries & Generalized Symmetries","short":"Symmetries","domain":"physics","area":"hep","one_liner":"Symmetry organizes conservation laws, spectra, phases and dynamics; generalized symmetries extend this to extended and non-invertible operators.","summary":"From Noether to Wigner to Landau, symmetry has been the master organizing principle. Since Gaiotto, Kapustin, Seiberg and Willett (2014) symmetries are seen as topological operators: they may act on lines and surfaces (higher-form), form higher groups, or have no inverse (non-invertible, fusion-category symmetries). Their anomalies give robust non-perturbative constraints on phases of matter and QFTs.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What constrains the spectrum, dynamics and phases of a system independently of details?","How do symmetries and their anomalies classify phases of matter?","What is the most general notion of symmetry in quantum field theory?"]},{"key":"key_results","label":"Fundamental results","value":["Noether's theorem; Wigner's theorem (symmetries are unitary or antiunitary); Goldstone theorem.","Landau paradigm: phases classified by symmetry breaking patterns.","’t Hooft anomaly matching: UV anomalies must be reproduced in the IR.","Higher-form symmetries act on extended objects; 1-form center symmetry is the order parameter for confinement.","Non-invertible symmetries exist in 4D (e.g. in QED and pion theory) and constrain dynamics (Choi–Lam–Shao, Córdova–Ohmori).","Symmetry TFT / SymTFT: symmetries of a d-dimensional theory encoded in a (d+1)-dimensional topological theory."]},{"key":"experiments","label":"Empirical basis","value":["<a class=\"ref\" href=\"#exp-wu-parity\">Wu Experiment (Parity Violation)<\/a> (P violation), CP violation in kaons (1964), Goldstone modes (phonons, magnons, pions)."]},{"key":"limits","label":"Limits & open problems","value":["The classification of generalized symmetries in higher dimensions (higher fusion categories) is still being developed."]},{"key":"applications","label":"Applications","value":["Selection rules in spectroscopy and chemistry; classification of topological phases; constraints on neutral pion decay and axion couplings."]},{"key":"frontiers","label":"Where research is going","value":["Categorical symmetries, SymTFT, anomalies of non-invertible symmetries, generalized symmetries in lattice models and quantum gravity (no global symmetries conjecture)."]}],"connections":["classical-mechanics","qft","gauge-theory","topological-phases","phase-transitions","group-theory","category-theory","quantum-gravity","cft"],"prerequisites":["qft","group-theory"],"resources":["Gaiotto, Kapustin, Seiberg, Willett, <em>Generalized Global Symmetries<\/em> (2014)","Schafer-Nameki, <em>ICTP lectures on (non-)invertible generalized symmetries<\/em> (2023)","Shao, <em>What's done cannot be undone: TASI lectures on non-invertible symmetries<\/em> (2023)"],"cards":[{"q":"In modern QFT language, what is a symmetry?","a":"A topological operator (defect); a $p$-form symmetry is generated by codimension-$(p+1)$ topological operators acting on $p$-dimensional charged objects."},{"q":"What is the order parameter for confinement in pure Yang–Mills in generalized-symmetry language?","a":"The 1-form center symmetry, which acts on Wilson lines; unbroken ⇔ confinement."},{"q":"What is a ’t Hooft anomaly and why is it useful?","a":"An obstruction to gauging a global symmetry; it is RG invariant, so the IR must match it (gapless modes, symmetry breaking, or topological order)."},{"q":"What is a non-invertible symmetry?","a":"A topological operator without inverse, whose fusion rules form a category (e.g. Kramers–Wannier duality defect in the Ising model)."},{"q":"What does Wigner's theorem state?","a":"Every symmetry preserving transition probabilities is represented by a unitary or an antiunitary operator."},{"q":"What is the conjecture about global symmetries in quantum gravity?","a":"Quantum gravity admits no exact global symmetries (all symmetries are gauged or broken), supported by black-hole arguments and AdS/CFT (Harlow–Ooguri)."}],"search":"symmetries & generalized symmetries symmetries symmetry organizes conservation laws, spectra, phases and dynamics; generalized symmetries extend this to extended and non-invertible operators.  "},{"id":"cft","title":"Conformal Field Theory","short":"CFT","domain":"physics","area":"hep","one_liner":"Quantum field theories invariant under angle-preserving transformations; the fixed points of the renormalization group.","summary":"CFTs describe critical points of phase transitions, the endpoints of RG flows, string worldsheets and, through holography, quantum gravity in AdS. In 2D conformal symmetry is infinite-dimensional (Virasoro) and many theories are exactly solvable. In higher dimensions the conformal bootstrap uses consistency alone to compute critical exponents.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What are the possible scale-invariant quantum field theories?","What data (operator spectrum, OPE coefficients) defines a CFT, and what consistency conditions constrain it?","How do CFTs describe critical phenomena and quantum gravity?"]},{"key":"key_results","label":"Fundamental results","value":["Operator–state correspondence; operator product expansion; crossing symmetry.","2D: Virasoro algebra, central charge, minimal models (BPZ 1984), Cardy formula, modular invariance.","Unitarity bounds on scaling dimensions.","Conformal bootstrap (Rattazzi–Rychkov–Tonni–Vichi 2008): rigorous bounds; 3D Ising exponents to 6+ digits.","Most-precise 3D Ising: $\\Delta_\\sigma \\approx 0.5181489$, $\\Delta_\\epsilon \\approx 1.412625$.","Lightcone bootstrap: large-spin operators approach double-twist values (Fitzpatrick–Kaplan–Poland–Simmons-Duffin; Komargodski–Zhiboedov); Caron-Huot inversion formula."]},{"key":"experiments","label":"Empirical basis","value":["Critical exponents of liquid–gas, binary mixtures, uniaxial magnets (3D Ising class); superfluid helium (O(2))."]},{"key":"limits","label":"Limits & open problems","value":["Higher-dimensional CFTs are rarely solvable; the landscape of CFTs is not classified.","Scale vs conformal invariance equivalence proven in 2D (Polchinski/Zamolodchikov) but not in general dimensions."]},{"key":"applications","label":"Applications","value":["Critical phenomena, string worldsheets, quantum Hall edges, holography, quantum critical points in materials."]},{"key":"frontiers","label":"Where research is going","value":["Numerical bootstrap of gauge theories and fermionic CFTs; analytic bootstrap; conformal defects and boundaries; fuzzy-sphere regularization."]}],"connections":["renormalization","phase-transitions","holography","string-theory","qft","symmetries","integrability","complex-analysis"],"prerequisites":["qft","renormalization"],"resources":["Di Francesco, Mathieu, Sénéchal, <em>Conformal Field Theory<\/em>","Poland, Rychkov, Vichi, <em>The conformal bootstrap<\/em> (RMP 2019)"],"cards":[{"q":"What data defines a CFT (locally)?","a":"The spectrum of primary operators (dimensions and spins) and their OPE coefficients, subject to crossing symmetry."},{"q":"What is the Cardy formula?","a":"The asymptotic density of states in a unitary 2D CFT, $S \\approx 2\\pi\\sqrt{c L_0/6} + \\ldots$, fixed by modular invariance; reproduces BTZ black-hole entropy."},{"q":"What made the conformal bootstrap numerically powerful after 2008?","a":"Crossing symmetry + unitarity, cast as linear/semidefinite programming, gives rigorous bounds; islands pin down the 3D Ising CFT."},{"q":"What is the operator–state correspondence?","a":"In a CFT, states on $S^{d-1}$ in radial quantization correspond one-to-one with local operators at the origin."},{"q":"What universality class do the liquid–gas critical point and uniaxial magnets share?","a":"The 3D Ising universality class."}],"search":"conformal field theory cft quantum field theories invariant under angle-preserving transformations; the fixed points of the renormalization group.  "},{"id":"scattering-amplitudes","title":"Scattering Amplitudes","short":"Amplitudes","domain":"physics","area":"hep","one_liner":"Computing particle scattering directly from symmetry, unitarity and analyticity, bypassing Feynman diagrams.","summary":"On-shell methods revealed that gauge and gravity amplitudes are far simpler than their Feynman diagram expansions. This led to new computational tools for colliders and gravitational waves and to geometric reformulations (amplituhedron) in which locality and unitarity emerge.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What is the simplest way to compute and understand S-matrix elements?","What hidden structures (dualities, geometry) do amplitudes have?","How are gauge theory and gravity amplitudes related?"]},{"key":"key_results","label":"Fundamental results","value":["Parke–Taylor formula for MHV gluon amplitudes.","BCFW recursion relations; generalized unitarity; spinor-helicity formalism.","Double copy / BCJ: gravity amplitudes ≈ (gauge amplitudes)² (KLT relations from strings).","Dual superconformal / Yangian symmetry of planar N=4 SYM; amplitudes ↔ Wilson loops duality.","Amplituhedron (Arkani-Hamed–Trnka 2013); positive geometry; CHY formulas.","S-matrix bootstrap: bounds on couplings from unitarity and crossing."]},{"key":"experiments","label":"Empirical basis","value":["NNLO/N3LO QCD predictions used for LHC precision; post-Minkowskian binary dynamics used for gravitational-wave modelling."]},{"key":"limits","label":"Limits & open problems","value":["Strongest results in highly symmetric (planar, supersymmetric) theories; massive and loop-level generalization is harder."]},{"key":"applications","label":"Applications","value":["LHC background predictions; gravitational-wave waveforms; constraints on EFTs."]},{"key":"frontiers","label":"Where research is going","value":["Amplitudes for gravitational waves (scattering-to-bound maps); cosmological correlators and the cosmological bootstrap; surfaceology and kinematic-space geometries for non-supersymmetric theories."]}],"connections":["qft","gauge-theory","string-theory","effective-field-theory","general-relativity","integrability","algebraic-geometry"],"prerequisites":["qft"],"resources":[],"cards":[{"q":"What is the Parke–Taylor formula?","a":"The tree-level MHV n-gluon amplitude is $\\frac{\\langle ij\\rangle^4}{\\langle 12\\rangle\\langle 23\\rangle\\cdots\\langle n1\\rangle}$ (times couplings and momentum conservation)."},{"q":"What is the double copy?","a":"Gravity amplitudes can be obtained from gauge-theory amplitudes by replacing colour factors with kinematic numerators that obey colour–kinematics duality (BCJ)."},{"q":"What is BCFW recursion?","a":"Tree amplitudes are built from lower-point on-shell amplitudes by complex-shifting two momenta and using Cauchy's theorem on the poles."},{"q":"What is the amplituhedron?","a":"A positive geometry whose canonical form gives the planar N=4 SYM integrand; locality and unitarity emerge from its geometry."}],"search":"scattering amplitudes amplitudes computing particle scattering directly from symmetry, unitarity and analyticity, bypassing feynman diagrams.  "},{"id":"integrability","title":"Integrability","short":null,"domain":"physics","area":"hep","one_liner":"Systems with enough conserved quantities to be solved exactly, from spin chains to planar N=4 Yang–Mills.","summary":"Quantum integrable systems have factorized scattering and infinitely many commuting charges. Bethe ansatz, Yang–Baxter equation and quantum groups solve 1+1D models exactly. Integrability solved the spectrum of planar N=4 SYM and supplies exact benchmarks for many-body physics.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["Which interacting systems can be solved exactly, and what structure makes it possible?","How do integrable systems thermalize (or fail to)?"]},{"key":"key_results","label":"Fundamental results","value":["Bethe ansatz (1931) for the Heisenberg chain; Lieb–Liniger; Yang–Baxter equation.","Onsager's solution of the 2D Ising model (1944).","Factorized S-matrices (Zamolodchikov); quantum groups.","Quantum spectral curve for planar N=4 SYM (Gromov–Kazakov–Leurent–Volin).","Generalized Gibbs ensemble and generalized hydrodynamics (2016) for integrable relaxation."]},{"key":"experiments","label":"Empirical basis","value":["Quantum Newton's cradle (Kinoshita–Wenger–Weiss 2006): 1D Bose gas does not thermalize.","Spin-chain materials measured by neutron scattering; KPZ superdiffusion in Heisenberg chains."]},{"key":"limits","label":"Limits & open problems","value":["Fine-tuned; most realistic systems are non-integrable; mostly low-dimensional."]},{"key":"applications","label":"Applications","value":["Exact benchmarks for numerics; cold-atom physics; strings in AdS₅×S⁵."]},{"key":"frontiers","label":"Where research is going","value":["Generalized hydrodynamics; weak integrability breaking; integrability in AdS₃ and fishnet theories."]}],"connections":["classical-mechanics","cft","statistical-mechanics","condensed-matter","holography","chaos","scattering-amplitudes"],"prerequisites":[],"resources":[],"cards":[{"q":"What is the Yang–Baxter equation?","a":"$R_{12}R_{13}R_{23} = R_{23}R_{13}R_{12}$; consistency of factorized scattering and of commuting transfer matrices."},{"q":"What is the generalized Gibbs ensemble?","a":"The stationary state of integrable systems, $\\rho \\propto e^{-\\sum_i \\beta_i Q_i}$ including all conserved charges."},{"q":"What did the quantum Newton's cradle experiment show?","a":"A 1D Bose gas (nearly integrable Lieb–Liniger) did not thermalize over thousands of collisions."}],"search earned samplers (normalizing flows); tensor networks to avoid the sign problem."]}],"connections":["qft","gauge-theory","standard-model","quantum-information","statistical-mechanics","nuclear-physics","numerical-analysis"],"prerequisites":[],"resources":[],"cards":[{"q":"What is the fermion sign problem?","a":"When the Euclidean weight is not positive (e.g. finite baryon density), Monte Carlo importance sampling fails and cancellations grow exponentially with volume."},{"q":"What does the Nielsen–Ninomiya theorem state?","a":"A local, hermitian, translation-invariant lattice fermion action with exact chiral symmetry must have doublers (equal numbers of left and right movers)."},{"q":"What is the nature of the QCD transition at zero baryon density?","a":"A smooth crossover around 155 MeV (lattice QCD)."}],"search":"lattice field theory lattice qft defining quantum field theories on a discrete spacetime lattice to compute non-perturbatively on computers.  "},{"id":"general-relativity","title":"General Relativity","short":"GR","domain":"physics","area":"gravity","one_liner":"Gravity is the curvature of spacetime, sourced by energy and momentum.","summary":"Einstein's 1915 theory: free fall follows geodesics of a dynamical Lorentzian metric obeying $G_{\\mu\\nu} + \\Lambda g_{\\mu\\nu} = 8\\pi G\\, T_{\\mu\\nu}$. It predicts black holes, gravitational waves and an expanding universe, and has passed every test from the lab to merging black holes.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What is gravity, and how do matter and spacetime geometry influence each other?","What happens in strong gravitational fields (black holes, neutron stars, the Big Bang)?","How does the universe as a whole evolve?"]},{"key":"key_results","label":"Fundamental results","value":["Equivalence principle; Einstein field equations; Einstein–Hilbert action $\\frac{1}{16\\pi G}\\int \\sqrt{-g}\\,(R - 2\\Lambda)$.","Schwarzschild (1916) coustic peaks; anisotropies ~10⁻⁵.","ΛCDM: ~5% baryons, ~27% dark matter, ~68% dark energy; six-parameter fit (Planck 2018).","Inflation (Guth, Linde, Starobinsky) solves horizon/flatness problems and predicts nearly scale-invariant adiabatic Gaussian perturbations, $n_s \\approx 0.965$."]},{"key":"experiments","label":"Empirical basis","value":["<a class=\"ref\" href=\"#exp-cmb\">Cosmic Microwave Background<\/a>, <a class=\"ref\" href=\"#exp-supernovae-acceleration\">Accelerating Expansion from Supernovae<\/a>, BAO surveys (SDSS, DESI), galaxy rotation curves and the Bullet Cluster, BBN abundances."]},{"key":"limits","label":"Limits & open problems","value":["Nature of dark matter and dark energy unknown; cosmological constant problem.","Hubble tension: local distance ladder ~73 vs CMB-inferred ~67 km/s/Mpc.","Initial singularity; inflation's UV completion and measure problem."]},{"key":"applications","label":"Applications","value":["Constraints on particle physics (neutrino masses, light relics $N_{\\rm eff}$, dark matter properties)."]},{"key":"frontiers","label":"Where research is going","value":["DESI DR2 (2025) BAO, combined with CMB and supernovae, prefers evolving dark energy $(w_0, w_a)$ at ~3–4σ; Euclid, Rubin LSST, Simons Observatory and CMB-S4-class experiments will test it.","Primordial gravitational waves (tensor-to-scalar ratio $r$); 21-cm cosmology; JWST early galaxies."]}],"connections":["general-relativity","beyond-standard-model","astrophysics","quantum-gravity","string-theory","standard-model"],"prerequisites":["general-relativity"],"resources":["Baumann, <em>Cosmology<\/em> (2022)","Weinberg, <em>Cosmology<\/em>"],"cards":[{"q":"What are the approximate energy fractions in ΛCDM today?","a":"~68% dark energy, ~27% cold dark matter, ~5% ordinary matter."},{"q":"What is the Hubble tension?","a":"Distance-ladder measurements (SH0ES) give $H_0 \\approx 73$ km/s/Mpc, while ΛCDM fits to the CMB give ≈ 67; the discrepancy is ~5σ."},{"q":"What does inflation predict for primordial perturbations?","a":"Nearly scale-invariant ($n_s \\approx 0.965$ measured), adiabatic, nearly Gaussian scalar perturbations, plus tensor modes of unknown amplitude $r$."},{"q":"What did DESI DR2 (2025) suggest about dark energy?","a":"Combined with CMB and supernova data, a preference (≈3–4σ depending on dataset) for time-varying dark energy over a cosmological constant."},{"q":"What does Big Bang nucleosynthesis predict and test?","a":"Primordial abundances of D, ³He, ⁴He (~25% by mass) and ⁷Li from the baryon-to-photon ratio; the lithium abundance remains discrepant."},{"q":"What is the CMB temperature today?","a":"2.7255 K, a near-perfect blackbody (COBE FIRAS)."}],"search":"cosmology  the origin, composition and evolution of the universe as a whole.  "},{"id":"black-holes","title":"Black Holes & Black-Hole Thermodynamics","short":"Black holes","domain":"physics","area":"gravity","one_liner":"Regions of no escape that behave as thermodynamic objects and sit at the crossroads of gravity, quantum theory and information.","summary":"Astrophysically, black holes power quasars and merge in gravitational-wave events. Theoretically, Hawking radiation and Bekenstein–Hawking entropy make them the key testing ground for quantum gravity, culminating in the information paradox and its recent partial resolution through quantum extremal surfaces.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What is the microscopic origin of black-hole entropy?","Is information lost when a black hole evaporates?","What happens at the singularity and near the horizon?"]},{"key":"key_results","label":"Fundamental results","value":["Laws of black-hole mechanics (Bardeen–Carter–Hawking 1973).","Hawking radiation (1974): $T_H = \\hbar c^3 / 8\\pi G M k_B$.","Strominger–Vafa (1996): microscopic counting of entropy for extremal string black holes.","Page curve; island formula / quantum extremal surfaces reproduce u
