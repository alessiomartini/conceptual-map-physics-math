dell conjecture (Faltings 1983): curves of genus ≥ 2 have finitely many rational points.","Green–Tao: primes contain arbitrarily long arithmetic progressions; Zhang/Maynard bounded gaps between primes.","Geometric Langlands conjecture proved (Gaitsgory, Raskin et al., 2024)."]},{"key":"motivating_examples","label":"Motivating examples","value":["Pythagorean triples; Fermat's equation; distribution of primes; RSA."]},{"key":"limits","label":"Limits & open problems","value":["Riemann hypothesis, twin primes, Goldbach, Birch–Swinnerton-Dyer, abc (claimed proof disputed) remain open."]},{"key":"applications","label":"Applications","value":["Cryptography (RSA, elliptic curves, lattice-based post-quantum), pseudorandom generators, error-correcting codes."]},{"key":"frontiers","label":"Where research is going","value":["Langlands program (arithmetic), p-adic geometry (perfectoids, Scholze), formalization of FLT in Lean."]}],"connections":["group-theory","algebraic-geometry","complex-analysis","random-matrix-theory","lie-theory"],"prerequisites":[],"resources":["Ireland &amp; Rosen, <em>A Classical Introduction to Modern Number Theory<\/em>"],"cards":[{"q":"State the prime number theorem.","a":"The number of primes up to x satisfies $\\pi(x) \\sim x/\\ln x$."},{"q":"State the Riemann hypothesis.","a":"All nontrivial zeros of $\\zeta(s)$ have real part 1/2; equivalent to optimal error bounds in the prime number theorem."},{"q":"How was Fermat's Last Theorem proved?","a":"Wiles (with Taylor) proved semistable elliptic curves over ℚ are modular; a Fermat solution would give a non-modular Frey curve (Ribet)."},{"q":"What is the Langlands program, in one line?","a":"A web of conjectures relating Galois representations and automorphic representations via L-functions — a non-abelian generalization of class field theory."},{"q":"What did Faltings prove in 1983?","a":"The Mordell conjecture — a curve of genus ≥ 2 over a number field has finitely many rational points."}],"search":"number theory  properties of the integers and primes, studied with tools from algebra, analysis and geometry.  "},{"id":"algebraic-geometry","title":"Algebraic Geometry","short":null,"domain":"math","area":"algebra","one_liner":"Geometry of solution sets of polynomial equations, rebuilt by Grothendieck on schemes and sheaves.","summary":"From classical curves and surfaces to schemes, stacks and derived geometry. It unifies geometry and number theory (arithmetic geometry) and is the natural home of mirror symmetry, moduli spaces and much of string theory.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What are the geometric properties of solution sets of polynomials?","How do we classify varieties (moduli spaces)?","How can geometry over finite fields and number fields inform arithmetic?"]},{"key":"key_results","label":"Fundamental results","value":["Hilbert's Nullstellensatz: ideals ↔ varieties.","Riemann–Roch theorem and Hirzebruch–Riemann–Roch, Grothendieck–Riemann–Roch.","Schemes and étale cohomology (Grothendieck); Weil conjectures proved by Deligne (1974).","Resolution of singularities in characteristic 0 (Hironaka 1964).","Minimal model program; classification of surfaces.","Hodge theory; Hodge conjecture open."]},{"key":"motivating_examples","label":"Motivating examples","value":["Conic sections; elliptic curves; Bézout's theorem counting intersections."]},{"key":"limits","label":"Limits & open problems","value":["Hodge conjecture open; resolution of singularities in positive characteristic open in general."]},{"key":"applications","label":"Applications","value":["Elliptic-curve cryptography, coding theory (algebraic geometry codes), string compactifications, robotics kinematics, algebraic statistics."]},{"key":"frontiers","label":"Where research is going","value":["Derived and spectral algebraic geometry; enumerative geometry and mirror symmetry; p-adic Hodge theory."]}],"connections":["number-theory","group-theory","category-theory","topology","differential-geometry","string-theory","complex-analysis","scattering-amplitudes"],"prerequisites":["group-theory"],"resources":["Hartshorne, <em>Algebraic Geometry<\/em>","Vakil, <em>The Rising Sea<\/em> (free online)"],"cards":[{"q":"What does Hilbert's Nullstellensatz state?","a":"Over an algebraically closed field, radical ideals correspond bijectively to affine varieties ($I(V(J)) = \\sqrt{J}$)."},{"q":"What are the Weil conjectures and who completed their proof?","a":"Statements about zeta functions of varieties over finite fields (rationality, functional equation, Riemann hypothesis analogue); Deligne completed them in 1974 using étale cohomology."},{"q":"What is the Hodge conjecture?","a":"On a projective complex manifold, every rational Hodge class of type (p,p) is a rational combination of classes of algebraic cycles."},{"q":"What is a Calabi–Yau manifold?","a":"A compact Kähler manifold with trivial canonical bundle (equivalently a Ricci-flat Kähler metric, by Yau's theorem)."}],"search":"algebraic geometry  geometry of solution sets of polynomial equations, rebuilt by grothendieck on schemes and sheaves.  "},{"id":"topology","title":"Topology","short":null,"domain":"math","area":"geometry","one_liner":"Properties of spaces that survive continuous deformation — connectivity, holes, knots.","summary":"General topology formalizes continuity; algebraic topology attaches algebraic invariants (homotopy groups, homology, cohomology, K-theory) to spaces; geometric topology studies manifolds and knots. Topology now classifies phases of matter and anomalies.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["When are two spaces equivalent up to deformation?","What invariants detect holes, twisting and knotting?","How are manifolds classified in each dimension?"]},{"key":"key_results","label":"Fundamental results","value":["Brouwer fixed point theorem; Euler characteristic; classification of surfaces.","Homology and cohomology; Poincaré duality; homotopy groups.","Poincaré conjecture: proved by Perelman (2003) via Ricci flow with surgery.","Smale (h-cobordism, dim ≥ 5); Freedman (dim 4, topological); Donaldson: exotic smooth $\\mathbb{R}^4$.","Atiyah–Singer index theorem relates analysis and topology.","Jones polynomial (1984); Witten's Chern–Simons interpretation (1989)."]},{"key":"motivating_examples","label":"Motivating examples","value":["Königsberg bridges; Möbius strip; hairy ball theorem."]},{"key":"limits","label":"Limits & open problems","value":["Smooth 4D Poincaré conjecture is open; computing homotopy groups of spheres is extremely hard."]},{"key":"applications","label":"Applications","value":["Topological phases and band theory, defects in ordered media, topological data analysis, robotics configuration spaces."]},{"key":"frontiers","label":"Where research is going","value":["Stable homotopy theory (Kervaire invariant in dimension 126 resolved 2024); 4-manifolds; TDA in machine learning."]}],"connections":["differential-geometry","algebraic-geometry","category-theory","topological-phases","gauge-theory","classical-field-theory"],"prerequisites":[],"resources":["Hatcher, <em>Algebraic Topology<\/em> (free online)","Nakahara, <em>Geometry, Topology and Physics<\/em>"],"cards":[{"q":"Who proved the Poincaré conjecture and how?","a":"Grigori Perelman (2002–2003), using Hamilton's Ricci flow with surgery; also proving Thurston's geometrization."},{"q":"What does the Atiyah–Singer index theorem state?","a":"The analytic index of an elliptic operator on a compact manifold (dim ker − dim coker) equals a topological index computed from characteristic classes."},{"q":"What does the hairy ball theorem state?","a":"There is no nowhere-vanishing continuous tangent vector field on $S^2$ (on even-dimensional spheres)."},{"q":"What surprising fact did Donaldson's work imply about $\\mathbb{R}^4$?","a":"It admits exotic smooth structures (uncountably many), unlike $\\mathbb{R}^n$ for $n \\ne 4$."},{"q":"How did Witten interpret the Jones polynomial?","a":"As expectation values of Wilson loops in 3D Chern–Simons gauge theory."}],"search":"topology  properties of spaces that survive continuous deformation — connectivity, holes, knots.  "},{"id":"differential-geometry","title":"Differential Geometry","short":"Diff. geometry","domain":"math","area":"geometry","one_liner":"Calculus on curved spaces — manifolds, metrics, connections and curvature.","summary":"The language of general relativity (Riemannian/Lorentzian geometry) and gauge theory (fibre bundles and connections). Global results link local curvature to topology; geometric analysis (Ricci flow, minimal surfaces) proved major conjectures.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do we do calculus and measure distances on curved spaces?","How does curvature constrain topology?","What special geometric structures exist (Kähler, Calabi–Yau, special holonomy)?"]},{"key":"key_results","label":"Fundamental results","value":["Gauss's Theorema Egregium: Gaussian curvature is intrinsic.","Gauss–Bonnet: $\\int_M K\\,dA = 2\\pi\\chi(M)$; Chern–Gauss–Bonnet in higher dimensions.","Levi-Civita connection; Riemann tensor; geodesics; Jacobi fields.","Fibre bundles, connections, characteristic classes (Chern–Weil).","Yau's proof of the Calabi conjecture (1977); Berger's holonomy classification.","Hamilton's Ricci flow; Perelman's entropy."]},{"key":"motivating_examples","label":"Motivating examples","value":["Geodesics on the sphere; map projections (Gauss); curved spacetime."]},{"key":"limits","label":"Limits & open problems","value":["Many existence questions for Einstein and special-holonomy metrics are open; PDEs are nonlinear and hard."]},{"key":"applications","label":"Applications","value":["General relativity, gauge theory, robotics, computer graphics, information geometry, optimization on manifolds."]},{"key":"frontiers","label":"Where research is going","value":["G₂ manifolds and M-theory; geometric flows; Lorentzian geometric analysis (stability of Kerr)."]}],"connections":["topology","general-relativity","gauge-theory","lie-theory","pde","classical-mechanics","string-theory","algebraic-geometry"],"prerequisites":[],"resources":["Lee, <em>Introduction to Smooth Manifolds<\/em>","Nakahara, <em>Geometry, Topology and Physics<\/em>"],"cards":[{"q":"State the Gauss–Bonnet theorem for a closed surface.","a":"$\\int_M K\\, dA = 2\\pi\\chi(M)$, linking total curvature to the Euler characteristic."},{"q":"What is the Theorema Egregium?","a":"Gaussian curvature depends only on the intrinsic metric, not on how the surface is embedded."},{"q":"What did Yau prove in 1977?","a":"The Calabi conjecture — compact Kähler manifolds with vanishing first Chern class admit Ricci-flat Kähler metrics."},{"q":"What is a connection on a fibre bundle?","a":"A rule for parallel transport (horizontal subspaces); locally a Lie-algebra-valued 1-form, physically a gauge field."}],"search":"differential geometry diff. geometry calculus on curved spaces — manifolds, metrics, connections and curvature.  "},{"id":"real-analysis","title":"Real Analysis & Measure Theory","short":"Real analysis","domain":"math","area":"analysis","one_liner":"Rigorous foundations of limits, continuity, integration and the size of sets.","summary":"Makes calculus rigorous (ε–δ), builds the real numbers, and generalizes integration via Lebesgue measure, which is the foundation of probability theory and of function spaces.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What does it mean for a limit, sum or integral to exist?","Which sets and functions can be measured and integrated?","When can limits and integrals be exchanged?"]},{"key":"key_results","label":"Fundamental results","value":["Completeness of ℝ; Bolzano–Weierstrass; Heine–Borel.","Lebesgue integral; monotone and dominated convergence theorems; Fubini–Tonelli.","Radon–Nikodym theorem; $L^p$ spaces and their completeness.","Vitali's non-measurable set (needs the axiom of choice).","Weierstrass approximation; Arzelà–Ascoli; Baire category theorem."]},{"key":"motivating_examples","label":"Motivating examples","value":["Fourier series convergence problems that motivated rigorous analysis; continuous nowhere-differentiable functions."]},{"key":"limits","label":"Limits & open problems","value":["Pathologies require care; infinite-dimensional analogues need functional analysis."]},{"key":"applications","label":"Applications","value":["Probability, statistics, PDE theory, numerical analysis, mathematical finance (change of measure)."]},{"key":"frontiers","label":"Where research is going","value":["Geometric measure theory; analysis on metric spaces; fractal geometry."]}],"connections":["functional-analysis","probability-theory","complex-analysis","pde","logic-set-theory"],"prerequisites":[],"resources":["Rudin, <em>Principles of Mathematical Analysis<\/em> and <em>Real and Complex Analysis<\/em>","Tao, <em>An Introduction to Measure Theory<\/em> (free online)"],"cards":[{"q":"State the dominated convergence theorem.","a":"If $f_n \\to f$ pointwise a.e. and $|f_n| \\le g$ with $g$ integrable, then $\\int f_n \\to \\int f$."},{"q":"What is the Radon–Nikodym theorem, and why does it matter in finance?","a":"If $\\nu \\ll \\mu$ (σ-finite), then $d\\nu = f\\, d\\mu$ for some density f; in finance, the risk-neutral measure is defined through such a density (Girsanov)."},{"q":"What does the Baire category theorem state?","a":"A complete metric space is not a countable union of nowhere-dense sets."}],"search":"real analysis & measure theory real analysis rigorous foundations of limits, continuity, integration and the size of sets.  "},{"id":"complex-analysis","title":"Complex Analysis","short":null,"domain":"math","area":"analysis","one_liner":"Calculus of functions of a complex variable, where differentiability forces extraordinary rigidity.","summary":"Holomorphic functions are analytic, determined by their values on small sets, and computable through contour integrals and residues. The theory feeds number theory (zeta function), physics (analyticity of S-matrix, dispersion relations), and 2D conformal field theory.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What are the properties of complex-differentiable functions?","How do singularities and analytic continuation determine a function?"]},{"key":"key_results","label":"Fundamental results","value":["Cauchy–Riemann equations; Cauchy's integral theorem and formula; residue theorem.","Liouville's theorem; maximum modulus principle; identity theorem.","Riemann mapping theorem; uniformization theorem for Riemann surfaces.","Picard's theorems; Weierstrass and Hadamard factorization.","Analytic continuation; monodromy; Riemann surfaces."]},{"key":"motivating_examples","label":"Motivating examples","value":["Evaluating real integrals by residues; conformal maps in 2D fluid flow and electrostatics."]},{"key":"limits","label":"Limits & open problems","value":["Several complex variables behave very differently (Hartogs phenomenon)."]},{"key":"applications","label":"Applications","value":["Dispersion relations (Kramers–Kronig), S-matrix analyticity, Wick rotation, signal processing (Laplace transforms), 2D CFT, aerodynamics (Joukowski)."]},{"key":"frontiers","label":"Where research is going","value":["Complex dynamics (Mandelbrot set, MLC conjecture), Teichmüller theory, resurgence."]}],"connections":["real-analysis","number-theory","cft","algebraic-geometry","functional-analysis","scattering-amplitudes"],"prerequisites":[],"resources":["Ahlfors, <em>Complex Analysis<\/em>","Needham, <em>Visual Complex Analysis<\/em>"],"cards":[{"q":"State the residue theorem.","a":"$\\oint_\\gamma f\\,dz = 2\\pi i \\sum \\mathrm{Res}(f, a_k)$ over poles enclosed by γ (counted with winding number)."},{"q":"What does Liouville's theorem (complex analysis) say?","a":"Every bounded entire function is constant."},{"q":"What does the Riemann mapping theorem state?","a":"Every simply connected proper open subset of ℂ is conformally equivalent to the unit disk."},{"q":"What physics principle do Kramers–Kronig relations encode?","a":"Causality — response functions analytic in the upper half-plane have real and imaginary parts related by Hilbert transforms."}],"search":"complex analysis  calculus of functions of a complex variable, where differentiability forces extraordinary rigidity.  "},{"id":"functional-analysis","title":"Functional Analysis","short":null,"domain":"math","area":"analysis","one_liner":"Linear algebra in infinite dimensions — Banach and Hilbert spaces and operators on them.","summary":"The mathematical setting of quantum mechanics and PDEs. Spectral theory of unbounded self-adjoint operators, operator algebras (C* and von Neumann), and distributions are its main tools.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do linear algebra and spectral theory extend to infinite-dimensional spaces?","What are the possible algebras of observables?"]},{"key":"key_results","label":"Fundamental results","value":["Hahn–Banach, open mapping, closed graph, uniform boundedness theorems.","Riesz representation theorem; spectral theorem for (unbounded) self-adjoint operators; Stone's theorem on unitary groups.","Sobolev spaces and embedding theorems; distributions (Schwartz).","Gelfand–Naimark: commutative C*-algebras ↔ locally compact Hausdorff spaces.","Murray–von Neumann classification of factors (types I, II, III); Tomita–Takesaki modular theory; Connes' classification of type III."]},{"key":"motivating_examples","label":"Motivating examples","value":["Fourier analysis on $L^2$; the Schrödinger operator; Green's functions."]},{"key":"limits","label":"Limits & open problems","value":["Unbounded operators require careful domains; nonlinear problems need other tools."]},{"key":"applications","label":"Applications","value":["Quantum mechanics and QFT (algebraic QFT), PDE theory, signal processing, machine learning (kernel methods, RKHS)."]},{"key":"frontiers","label":"Where research is going","value":["Von Neumann algebras in quantum gravity and holography (type II factors and generalized entropy); noncommutative geometry; free probability."]}],"connections":["linear-algebra","real-analysis","pde","quantum-mechanics","qft","probability-theory","quantum-gravity"],"prerequisites":[],"resources":["Reed &amp; Simon, <em>Methods of Modern Mathematical Physics<\/em>","Brezis, <em>Functional Analysis, Sobolev Spaces and PDEs<\/em>"],"cards":[{"q":"What does Stone's theorem state?","a":"Strongly continuous one-parameter unitary groups $U(t)$ correspond to self-adjoint generators: $U(t) = e^{-itH}$."},{"q":"What are the three Murray–von Neumann types of factors?","a":"Type I (bounded operators on a Hilbert space), type II (finite or semifinite trace, no minimal projections), type III (no semifinite trace; local QFT algebras are type III₁)."},{"q":"What does the Gelfand–Naimark theorem say?","a":"Commutative C*-algebras are exactly algebras of continuous functions vanishing at infinity on locally compact Hausdorff spaces (basis of noncommutative geometry)."},{"q":"Why is self-adjointness (not just symmetry) important in quantum mechanics?","a":"Only self-adjoint operators have a spectral decomposition and generate unitary time evolution (Stone)."}],"search":"functional analysis  linear algebra in infinite dimensions — banach and hilbert spaces and operators on them.  "},{"id":"pde","title":"Partial Differential Equations","short":"PDE","domain":"math","area":"analysis","one_liner":"Equations relating rates of change in several variables — the language of almost every physical law.","summary":"Elliptic (Laplace), parabolic (heat) and hyperbolic (wave) equations behave differently. The core questions are existence, uniqueness, regularity and long-time behaviour, especially for nonlinear equations like Navier–Stokes, Einstein and Yang–Mills.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["Do solutions exist, are they unique, and do they depend continuously on data (well-posedness)?","Do solutions stay smooth or develop singularities?","What is the long-time behaviour (stability, scattering, blow-up)?"]},{"key":"key_results","label":"Fundamental results","value":["Classification into elliptic, parabolic, hyperbolic; maximum principles; energy methods.","Cauchy–Kovalevskaya theorem; Lax–Milgram; Sobolev regularity theory.","De Giorgi–Nash–Moser regularity for elliptic equations with rough coefficients.","Choquet-Bruhat (1952): well-posedness of Einstein's equations; Christodoulou–Klainerman stability of Minkowski.","Nash embedding theorem; convex integration (Nash–Kuiper, and Isett's proof of Onsager's conjecture 2018)."]},{"key":"motivating_examples","label":"Motivating examples","value":["Heat equation (Fourier), wave equation, Laplace equation, Schrödinger and Navier–Stokes equations."]},{"key":"limits","label":"Limits & open problems","value":["No general theory for nonlinear PDEs; Navier–Stokes regularity is a Millennium problem."]},{"key":"applications","label":"Applications","value":["Physics everywhere, engineering simulations, Black–Scholes equation, image processing, weather prediction."]},{"key":"frontiers","label":"Where research is going","value":["Blow-up for Euler (computer-assisted proof by Chen–Hou), stability of Kerr black holes, PDE-based machine learning (PINNs, neural operators)."]}],"connections":["functional-analysis","real-analysis","differential-geometry","hydrodynamics","general-relativity","numerical-analysis","stochastic-processes"],"prerequisites":[],"resources":["Evans, <em>Partial Differential Equations<\/em>"],"cards":[{"q":"What are the three classical types of second-order linear PDE and their prototypes?","a":"Elliptic (Laplace), parabolic (heat), hyperbolic (wave)."},{"q":"What does well-posedness (Hadamard) mean?","a":"A solution exists, is unique, and depends continuously on the data."},{"q":"What is Onsager's conjecture, and who proved its sharp form?","a":"Weak solutions of 3D Euler with Hölder regularity &lt; 1/3 can dissipate energy (≥ 1/3 conserve it); Isett (2018) built dissipative solutions via convex integration."},{"q":"How is the Black–Scholes equation related to the heat equation?","a":"By a change of variables (log-price and time to maturity), it reduces to the heat equation."}],"search":"partial differential equations pde equations relating rates of change in several variables — the language of almost every physical law.  "},{"id":"probability-theory","title":"Probability Theory","short":"Probability","domain":"math","area":"probability","one_liner":"The mathematics of uncertainty, built on measure theory since Kolmogorov (1933).","summary":"From limit theorems and large deviations to random walks, martingales and random structures. Probability is the foundation of statistics, statistical physics, information theory and quantitative finance.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What laws govern sums and extremes of random variables?","How do random processes and random structures behave in high dimension?","How do we quantify rare events?"]},{"key":"key_results","label":"Fundamental results","value":["Kolmogorov axioms; laws of large numbers; central limit theorem.","Large deviations (Cramér, Sanov); rate functions ≈ entropy.","Martingale convergence and optional stopping; concentration inequalities.","Lévy stable laws and generalized CLT for heavy tails; extreme value theory (Fisher–Tippett–Gnedenko).","de Finetti's theorem; Bayesian inference.","Schramm–Loewner evolution describes 2D critical interfaces (Fields Medals 2006, 2010)."]},{"key":"motivating_examples","label":"Motivating examples","value":["Gambling problems (Pascal–Fermat); Brownian motion; random walks."]},{"key":"limits","label":"Limits & open problems","value":["Interpretation (frequentist vs Bayesian) is debated; heavy-tailed and dependent phenomena break naive CLT reasoning."]},{"key":"applications","label":"Applications","value":["Statistics, machine learning, physics, finance and risk, insurance, algorithms (randomized)."]},{"key":"frontiers","label":"Where research is going","value":["High-dimensional probability; random geometry (Liouville quantum gravity); probabilistic methods in combinatorics and learning theory."]}],"connections":["real-analysis","stochastic-processes","statistical-mechanics","information-theory","random-matrix-theory","combinatorics"],"prerequisites":[],"resources":["Durrett, <em>Probability: Theory and Examples<\/em> (free online)","Vershynin, <em>High-Dimensional Probability<\/em> (free online)"],"cards":[{"q":"State the central limit theorem.","a":"For i.i.d. variables with finite variance σ², $(S_n - n\\mu)/(\\sigma\\sqrt n) \\to \\mathcal{N}(0,1)$ in distribution."},{"q":"What is a large deviation principle?","a":"Probabilities of rare events decay exponentially, $P(S_n/n \\approx x) \\asymp e^{-n I(x)}$, with rate function I (Cramér)."},{"q":"What are the three extreme value distributions?","a":"Gumbel, Fréchet (heavy tails), Weibull (bounded tails) — unified in the generalized extreme value distribution."},{"q":"What is SLE (Schramm–Loewner evolution)?","a":"A one-parameter family of random curves describing scaling limits of 2D critical interfaces (percolation κ=6, Ising κ=3)."}],"search":"probability theory probability the mathematics of uncertainty, built on measure theory since kolmogorov (1933).  "},{"id":"stochastic-processes","title":"Stochastic Processes & Stochastic Calculus","short":"Stochastic processes","domain":"math","area":"probability","one_liner":"Random functions of time — Brownian motion, Markov chains, Itô calculus.","summary":"The mathematics behind diffusion, noise, filtering and financial derivatives. Itô calculus makes sense of differential equations driven by Brownian motion and links them to PDEs (Feynman–Kac).","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How do we model and compute with continuous-time randomness?","How do random dynamics relate to PDEs and to equilibrium distributions?"]},{"key":"key_results","label":"Fundamental results","value":["Brownian motion (Wiener measure); Markov chains and ergodic theorems.","Itô's lemma $df = f'\\,dX + \\tfrac12 f''\\,d\\langle X\\rangle$; stochastic differential equations.","Feynman–Kac formula linking expectations and parabolic PDEs; Fokker–Planck equation.","Girsanov theorem: change of drift by change of measure.","Fundamental theorem of asset pricing: no arbitrage ⇔ existence of an equivalent martingale measure; Black–Scholes–Merton.","Poisson, Lévy, Hawkes processes; rough paths (Lyons) and regularity structures (Hairer)."]},{"key":"motivating_examples","label":"Motivating examples","value":["Pollen grains in water (Brown, Einstein); stock prices; queueing."]},{"key":"limits","label":"Limits & open problems","value":["Real data often non-Markovian, non-stationary, heavy-tailed; model risk in finance."]},{"key":"applications","label":"Applications","value":["Quantitative finance, filtering (Kalman), MCMC sampling, diffusion generative models, biology, physics of noise."]},{"key":"frontiers","label":"Where research is going","value":["Rough volatility models; singular SPDEs (KPZ via regularity structures); score-based diffusion models in ML."]}],"connections":["probability-theory","pde","non-equilibrium","econophysics","statistical-mechanics","dynamical-systems"],"prerequisites":["probability-theory"],"resources":["Øksendal, <em>Stochastic Differential Equations<\/em>","Shreve, <em>Stochastic Calculus for Finance II<\/em>"],"cards":[{"q":"State Itô's lemma for $f(t, X_t)$ with $dX = \\mu\\,dt + \\sigma\\,dW$.","a":"$df = (\\partial_t f + \\mu\\,\\partial_x f + \\tfrac12\\sigma^2\\partial_x^2 f)\\,dt + \\sigma\\,\\partial_x f\\,dW$."},{"q":"What does the Feynman–Kac formula state?","a":"Solutions of parabolic PDEs like $\\partial_t u + \\mu u_x + \\tfrac12\\sigma^2 u_{xx} - ru = 0$ are expectations $u = E[e^{-\\int r}\\, g(X_T)]$ over the associated diffusion."},{"q":"What is the fundamental theorem of asset pricing?","a":"A market has no arbitrage iff there exists an equivalent martingale (risk-neutral) measure; completeness iff it is unique."},{"q":"What does Girsanov's theorem allow?","a":"Changing the drift of a Brownian motion by changing to an equivalent probability measure with an explicit density."},{"q":"What is the Fokker–Planck equation?","a":"The forward Kolmogorov PDE for the probability density of a diffusion, $\\partial_t p = -\\partial_x(\\mu p) + \\tfrac12\\partial_x^2(\\sigma^2 p)$."}],"search":"stochastic processes & stochastic calculus stochastic processes random functions of time — brownian motion, markov chains, itô calculus.  "},{"id":"dynamical-systems","title":"Dynamical Systems & Ergodic Theory","short":"Dynamical systems","domain":"math","area":"probability","one_liner":"Long-term behaviour of systems evolving by fixed rules, and the statistics of their orbits.","summary":"Studies flows and maps qualitatively: stability, bifurcations, attractors, chaos. Ergodic theory studies invariant measures, connecting dynamics to probability and number theory.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What are the possible long-term behaviours of a system?","When do time averages equal space averages?","How do qualitative behaviours change with parameters (bifurcations)?"]},{"key":"key_results","label":"Fundamental results","value":["Poincaré–Bendixson theorem (no chaos in 2D flows); Hartman–Grobman; stable manifold theorem.","Birkhoff ergodic theorem; mixing; Kolmogorov–Sinai entropy.","Smale horseshoe; hyperbolic dynamics; structural stability.","KAM theory; Arnold diffusion.","Furstenberg's ergodic proof of Szemerédi's theorem; Ratner's theorems; homogeneous dynamics (Margulis, Lindenstrauss)."]},{"key":"motivating_examples","label":"Motivating examples","value":["Three-body problem; logistic map; Lorenz system; billiards."]},{"key":"limits","label":"Limits & open problems","value":["Generic high-dimensional systems are hard to analyse; ergodicity of physical systems rarely provable."]},{"key":"applications","label":"Applications","value":["Celestial mechanics, climate models, population dynamics, control theory, neural dynamics."]},{"key":"frontiers","label":"Where research is going","value":["Smooth ergodic theory, data-driven dynamics (Koopman operator), rigidity in homogeneous dynamics."]}],"connections":["chaos","classical-mechanics","probability-theory","number-theory","complex-systems","stochastic-processes"],"prerequisites":[],"resources":["Strogatz, <em>Nonlinear Dynamics and Chaos<\/em>","Katok &amp; Hasselblatt, <em>Introduction to the Modern Theory of Dynamical Systems<\/em>"],"cards":[{"q":"What does the Poincaré–Bendixson theorem imply?","a":"Bounded trajectories of planar continuous flows approach fixed points or periodic orbits — no chaos in 2D autonomous ODEs."},{"q":"State Birkhoff's ergodic theorem.","a":"For an ergodic measure-preserving system, time averages $\\frac1N\\sum f(T^n x)$ converge to the space average $\\int f\\,d\\mu$ for almost every x."},{"q":"What is the Koopman operator?","a":"The linear (infinite-dimensional) operator $f \\mapsto f\\circ T$ on observables, turning nonlinear dynamics into linear spectral analysis."}],"search":"dynamical systems & ergodic theory dynamical systems long-term behaviour of systems evolving by fixed rules, and the statistics of their orbits.  "},{"id":"information-theory","title":"Information Theory","short":null,"domain":"math","area":"probability","one_liner":"Quantifying information, compression and communication over noisy channels.","summary":"Shannon (1948) defined entropy and proved the limits of compression and reliable communication. Information-theoretic quantities now appear everywhere: statistical inference, machine learning, thermodynamics, quantum information, black holes and finance (Kelly criterion).","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How much can data be compressed?","How fast can information be sent reliably through noisy channels?","How do we measure dependence and distinguishability between distributions?"]},{"key":"key_results","label":"Fundamental results","value":["Shannon entropy $H = -\\sum p\\log p$; mutual information; KL divergence.","Source coding theorem; channel coding theorem with capacity $C = \\max I(X;Y)$.","Data processing inequality; Fano's inequality.","Kelly criterion: maximizing expected log growth relates bet sizing to mutual information.","Quantum versions: von Neumann entropy, Holevo bound, strong subadditivity (Lieb–Ruskai)."]},{"key":"motivating_examples","label":"Motivating examples","value":["Telegraph codes; Morse code efficiency; error-correcting codes in deep-space communication."]},{"key":"limits","label":"Limits & open problems","value":["Shannon information ignores meaning; finite-blocklength regimes need refined analysis."]},{"key":"applications","label":"Applications","value":["Compression (ZIP, JPEG), telecommunications (5G uses LDPC and polar codes), ML losses (cross-entropy), portfolio theory, cryptography."]},{"key":"frontiers","label":"Where research is going","value":["Information theory of deep learning; quantum Shannon theory; entropy in holography."]}],"connections":["probability-theory","thermodynamics","statistical-mechanics","quantum-information","complexity","logic-set-theory"],"prerequisites":[],"resources":["Cover &amp; Thomas, <em>Elements of Information Theory<\/em>","MacKay, <em>Information Theory, Inference, and Learning Algorithms<\/em> (free online)"],"cards":[{"q":"Define the Kullback–Leibler divergence.","a":"$D(P\\|Q) = \\sum_x P(x)\\log\\frac{P(x)}{Q(x)} \\ge 0$, zero iff P = Q; not symmetric."},{"q":"State Shannon's channel coding theorem.","a":"Rates below capacity $C = \\max_{p(x)} I(X;Y)$ can be achieved with arbitrarily small error; rates above cannot."},{"q":"What is the Kelly criterion?","a":"Bet the fraction that maximizes expected log wealth; for a simple bet, $f^* = p - q/b$; growth rate is tied to information advantage."},{"q":"What does strong subadditivity of von Neumann entropy state?","a":"$S(AB) + S(BC) \\ge S(ABC) + S(B)$ (Lieb–Ruskai 1973)."}],"search":"information theory  quantifying information, compression and communication over noisy channels.  "},{"id":"combinatorics","title":"Combinatorics","short":null,"domain":"math","area":"discrete","one_liner":"Counting, arranging and finding structure in finite objects.","summary":"Enumerative, extremal, probabilistic and algebraic combinatorics. Ramsey theory shows that complete disorder is impossible; the probabilistic method proves existence without construction.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["How many configurations of a given kind exist?","How large can a structure be while avoiding a pattern (extremal problems)?","Does sufficient size always force order (Ramsey theory)?"]},{"key":"key_results","label":"Fundamental results","value":["Generating functions; inclusion–exclusion; Pólya enumeration.","Ramsey's theorem; Szemerédi's theorem on arithmetic progressions.","Probabilistic method (Erdős); Lovász local lemma.","Sperner, Erdős–Ko–Rado; sunflower and cap-set breakthroughs (polynomial method, 2016).","Kahn–Kalai conjecture proved (Park–Pham 2022); exponential improvement on diagonal Ramsey (Campos–Griffiths–Morris–Sahasrabudhe 2023)."]},{"key":"motivating_examples","label":"Motivating examples","value":["Counting permutations, lattice paths, Catalan structures; the party problem R(3,3) = 6."]},{"key":"limits","label":"Limits & open problems","value":["Many exact values (e.g. R(5,5)) unknown; problems are easy to state, hard to solve."]},{"key":"applications","label":"Applications","value":["Algorithms, coding theory, statistical physics (lattice counting), network design."]},{"key":"frontiers","label":"Where research is going","value":["Additive combinatorics; random graphs and thresholds; combinatorial approaches with computer and AI assistance."]}],"connections":["graph-theory","probability-theory","number-theory","computational-complexity","statistical-mechanics"],"prerequisites":[],"resources":[],"cards":[{"q":"What does Ramsey's theorem guarantee?","a":"For any k, l, every sufficiently large complete graph 2-coloured contains a red $K_k$ or blue $K_l$; e.g. $R(3,3) = 6$."},{"q":"What is the probabilistic method?","a":"Proving existence of an object by showing a random construction has the property with positive probability (Erdős)."},{"q":"What does Szemerédi's theorem state?","a":"Every subset of the integers with positive upper density contains arbitrarily long arithmetic progressions."}],"search":"combinatorics  counting, arranging and finding structure in finite objects.  "},{"id":"graph-theory","title":"Graph Theory","short":null,"domain":"math","area":"discrete","one_liner":"The mathematics of networks — vertices joined by edges.","summary":"From Euler's bridges to spectral graph theory, graph minors and random graphs. It underpins network science, algorithms and combinatorial optimization.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["What structural properties (connectivity, colouring, planarity, flows) do graphs have?","How do spectra of graph matrices reflect structure?"]},{"key":"key_results","label":"Fundamental results","value":["Euler's theorem on Eulerian circuits (1736); Kuratowski's planarity theorem.","Four colour theorem (Appel–Haken 1976, computer-assisted).","Max-flow min-cut theorem; Hall's marriage theorem.","Robertson–Seymour graph minor theorem.","Cheeger inequality: spectral gap ↔ expansion; expander graphs.","Erdős–Rényi phase transitions in random graphs."]},{"key":"motivating_examples","label":"Motivating examples","value":["Königsberg bridges; map colouring; transport networks."]},{"key":"limits","label":"Limits & open problems","value":["Many graph problems are NP-hard (colouring, Hamiltonian cycle, max clique)."]},{"key":"applications","label":"Applications","value":["Routing, scheduling, social and biological networks, error-correcting codes (expanders, LDPC), graph neural networks."]},{"key":"frontiers","label":"Where research is going","value":["Graph limits (graphons); structural graph theory; spectral methods in learning."]}],"connections":["combinatorics","networks","computational-complexity","linear-algebra","topology"],"prerequisites":[],"resources":[],"cards":[{"q":"State the max-flow min-cut theorem.","a":"In a flow network, the maximum flow from source to sink equals the minimum capacity of a cut separating them."},{"q":"What is the Cheeger inequality for graphs?","a":"The spectral gap of the Laplacian bounds the edge expansion $h$ from both sides, $\\lambda_2/2 \\le h \\le \\sqrt{2\\lambda_2}$ (normalized)."},{"q":"Why was the four colour theorem's proof controversial?","a":"It relied on computer verification of ~1,900 reducible configurations (Appel–Haken 1976); later formally verified in Coq (Gonthier 2005)."}],"search":"graph theory  the mathematics of networks — vertices joined by edges.  "},{"id":"computational-complexity","title":"Computational Complexity","short":"Complexity theory","domain":"math","area":"discrete","one_liner":"Which problems can be solved efficiently, and which resources (time, space, randomness, quantumness) make a difference.","summary":"Classifies problems into complexity classes (P, NP, PSPACE, BQP...). Its central open question, P vs NP, is a Millennium problem. Complexity shapes cryptography, limits of simulation in physics, and quantum advantage.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["Which problems are efficiently solvable?","Is finding a solution fundamentally harder than checking one (P vs NP)?","What do randomness and quantum mechanics add to computation?"]},{"key":"key_results","label":"Fundamental results","value":["Cook–Levin theorem: SAT is NP-complete; Karp's 21 NP-complete problems.","Time and space hierarchy theorems; PSPACE = IP; PCP theorem.","Primality in P (AKS 2002).","Relativization, natural proofs and algebrization barriers to proving P ≠ NP.","BQP contains factoring (Shor); MIP* = RE (2020) links complexity to Connes' embedding problem."]},{"key":"motivating_examples","label":"Motivating examples","value":["Travelling salesman; scheduling; protein folding; cryptographic hardness."]},{"key":"limits","label":"Limits & open problems","value":["Almost all separations between major classes remain unproven."]},{"key":"applications","label":"Applications","value":["Cryptography, algorithm design, limits of physical simulation, quantum advantage arguments."]},{"key":"frontiers","label":"Where research is going","value":["Fine-grained complexity; quantum complexity (supremacy foundations); complexity of learning and of LLM reasoning."]}],"connections":["logic-set-theory","combinatorics","graph-theory","quantum-information","complexity","optimization","information-theory"],"prerequisites":[],"resources":["Arora &amp; Barak, <em>Computational Complexity: A Modern Approach<\/em>","Aaronson, <em>Quantum Computing Since Democritus<\/em>"],"cards":[{"q":"What does the Cook–Levin theorem state?","a":"Boolean satisfiability (SAT) is NP-complete."},{"q":"What is BQP?","a":"Problems solvable by a quantum computer in polynomial time with bounded error; contains P and factoring, believed not to contain NP-complete problems."},{"q":"What does MIP* = RE (2020) imply?","a":"Multi-prover interactive proofs with entangled provers can verify all recursively enumerable languages; as a consequence Connes' embedding conjecture is false."},{"q":"Name the three known barriers to proving P ≠ NP.","a":"Relativization (Baker–Gill–Solovay), natural proofs (Razborov–Rudich), algebrization (Aaronson–Wigderson)."}],"search":"computational complexity complexity theory which problems can be solved efficiently, and which resources (time, space, randomness, quantumness) make a difference.  "},{"id":"optimization","title":"Optimization","short":null,"domain":"math","area":"discrete","one_liner":"Finding the best solution under constraints, from linear programs to training neural networks.","summary":"Convex optimization has a complete theory (duality, efficient algorithms); non-convex optimization is hard in general yet works surprisingly well in deep learning. It connects to variational principles in physics and portfolio theory in finance.","who":"","year":"","sections":[{"key":"asks","label":"What questions does it try to answer?","value":["When can the optimum be found efficiently and certified?","How do constraints shape optima (duality)?","Why does gradient descent succeed on non-convex landscapes in practice?"]},{"key":"key_results","label":"Fundamental results","value":["Lagrange multipliers and KKT conditions; convex duality.","Simplex method (Dantzig); interior-point methods (Karmarkar 1984) — LP in polynomial time (Khachiyan 1979).","Semidefinite programming; Goemans–Williamson MAX-CUT approximation.","Gradient descent rates; Nesterov acceleration; stochastic gradient descent.","Markowitz mean–variance portfolio optimization."]},{"key":"motivating_examples","label":"Motivating examples","value":["Resource allocation, shortest paths, roximated?","How do errors and costs scale with problem size?"]},{"key":"key_results","label":"Fundamental results","value":["Condition numbers and backward stability (Wilkinson).","Lax equivalence theorem: consistency + stability ⇔ convergence (linear PDE).","Runge–Kutta methods; symplectic integrators preserve Hamiltonian structure.","Fast Fourier transform (Cooley–Tukey 1965); fast multipole method; multigrid.","Monte Carlo error ~ $1/\\sqrt N$ independent of dimension; Metropolis algorithm (1953); quasi-Monte Carlo."]},{"key":"motivating_examples","label":"Motivating examples","value":["Solving large linear systems; simulating planetary orbits; pricing derivatives by Monte Carlo."]},{"key":"limits","label":"Limits & open problems","value":["Curse of dimensionality for grid methods; sign problem for quantum Monte Carlo."]},{"key":"applications","label":"Applications","value":["Engineering, climate models, lattice QCD, quantitative finance, machine learning infrastructure."]},{"key":"frontiers","label":"Where research is going","value":["Neural PDE solvers, randomized linear algebra, mixed-precision computing, tensor-network methods."]}],"connections":["linear-algebra","pde","optimization","lattice-field-theory","stochastic-processes","classical-mechanics"],"prerequisites":[],"resources":[],"cards":[{"q":"State the Lax equivalence theorem.","a":"For a consistent finite-difference scheme for a well-posed linear initial value problem, stability is equivalent to convergence."},{"q":"Why are symplectic integrators preferred for long Hamiltonian simulations?","a":"They exactly preserve the symplectic structure, so energy errors stay bounded instead of drifting."},{"q":"How does the Monte Carlo error scale?","a":"As $\\sigma/\\sqrt{N}$, independent of dimension."}],"search":"numerical analysis & scientific computing numerical analysis designing and analysing algorithms for continuous mathematics on finite computers.  "},{"id":"frontier-measuring","title":"What We Are Trying to Measure Now","short":"Open measurements","domain":"experiment","area":"exp-overview","one_liner":"The major open measurements across fundamental physics as of 2026.","summary":"A checklist of quantities that experiments are actively chasing, each tied to a theoretical question.","who":"","year":"","sections":[{"key":"measuring_now","label":"What we are trying to measure","value":["<strong>Neutrino properties<\/strong> — absolute mass (KATRIN bound $m_\\nu &lt; 0.45$ eV; Project 8; cosmology), mass ordering (JUNO, running since 2025), leptonic CP phase (DUNE, Hyper-K), Majorana nature via 0νββ (LEGEND, nEXO, KamLAND-Zen).","<strong>Dark matter<\/strong> — direct detection (LZ, XENONnT, PandaX, DARWIN/XLZD), axions (ADMX, haloscopes, helioscopes like IAXO), indirect signals, collider production.","<strong>Dark energy equation of state<\/strong> $w(z)$ — DESI, Euclid, Rubin LSST, Roman.","<strong>Hubble constant<\/strong> — distance ladder (Cepheids, TRGB, JAGB with JWST) vs CMB/BAO; standard sirens.","<strong>Primordial gravitational waves<\/strong> — CMB B-modes (BICEP/Keck, Simons Observatory, LiteBIRD) for the tensor ratio $r$.","<strong>Higgs sector<\/strong> — couplings to second-generation fermions, self-coupling, invisible decays (HL-LHC from ~2030).","<strong>CP violation and EDMs<\/strong> — electron and neutron EDMs probe new physics at 10–100 TeV scales.","<strong>Proton decay<\/strong> (Hyper-K, DUNE, JUNO) — test of grand unification.","<strong>Gravitational-wave spectrum<\/strong> — LIGO/Virgo/KAGRA O5, LISA (2030s), pulsar timing arrays, Einstein Telescope/Cosmic Explorer.","<strong>Fundamental constants and their variation<\/strong> — optical and nuclear clocks; fine-structure constant; $G$.","<strong>Quantum gravity signatures<\/strong> — gravitationally induced entanglement in tabletop experiments; Lorentz violation; black-hole ringdown spectroscopy.","<strong>Nuclear and QCD<\/strong> — proton structure (EIC), neutron lifetime, neutron-star equation of state (NICER, GW tidal deformability)."]}],"connections":["beyond-standard-model","cosmology","standard-model","quantum-gravity","general-relativity","astrophysics"],"prerequisites":[],"resources":[],"cards":[{"q":"Which experiment aims to determine the neutrino mass ordering with reactor antineutrinos?","a":"JUNO (China), taking data since 2025."},{"q":"What is KATRIN's (2025) upper bound on the effective electron-antineutrino mass?","a":"$m_\\nu &lt; 0.45$ eV (90% CL)."},{"q":"What two quantities do CMB B-mode experiments and LISA respectively target?","a":"B-modes target the primordial tensor-to-scalar ratio $r$ (inflation); LISA targets mHz gravitational waves from massive black-hole binaries and early-universe sources."},{"q":"Why are electron EDM experiments sensitive to very heavy new physics?","a":"EDMs require CP violation beyond the SM's (negligible) contribution; loop effects of TeV-scale particles produce measurable EDMs."}],"search":"what we are trying to measure now open measurements the major open measurements across fundamental physics as of 2026.  "},{"id":"frontier-unmeasurable","title":"What We Cannot (Yet) Measure","short":"Limits of measurement","domain":"experiment","area":"exp-overview","one_liner":"Questions that are beyond experiment in practice or in principle, and why.","summary":"Some limits are technological (energy, sensitivity), some are cosmic (horizons, a single universe), and some are in principle (quantum mechanics, gauge redundancy). Knowing which is which shapes what theory can hope to test.","who":"","year":"","sections":[{"key":"cannot_measure","label":"What we cannot (yet) measure","value":["<strong>The Planck scale directly<\/strong> — $10^{19}$ GeV is ~15 orders of magnitude above the LHC; a collider would need galactic size.","<strong>Single gravitons<\/strong> — Dyson argued a graviton detector would need to be so massive it collapses into a black hole, or would be swamped by neutrino backgrounds.","<strong>Hawking radiation of astrophysical black holes<\/strong> — temperatures are nanokelvin or less, far below the CMB.","<strong>Beyond our cosmological horizon<\/strong> — regions never in causal contact; other bubbles of eternal inflation or the string landscape.","<strong>The cosmic neutrino background directly<\/strong> — predicted at 1.95 K; PTOLEMY-like capture proposals face severe challenges.","<strong>Cosmic variance<\/strong> — only one universe; large-angle CMB multipoles have irreducible statistical error.","<strong>The wavefunction in a single shot<\/strong> — no-cloning and measurement back-action; only ensembles or weak/protective measurements reconstruct it.","<strong>Gauge-dependent quantities<\/strong> — potentials themselves, only holonomies and field strengths are physical.","<strong>Inside a black hole horizon<\/strong> — no signal escapes; interior physics is inferred, not observed.","<strong>Before recombination with light<\/strong> — the universe was opaque; earlier epochs need neutrinos or gravitational waves.","<strong>The interpretation of quantum mechanics<\/strong> — most interpretations are empirically equivalent (collapse models are the exception)."]}],"connections":["quantum-gravity","cosmology","black-holes","quantum-foundations","gauge-theory"],"prerequisites":[],"resources":[],"cards":[{"q":"Why is detecting a single graviton considered practically impossible?","a":"Gravitational coupling is so weak that a detector with reasonable efficiency would need Jupiter-scale mass close to a source; Dyson argued shielding and background make it effectively impossible."},{"q":"What is cosmic variance?","a":"The irreducible uncertainty from observing a single realization of the universe; it dominates large-angle CMB measurements."},{"q":"Why can't we see the universe before recombination in light?","a":"The plasma was opaque to photons until ~380,000 years; earlier epochs require neutrinos or gravitational waves."}],"search":"what we cannot (yet) measure limits of measurement questions that are beyond experiment in practice or in principle, and why.  "},{"id":"exp-cavendish","title":"Cavendish Torsion Balance","short":null,"domain":"experiment","area":"exp-classical","one_liner":"First laboratory measurement of the gravitational attraction between masses.","summary":"","who":"Henry Cavendish","year":"1798","sections":[{"key":"measured","label":"What was measured","value":"The tiny twist of a torsion balance as lead spheres attracted smaller ones."},{"key":"result","label":"Result","value":"Earth's density ≈ 5.45 g/cm³ (implying $G$, later extracted, within ~1% of today's value)."},{"key":"significance","label":"Why it matters","value":["Made gravity a laboratory force and fixed the scale of Newtonian gravity.","$G$ remains the least precisely known fundamental constant (~20 ppm), with puzzling disagreements between modern experiments."]}],"connections":["classical-mechanics","general-relativity"],"prerequisites":[],"resources":[],"cards":[{"q":"Why is $G$ hard to measure precisely?","a":"Gravity is extremely weak and cannot be shielded; modern measurements disagree beyond their quoted errors (~10⁻⁴ spread)."}],"search":"cavendish torsion balance  first laboratory measurement of the gravitational attraction between masses.  "},{"id":"exp-mercury-perihelion","title":"Perihelion Precession of Mercury","short":null,"domain":"experiment","area":"exp-classical","one_liner":"An unexplained 43 arcseconds per century in Mercury's orbit that GR explained exactly.","summary":"","who":"Urbain Le Verrier (anomaly); explained by Einstein, 1915","year":"1859","sections":[{"key":"measured","label":"What was measured","value":"The precession of Mercury's perihelion, after subtracting the effects of other planets."},{"key":"result","label":"Result","value":"An excess of ≈ 43″ per century unexplained by Newtonian gravity."},{"key":"significance","label":"Why it matters","value":["First success of general relativity (1915), computed by Einstein from first principles without free parameters."]}],"connections":["general-relativity","classical-mechanics"],"prerequisites":[],"resources":[],"cards":[{"q":"How large is Mercury's anomalous perihelion precession?","a":"About 43 arcseconds per century, out of ~574″ total (the rest from planetary perturbations)."}],"search":"perihelion precession of mercury  an unexplained 43 arcseconds per century in mercury's orbit that gr explained exactly.  "},{"id":"exp-michelson-morley","title":"Michelson–Morley Experiment","short":null,"domain":"experiment","area":"exp-classical","one_liner":"An interferometer found no motion of Earth through the luminiferous ether.","summary":"","who":"Albert Michelson, Edward Morley","year":"1887","sections":[{"key":"measured","label":"What was measured","value":"Shifts of interference fringes between perpendicular arms as the apparatus rotated."},{"key":"result","label":"Result","value":"Null result — far below the expected shift from Earth's orbital speed."},{"key":"significance","label":"Why it matters","value":["Undermined the ether; consistent with the constancy of the speed of light, a postulate of special relativity.","Modern versions with optical cavities bound anisotropy of $c$ to ~10⁻¹⁸."]}],"connections":["special-relativity","electromagnetism"],"prerequisites":[],"resources":[],"cards":[{"q":"What did the Michelson–Morley experiment show?","a":"No detectable difference in the speed of light along perpendicular directions — no ether wind."}],"search":"michelson–morley experiment  an interferometer found no motion of earth through the luminiferous ether.  "},{"id":"exp-blackbody","title":"Blackbody Spectrum & Planck's Quantum","short":null,"domain":"experiment","area":"exp-quantum","one_liner":"Precise measurements of thermal radiation forced the hypothesis that energy comes in quanta $E = h\\nu$.","summary":"","who":"Max Planck (theory), Lummer, Pringsheim, Rubens, Kurlbaum (data)","year":"1900","sections":[{"key": work function."}],"search":"photoelectric effect  light ejects electrons with energies set by its frequency, not its intensity — light comes in photons.  "},{"id":"exp-stern-gerlach","title":"Stern–Gerlach Experiment","short":null,"domain":"experiment","area":"exp-quantum","one_liner":"Silver atoms in an inhomogeneous magnetic field split into two beams — angular momentum is quantized.","summary":"","who":"Otto Stern, Walther Gerlach","year":"1922","sections":[{"key":"measured","label":"What was measured","value":"Deflection of a silver atom beam passing through an inhomogeneous magnetic field."},{"key":"result","label":"Result","value":"Two discrete spots rather than a continuous smear."},{"key":"significance","label":"Why it matters","value":["Direct evidence of space quantization; later understood as electron spin-1/2. The archetype of a quantum measurement."]}],"connections":["quantum-mechanics","quantum-foundations"],"prerequisites":[],"resources":[],"cards":[{"q":"Why did silver atoms split into exactly two beams?","a":"Silver's magnetic moment comes from a single unpaired electron with spin 1/2 (two projections)."}],"search":"stern–gerlach experiment  silver atoms in an inhomogeneous magnetic field split into two beams — angular momentum is quantized.  "},{"id":"exp-compton","title":"Compton Scattering","short":null,"domain":"experiment","area":"exp-quantum","one_liner":"X-rays scattering off electrons change wavelength exactly as if photons carry momentum.","summary":"","who":"Arthur Compton","year":"1923","sections":[{"key":"measured","label":"What was measured","value":"Wavelength shift of X-rays scattered from graphite as a function of angle."},{"key":"result","label":"Result","value":"$\\Delta\\lambda = \\frac{h}{m_ec}(1-\\cos\\theta)$."},{"key":"significance","label":"Why it matters","value":["Confirmed that photons carry momentum $p = h/\\lambda$; particle nature of light."]}],"connections":["quantum-mechanics","special-relativity"],"prerequisites":[], omy of the gauge field."}],"search":"aharonov–bohm effect  electrons are affected by a vector potential in regions where the magnetic field is zero.  "},{"id":"exp-rutherford","title":"Rutherford (Geiger–Marsden) Scattering","short":null,"domain":"experiment","area":"exp-particle","one_liner":"Alpha particles bouncing back from gold foil revealed a tiny, dense atomic nucleus.","summary":"","who":"Hans Geiger, Ernest Marsden, Ernest Rutherford","year":"1911","sections":[{"key":"measured","label":"What was measured","value":"Angular distribution of alpha particles scattered by thin gold foil."},{"key":"result","label":"Result","value":"Rare large-angle scattering following $d\\sigma/d\\Omega \\propto 1/\\sin^4(\\theta/2)$."},{"key":"significance","label":"Why it matters","value":["Nuclear model of the atom; template for every later scattering experiment probing structure."]}],"connections":["nuclear-physics","quantum-mechanics"],"prerequisites":[],"resources":[],"cards":[{"q":"What angular dependence characterizes Rutherford scattering?","a":"$d\\sigma/d\\Omega \\propto 1/\\sin^4(\\theta/2)$ (Coulomb scattering off a point charge)."}],"search":"rutherford (geiger–marsden) scattering  alpha particles bouncing back from gold foil revealed a tiny, dense atomic nucleus.  "},{"id":"exp-wu-parity","title":"Wu Experiment (Parity Violation)","short":null,"domain":"experiment","area":"exp-particle","one_liner":"Electrons from polarized cobalt-60 nuclei are emitted preferentially opposite the spin — the weak force violates parity.","summary":"","who":"Chien-Shiung Wu et al. (proposed by Lee and Yang, 1956)","year":"1957","sections":[{"key":"measured","label":"What was measured","value":"Angular distribution of beta-decay electrons from polarized ⁶⁰Co at ~10 mK."},{"key":"result","label":"Result","value":"Strong asymmetry relative to nuclear spin direction."},{"key":"significance","label":"Why it matters","value":["Nature distinguishes left from right; led to the V−A theory and omaly (once ~5σ) mostly dissolved with lattice HVP."]}],"connections":["qft","standard-model","lattice-field-theory","beyond-standard-model"],"prerequisites":[],"resources":[],"cards":[{"q":"What is the Schwinger term in the anomalous magnetic moment?","a":"The one-loop QED contribution $a = \\alpha/2\\pi \\approx 0.00116$."},{"q":"What theory input dominated the uncertainty in the muon g−2 prediction?","a":"Hadronic vacuum polarization (and hadronic light-by-light), now computed with lattice QCD."}],"search":"muon and electron g−2  ultra-precise anomalous magnetic moments testing qed and the standard model through quantum loops.  "},{"id":"exp-neutrino-oscillations","title":"Neutrino Oscillations","short":null,"domain":"experiment","area":"exp-particle","one_liner":"Neutrinos change flavour while travelling, so they must have mass.","summary":"","who":"Super-Kamiokande (1998, atmospheric), SNO (2001, solar); Kajita and McDonald, Nobel 2015","year":"1998","sections":[{"key":"measured","label":"What was measured","value":"Up/down asymmetry of atmospheric muon neutrinos (Super-K); solar ⁸B neutrinos via charged and neutral currents (SNO)."},{"key":"result","label":"Result","value":"Disappearance of ν_μ depending on path length; total solar flux matches the solar model, with electron neutrinos converted to other flavours."},{"key":"significance","label":"Why it matters","value":["First established physics beyond the minimal Standard Model; resolved the solar neutrino problem."]}],"connections":["standard-model","beyond-standard-model","astrophysics"],"prerequisites":[],"resources":[],"cards":[{"q":"What does neutrino oscillation imply about neutrino masses?","a":"At least two neutrinos are massive and flavour states are mixtures of mass states (PMNS matrix)."},{"q":"What can oscillation experiments not measure?","a":"The absolute neutrino mass scale (only mass-squared differences) and whether neutrinos are Majorana."},{"q":"How did SNO resolve the solar neutrino proble ckbody at 2.7255 K; anisotropies ~10⁻⁵ with acoustic peaks; fit by six-parameter ΛCDM."},{"key":"significance","label":"Why it matters","value":["Confirmed the hot Big Bang; measured geometry (flat), baryon and dark matter densities, $n_s \\approx 0.965$ (evidence for inflation-like initial conditions)."]}],"connections":["cosmology","general-relativity","statistical-mechanics"],"prerequisites":[],"resources":[],"cards":[{"q":"When was the CMB released, and what event is it?","a":"About 380,000 years after the Big Bang, at recombination when neutral hydrogen formed and photons decoupled."},{"q":"What do the CMB acoustic peaks encode?","a":"Sound waves in the photon–baryon fluid; their positions and heights fix curvature, baryon density and dark matter density."},{"q":"What CMB signal would indicate primordial gravitational waves?","a":"Large-angle B-mode polarization (tensor-to-scalar ratio r; current bound r &lt; ~0.036)."}],"search":"cosmic microwave background  relic radiation from 380,000 years after the big bang, the richest dataset in cosmology.  "},{"id":"exp-rubin-dark-matter","title":"Evidence for Dark Matter","short":null,"domain":"experiment","area":"exp-cosmo","one_liner":"Galaxies and clusters contain far more gravitating mass than visible matter.","summary":"","who":"Zwicky (clusters, 1933); Rubin &amp; Ford (rotation curves, 1970s); Clowe et al. (Bullet Cluster, 2006)","year":"1970","sections":[{"key":"measured","label":"What was measured","value":"Galaxy rotation curves (21 cm and optical); cluster velocity dispersions; gravitational lensing; CMB peaks."},{"key":"result","label":"Result","value":"Flat rotation curves; lensing mass offset from hot gas in colliding clusters."},{"key":"significance","label":"Why it matters","value":["Dark matter is ~85% of matter; the Bullet Cluster disfavours simple modified-gravity explanations."]}],"connections":["cosmology","astrophysics","beyond-standard-model"],"prerequisites":[],"resources":[],"cards":[{"q":"Why   /* ---------- helpers ---------- */
  const sectionHtml = s => Array.isArray(s.value) ? `<ul>${s.value.map(v => `<li>${v}</li>`).join("")}</ul>` : `<p>${s.value}</p>`;
  const chip = id => byId[id] ? `<a class="chip" href="#${id}"><span class="swatch" style="background:${color(byId[id].area)}"></span>${esc(byId[id].title)}</a>` : "";
  function typeset(el) {
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});
    else document.getElementById("mj").addEventListener("load", () => setTimeout(() => MathJax.typesetPromise && MathJax.typesetPromise([el]), 50), { once: true });
  }

  /* ---------- entry page ---------- */
  function renderEntry(e) {
    const a = areaOf[e.area];
    const siblings = D.entries.filter(x => x.area === e.area);
    const i = siblings.indexOf(e);
    const prev = siblings[i - 1], next = siblings[i + 1];
    const inc = (incoming[e.id] || []).filter(x => !(e.connections || []).includes(x));
    let h = `<article class="col">
      <div class="eyebrow"><span>${esc(a.domLabel)}</span><span>·</span><span class="swatch" style="background:${color(e.area)}"></span><span>${esc(a.label)}</span>${e.year ? `<span>·</span><span>${esc(e.year)}</span>` : ""}</div>
      <h1>${esc(e.title)}</h1>
      <p class="lede">${e.one_liner}</p>
      ${e.who ? `<p class="meta">${e.who}</p>` : ""}
      ${e.summary ? `<p class="summary">${e.summary}</p>` : ""}
      <div class="sections">`;
    for (const s of e.sections) h += `<section class="sec"><h2>${esc(s.label)}</h2>${sectionHtml(s)}</section>`;
    if (e.prerequisites && e.prerequisites.length) h += `<section class="sec"><h2>Builds on</h2><div class="chips">${e.prerequisites.map(chip).join("")}</div></section>`;
    if ((e.connections || []).length || inc.length) h += `<section class="sec"><h2>Connected to</h2><div class="chips">${[...(e.connections || []), ...inc].map(chip).join("")}</div></section>`;
    if (e.resources && e.resources.length) h += `<section class="sec"><h2>Where to read more</h2><ul>${e.resources.map(r => `<li>${r}</li>`).join("")}</ul></section>`;
    if (e.cards.length) h += `<section class="sec"><h2>Flashcards · ${e.cards.length}</h2><div class="cards">${e.cards.map(c => `<details><summary>${c.q}</summary><div>${c.a}</div></details>`).join("")}</div></section>`;
    h += `</div><nav class="pager"><span>${prev ? `← <a href="#${prev.id}">${esc(prev.title)}</a>` : ""}</span><span>${next ? `<a href="#${next.id}">${esc(next.title)}</a> →` : ""}</span></nav></article>`;
    main.innerHTML = h;
    document.title = `${e.title} · ${D.config.title}`;
  }

  /* ---------- home + map ---------- */
  function renderHome() {
    const nFields = D.entries.filter(e => e.domain !== "experiment").length;
    const nExp = D.entries.filter(e => e.domain === "experiment").length;
    let h = `<div class="wide">
      <div class="hero"><div><div class="eyebrow">An atlas for the long view</div><h1>${esc(D.config.title)}</h1>
      <p>${esc(D.config.subtitle)}. Each field answers the same questions: what it asks, what it has established, what it rests on, where it breaks, and where it is heading. Click a node to open it.</p></div>
      <div class="stats"><div><b>${nFields}</b>fields</div><div><b>${nExp}</b>experiments</div><div><b>${D.nCards}</b>flashcards</div></div></div>
      <div class="mapbox"><div class="mapbar">${Object.entries(D.areas).map(([k, d]) => `<label><input type="checkbox" data-dom="${k}" checked> ${esc(d.label)} <span class="mark mark-${k}"></span></label>`).join("")}
        <span class="hint">Drag to pan · scroll to zoom (experiment names appear) · hover to trace links</span></div>
        <svg id="map" role="img" aria-label="Map of fields and their connections"></svg>
        <div class="legend">${Object.entries(D.areas).map(([k, d]) => `<div class="lg"><b>${esc(d.label)}</b>${d.areas.map(a => `<span><span class="swatch" style="background:${color(a.id)}"></span>${esc(a.label)}</span>`).join("")}</div>`).join("")}</div></div>
      <div class="block"><h2>Read across fields</h2><p class="meta" style="margin:0 0 10px">A lens shows every field's answer to one question side by side.</p>
        <div class="lenses">${D.lenses.map(l => `<a href="#lens-${l.key}">${esc(l.label)}</a>`).join("")}</div></div>
      <div class="block"><h2>All areas</h2><div class="grid">`;
    for (const id of areaOrder) {
      const items = D.entries.filter(e => e.area === id);
      if (!items.length) continue;
      h += `<div class="tile"><h3><span class="swatch" style="background:${color(id)}"></span>${esc(areaOf[id].label)}</h3><ul>${items.map(e => `<li><a href="#${e.id}">${esc(e.title)}</a></li>`).join("")}</ul></div>`;
    }
    h += `</div></div></div>`;
    main.innerHTML = h;
    document.title = D.config.title;
    drawMap();
    main.querySelectorAll(".mapbar input").forEach(cb => cb.addEventListener("change", drawMap));
  }

  let layoutCache = null;
  function drawMap() {
    if (!window.d3) { setTimeout(drawMap, 120); return; }
    const svg = d3.select("#map"); if (svg.empty()) return;
    const on = new Set([...main.querySelectorAll(".mapbar input:checked")].map(i => i.dataset.dom));
    const el = svg.node(); const W = el.clientWidth || 900, H = el.clientHeight || 600;
    if (!layoutCache) {
      const nodes = D.entries.map(e => ({ id: e.id, e }));
      const links = [];
      for (const e of D.entries) for (const c of e.connections || []) if (byId[c]) links.push({ source: e.id, target: c });
      const deg = {}; links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
      nodes.forEach(n => n.deg = deg[n.id] || 0);
      const anchor = { physics: [-0.30, -0.08], math: [0.42, 0.02], experiment: [-0.22, 0.50] };
      nodes.forEach(n => { const [ax, ay] = anchor[n.e.domain]; n.x = ax * 1400 + (Math.random() - .5) * 300; n.y = ay * 700 + (Math.random() - .5) * 300; });
      const rad = d => d.e.domain === "experiment" ? 10 : 16 + Math.sqrt(d.deg) * 2;
      const sim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(85).strength(0.18))
        .force("charge", d3.forceManyBody().strength(d => d.e.domain === "experiment" ? -120 : -340))
        .force("collide", d3.forceCollide(rad).iterations(2))
        .force("x", d3.forceX(d => anchor[d.e.domain][0] * 1400).strength(0.07))
        .force("y", d3.forceY(d => anchor[d.e.domain][1] * 650).strength(0.09))
        .stop();
      for (let i = 0; i < 500; i++) sim.tick();
      layoutCache = { nodes, links };
    }
    const { nodes, links } = layoutCache;
    const vis = nodes.filter(n => on.has(n.e.domain));
    const visIds = new Set(vis.map(n => n.id));
    const vlinks = links.filter(l => visIds.has(l.source.id) && visIds.has(l.target.id));
    svg.selectAll("*").remove();
    const xs = d3.extent(vis, d => d.x), ys = d3.extent(vis, d => d.y);
    const pad = 60, sc = Math.min(W / ((xs[1] - xs[0]) + 2 * pad || 1), H / ((ys[1] - ys[0]) + 2 * pad || 1), 1.6);
    const g = svg.append("g");
    const zoom = d3.zoom().scaleExtent([0.3, 5]).on("zoom", ev => { g.attr("transform", ev.transform); svg.classed("zoomed", ev.transform.k > 1.6); });
    svg.call(zoom).call(zoom.transform, d3.zoomIdentity.translate(W / 2 - sc * (xs[0] + xs[1]) / 2, H / 2 - sc * (ys[0] + ys[1]) / 2).scale(sc));
    const L = g.append("g").selectAll("line").data(vlinks).join("line")
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    const N = g.append("g").selectAll("g").data(vis).join("g").attr("class", "n").attr("transform", d => `translate(${d.x},${d.y})`);
    const size = d => (d.e.domain === "experiment" ? 4 : 5.5) + Math.sqrt(d.deg) * 1.5;
    const sym = d3.symbol();
    N.append("path")
      .attr("d", d => sym.type(d.e.domain === "math" ? d3.symbolDiamond : d3.symbolCircle).size(Math.PI * size(d) ** 2 * (d.e.domain === "math" ? 1.3 : 1))())
      .attr("class", d => d.e.domain === "experiment" ? "hollow" : "")
      .style("fill", d => d.e.domain === "experiment" ? null : color(d.e.area))
      .style("stroke", d => d.e.domain === "experiment" ? color(d.e.area) : null)
      .on("click", (ev, d) => { location.hash = d.id; });
    N.append("title").text(d => `${d.e.title} — ${strip(d.e.one_liner)}`);
    N.append("text").attr("dy", d => -(size(d) + 4)).attr("text-anchor", "middle")
      .attr("class", d => d.e.domain === "experiment" ? "lbl-exp" : "")
      .attr("font-size", d => d.e.domain === "experiment" ? 10 : 11.5).text(d => d.e.short || d.e.title);
    N.on("mouseenter", (ev, d) => {
      const nb = new Set([d.id]);
      vlinks.forEach(l => { if (l.source.id === d.id) nb.add(l.target.id); if (l.target.id === d.id) nb.add(l.source.id); });
      N.classed("dim", n => !nb.has(n.id)).classed("lit", n => nb.has(n.id));
      L.classed("dim", l => l.source.id !== d.id && l.target.id !== d.id).classed("hot", l => l.source.id === d.id || l.target.id === d.id);
    }).on("mouseleave", () => { N.classed("dim", false).classed("lit", false); L.classed("dim", false).classed("hot", false); });
  }

  /* ---------- lens ---------- */
  let lensDom = new Set(Object.keys(D.areas));
  function renderLens(key) {
    const lens = D.lenses.find(l => l.key === key) || D.lenses[0];
    const rows = D.entries.filter(e => lensDom.has(e.domain) && e.sections.some(s => s.key === lens.key));
    let h = `<div class="wide"><div class="eyebrow">Lens</div><h1>${esc(lens.label)}</h1>
      <div class="lenses">${D.lenses.map(l => `<a class="${l.key === lens.key ? "on" : ""}" href="#lens-${l.key}">${esc(l.label)}</a>`).join("")}</div>
      <div class="filters">${Object.entries(D.areas).map(([k, d]) => `<button type="button" data-dom="${k}" aria-pressed="${lensDom.has(k)}">${esc(d.label)}</button>`).join("")}</div>
      <p class="meta">${rows.length} entries</p>`;
    for (const e of rows) {
      const s = e.sections.find(s => s.key === lens.key);
      h += `<div class="lens-entry"><div><div class="eyebrow"><span class="swatch" style="background:${color(e.area)}"></span>${esc(areaOf[e.area].label)}</div><h3><a href="#${e.id}">${esc(e.title)}</a></h3></div><div>${sectionHtml(s)}</div></div>`;
    }
    main.innerHTML = h + `</div>`;
    main.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
      const k = b.dataset.dom; lensDom.has(k) ? lensDom.delete(k) : lensDom.add(k); if (!lensDom.size) lensDom.add(k); renderLens(lens.key);
    }));
    document.title = `${lens.label} · ${D.config.title}`;
  }

  /* ---------- timeline ---------- */
  function renderTimeline() {
    const items = D.entries.filter(e => e.year).sort((a, b) => parseInt(a.year) - parseInt(b.year));
    let h = `<div class="col"><div class="eyebrow">Experiments</div><h1>The experiments modern physics rests on</h1>
      <p class="meta">Ordered by year. Each one links to the theory it established or tested.</p><div class="tl">`;
    for (const e of items) h += `<div class="tl-item" style="--dot:${color(e.area)}"><span class="tl-year">${esc(e.year)}</span><a href="#${e.id}">${esc(e.title)}</a><p>${e.one_liner}</p></div>`;
    main.innerHTML = h + `</div></div>`;
    document.title = `Timeline · ${D.config.title}`;
  }

  /* ---------- router ---------- */
  function route() {
    const h = decodeURIComponent(location.hash.slice(1)) || "home";
    if (h === "home") renderHome();
    else if (h === "timeline") renderTimeline();
    else if (h.startsWith("lens-")) renderLens(h.slice(5));
    else if (byId[h]) renderEntry(byId[h]);
    else renderHome();
    markNav();
    typeset(main);
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (document.getElementById("map")) drawMap(); }, 200); });
  renderNav("");
  route();
})();
</script>

</body>
</html>
